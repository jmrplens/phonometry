<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620"><rect width="900" height="620" fill="#ffffff"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1a1a1a" text-anchor="middle">Data qualification: the stationarity decision (Bendat &amp; Piersol 10.3)</text><rect x="170.0" y="52" width="560.0" height="54" rx="10" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="2"/><text x="450.0" y="75" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="600">Time record x(t)</text><text x="450.0" y="95" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">before trusting any PSD, Leq or GUM average</text><rect x="170.0" y="134" width="560.0" height="54" rx="10" fill="#f0f2f5" stroke="#1f77b4" stroke-width="2"/><text x="450.0" y="157" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="600">Mean square per interval — N = 20 equal segments</text><text x="450.0" y="177" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">each interval long against the record's lowest frequencies; also rms, mean or variance</text><rect x="170.0" y="216" width="560.0" height="54" rx="10" fill="#f0f2f5" stroke="#1f77b4" stroke-width="2"/><text x="450.0" y="239" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="600">Reverse arrangement count A</text><text x="450.0" y="259" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">pairs i &lt; j with x_i &gt; x_j; trend-free mean μ_A = N(N−1)/4 = 95</text><line x1="450.0" y1="106" x2="450.0" y2="121.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 130.0 L 446.4 121.0 L 453.6 121.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="450.0" y1="188" x2="450.0" y2="203.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 212.0 L 446.4 203.0 L 453.6 203.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="450.0" y1="270" x2="450.0" y2="285.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 294.0 L 446.4 285.0 L 453.6 285.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><path d="M 240 340 L 450 296 L 660 340 L 450 384 Z" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/><text x="450.0" y="336" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">64 &lt; A ≤ 125 ?</text><text x="450.0" y="358" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">(Table A.6, α = 0.05)</text><line x1="390" y1="380" x2="258.5502857413644" y2="423.190620399266" stroke="#d62728" stroke-width="1.8" stroke-linecap="round"/><path d="M 250.0 426.0 L 257.4 419.8 L 259.7 426.6 Z" fill="#d62728" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="298" y="392" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#d62728" text-anchor="middle" font-weight="600">no</text><line x1="510" y1="380" x2="641.4497142586356" y2="423.190620399266" stroke="#2ca02c" stroke-width="1.8" stroke-linecap="round"/><path d="M 650.0 426.0 L 640.3 426.6 L 642.6 419.8 Z" fill="#2ca02c" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="602" y="392" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#2ca02c" text-anchor="middle" font-weight="600">yes</text><rect x="60" y="430" width="360" height="96" rx="10" fill="#f0f2f5" stroke="#d62728" stroke-width="2.2"/><text x="240" y="458" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="600">Nonstationary: do not average</text><text x="240" y="482" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#d62728" text-anchor="middle">+20 % gain ramp: A = 7 → rejected</text><text x="240" y="504" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">split at the change, or go short-time (spectrogram)</text><rect x="480" y="430" width="360" height="96" rx="10" fill="#f0f2f5" stroke="#2ca02c" stroke-width="2.2"/><text x="660" y="458" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="600">Stationary: analyse</text><text x="660" y="482" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2ca02c" text-anchor="middle">steady noise: A = 91 → accepted</text><text x="660" y="504" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">the chi-square CIs and error formulas hold</text><text x="450.0" y="566" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">the runs test (method="runs") is the two-sided companion: too many runs is as suspect as too few</text><text x="450.0" y="590" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle">a frequency glide can hide from the mean square: test statistic="mean" or band-filtered copies too</text></svg>