<svg xmlns="http://www.w3.org/2000/svg" width="900" height="670" viewBox="0 0 900 670"><rect width="900" height="670" fill="#ffffff"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1a1a1a" text-anchor="middle">Programme loudness: the BS.1770 / R 128 metering chain</text><rect x="170.0" y="52" width="560.0" height="58" rx="10" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="2"/><text x="450.0" y="77" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="600">Programme x — channel weights Gi: 1.0 front, 1.41 surround</text><text x="450.0" y="97" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">anchor: a 0 dB FS 997 Hz sine on one front channel reads −3.01 LKFS</text><rect x="170.0" y="138" width="560.0" height="58" rx="10" fill="#f0f2f5" stroke="#1f77b4" stroke-width="2"/><text x="450.0" y="163" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="600">K-weighting: +4 dB spherical-head shelf + RLB high-pass</text><text x="450.0" y="183" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">LK = −0.691 + 10·log10 Σ Gi·zi;  LKFS ≡ LUFS, 1 LU = 1 dB</text><rect x="170.0" y="224" width="560.0" height="58" rx="10" fill="#f0f2f5" stroke="#1f77b4" stroke-width="2"/><text x="450.0" y="249" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="600">Mean square in 400 ms blocks, 75 % overlap</text><text x="450.0" y="269" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">absolute gate: blocks below −70 LUFS are dropped</text><rect x="170.0" y="310" width="560.0" height="58" rx="10" fill="#f0f2f5" stroke="#1f77b4" stroke-width="2"/><text x="450.0" y="335" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="600">Relative gate: −10 LU below the survivors</text><text x="450.0" y="355" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">example: 10 s at −23 dBFS + 30 s of quiet → threshold −39.0 LUFS</text><rect x="170.0" y="396" width="560.0" height="60" rx="10" fill="none" stroke="#2ca02c" stroke-width="2.4"/><text x="450.0" y="421" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="600">Integrated loudness I = −23.1 LUFS: the tail is gated out</text><text x="450.0" y="443" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">EBU R 128 target −23.0 LUFS; tolerance ±0.2 LU in QC, ±1.0 LU live</text><line x1="450.0" y1="110" x2="450.0" y2="125.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 134.0 L 446.4 125.0 L 453.6 125.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="450.0" y1="196" x2="450.0" y2="211.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 220.0 L 446.4 211.0 L 453.6 211.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="450.0" y1="282" x2="450.0" y2="297.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 306.0 L 446.4 297.0 L 453.6 297.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="450.0" y1="368" x2="450.0" y2="383.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 392.0 L 446.4 383.0 L 453.6 383.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="170" y1="167" x2="120" y2="167" stroke="#666666" stroke-width="1.4" stroke-linecap="round"/><line x1="120" y1="167" x2="120" y2="484" stroke="#666666" stroke-width="1.4" stroke-linecap="round"/><line x1="120" y1="484" x2="120.0" y2="479.0" stroke="#666666" stroke-width="1.4" stroke-linecap="round"/><path d="M 120.0 488.0 L 116.4 479.0 L 123.6 479.0 Z" fill="#666666" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="120" y="157" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">K-weighted</text><line x1="730" y1="81" x2="780" y2="81" stroke="#666666" stroke-width="1.4" stroke-linecap="round"/><line x1="780" y1="81" x2="780" y2="484" stroke="#666666" stroke-width="1.4" stroke-linecap="round"/><line x1="780" y1="484" x2="780.0" y2="479.0" stroke="#666666" stroke-width="1.4" stroke-linecap="round"/><path d="M 780.0 488.0 L 776.4 479.0 L 783.6 479.0 Z" fill="#666666" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="780" y="71" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">raw signal</text><rect x="70" y="492" width="360" height="82" rx="10" fill="#f0f2f5" stroke="#d62728" stroke-width="2"/><text x="250" y="517" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="600">Loudness range LRA = P95 − P10</text><text x="250" y="538" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">short-term 3 s windows, deeper −20 LU gate</text><text x="250" y="558" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#d62728" text-anchor="middle" font-weight="600">10.0 LU on the Tech 3342 two-step case</text><rect x="470" y="492" width="360" height="82" rx="10" fill="#f0f2f5" stroke="#d62728" stroke-width="2"/><text x="650" y="517" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="600">True peak: 4× oversampling, in dBTP</text><text x="650" y="538" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">the fs/4 tone: sample peak −3.01 dB, true peak +0.12 dBTP</text><text x="650" y="558" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#d62728" text-anchor="middle" font-weight="600">R 128 production ceiling −1 dBTP</text><text x="450" y="618" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">the gates keep quiet passages from dragging the foreground down</text><text x="450" y="642" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle">ungated, the same 40 s example would read near −29 LUFS</text></svg>