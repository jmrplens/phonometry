/><path d="M 442.0 376.0 L 433.0 379.6 L 433.0 372.4 Z" fill="#2ca02c" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="290.0" y1="326.0" x2="332.0" y2="302.0" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round"/><circle cx="290.0" cy="320.0" r="5" fill="#1a1a1a" stroke="none" stroke-width="1.5"/><circle cx="290.0" cy="332.0" r="5" fill="#1a1a1a" stroke="none" stroke-width="1.5"/><text x="338.0" y="298.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start">p-p probe</text><line x1="96.0" y1="276.0" x2="70.76075451500219" y2="281.9386459964701" stroke="#1f77b4" stroke-width="2.0" stroke-linecap="round"/><path d="M 62.0 284.0 L 69.9 278.4 L 71.6 285.4 Z" fill="#1f77b4" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="96.0" y1="326.0" x2="70.76075451500219" y2="331.9386459964701" stroke="#1f77b4" stroke-width="2.0" stroke-linecap="round"/><path d="M 62.0 334.0 L 69.9 328.4 L 71.6 335.4 Z" fill="#1f77b4" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="96.0" y1="376.0" x2="70.76075451500219" y2="381.9386459964701" stroke="#1f77b4" stroke-width="2.0" stroke-linecap="round"/><path d="M 62.0 384.0 L 69.9 378.4 L 71.6 385.4 Z" fill="#1f77b4" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="52.0" y="332.0" font-family="Consolas, Menlo, monospace" font-size="18" fill="#1f77b4" text-anchor="end" font-weight="600">P_j</text><text x="590.0" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="start" font-weight="600">Determining ε_j (Part 2)</text><text x="590.0" y="154" font-family="Consolas, Menlo, monospace" font-size="16" fill="#1f77b4" text-anchor="start" font-weight="600">ε_j = P_j / (Z_c,n ⟨v_j²⟩ S)</text><text x="590.0" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#666666" text-anchor="start">P_j : ISO 9614 band power</text><text x="590.0" y="212" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#666666" text-anchor="start">⟨v_j²⟩ : surface-averaged</text><text x="590.0" y="238" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#666666" text-anchor="start">normal velocity, same bands</text><rect x="580.0" y="268" width="260" height="118" rx="10" fill="#f0f2f5" stroke="#d62728" stroke-width="2.0"/><text x="590.0" y="292" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="600">one machine, one run:</text><text x="590.0" y="314" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start">the same operating mode,</text><text x="590.0" y="336" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start">the same mounting, the same bands.</text><text x="590.0" y="358" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start">ε_j is a property of the structure</text><text x="590.0" y="380" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start">and its excitation together.</text><text x="450" y="450" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">determined once, then the velocity survey alone serves the rest of the family</text><text x="450" y="478" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#666666" text-anchor="middle">mean segment-to-source distance ≥ 200 mm (ISO 9614-2, clause 8.2)</text><text x="450" y="506" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#666666" text-anchor="middle">Part 1 skips this measurement and sets ε = 1, which is why it returns an upper limit</text></svg>