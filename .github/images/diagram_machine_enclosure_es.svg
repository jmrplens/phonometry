d">rendija sin sellar al pie</text><text x="206" y="440" font-family="Consolas, Menlo, monospace" font-size="13" fill="#d62728" text-anchor="end">0,24 m² = 1 % de S_E</text><line x1="208" y1="446" x2="216" y2="460" stroke="#666666" stroke-width="1.0" stroke-linecap="round"/><rect x="680.0" y="384" width="96" height="56" rx="0.0" fill="none" stroke="#1a1a1a" stroke-width="2.2"/><line x1="680.0" y1="394" x2="776.0" y2="394" stroke="#2ca02c" stroke-width="2.0" stroke-dasharray="5,4" stroke-linecap="round"/><line x1="680.0" y1="430" x2="776.0" y2="430" stroke="#2ca02c" stroke-width="2.0" stroke-dasharray="5,4" stroke-linecap="round"/><line x1="768.0" y1="412" x2="701.0" y2="412.0" stroke="#1f77b4" stroke-width="2.0" stroke-linecap="round"/><path d="M 692.0 412.0 L 701.0 408.4 L 701.0 415.6 Z" fill="#1f77b4" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="700" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">entrada revestida</text><text x="700" y="320" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="start">el aire debe poder circular</text><line x1="451.0" y1="528.0" x2="239.0" y2="528.0" stroke="#666666" stroke-width="1.2" stroke-linecap="round"/><path d="M 230.0 528.0 L 239.0 524.4 L 239.0 531.6 Z" fill="#666666" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="459.0" y1="528.0" x2="671.0" y2="528.0" stroke="#666666" stroke-width="1.2" stroke-linecap="round"/><path d="M 680.0 528.0 L 671.0 531.6 L 671.0 524.4 Z" fill="#666666" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="455.0" y="521.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle">3,0 m</text><line x1="858.0" y1="331.0" x2="858.0" y2="209.0" stroke="#666666" stroke-width="1.2" stroke-linecap="round"/><path d="M 858.0 200.0 L 861.6 209.0 L 854.4 209.0 Z" fill="#666666" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="858.0" y1="339.0" x2="858.0" y2="461.0" stroke="#666666" stroke-width="1.2" stroke-linecap="round"/><path d="M 858.0 470.0 L 854.4 461.0 L 861.6 461.0 Z" fill="#666666" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="849.0" y="341.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end">1,8 m</text><text x="40" y="560" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="start">IL = R − C,   C = 10 log10(0,3 + S_E/R_i) = 3,4 dB</text><text x="40" y="586" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f77b4" text-anchor="start">envolvente sellada (R medio = 32,3 dB): IL medio = 28,9 dB</text><text x="40" y="610" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#d62728" text-anchor="start">con la puerta: 21,4 dB; con la rendija del 1 % además: 15,1 dB, frente al techo 10 log10(S_E/S_a) = 20 dB</text><text x="40" y="634" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#666666" text-anchor="start">un encapsulamiento entrega su peor elemento, no sus paneles</text></svg>