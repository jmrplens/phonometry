0.0" y="127" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle">lo más cerca posible de 750 m</text><line x1="110.0" y1="120" x2="110.0" y2="140" stroke="#666666" stroke-width="0.9" stroke-dasharray="3,3" stroke-linecap="round"/><line x1="490.0" y1="174.0" x2="490.0" y2="140" stroke="#666666" stroke-width="0.9" stroke-dasharray="3,3" stroke-linecap="round"/><rect x="450.0" y="305.0" width="120.0" height="117.0" rx="0.0" fill="#f0f2f5" stroke="#666666" stroke-width="1.0" stroke-dasharray="5,4"/><text x="568.0" y="275.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end">mitad inferior de la columna de agua:</text><text x="568.0" y="293.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end">de 2 m sobre el fondo a ½ profundidad</text><rect x="470.0" y="422.0" width="40" height="18" rx="2" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="1.8"/><line x1="490.0" y1="422.0" x2="490.0" y2="305.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><circle cx="490.0" cy="305.0" r="7" fill="#d62728" stroke="none" stroke-width="1.5"/><circle cx="490.0" cy="305.0" r="2.5" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="504.0" y="310.0" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1a1a1a" text-anchor="start">½ prof.</text><circle cx="490.0" cy="372.5" r="7" fill="#d62728" stroke="none" stroke-width="1.5"/><circle cx="490.0" cy="372.5" r="2.5" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="504.0" y="377.5" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1a1a1a" text-anchor="start">¾ prof.</text><text x="492.0" y="474.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle">registrador fondeado</text><path d="M 336 156 L 394 156 L 388 170 L 342 170 Z" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="1.6" stroke-linejoin="round"/><rect x="354" y="142" width="18" height="14" rx="2" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="1.4"/><line x1="248" y1="348" x2="347.3432259498172" y2="183.70158785222532" stroke="#666666" stroke-width="1.2" stroke-linecap="round"/><path d="M 352.0 176.0 L 350.4 185.6 L 344.3 181.8 Z" fill="#666666" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="176" y="372" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="start">motores, generador y ecosonda apagados;</text><text x="176" y="390" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="start">ruido de flujo, cable y balanceo</text><text x="176" y="408" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="start">se leen como señal</text><text x="742" y="64" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="600">Planta: dónde medir además</text><circle cx="742.0" cy="300.0" r="34" fill="#f0f2f5" stroke="#666666" stroke-width="1.2"/><circle cx="742.0" cy="300.0" r="100" fill="none" stroke="#d62728" stroke-width="1.6"/><ellipse cx="742.0" cy="300.0" rx="142" ry="142" fill="none" stroke="#666666" stroke-width="1.2" stroke-dasharray="6,5"/><circle cx="742.0" cy="300.0" r="9" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="2"/><circle cx="742.0" cy="300.0" r="3" fill="#1a1a1a" stroke="none" stroke-width="1.5"/><text x="742.0" y="282.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">pilote</text><line x1="742.0" y1="300.0" x2="794.9919264233205" y2="215.1951903843574" stroke="#666666" stroke-width="1.0" stroke-dasharray="4,4" stroke-linecap="round"/><circle cx="794.9919264233205" cy="215.1951903843574" r="6" fill="#d62728" stroke="none" stroke-width="1.5"/><circle cx="794.9919264233205" cy="215.1951903843574" r="2.2" fill="#ffffff" stroke="none" stroke-width="1.5"/><line x1="742.0" y1="300.0" x2="867.3785581859677" y2="366.6649619155965" stroke="#666666" stroke-width="1.0" stroke-dasharray="4,4" stroke-linecap="round"/><circle cx="867.3785581859677" cy="366.6649619155965" r="6" fill="#2ca02c" stroke="none" stroke-width="1.5"/><circle cx="867.3785581859677" cy="366.6649619155965" r="2.2" fill="#ffffff" stroke="none" stroke-width="1.5"/><line x1="742.0" y1="300.0" x2="602.1572990722665" y2="324.6580412287041" stroke="#666666" stroke-width="1.0" stroke-dasharray="4,4" stroke-linecap="round"/><circle cx="602.1572990722665" cy="324.6580412287041" r="6" fill="#2ca02c" stroke="none" stroke-width="1.5"/><circle cx="602.1572990722665" cy="324.6580412287041" r="2.2" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="742.0" y="358.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle">3 × profundidad = 90 m:</text><text x="742.0" y="374.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle">sin posiciones</text><text x="806.0" y="208.0" font-family="Consolas, Menlo, monospace" font-size="15" fill="#d62728" text-anchor="start">750 m</text><text x="742.0" y="476.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle">más posiciones en un transecto,</text><text x="742.0" y="496.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle">libre de bancos y fosas</text><text x="742.0" y="516.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle">(radios sin escala)</text><text x="70" y="552" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="start">Solo hincado percusivo, en 4 m a 100 m de agua: vibrohincado y tablestacas quedan fuera del alcance</text><text x="70" y="580" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="start">750 m es un convenio de comparabilidad, no un límite normativo; se informa la distancia real, con un 5 %</text><text x="70" y="608" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="start">La estación registra toda la secuencia de hincado, arranque suave incluido, a una distancia fija</text><text x="70" y="636" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="start">Anota profundidad del hidrófono, GPS, profundidad y marea, clase de fondo y la energía por golpe</text></svg>