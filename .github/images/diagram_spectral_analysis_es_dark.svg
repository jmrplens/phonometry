<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><rect width="900" height="600" fill="#0d1117"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6e6e6" text-anchor="middle">PSD de Welch: segmentar, enventanar, promediar (Bendat &amp; Piersol)</text><rect x="110.0" y="52" width="680.0" height="58.0" rx="10" fill="#1c2128" stroke="#e6e6e6" stroke-width="2"/><text x="450.0" y="77" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>Registro </tspan><tspan font-style="italic">x</tspan><tspan>(</tspan><tspan font-style="italic">t</tspan><tspan>) — </tspan><tspan font-style="italic">f</tspan><tspan dy="3.7" font-size="11.9" font-style="italic">s</tspan><tspan dy="-3.7"> = 48 kHz, 20 s de ruido rosa</tspan></text><text x="450.0" y="97" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9a9a9a" text-anchor="middle">960 000 muestras, calibrado de extremo a extremo: pascales dentro, Pa²/Hz fuera</text><rect x="110.0" y="138" width="680.0" height="58.0" rx="10" fill="#1c2128" stroke="#4da3d8" stroke-width="2"/><text x="450.0" y="163" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="middle" font-weight="600">División en segmentos con 50 % de solape — nperseg = 4096</text><text x="450.0" y="183" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9a9a9a" text-anchor="middle" xml:space="preserve"><tspan>467 segmentos de 85,3 ms; separación de bins Δ</tspan><tspan font-style="italic">f</tspan><tspan> = </tspan><tspan font-style="italic">f</tspan><tspan dy="2.9" font-size="9.1" font-style="italic">s</tspan><tspan dy="-2.9">/4096 = 11,7 Hz</tspan></text><rect x="110.0" y="224" width="680.0" height="58.0" rx="10" fill="#1c2128" stroke="#4da3d8" stroke-width="2"/><text x="450.0" y="249" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="middle" font-weight="600">Ventana de Hann en cada segmento</text><text x="450.0" y="269" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9a9a9a" text-anchor="middle" xml:space="preserve"><tspan>ENBW = 1,5 bins → ancho de banda de resolución </tspan><tspan font-style="italic">B</tspan><tspan dy="2.9" font-size="9.1" font-style="italic">e</tspan><tspan dy="-2.9"> = 1,5·Δ</tspan><tspan font-style="italic">f</tspan><tspan> = 17,6 Hz</tspan></text><rect x="110.0" y="310" width="680.0" height="58.0" rx="10" fill="#1c2128" stroke="#e6e6e6" stroke-width="2"/><text x="450.0" y="335" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>Periodograma unilateral |FFT|</tspan><tspan dy="-6.5" font-size="11.9">2</tspan><tspan dy="6.5"> de cada segmento, y promedio</tspan></text><text x="450.0" y="355" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9a9a9a" text-anchor="middle" xml:space="preserve"><tspan>correlación por solape (Welch 1967): 467 segmentos → </tspan><tspan font-style="italic">n</tspan><tspan dy="2.9" font-size="9.1" font-style="italic">d</tspan><tspan dy="-2.9"> = 442 promedios efectivos</tspan></text><rect x="110.0" y="396" width="680.0" height="60" rx="10" fill="none" stroke="#5abf5a" stroke-width="2.4"/><text x="450.0" y="421" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan font-style="italic">G</tspan><tspan dy="3.7" font-size="11.9" font-style="italic">xx</tspan><tspan dy="-3.7">(</tspan><tspan font-style="italic">f</tspan><tspan>) con su intervalo de confianza chi-cuadrado</tspan></text><text x="450.0" y="443" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9a9a9a" text-anchor="middle" xml:space="preserve"><tspan>error aleatorio </tspan><tspan font-style="italic">ε</tspan><tspan dy="2.9" font-size="9.1" font-style="italic">r</tspan><tspan dy="-2.9"> = 1/√</tspan><tspan font-style="italic">n</tspan><tspan dy="2.9" font-size="9.1" font-style="italic">d</tspan><tspan dy="-2.9"> = 4,8 %;  2·</tspan><tspan font-style="italic">n</tspan><tspan dy="2.9" font-size="9.1" font-style="italic">d</tspan><tspan dy="-2.9"> ≈ 885 grados de libertad</tspan></text><line x1="450.0" y1="110" x2="450.0" y2="125.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 134.0 L 446.4 125.0 L 453.6 125.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="450.0" y1="196" x2="450.0" y2="211.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 220.0 L 446.4 211.0 L 453.6 211.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="450.0" y1="282" x2="450.0" y2="297.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 306.0 L 446.4 297.0 L 453.6 297.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="450.0" y1="368" x2="450.0" y2="383.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 392.0 L 446.4 383.0 L 453.6 383.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="450.0" y1="456" x2="450.0" y2="475.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 484.0 L 446.4 475.0 L 453.6 475.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="130" y="488" width="640" height="72" rx="10" fill="none" stroke="#e46a6a" stroke-width="1.6" stroke-dasharray="6,5"/><text x="450.0" y="517" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e46a6a" text-anchor="middle" font-weight="600">El compromiso: el segmento compra resolución o estabilidad, nunca ambas</text><text x="450.0" y="543" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e6e6e6" text-anchor="middle" xml:space="preserve"><tspan>segmentos más largos → </tspan><tspan font-style="italic">B</tspan><tspan dy="2.9" font-size="9.1" font-style="italic">e</tspan><tspan dy="-2.9"> más fino pero menos promedios (mayor </tspan><tspan font-style="italic">ε</tspan><tspan dy="2.9" font-size="9.1" font-style="italic">r</tspan><tspan dy="-2.9">); más cortos → lo contrario</tspan></text></svg>