<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580"><rect width="900" height="580" fill="#0d1117"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6e6e6" text-anchor="middle">Audibilidad tonal: del espectro al ajuste (ISO/PAS 20065)</text><rect x="140.0" y="52" width="620.0" height="58" rx="10" fill="#1c2128" stroke="#e6e6e6" stroke-width="2"/><text x="450.0" y="77" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e6e6e6" text-anchor="middle" font-weight="600">Espectro FFT de banda estrecha — resolución Δf = 2,7 Hz</text><text x="450.0" y="97" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">espectro del motor del Anexo E; pico detectado en fT = 137,3 Hz (no en una ladera)</text><rect x="140.0" y="138" width="620.0" height="58" rx="10" fill="#1c2128" stroke="#4da3d8" stroke-width="2"/><text x="450.0" y="163" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e6e6e6" text-anchor="middle" font-weight="600">Banda crítica en torno al tono — Δfc = 101,36 Hz</text><text x="450.0" y="183" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">colocación geométrica: esquinas en 95,67 y 197,04 Hz, √(f1·f2) = fT</text><rect x="140.0" y="224" width="620.0" height="58" rx="10" fill="#1c2128" stroke="#4da3d8" stroke-width="2"/><text x="450.0" y="249" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e6e6e6" text-anchor="middle" font-weight="600">Niveles desde las líneas del espectro en la banda</text><text x="450.0" y="269" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">ruido enmascarante LS = 49,22 dB (media iterativa); tono LT = 67,96 dB (suma energética)</text><rect x="140.0" y="310" width="620.0" height="58" rx="10" fill="#1c2128" stroke="#4da3d8" stroke-width="2"/><text x="450.0" y="335" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e6e6e6" text-anchor="middle" font-weight="600">Umbral de enmascaramiento visto por el oído</text><text x="450.0" y="355" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">LG = LS + 10·log10(Δfc/Δf) = 64,97 dB;  índice de enmascaramiento av = −2,02 dB</text><rect x="140.0" y="396" width="620.0" height="60" rx="10" fill="none" stroke="#5abf5a" stroke-width="2.4"/><text x="450.0" y="421" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="middle" font-weight="600">Audibilidad ΔL = LT − LG − av = 5,01 dB</text><text x="450.0" y="443" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">el mayor ΔL de los nueve tonos: la audibilidad decisiva de este espectro</text><line x1="450.0" y1="110" x2="450.0" y2="125.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 134.0 L 446.4 125.0 L 453.6 125.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="450.0" y1="196" x2="450.0" y2="211.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 220.0 L 446.4 211.0 L 453.6 211.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="450.0" y1="282" x2="450.0" y2="297.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 306.0 L 446.4 297.0 L 453.6 297.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="450.0" y1="368" x2="450.0" y2="383.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 392.0 L 446.4 383.0 L 453.6 383.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="450.0" y1="456" x2="450.0" y2="475.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 484.0 L 446.4 475.0 L 453.6 475.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="130" y="488" width="640" height="68" rx="10" fill="none" stroke="#e46a6a" stroke-width="1.6" stroke-dasharray="6,5"/><text x="450.0" y="515" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e46a6a" text-anchor="middle" font-weight="600">De la audibilidad al ajuste (ISO 1996-2:2017, Anexo J)</text><text x="450.0" y="539" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e6e6e6" text-anchor="middle">media energética de los cinco espectros ΔL = 6,98 dB → ajuste tonal Kt = 4 dB (Tabla J.1)</text></svg>