<svg xmlns="http://www.w3.org/2000/svg" width="900" height="545" viewBox="0 0 900 545"><rect width="900" height="545" fill="#0d1117"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6e6e6" text-anchor="middle">Captura de un par para STOI a través de un dispositivo real</text><rect x="26" y="242.0" width="96" height="92" rx="8" fill="#1c2128" stroke="#e6e6e6" stroke-width="2"/><text x="74" y="280.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="middle" font-weight="600">señal</text><text x="74" y="302.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9a9a9a" text-anchor="middle">de voz limpia</text><path d="M 122 274 C 168 274 168 144 212 144" fill="none" stroke="#4da3d8" stroke-width="2.2" stroke-linejoin="round"/><line x1="200" y1="144.0" x2="205.0" y2="144.0" stroke="#4da3d8" stroke-width="2.2" stroke-linecap="round"/><path d="M 214.0 144.0 L 205.0 147.6 L 205.0 140.4 Z" fill="#4da3d8" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="122" y1="288.0" x2="205.0" y2="288.0" stroke="#e46a6a" stroke-width="2.2" stroke-linecap="round"/><path d="M 214.0 288.0 L 205.0 291.6 L 205.0 284.4 Z" fill="#e46a6a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="214" y="118.0" width="300" height="56" rx="8" fill="#1c2128" stroke="#4da3d8" stroke-width="2"/><text x="364.0" y="142.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e6e6e6" text-anchor="middle" font-weight="600">camino de referencia</text><text x="364.0" y="163.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9a9a9a" text-anchor="middle">el archivo original, nunca una regrabación</text><line x1="514" y1="146.0" x2="587.0" y2="146.0" stroke="#4da3d8" stroke-width="2.2" stroke-linecap="round"/><path d="M 596.0 146.0 L 587.0 149.6 L 587.0 142.4 Z" fill="#4da3d8" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="214" y="262.0" width="118" height="52" rx="8" fill="#1c2128" stroke="#e46a6a" stroke-width="2"/><text x="273.0" y="284.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e6e6e6" text-anchor="middle" font-weight="600">reproducción</text><text x="273.0" y="305.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9a9a9a" text-anchor="middle">amplificador + altavoz</text><line x1="332" y1="288.0" x2="347.0" y2="288.0" stroke="#e46a6a" stroke-width="2.2" stroke-linecap="round"/><path d="M 356.0 288.0 L 347.0 291.6 L 347.0 284.4 Z" fill="#e46a6a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="356" y="214.0" width="172" height="148" rx="8" fill="none" stroke="#9a9a9a" stroke-width="1.6" stroke-dasharray="6,5"/><text x="442" y="204.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">caja de ensayo</text><rect x="370" y="236.0" width="144" height="46" rx="8" fill="#1c2128" stroke="#e46a6a" stroke-width="2"/><text x="442.0" y="265.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e6e6e6" text-anchor="middle" font-weight="600">equipo bajo ensayo</text><text x="442" y="308.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9a9a9a" text-anchor="middle">audífono sobre oído artificial,</text><text x="442" y="328.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9a9a9a" text-anchor="middle">o auriculares sobre un simulador de torso</text><line x1="528" y1="288.0" x2="543.0" y2="288.0" stroke="#e46a6a" stroke-width="2.2" stroke-linecap="round"/><path d="M 552.0 288.0 L 543.0 291.6 L 543.0 284.4 Z" fill="#e46a6a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="552" y="262.0" width="116" height="52" rx="8" fill="#1c2128" stroke="#e46a6a" stroke-width="2"/><text x="610.0" y="284.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e6e6e6" text-anchor="middle" font-weight="600">captura</text><text x="610.0" y="305.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9a9a9a" text-anchor="middle">micrófono + preamplificador</text><path d="M 668 288 C 696 288 696 248 696 226" fill="none" stroke="#e46a6a" stroke-width="2.2" stroke-linejoin="round"/><line x1="696" y1="238.0" x2="696.0" y2="215.0" stroke="#e46a6a" stroke-width="2.2" stroke-linecap="round"/><path d="M 696.0 206.0 L 699.6 215.0 L 692.4 215.0 Z" fill="#e46a6a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="596" y="112.0" width="200" height="88" rx="10" fill="#1c2128" stroke="#5abf5a" stroke-width="2.4"/><text x="696" y="140.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#e6e6e6" text-anchor="middle" font-weight="600">alinear y recortar</text><text x="696" y="164.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5abf5a" text-anchor="middle">correlacionar las envolventes</text><text x="696" y="184.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5abf5a" text-anchor="middle">misma longitud · un solo reloj</text><line x1="796" y1="156.0" x2="805.0" y2="156.0" stroke="#5abf5a" stroke-width="2.2" stroke-linecap="round"/><path d="M 814.0 156.0 L 805.0 159.6 L 805.0 152.4 Z" fill="#5abf5a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="816" y="112.0" width="60" height="88" rx="8" fill="#1c2128" stroke="#e6e6e6" stroke-width="2"/><text x="846" y="150.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="600">STOI /</text><text x="846" y="170.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="600">ESTOI</text><rect x="214" y="392" width="454" height="56" rx="10" fill="none" stroke="#4da3d8" stroke-width="1.6" stroke-dasharray="6,5"/><text x="441" y="416" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#4da3d8" text-anchor="middle" font-weight="600">hágalo una vez con el equipo puenteado</text><text x="441" y="438" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9a9a9a" text-anchor="middle">el altavoz, el ruido de la caja y el micrófono también se puntúan como degradación</text><line x1="268" y1="392" x2="268" y2="318.0" stroke="#4da3d8" stroke-width="1.2" stroke-dasharray="5,4" stroke-linecap="round"/><line x1="610" y1="392" x2="610" y2="318.0" stroke="#4da3d8" stroke-width="1.2" stroke-dasharray="5,4" stroke-linecap="round"/><rect x="26" y="468" width="850" height="62" rx="10" fill="none" stroke="#e6e6e6" stroke-width="1.4" stroke-dasharray="6,5"/><text x="450" y="494" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e6e6e6" text-anchor="middle" font-weight="600">Reproduzca al nivel de operación del equipo y repita la captura</text><text x="450" y="518" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9a9a9a" text-anchor="middle">el índice es invariante al nivel, el equipo no; una sola captura arrastra la dispersión del camino acústico</text></svg>