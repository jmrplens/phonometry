<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"><rect width="900" height="560" fill="#0d1117"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6e6e6" text-anchor="middle">The cepstrum chain: an echo becomes a quefrency spike</text><rect x="48" y="64" width="190" height="86" rx="10" fill="#1c2128" stroke="#e6e6e6" stroke-width="2"/><text x="143.0" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="600">Signal with one echo</text><text x="143.0" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">x = s(t) + a·s(t − t0)</text><text x="143.0" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">a = 0.5,  t0 = 8 ms</text><rect x="262" y="64" width="180" height="86" rx="10" fill="#1c2128" stroke="#4da3d8" stroke-width="2"/><text x="352.0" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="600">Ripply spectrum |X(f)|</text><text x="352.0" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">cosine ripple of period</text><text x="352.0" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">1/t0 = 125 Hz</text><rect x="466" y="64" width="180" height="86" rx="10" fill="#1c2128" stroke="#4da3d8" stroke-width="2"/><text x="556.0" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="600">Take the log: ln |X|²</text><text x="556.0" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">the multiplicative echo</text><text x="556.0" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">becomes an additive ripple</text><rect x="670" y="64" width="190" height="86" rx="10" fill="#1c2128" stroke="#e46a6a" stroke-width="2"/><text x="765.0" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="600">Inverse FFT</text><text x="765.0" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">quefrency axis, in seconds</text><text x="765.0" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">the cepstrum</text><line x1="240.0" y1="107" x2="251.0" y2="107.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 260.0 107.0 L 251.0 110.6 L 251.0 103.4 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="444.0" y1="107" x2="455.0" y2="107.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 464.0 107.0 L 455.0 110.6 L 455.0 103.4 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="648.0" y1="107" x2="659.0" y2="107.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 668.0 107.0 L 659.0 110.6 L 659.0 103.4 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="765" y1="152" x2="765.0" y2="187.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 765.0 196.0 L 761.4 187.0 L 768.6 187.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="70" y="200" width="760" height="240" rx="10" fill="#1c2128" stroke="#e6e6e6" stroke-width="1.8"/><line x1="110.0" y1="370.0" x2="790" y2="370.0" stroke="#e6e6e6" stroke-width="1.6" stroke-linecap="round"/><line x1="790" y1="370.0" x2="797.0" y2="370.0" stroke="#e6e6e6" stroke-width="1.6" stroke-linecap="round"/><path d="M 806.0 370.0 L 797.0 373.6 L 797.0 366.4 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="800" y="390" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9a9a9a" text-anchor="end">quefrency</text><path d="M 110 294 Q 132 360 178 370" fill="none" stroke="#9a9a9a" stroke-width="2.0" stroke-linejoin="round"/><text x="170" y="244" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">source wavelet,</text><text x="170" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">below 2 ms</text><line x1="382.0" y1="370.0" x2="382.0" y2="260.0" stroke="#4da3d8" stroke-width="2.6" stroke-linecap="round"/><circle cx="382.0" cy="260.0" r="3.5" fill="#4da3d8" stroke="none" stroke-width="1.5"/><text x="382.0" y="246" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#4da3d8" text-anchor="middle" font-weight="600">a = 0.5 at t0 = 8 ms</text><line x1="654.0" y1="370.0" x2="654.0" y2="397.0" stroke="#e46a6a" stroke-width="2.2" stroke-linecap="round"/><circle cx="654.0" cy="397.0" r="3.0" fill="#e46a6a" stroke="none" stroke-width="1.5"/><text x="668.0" y="404.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#e46a6a" text-anchor="start">−a²/2 = −0.125</text><line x1="246.0" y1="224" x2="246.0" y2="414" stroke="#5abf5a" stroke-width="1.6" stroke-dasharray="6,5" stroke-linecap="round"/><text x="246.0" y="432" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5abf5a" text-anchor="middle">lifter cutoff 4 ms</text><text x="176" y="218" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#e6e6e6" text-anchor="middle">lowpass: envelope</text><text x="450" y="218" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#e6e6e6" text-anchor="middle">highpass: the echo ripple alone</text><line x1="110.0" y1="370.0" x2="110.0" y2="376.0" stroke="#e6e6e6" stroke-width="1.4" stroke-linecap="round"/><text x="110.0" y="392.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">0</text><line x1="382.0" y1="370.0" x2="382.0" y2="376.0" stroke="#e6e6e6" stroke-width="1.4" stroke-linecap="round"/><text x="382.0" y="392.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">8 ms</text><line x1="654.0" y1="370.0" x2="654.0" y2="376.0" stroke="#e6e6e6" stroke-width="1.4" stroke-linecap="round"/><text x="654.0" y="420.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">16 ms</text><text x="450" y="478" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="600">rahmonics at n·t0 with heights a, −a²/2, a³/3, …, whatever the source spectrum does</text><text x="450" y="504" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9a9a9a" text-anchor="middle">the highpass ripple swings between 20·lg(1 ± a) = +3.5 and −6.0 dB; echo_detection reads t0 and a off the peak</text></svg>