version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    # A release is proposed three days after it is published, not the
    # morning it appears: a compromised version is usually yanked within that
    # window, and a pin that lands on it would publish it with the next release.
    # The same window on every ecosystem below.
    cooldown:
      default-days: 3
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    cooldown:
      default-days: 3
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 5
    # The exact pins in requirements*.txt move to each new release, because
    # an `==` pin never admits it; the `>=` floors in pyproject.toml already
    # admit every newer release and stay where they were measured. "increase"
    # would raise them to the release being bumped to, with no failure behind
    # it (CONTRIBUTING.md, section 3a).
    versioning-strategy: "increase-if-necessary"
    groups:
      python:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/site"
    cooldown:
      default-days: 3
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "javascript"
    open-pull-requests-limit: 5
    # katex takes every update like the rest. rehype-katex renders the markup
    # with a katex of its own and still asks for ^0.16, but site/package.json
    # and an override in site/pnpm-workspace.yaml both read katex from one
    # catalog entry there, so a bump moves the renderer and the stylesheet
    # together, and `pnpm check:math` fails the build if they ever part.
    groups:
      site:
        patterns:
          - "*"

  # The Pyodide the CI job installs the wheel into, standing in for
  # JupyterLite: a new Pyodide ships new numpy and scipy builds, which is
  # what decides whether the package installs there.
  - package-ecosystem: "npm"
    directory: "/tests/pyodide"
    cooldown:
      default-days: 3
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "javascript"
    open-pull-requests-limit: 2

  # The base images of docker/node/Dockerfile. The gpu stage's is the GPU
  # node the CuPy proof in gpu-parity.lock is measured on. Its CUDA minor is
  # the node driver's own, and the CUDA headers are pinned to the exact
  # cudart it carries, which no CI job would catch drifting, since none
  # builds that stage. So only a new digest of the same tag is proposed: a
  # CUDA release of any size is a change made by hand, with the headers and
  # the driver beside it. The cpu stage starts from Ubuntu 24.04, the release
  # the CUDA image is built on, and the CI job that builds that stage checks
  # a new digest of it. The image's ffmpeg is pinned by URL and SHA-256,
  # which Dependabot cannot move; the workflow node-ffmpeg.yml watches it.
  - package-ecosystem: "docker"
    directory: "/docker/node"
    cooldown:
      default-days: 3
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "area: simulation"
    ignore:
      - dependency-name: "nvidia/cuda"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "ubuntu"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
