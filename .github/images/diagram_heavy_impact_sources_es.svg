ke-linejoin="round"/><text x="841.0" y="358.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start">85 cm</text><line x1="802.0" y1="274.0" x2="832.0" y2="274.0" stroke="#666666" stroke-width="0.9" stroke-dasharray="3,3" stroke-linecap="round"/><rect x="60" y="508" width="780" height="60" rx="8" fill="#f0f2f5" stroke="#666666" stroke-width="1.4"/><text x="150.0" y="543" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle">fuente</text><line x1="216.0" y1="538" x2="273.0" y2="538.0" stroke="#666666" stroke-width="1.8" stroke-linecap="round"/><path d="M 282.0 538.0 L 273.0 541.6 L 273.0 534.4 Z" fill="#666666" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="350.0" y="532" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle">suelo rigido +</text><text x="350.0" y="552" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle">plataforma de fuerza</text><line x1="416.0" y1="538" x2="473.0" y2="538.0" stroke="#666666" stroke-width="1.8" stroke-linecap="round"/><path d="M 482.0 538.0 L 473.0 541.6 L 473.0 534.4 Z" fill="#666666" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="550.0" y="543" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1f77b4" text-anchor="middle" font-weight="600">filtro de octava</text><line x1="616.0" y1="538" x2="673.0" y2="538.0" stroke="#666666" stroke-width="1.8" stroke-linecap="round"/><path d="M 682.0 538.0 L 673.0 541.6 L 673.0 534.4 Z" fill="#666666" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="750.0" y="543" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle">analizador → L_FE</text><text x="450" y="592" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#d62728" text-anchor="middle" font-weight="600">JIS A 1418-2 Anexo C: el filtro va ANTES del analizador,</text><text x="450" y="613" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#d62728" text-anchor="middle" font-weight="600">de modo que L_FE se evalua una vez por banda</text><text x="450" y="638" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#666666" text-anchor="middle" font-style="italic">Las dimensiones anteriores son ejemplos constructivos informativos de las normas;</text><text x="450" y="658" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#666666" text-anchor="middle" font-style="italic">la especificacion es el espectro de fuerza, no la forma.</text></svg>