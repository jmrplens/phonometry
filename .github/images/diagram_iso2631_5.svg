<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580"><rect width="900" height="580" fill="#ffffff"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1a1a1a" text-anchor="middle">Multiple-shock spinal-response dose and injury risk (ISO 2631-5)</text><rect x="120.0" y="48" width="660.0" height="58.0" rx="10" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="2"/><text x="450.0" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>Vertical seat acceleration  </tspan><tspan font-style="italic">a</tspan><tspan dy="4.2" font-size="13.3" font-style="italic">z</tspan><tspan dy="-4.2">(</tspan><tspan font-style="italic">t</tspan><tspan>)</tspan></text><text x="450.0" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle">conditioned per 5.1.3:  HP 0.01 Hz (2nd order) / LP 80 Hz (4th order)</text><line x1="450.0" y1="106" x2="450.0" y2="127.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 136.0 L 446.4 127.0 L 453.6 127.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="424.0" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#d62728" text-anchor="end">not the ISO 2631-1 0.4 Hz / 100 Hz filters</text><rect x="120.0" y="136" width="660.0" height="58.0" rx="10" fill="#f0f2f5" stroke="#1f77b4" stroke-width="2"/><text x="450.0" y="161" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>Spinal response  </tspan><tspan font-style="italic">A</tspan><tspan dy="3.7" font-size="11.9" font-style="italic">z</tspan><tspan dy="-3.7">(</tspan><tspan font-style="italic">t</tspan><tspan>)  (clause 5.2, Formula 1/2)</tspan></text><text x="450.0" y="181" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle" xml:space="preserve"><tspan>seat-to-spine transfer function </tspan><tspan font-style="italic">H</tspan><tspan>(</tspan><tspan font-style="italic">f</tspan><tspan>): 1 zero, 6 poles</tspan></text><rect x="120.0" y="224" width="660.0" height="58.0" rx="10" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="2"/><text x="450.0" y="249" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>Acceleration dose  </tspan><tspan font-style="italic">D</tspan><tspan dy="3.7" font-size="11.9" font-style="italic">z</tspan><tspan dy="-3.7"> = 1.07·(Σ </tspan><tspan font-style="italic">A</tspan><tspan dy="3.7" font-size="11.9" font-style="italic">z</tspan><tspan font-size="11.9">,</tspan><tspan font-size="11.9" font-style="italic">i</tspan><tspan dy="-10.2" font-size="11.9">6</tspan><tspan dy="6.5">)</tspan><tspan dy="-6.5" font-size="11.9">1/6</tspan><tspan dy="6.5">  (Formula 3)</tspan></text><text x="450.0" y="269" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">A</tspan><tspan dy="2.9" font-size="9.1" font-style="italic">z</tspan><tspan font-size="9.1">,</tspan><tspan font-size="9.1" font-style="italic">i</tspan><tspan dy="-2.9"> = positive peaks;   daily dose </tspan><tspan font-style="italic">D</tspan><tspan dy="2.9" font-size="9.1" font-style="italic">zd</tspan><tspan dy="-2.9"> = </tspan><tspan font-style="italic">D</tspan><tspan dy="2.9" font-size="9.1" font-style="italic">z</tspan><tspan dy="-2.9">·(</tspan><tspan font-style="italic">t</tspan><tspan dy="2.9" font-size="9.1" font-style="italic">d</tspan><tspan dy="-2.9">/</tspan><tspan font-style="italic">t</tspan><tspan dy="2.9" font-size="9.1" font-style="italic">m</tspan><tspan dy="-2.9">)</tspan><tspan dy="-4.9" font-size="9.1">1/6</tspan></text><rect x="120.0" y="312" width="660.0" height="58.0" rx="10" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="2"/><text x="450.0" y="337" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>Compressive stress  </tspan><tspan font-style="italic">S</tspan><tspan dy="3.7" font-size="11.9" font-style="italic">d</tspan><tspan dy="-3.7"> = </tspan><tspan font-style="italic">m</tspan><tspan dy="3.7" font-size="11.9" font-style="italic">z</tspan><tspan dy="-3.7">·</tspan><tspan font-style="italic">D</tspan><tspan dy="3.7" font-size="11.9" font-style="italic">zd</tspan><tspan dy="-3.7">  (Annex C, Formula C.1)</tspan></text><text x="450.0" y="357" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">m</tspan><tspan dy="2.9" font-size="9.1" font-style="italic">z</tspan><tspan dy="-2.9"> = 0.029 (male) / 0.025 (female) MPa per m/s²</tspan></text><rect x="120.0" y="400" width="660.0" height="58.0" rx="10" fill="#f0f2f5" stroke="#d62728" stroke-width="2"/><text x="450.0" y="425" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">Stress variable  R = [Σ (Sd·N^(1/6) / (Su − Sstat))^6]^(1/6)</text><text x="450.0" y="445" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle">Su = 6.75 − Sage·(b+i) MPa, cumulated over exposure years (C.3/C.4)</text><line x1="450.0" y1="196" x2="450.0" y2="215.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 224.0 L 446.4 215.0 L 453.6 215.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="450.0" y1="284" x2="450.0" y2="303.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 312.0 L 446.4 303.0 L 453.6 303.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="450.0" y1="372" x2="450.0" y2="391.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 400.0 L 446.4 391.0 L 453.6 391.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="450.0" y1="460" x2="450.0" y2="479.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 488.0 L 446.4 479.0 L 453.6 479.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="120.0" y="488" width="660.0" height="58" rx="10" fill="none" stroke="#1f77b4" stroke-width="2.4"/><text x="450.0" y="513" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>Injury probability  </tspan><tspan font-style="italic">P</tspan><tspan>(</tspan><tspan font-style="italic">R</tspan><tspan>) = 1 − exp(−(</tspan><tspan font-style="italic">R</tspan><tspan>/</tspan><tspan font-style="italic">α</tspan><tspan>)</tspan><tspan dy="-6.5" font-size="11.9" font-style="italic">β</tspan><tspan dy="6.5">)  (Formula C.5)</tspan></text><text x="450.0" y="533" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle">Weibull risk of lumbar injury, by sex (Table C.1/C.2)</text></svg>