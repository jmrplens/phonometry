[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phonometry"
dynamic = ["version"]
authors = [
  { name="José Manuel Requena Plens", email="mail@jmrp.io" },
]
description = "Acoustic measurement toolkit: fractional octave-band filters, A/C/Z and time weighting, and sound level metrology per IEC 61260-1 and IEC 61672-1."
# The PyPI long description is generated from README.md (which uses
# theme-aware <picture> elements that PyPI's renderer strips) by
# scripts/generate_pypi_readme.py; `make pypi-readme` refreshes it and the
# packaging tests fail on drift.
readme = "README_PYPI.md"
requires-python = ">=3.13"
# Search terms for PyPI: the domains the library actually covers, plus the
# designations of the standards its metrics are implemented from, so a search
# for a standard number finds the package.
keywords = [
    "acoustics",
    "sound level meter",
    "sound level",
    "octave band",
    "fractional octave band",
    "octave filter bank",
    "frequency weighting",
    "signal processing",
    "psychoacoustics",
    "loudness",
    "sharpness",
    "roughness",
    "room acoustics",
    "reverberation time",
    "sound absorption",
    "sound insulation",
    "building acoustics",
    "sound power",
    "vibration",
    "human vibration exposure",
    "environmental noise",
    "aircraft noise",
    "underwater acoustics",
    "electroacoustics",
    "loudspeaker measurement",
    "broadcast loudness",
    "noise control",
    "acoustic metrology",
    "standards conformance",
    "ANSI S1.11",
    "IEC 61260-1",
    "IEC 61672-1",
    "IEC 60942",
    "IEC 60268-3",
    "ISO 226",
    "ISO 532-1",
    "ISO 354",
    "ISO 3382-1",
    "ISO 717-1",
    "ISO 16283-1",
    "EN 12354",
    "ISO 1996-1",
    "ISO 9613-2",
    "ISO 2631-1",
    "ISO 7196",
    "ECMA-418-1",
    "EBU R 128",
    "ITU-R BS.1770",
    "ICAO Annex 16",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.5.2",
    "scipy>=1.18.0",
]

[project.optional-dependencies]
perf = ["numba>=0.67.0"]
plot = ["matplotlib>=3.11.1"]
report = ["reportlab>=5.0.0", "svglib>=2.1.0"]
full = ["numba>=0.67.0", "matplotlib>=3.11.1", "reportlab>=5.0.0", "svglib>=2.1.0"]

[project.urls]
"Homepage" = "https://github.com/jmrplens/phonometry"
"Documentation" = "https://jmrplens.github.io/phonometry/"
"Source" = "https://github.com/jmrplens/phonometry"
"Changelog" = "https://github.com/jmrplens/phonometry/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/jmrplens/phonometry/issues"
"DOI" = "https://doi.org/10.5281/zenodo.21215280"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phonometry = ["py.typed", "aircraft/data/anp/*.csv", "aircraft/data/anp/*.md"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.coverage.run]
relative_files = true

[tool.pytest.ini_options]
pythonpath = ["tests"]
# Group-aware distribution for `-n auto` runs: tests marked with
# `xdist_group` land on one worker, so an expensive module-scoped fixture
# (FDTD steady states, ECMA-418-2 reference results, the memoized
# conformance registry) is computed once per run instead of once per worker
# that happens to pick one of its consumers. Unmarked tests are distributed
# exactly as with the default `load` mode, and the flag is inert without `-n`.
addopts = ["--dist=loadgroup"]
filterwarnings = [
    "ignore:Low sampling rate:UserWarning",
    # A deprecated phonometry name used anywhere in the suite is an error, not
    # a line in a log nobody reads: the shims exist for users on the old paths,
    # and the tests are not users. The one file that exercises the shims on
    # purpose catches them with pytest.warns, which passes under this filter.
    "error:.*is deprecated since phonometry.*:DeprecationWarning",
]