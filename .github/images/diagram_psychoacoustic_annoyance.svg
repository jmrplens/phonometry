<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520"><rect width="900" height="520" fill="#ffffff"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1a1a1a" text-anchor="middle">Psychoacoustic annoyance: four sensations, one scalar</text><rect x="42.0" y="60" width="196" height="72" rx="10" fill="#f0f2f5" stroke="#1f77b4" stroke-width="2"/><text x="140.0" y="84" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan font-style="italic">S</tspan><tspan> = 2.0 acum</tspan></text><text x="140.0" y="103" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">sharpness (DIN 45692)</text><text x="140.0" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">counts only above 1.75 acum</text><rect x="262.0" y="60" width="196" height="72" rx="10" fill="#f0f2f5" stroke="#1f77b4" stroke-width="2"/><text x="360.0" y="84" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan font-style="italic">N</tspan><tspan dy="3.1" font-size="9.8">5</tspan><tspan dy="-3.1"> = 30 sone</tspan></text><text x="360.0" y="103" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">percentile loudness (ISO 532-1)</text><text x="360.0" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">exceeded 5 % of the time</text><rect x="482.0" y="60" width="196" height="72" rx="10" fill="#f0f2f5" stroke="#1f77b4" stroke-width="2"/><text x="580.0" y="84" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan font-style="italic">F</tspan><tspan> = 0.5 vacil</tspan></text><text x="580.0" y="103" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">fluctuation strength</text><text x="580.0" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">slow modulation, ≈ 4 Hz</text><rect x="702.0" y="60" width="196" height="72" rx="10" fill="#f0f2f5" stroke="#1f77b4" stroke-width="2"/><text x="800.0" y="84" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan font-style="italic">R</tspan><tspan> = 0.3 asper</tspan></text><text x="800.0" y="103" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">roughness</text><text x="800.0" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">fast modulation, ≈ 70 Hz</text><rect x="90" y="204" width="340" height="86" rx="10" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="2"/><text x="260" y="230" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>Sharpness weighting </tspan><tspan font-style="italic">w</tspan><tspan dy="3.3" font-size="10.5" font-style="italic">S</tspan><tspan dy="-3.3"> = 0.1001</tspan></text><text x="260" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f77b4" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">w</tspan><tspan dy="2.9" font-size="9.1" font-style="italic">S</tspan><tspan dy="-2.9"> = (</tspan><tspan font-style="italic">S</tspan><tspan> − 1.75) · 0.25 · log</tspan><tspan dy="2.9" font-size="9.1">10</tspan><tspan dy="-2.9">(</tspan><tspan font-style="italic">N</tspan><tspan dy="2.9" font-size="9.1">5</tspan><tspan dy="-2.9"> + 10)</tspan></text><text x="260" y="274" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle" xml:space="preserve"><tspan>zero for </tspan><tspan font-style="italic">S</tspan><tspan> ≤ 1.75 acum</tspan></text><rect x="470" y="204" width="340" height="86" rx="10" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="2"/><text x="640" y="230" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>Roughness and fluctuation </tspan><tspan font-style="italic">w</tspan><tspan dy="3.3" font-size="10.5" font-style="italic">FR</tspan><tspan dy="-3.3"> = 0.2125</tspan></text><text x="640" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f77b4" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">w</tspan><tspan dy="2.9" font-size="9.1" font-style="italic">FR</tspan><tspan dy="-2.9"> = 2.18 / </tspan><tspan font-style="italic">N</tspan><tspan dy="2.9" font-size="9.1">5</tspan><tspan dy="-7.8" font-size="9.1">0.4</tspan><tspan dy="4.9"> · (0.4·</tspan><tspan font-style="italic">F</tspan><tspan> + 0.6·</tspan><tspan font-style="italic">R</tspan><tspan>)</tspan></text><text x="640" y="274" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">roughness weighs more: 0.6 against 0.4</text><line x1="141" y1="132" x2="194.10182014503792" y2="193.20209779428097" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 200.0 200.0 L 191.4 195.6 L 196.8 190.8 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="330" y1="132" x2="289.966802107636" y2="192.49461014846113" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 285.0 200.0 L 287.0 190.5 L 293.0 194.5 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="395" y1="132" x2="512.0941106400244" y2="195.69919618817323" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 520.0 200.0 L 510.4 198.9 L 513.8 192.5 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="581" y1="132" x2="606.4694251418626" y2="191.72141067747114" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 610.0 200.0 L 603.2 193.1 L 609.8 190.3 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="800" y1="132" x2="697.6553511259143" y2="195.26760112216203" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 690.0 200.0 L 695.8 192.2 L 699.5 198.3 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="200" y="344" width="500" height="72" rx="10" fill="none" stroke="#2ca02c" stroke-width="2.4"/><text x="450" y="374" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>PA = </tspan><tspan font-style="italic">N</tspan><tspan dy="4.0" font-size="12.6">5</tspan><tspan dy="-4.0"> · (1 + √(</tspan><tspan font-style="italic">w</tspan><tspan dy="4.0" font-size="12.6" font-style="italic">S</tspan><tspan dy="-10.8" font-size="12.6">2</tspan><tspan dy="6.8"> + </tspan><tspan font-style="italic">w</tspan><tspan dy="4.0" font-size="12.6" font-style="italic">FR</tspan><tspan dy="-10.8" font-size="12.6">2</tspan><tspan dy="6.8">)) = 37.05</tspan></text><text x="450" y="399" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">Fastl and Zwicker Eq. 16.2 (origin Widmann 1992)</text><line x1="260" y1="290" x2="371.6923076923077" y2="336.53846153846155" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 380.0 340.0 L 370.3 339.9 L 373.1 333.2 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="640" y1="290" x2="528.3076923076923" y2="336.53846153846155" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 520.0 340.0 L 526.9 333.2 L 529.7 339.9 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="450" y="464" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" xml:space="preserve"><tspan>a neutral sound (</tspan><tspan font-style="italic">S</tspan><tspan> ≤ 1.75 acum, </tspan><tspan font-style="italic">F</tspan><tspan> = </tspan><tspan font-style="italic">R</tspan><tspan> = 0) sits on the baseline PA = </tspan><tspan font-style="italic">N</tspan><tspan dy="3.1" font-size="9.8">5</tspan></text><text x="450" y="488" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle">sharpness, roughness and fluctuation only ever lift the annoyance above the loudness</text></svg>