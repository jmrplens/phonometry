name: Publish to PyPI and Release

# Releases are driven by the repository-root VERSION file: merging a change
# to it on main validates, builds, publishes to PyPI and creates the GitHub
# Release (which creates the tag and fires the Zenodo webhook). Creating the
# tag from a separate workflow with GITHUB_TOKEN would NOT trigger this one
# (GitHub suppresses recursive workflow triggers), hence this single
# self-contained workflow.

on:
  push:
    branches: ["main"]
    paths: ["VERSION"]
  workflow_dispatch:

permissions:
  contents: write
  # Reading the conclusion of the CI run on this commit, which is what the
  # first step of the job refuses to publish without.
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    # Ref guard: workflow_dispatch could otherwise be run from any branch
    # and publish unreviewed code; only main may release.
    if: github.repository == 'jmrplens/phonometry' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read VERSION and guard existing tag
        id: version
        run: |
          VERSION=$(tr -d ' \n' < VERSION)
          # The PEP 440 normal form, which is what the build back end writes
          # into the artefact names a few steps down. Two ways to get that
          # wrong both end at the same failure, an artefact whose name is not
          # the one this file says: a pre-release marker carries no separator
          # (4.0.0rc1, never 4.0.0-rc1), and no numeric component carries a
          # leading zero (4.0.0, never 04.00.00, and rc1, never rc01). Both are
          # normalised by the back end and neither is normalised here.
          if ! echo "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)((a|b|rc)(0|[1-9][0-9]*))?(\.post(0|[1-9][0-9]*))?(\.dev(0|[1-9][0-9]*))?$'; then
            echo "::error::VERSION is not a PEP 440 normal-form version: '$VERSION'"
            exit 1
          fi
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::notice::Tag v$VERSION already exists — nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A release candidate is published as a pre-release, so it does not
          # become the repository's "Latest release" and pip leaves it alone
          # without --pre. Read off the version rather than set by hand: the
          # VERSION file is the only thing that decides a release here, and a
          # flag somebody has to remember is a flag that goes out wrong.
          # PEP 440 counts a developmental release as a pre-release too, and
          # one can follow a post-release (4.0.0.post1.dev1), so the marker is
          # looked for anywhere rather than right after the release segment.
          # The string is already validated above, so nothing else can match.
          if echo "$VERSION" | grep -Eq '(a|b|rc)[0-9]+|\.dev[0-9]+'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Require a green Python CI on this commit
        if: steps.version.outputs.skip != 'true'
        # Fifty, just above the loop's own forty-five, so the message the loop
        # writes is the one a reader gets in the ordinary case. The ceiling is
        # not redundant with it: the loop only tests its deadline between
        # iterations, so a `gh` call that hangs on a stalled connection never
        # reaches the test, and without this the job would sit on a runner
        # until the six-hour default.
        timeout-minutes: 50
        # Publishing consulted no test result at all: a push to VERSION on a
        # semantically broken main went to PyPI, and a version number cannot be
        # re-uploaded once it is burned. `needs:` cannot cross workflow files,
        # and branch protection would not cover the manual trigger below, so the
        # job asks the API directly.
        #
        # Python CI runs on every push to main, which means it is in flight
        # beside this job rather than finished before it: the loop waits for the
        # run on this exact commit and then insists that it succeeded. A run
        # that has not been registered yet is tolerated briefly, since the two
        # workflows start together; one that never appears is a failure, because
        # publishing on no evidence is the thing this step exists to stop.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          appear_deadline=$(( SECONDS + 300 ))
          finish_deadline=$(( SECONDS + 2700 ))
          while :; do
            # A failed call leaves the substitution empty rather than killing
            # the step: a here-string discards the substitution's exit status,
            # so `set -e` never sees it. Name that state, so the log shows the
            # retries and the deadline message says what it was waiting on.
            read -r status conclusion <<<"$(gh run list \
              --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
              --workflow python-app.yml --limit 1 \
              --json status,conclusion \
              --jq '.[0] | "\(.status // "missing") \(.conclusion // "none")"')"
            if [ -z "$status" ]; then
              status=unreachable
              echo "::warning::gh run list failed; retrying."
            fi
            case "$status" in
              completed)
                if [ "$conclusion" = success ]; then
                  echo "Python CI succeeded on $GITHUB_SHA."
                  break
                fi
                echo "::error::Python CI concluded '$conclusion' on $GITHUB_SHA. Not publishing."
                exit 1
                ;;
              missing)
                if [ "$SECONDS" -ge "$appear_deadline" ]; then
                  echo "::error::No Python CI run for $GITHUB_SHA after five minutes. Not publishing."
                  exit 1
                fi
                ;;
              *)
                if [ "$SECONDS" -ge "$finish_deadline" ]; then
                  echo "::error::Python CI still '$status' on $GITHUB_SHA after 45 minutes. Not publishing."
                  exit 1
                fi
                ;;
            esac
            sleep 30
          done

      - name: Set up Python
        if: steps.version.outputs.skip != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build tooling
        if: steps.version.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        if: steps.version.outputs.skip != 'true'
        run: python -m build

      - name: Check package
        if: steps.version.outputs.skip != 'true'
        run: python -m twine check dist/*

      - name: Verify built version matches VERSION
        if: steps.version.outputs.skip != 'true'
        run: |
          ls dist/phonometry-${{ steps.version.outputs.version }}.tar.gz
          ls dist/phonometry-${{ steps.version.outputs.version }}-py3-none-any.whl

      - name: Publish to PyPI
        if: steps.version.outputs.skip != 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: python -m twine upload dist/*

      - name: Create GitHub Release (creates the tag)
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          # The tag has to name the commit these checks ran on. Left out,
          # the tag is cut from whatever the default branch points at when
          # this step runs, so a push landing meanwhile would be inside a
          # release nobody built or tested, and the description uploaded a
          # few steps earlier would name a tree the tag does not hold.
          target_commitish: ${{ github.sha }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            See the [changelog](https://github.com/jmrplens/phonometry/blob/main/CHANGELOG.md) for the full details of this release.
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
