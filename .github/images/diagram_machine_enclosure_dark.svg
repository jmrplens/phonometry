28" x2="566" y2="200.0" stroke="#5abf5a" stroke-width="2.0" stroke-dasharray="5,4" stroke-linecap="round"/><line x1="548" y1="190.0" x2="548.0" y2="145.0" stroke="#4da3d8" stroke-width="2.0" stroke-linecap="round"/><path d="M 548.0 136.0 L 551.6 145.0 L 544.4 145.0 Z" fill="#4da3d8" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="592" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e6e6e6" text-anchor="start">lined cooling outlet</text><text x="592" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="start">a short lined duct, never a bare hole</text><line x1="310" y1="200.0" x2="310" y2="156" stroke="#e6e6e6" stroke-width="3.0" stroke-linecap="round"/><circle cx="310" cy="194.0" r="9" fill="none" stroke="#5abf5a" stroke-width="2.0"/><text x="310" y="142" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e6e6e6" text-anchor="middle">cable and pipe entry, sealed sleeve</text><rect x="230.0" y="200.0" width="450.0" height="270.0" rx="0.0" fill="none" stroke="#e6e6e6" stroke-width="2.6"/><rect x="236.0" y="206.0" width="438.0" height="264.0" rx="0.0" fill="none" stroke="#5abf5a" stroke-width="2.0" stroke-dasharray="6,4"/><rect x="242.0" y="212.0" width="426.0" height="258.0" rx="0.0" fill="none" stroke="#9a9a9a" stroke-width="1.4" stroke-dasharray="2,4"/><text x="455" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle">S_i = 30 m², ᾱ_i = 0.30  →  R_i = 12.9 m²</text><text x="455" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9a9a9a" text-anchor="middle">wall build-up: sheet-steel mass, absorbent lining, perforated facing</text><rect x="330" y="356" width="260" height="88" rx="6" fill="#1c2128" stroke="#e6e6e6" stroke-width="2.2"/><circle cx="460" cy="400" r="17" fill="#4da3d8" stroke="none" stroke-width="1.5"/><circle cx="460" cy="400" r="6" fill="#0d1117" stroke="none" stroke-width="1.5"/><path d="M 352 444 q 8 7 0 13 q -8 7 0 13" fill="none" stroke="#e46a6a" stroke-width="2.0" stroke-linejoin="round"/><path d="M 412 444 q 8 7 0 13 q -8 7 0 13" fill="none" stroke="#e46a6a" stroke-width="2.0" stroke-linejoin="round"/><path d="M 508 444 q 8 7 0 13 q -8 7 0 13" fill="none" stroke="#e46a6a" stroke-width="2.0" stroke-linejoin="round"/><path d="M 568 444 q 8 7 0 13 q -8 7 0 13" fill="none" stroke="#e46a6a" stroke-width="2.0" stroke-linejoin="round"/><text x="460" y="342" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="600">machine on vibration isolators</text><text x="455" y="496" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e46a6a" text-anchor="middle">no rigid contact with the shell or with its slab</text><rect x="218" y="262" width="24" height="190" rx="0.0" fill="#1c2128" stroke="#e6e6e6" stroke-width="2.0"/><line x1="218" y1="268" x2="242" y2="268" stroke="#5abf5a" stroke-width="2.6" stroke-linecap="round"/><line x1="218" y1="446" x2="242" y2="446" stroke="#5abf5a" stroke-width="2.6" stroke-linecap="round"/><rect x="218" y="452" width="24" height="18.0" rx="0.0" fill="#e46a6a" stroke="#e46a6a" stroke-width="1.0"/><text x="206" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="end">access door</text><text x="202" y="272" font-family="Consolas, Menlo, monospace" font-size="13" fill="#9a9a9a" text-anchor="end">1.28 m², R = 15 dB</text><text x="206" y="312" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5abf5a" text-anchor="end">compression seal</text><line x1="208" y1="308" x2="216" y2="274" stroke="#9a9a9a" stroke-width="1.0" stroke-linecap="round"/><text x="206" y="420" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e46a6a" text-anchor="end">unsealed gap at the foot</text><text x="206" y="440" font-family="Consolas, Menlo, monospace" font-size="13" fill="#e46a6a" text-anchor="end">0.24 m² = 1 % of S_E</text><line x1="208" y1="446" x2="216" y2="460" stroke="#9a9a9a" stroke-width="1.0" stroke-linecap="round"/><rect x="680.0" y="384" width="96" height="56" rx="0.0" fill="none" stroke="#e6e6e6" stroke-width="2.2"/><line x1="680.0" y1="394" x2="776.0" y2="394" stroke="#5abf5a" stroke-width="2.0" stroke-dasharray="5,4" stroke-linecap="round"/><line x1="680.0" y1="430" x2="776.0" y2="430" stroke="#5abf5a" stroke-width="2.0" stroke-dasharray="5,4" stroke-linecap="round"/><line x1="768.0" y1="412" x2="701.0" y2="412.0" stroke="#4da3d8" stroke-width="2.0" stroke-linecap="round"/><path d="M 692.0 412.0 L 701.0 408.4 L 701.0 415.6 Z" fill="#4da3d8" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="700" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e6e6e6" text-anchor="start">lined cooling inlet</text><text x="700" y="320" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="start">cooling air needs a path</text><line x1="451.0" y1="528.0" x2="239.0" y2="528.0" stroke="#9a9a9a" stroke-width="1.2" stroke-linecap="round"/><path d="M 230.0 528.0 L 239.0 524.4 L 239.0 531.6 Z" fill="#9a9a9a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="459.0" y1="528.0" x2="671.0" y2="528.0" stroke="#9a9a9a" stroke-width="1.2" stroke-linecap="round"/><path d="M 680.0 528.0 L 671.0 531.6 L 671.0 524.4 Z" fill="#9a9a9a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="455.0" y="521.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle">3.0 m</text><line x1="858.0" y1="331.0" x2="858.0" y2="209.0" stroke="#9a9a9a" stroke-width="1.2" stroke-linecap="round"/><path d="M 858.0 200.0 L 861.6 209.0 L 854.4 209.0 Z" fill="#9a9a9a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="858.0" y1="339.0" x2="858.0" y2="461.0" stroke="#9a9a9a" stroke-width="1.2" stroke-linecap="round"/><path d="M 858.0 470.0 L 854.4 461.0 L 861.6 461.0 Z" fill="#9a9a9a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="849.0" y="341.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="end">1.8 m</text><text x="40" y="560" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="start">IL = R − C,   C = 10 log10(0.3 + S_E/R_i) = 3.4 dB</text><text x="40" y="586" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#4da3d8" text-anchor="start">sealed shell (mean R = 32.3 dB): mean IL = 28.9 dB</text><text x="40" y="610" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e46a6a" text-anchor="start">with the door: 21.4 dB — with the 1 % gap as well: 15.1 dB, against the 10 log10(S_E/S_a) = 20 dB cap</text><text x="40" y="634" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9a9a9a" text-anchor="start">an enclosure delivers its worst element, not its panels</text></svg>