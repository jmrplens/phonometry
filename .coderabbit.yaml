# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
#
# Review guidance that would otherwise be retyped in every pull request. The
# first entries send every review of code, tests, scripts and docs to the
# contributor style guide, whose rules each carry an identifier a review can
# cite. The `docs/**` entry also says which files under `docs/` are written by
# hand and which are written from the site, and the last three entries name
# the generated ones, so their globs together have to match exactly the files
# of the GitHub edition `make llms` writes and no others
# (tests/test_repository_config.py holds them to it).
reviews:
  # Review a pull request whatever it is aimed at, not only the ones aimed at
  # the default branch. Work here is often stacked, and the lower pull request
  # of a stack is aimed at the branch below it rather than at `main`, so the
  # default left exactly the part that most needs reading unreviewed and
  # answered with a note about checking this file.
  auto_review:
    enabled: true
    base_branches:
      - ".*"
    # A bot commit carries no reviewable intent: dependabot bumps a pin and
    # github-actions stamps a generated artifact, and neither is a decision
    # anyone needs read back to them.
    ignore_usernames:
      - "github-actions[bot]"
      - "dependabot[bot]"
  path_instructions:
    - path: "src/**"
      instructions: >-
        Review changes against the contributor style guide in docs/contributing/
        and cite the rule ID (for example N4) when a change departs from it.
    - path: "tests/**"
      instructions: >-
        Review changes against the contributor style guide in docs/contributing/
        and cite the rule ID (for example N4) when a change departs from it.
    - path: "scripts/**"
      instructions: >-
        Review changes against the contributor style guide in docs/contributing/
        and cite the rule ID (for example N4) when a change departs from it.
    - path: "docs/**"
      instructions: >-
        Review changes against the contributor style guide in docs/contributing/
        and cite the rule ID (for example N4) when a change departs from it.

        Most of `docs/` is the GitHub edition of the guides: every English
        guide, overview and start page of the site and the reference pages
        written as guides (the glossary, the bibliography, the theory pages
        and the determinism page), less the pages `EDITION_LEFT_OUT` names in
        `site/src/lib/agent-md/edition.mjs`, as plain Markdown at
        `docs/<route>.md` or `docs/<route>/index.md`, written from the site
        page's own source by `make llms` (`site/scripts/agent-md.mjs --docs`).
        The API reference, the catalogues and the errata families have no
        file in it, so a new page of theirs needs none. A new guide adds its
        route to `site/src/lib/agent-md/test/edition-routes.json` and its line
        to `docs/README.md`. A file of the edition opens with
        a comment naming the page it is written from, and CI fails when it is
        not what that page writes (rule F5,
        docs/contributing/docs-and-figures.md#f5). A guide edit therefore
        touches the English page under `site/src/content/docs/`, its Spanish
        twin under `es/` and, through `make llms`, the edition file together
        (rule F1, docs/contributing/docs-and-figures.md#f1). Flag a change to
        an edition file that its site page does not carry, and review the
        prose in the site page.

        The generated files under `docs/` are the edition's pages,
        `docs/CONFORMANCE.md` and `docs/conformance.json` (`make conformance`).
        Written by hand: `docs/README.md`, the edition's front door, which
        links every page of it (rule F3,
        docs/contributing/docs-and-figures.md#f3); the curated API table
        `docs/reference/api/index.md`, whose edit is the expected shape of a
        pull request that adds a public name (rule A7,
        docs/contributing/api.md#a7); the errata registers `docs/ERRATA.md`
        and `docs/ERRATA.es.md`; and `docs/contributing/`, the contributor
        guide itself, which is repository-only, with no site page and no
        Spanish twin, and is reviewed against its own rules.
    - path: "docs/!(contributing|reference)/**/*.md"
      instructions: &edition >-
        This file is the GitHub edition of a site page, written by `make llms`
        from the page its opening comment names under
        `site/src/content/docs/`, and CI fails on drift. A change made here by
        hand will be overwritten: the edit belongs in that page and its
        Spanish twin, with `make llms` re-run to regenerate this one.
    - path: "docs/reference/*.md"
      instructions: *edition
    - path: "docs/reference/!(api)/**/*.md"
      instructions: *edition
