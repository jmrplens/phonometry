<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520"><rect width="900" height="520" fill="#ffffff"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1a1a1a" text-anchor="middle">Impulsive-sound prominence and LAeq adjustment (NT ACOU 112)</text><rect x="130.0" y="56" width="640.0" height="60.0" rx="10" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="2"/><text x="450.0" y="82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>A-weighted level history  </tspan><tspan font-style="italic">L</tspan><tspan dy="4.2" font-size="13.3" font-style="italic">pAF</tspan><tspan dy="-4.2">  (time weighting F)</tspan></text><text x="450.0" y="103" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle">an onset = a stretch where the gradient exceeds 10 dB/s (clauses 4.5-4.7)</text><line x1="450.0" y1="116" x2="450.0" y2="141.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 150.0 L 446.4 141.0 L 453.6 141.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="130.0" y="150" width="640.0" height="60.0" rx="10" fill="#f0f2f5" stroke="#1f77b4" stroke-width="2"/><text x="450.0" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="600">Per impulse: onset rate OR and level difference LD</text><text x="450.0" y="197" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle" xml:space="preserve"><tspan>OR = onset slope [dB/s],   LD = </tspan><tspan font-style="italic">L</tspan><tspan dy="2.9" font-size="9.1" font-style="italic">e</tspan><tspan dy="-2.9"> − </tspan><tspan font-style="italic">L</tspan><tspan dy="2.9" font-size="9.1" font-style="italic">s</tspan><tspan dy="-2.9"> [dB]</tspan></text><rect x="130.0" y="242" width="640.0" height="60.0" rx="10" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="2"/><text x="450.0" y="268" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>Predicted prominence  </tspan><tspan font-style="italic">P</tspan><tspan>   (clause 7, Formula 1)</tspan></text><text x="450.0" y="289" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">P</tspan><tspan> = 3·log</tspan><tspan dy="2.9" font-size="9.1">10</tspan><tspan dy="-2.9">(OR) + 2·log</tspan><tspan dy="2.9" font-size="9.1">10</tspan><tspan dy="-2.9">(LD);   highest </tspan><tspan font-style="italic">P</tspan><tspan> over 30 min governs</tspan></text><rect x="130.0" y="334" width="640.0" height="60.0" rx="10" fill="#f0f2f5" stroke="#d62728" stroke-width="2"/><text x="450.0" y="360" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>Adjustment  </tspan><tspan font-style="italic">K</tspan><tspan dy="4.0" font-size="12.6" font-style="italic">I</tspan><tspan dy="-4.0">   (clause 8, Formula 2)</tspan></text><text x="450.0" y="381" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">K</tspan><tspan dy="2.9" font-size="9.1" font-style="italic">I</tspan><tspan dy="-2.9"> = 1.8·(</tspan><tspan font-style="italic">P</tspan><tspan> − 5) dB for </tspan><tspan font-style="italic">P</tspan><tspan> &gt; 5, else 0</tspan></text><line x1="450.0" y1="210" x2="450.0" y2="233.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 242.0 L 446.4 233.0 L 453.6 233.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="450.0" y1="302" x2="450.0" y2="325.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 334.0 L 446.4 325.0 L 453.6 325.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="450.0" y1="394" x2="450.0" y2="417.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 426.0 L 446.4 417.0 L 453.6 417.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="130.0" y="426" width="640.0" height="60" rx="10" fill="none" stroke="#1f77b4" stroke-width="2.4"/><text x="450.0" y="452" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="600">Rating level  LAr,T = 10·log10( (1/T) Σ Δt·10^((LAeq+KI)/10) )</text><text x="450.0" y="473" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle">impulse-adjusted level over the reference time  (Note 1)</text></svg>