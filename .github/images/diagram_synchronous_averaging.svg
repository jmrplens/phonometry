tspan> aligned blocks</tspan></text><text x="205" y="322" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle" xml:space="preserve"><tspan>one period </tspan><tspan font-style="italic">T</tspan><tspan> each</tspan></text><line x1="190" y1="254" x2="193.00541006769927" y2="267.2238042978769" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 195.0 276.0 L 189.5 268.0 L 196.5 266.4 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="360" y="288" width="220" height="78" rx="10" fill="#f0f2f5" stroke="#1f77b4" stroke-width="2"/><text x="470" y="312" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="600">Coherent average</text><text x="470" y="334" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f77b4" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">a</tspan><tspan>(</tspan><tspan font-style="italic">t</tspan><tspan>) = (1/</tspan><tspan font-style="italic">N</tspan><tspan>) Σ </tspan><tspan font-style="italic">y</tspan><tspan>(</tspan><tspan font-style="italic">t</tspan><tspan> + </tspan><tspan font-style="italic">n</tspan><tspan> </tspan><tspan font-style="italic">T</tspan><tspan>)</tspan></text><text x="470" y="354" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">N</tspan><tspan> = 40 here</tspan></text><line x1="310" y1="322" x2="347.0" y2="322.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 356.0 322.0 L 347.0 325.6 L 347.0 318.4 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="640" y="288" width="220" height="78" rx="10" fill="#f0f2f5" stroke="#2ca02c" stroke-width="2"/><text x="750" y="312" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="600">The periodic part survives</text><text x="750" y="334" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">comb teeth of unit gain</text><text x="750" y="354" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle" xml:space="preserve"><tspan>at every order </tspan><tspan font-style="italic">k</tspan><tspan>/</tspan><tspan font-style="italic">T</tspan></text><line x1="580" y1="327" x2="627.0" y2="327.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 636.0 327.0 L 627.0 330.6 L 627.0 323.4 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="100" y="420" width="460" height="64" rx="10" fill="none" stroke="#2ca02c" stroke-width="1.6" stroke-dasharray="6,5"/><text x="330" y="446" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#2ca02c" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>Asynchronous noise falls as 1/√</tspan><tspan font-style="italic">N</tspan></text><text x="330" y="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" xml:space="preserve"><tspan>power −10·log</tspan><tspan dy="2.9" font-size="9.1">10</tspan><tspan dy="-2.9"> </tspan><tspan font-style="italic">N</tspan><tspan> = −16 dB for </tspan><tspan font-style="italic">N</tspan><tspan> = 40;  amplitude gain √</tspan><tspan font-style="italic">N</tspan><tspan> = 6.3</tspan></text><line x1="470" y1="366" x2="470.0" y2="407.0" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round"/><path d="M 470.0 416.0 L 466.4 407.0 L 473.6 407.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="640" y="420" width="220" height="64" rx="10" fill="#f0f2f5" stroke="#d62728" stroke-width="2"/><text x="750" y="442" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="600">Residual</text><text x="750" y="460" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">record − tiled average:</text><text x="750" y="476" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">everything not synchronous</text><line x1="750" y1="366" x2="750.0" y2="407.0" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round"/><path d="M 750.0 416.0 L 746.4 407.0 L 753.6 407.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="450" y="526" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" xml:space="preserve"><tspan>a tone on a non-integer order is only attenuated: choose </tspan><tspan font-style="italic">N</tspan><tspan> so a comb node lands on it</tspan></text><text x="450" y="550" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle" xml:space="preserve"><tspan>McFadden's example: </tspan><tspan font-style="italic">N</tspan><tspan> = 20 nulls the 32.05-order tone (20·32.05 = 641); the habitual </tspan><tspan font-style="italic">N</tspan><tspan> = 32 does not</tspan></text></svg>