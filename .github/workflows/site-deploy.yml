# Deploys the documentation docs.yml built to phonometry.dev, the canonical
# site, served at the root.
#
# The site there is one Cloudflare Worker with Static Assets
# (site/worker/README.md): pages and files run no script, so the daily request
# quota of Workers Free cannot stop them; only the visitor beacon and the files
# agents read run the Worker, which logs them, and the quota guard switches
# those off at 95 %. This workflow never touches docs.jmrp.io, whose old
# addresses answer permanent redirects to phonometry.dev from the jmrp.io
# account (CONTRIBUTING.md, 5b).
#
# docs.yml calls it on every push to main and every dispatch of docs.yml on
# main, after the build, with the pages that run uploaded (job deploy-site).
# By hand, Actions > Site deploy > Run workflow with the id of an earlier
# docs.yml run on main whose pages artifact has not expired puts that build
# back. A call, not a workflow_run trigger, which zizmor flags.
name: Site deploy

on:
  workflow_call:
    inputs:
      run_id:
        description: "Id of the docs.yml run whose pages artifact is deployed: the calling run itself"
        required: true
        type: string
      attempt:
        description: "The attempt of that run that built the artifact (github-pages-<attempt>)"
        required: false
        default: "1"
        type: string
      apply_rules:
        description: "Put the zone rules (redirects and the Markdown 302) as generated, instead of only checking them"
        required: false
        default: false
        type: boolean
    secrets:
      # Environment secrets of phonometry-preview: a called workflow reads
      # them only when the caller names them, so both are required here and
      # a call that forgets one fails at once instead of deploying with an
      # empty token. A dispatch by hand reads them from the environment.
      CF_PHONOMETRY_DEPLOY_TOKEN:
        description: "Token that uploads and deploys the Worker versions"
        required: true
      CF_PHONOMETRY_RULES_TOKEN:
        description: "Token that reads and puts the zone rules"
        required: true
    outputs:
      # What the IndexNow job of docs.yml reads of a deploy.
      page_url:
        description: "The home page of the deployed site"
        value: ${{ jobs.deploy.outputs.page_url }}
      deployed-at:
        description: "When the Worker with these pages went live (UTC)"
        value: ${{ jobs.deploy.outputs.deployed-at }}
      attempt:
        description: "The attempt of the run the deploy ran in, later than the build's on a re-run of the deploy alone"
        value: ${{ jobs.deploy.outputs.attempt }}
  workflow_dispatch:
    inputs:
      run_id:
        description: "Id of a successful docs.yml run on main whose pages artifact is deployed (checked before the download)"
        required: true
        type: string
      attempt:
        description: "The attempt of that run that built the artifact (github-pages-<attempt>)"
        required: false
        default: "1"
        type: string
      apply_rules:
        description: "Put the zone rules (redirects and the Markdown 302) as generated, instead of only checking them"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  WRANGLER_SEND_METRICS: "false"

jobs:
  deploy:
    name: Deploy the site to phonometry.dev
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # One deploy at a time, whether docs.yml called it or it was run by hand,
    # and a deploy is never cancelled halfway: it uploads two Worker versions
    # as a pair. The group is the job's, since a called workflow runs inside
    # the caller's run.
    concurrency:
      group: site-deploy
      cancel-in-progress: false
    # The environment holds the two Cloudflare tokens and admits main only.
    environment:
      name: phonometry-preview
      url: ${{ steps.site.outputs.page_url }}
    permissions:
      contents: read
      actions: read # the pages artifact of an earlier docs.yml run, by hand
    outputs:
      page_url: ${{ steps.site.outputs.page_url }}
      deployed-at: ${{ steps.deployed.outputs.at }}
      # A later attempt than the build's when this job was re-run alone.
      attempt: ${{ github.run_attempt }}
    steps:
      - name: Check the inputs
        env:
          RUN_ID: ${{ inputs.run_id }}
          ATTEMPT: ${{ inputs.attempt }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::run_id must be a number"; exit 1; }
          [[ "$ATTEMPT" =~ ^[0-9]+$ ]] || { echo "::error::attempt must be a number"; exit 1; }
      - name: Check the run is a docs.yml build of main in this repository
        # The environment admits this workflow from main only, which limits
        # who can read the tokens, not where the deployed pages come from:
        # docs.yml can be dispatched on any branch and uploads its pages
        # artifact whenever the event is not a pull request. Anything but a
        # push or dispatch of docs.yml on main, here, whose commit main
        # contains, stops the deploy.
        # Called, this workflow runs in docs.yml's own run, whose id is the
        # one passed in (github.event_name is the caller's, push, either
        # way). That run is still going, with no conclusion yet, so it is
        # read from this run's context; the build job it needs succeeded or
        # this job would not run. By hand, the run named is another one and
        # is read back, and it has to have succeeded.
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          CALLED: ${{ inputs.run_id == github.run_id }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          fail=0
          if [ "$CALLED" = true ]; then
            sha=$SHA
            echo "called by $WORKFLOW_REF ($EVENT) at $sha"
            [ "${WORKFLOW_REF%%@*}" = "jmrplens/phonometry/.github/workflows/docs.yml" ] || { echo "::error::the caller $WORKFLOW_REF is not docs.yml of jmrplens/phonometry"; fail=1; }
            [ "$REF" = "refs/heads/main" ] || { echo "::error::the caller built $REF, not main"; fail=1; }
            [[ "$EVENT" = "push" || "$EVENT" = "workflow_dispatch" ]] || { echo "::error::the caller ran on a $EVENT"; fail=1; }
          else
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")
            path=$(jq -r .path <<<"$run")
            branch=$(jq -r .head_branch <<<"$run")
            event=$(jq -r .event <<<"$run")
            repo=$(jq -r .head_repository.full_name <<<"$run")
            conclusion=$(jq -r .conclusion <<<"$run")
            sha=$(jq -r .head_sha <<<"$run")
            echo "run $RUN_ID: $path on $branch ($event) from $repo at $sha, $conclusion"
            [ "$path" = ".github/workflows/docs.yml" ] || { echo "::error::run $RUN_ID is $path, not docs.yml"; fail=1; }
            [ "$branch" = "main" ] || { echo "::error::run $RUN_ID built $branch, not main"; fail=1; }
            [[ "$event" = "push" || "$event" = "workflow_dispatch" ]] || { echo "::error::run $RUN_ID was a $event"; fail=1; }
            [ "$repo" = "$GITHUB_REPOSITORY" ] || { echo "::error::run $RUN_ID came from $repo"; fail=1; }
            [ "$conclusion" = "success" ] || { echo "::error::run $RUN_ID concluded $conclusion"; fail=1; }
          fi
          [ "$fail" = 0 ] || exit 1
          # A commit main contains compares as identical to it or behind it.
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$sha" --jq .status)
          [[ "$status" = "identical" || "$status" = "behind" ]] || { echo "::error::$sha is not on main ($status)"; exit 1; }
          echo "Deploying the pages docs.yml built from $sha" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The staging step reads the redirect map and the site's address from
          # site/src/data, site/src/lib and site/scripts; the rest of the
          # repository is not needed. site/worker/test/workflow.test.mjs fails
          # when a script run here loads a module outside these directories.
          # Called, the checkout is the commit docs.yml built.
          sparse-checkout: |
            site/worker
            site/src/data
            site/src/lib
            site/scripts
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Enable the pnpm the Worker project pins, via corepack
        run: |
          corepack enable
          pnpm --version
        working-directory: site/worker
      - name: Install wrangler from the Worker project's lockfile
        run: pnpm install --frozen-lockfile
        working-directory: site/worker
      - name: Fetch the pages artifact the calling run built
        # An artifact of this very run, so no run is named and no token is
        # needed: the build job uploaded it before this job started.
        if: ${{ inputs.run_id == github.run_id }}
        uses: actions/download-artifact@v8
        with:
          name: github-pages-${{ inputs.attempt }}
          path: ${{ runner.temp }}/pages-artifact
      - name: Fetch the pages artifact of the docs.yml run
        if: ${{ inputs.run_id != github.run_id }}
        uses: actions/download-artifact@v8
        with:
          name: github-pages-${{ inputs.attempt }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pages-artifact
      - name: Unpack it
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pages"
          tar -xf "$RUNNER_TEMP/pages-artifact/artifact.tar" -C "$RUNNER_TEMP/pages"
          echo "$(find "$RUNNER_TEMP/pages" -type f | wc -l) files in the build"
      - name: Read where the pages are served
        # The host the Worker serves, the build's base path and canonical
        # site, and the clip host, from site/src/data/site-targets.json: every
        # check below takes its addresses from here. PHONOMETRY_SITE is unset
        # in docs.yml's build and here, so both read the default target.
        id: site
        run: node site/worker/scripts/site-address.mjs >> "$GITHUB_OUTPUT"
      - name: Stage the build with the beacon (every check runs before anything is written)
        # The target is the one the build was made for, and the noindex
        # follows from it (stage.mjs): no flag here decides it.
        run: node site/worker/stage.mjs --from "$RUNNER_TEMP/pages" --out site/worker/stage --site "${PHONOMETRY_SITE:-}" --beacon
      - name: Check robots.txt names a sitemap the stage holds
        # robots.txt is a hand-written file of public/ that names the sitemap
        # index by its address; a crawler that reads it is sent there.
        env:
          ORIGIN: ${{ steps.site.outputs.origin }}
        run: |
          set -euo pipefail
          sitemap=$(sed -n 's/^Sitemap: //p' site/worker/stage/robots.txt)
          [ -n "$sitemap" ] || { echo "::error::robots.txt names no sitemap"; exit 1; }
          path=${sitemap#"$ORIGIN"}
          [ "$path" != "$sitemap" ] || { echo "::error::robots.txt names $sitemap, not a file of $ORIGIN"; exit 1; }
          [ -f "site/worker/stage${path}" ] || { echo "::error::robots.txt names $sitemap, which the stage does not hold"; exit 1; }
          echo "ok   robots.txt names $sitemap, a staged file"
      - name: Check every staged clip answers at the clip host
        # The zone rule sends every clip to the clip host, which is filled
        # apart from this deploy: a clip added or re-rendered in the build and
        # missing there, or there at another size, would 404 or play the old
        # file with every check below green. Before anything goes live.
        env:
          BASE: ${{ steps.site.outputs.base }}
          CLIP_BASE: ${{ steps.site.outputs.clip_base }}
        run: node site/worker/scripts/check-clip-host.mjs --stage "site/worker/stage$BASE" --clip-base "$CLIP_BASE"
      - name: Read whether the quota guard has switched the code paths off
        # At 95 % of the day's Workers requests the guard blocks the beacon
        # and rolls the Worker to its assets-only half until 00:00 UTC. A
        # deploy then has to keep them off, or the agent files would spend
        # what the guard is keeping (site/worker/README.md, "Quota").
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PHONOMETRY_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/guard-state.mjs | tee -a "$GITHUB_OUTPUT"
        working-directory: site/worker
      - name: Upload the assets-only version the quota guard rolls to
        # Same stage, no code: tagged as the other half of this deploy's pair,
        # so the guard (site/worker/guard) can switch between them. The pair
        # is named after this run and its attempt, not after the docs.yml run
        # it deploys: a re-run of a deploy that failed halfway uploads a new
        # pair instead of a second version under a tag already taken.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PHONOMETRY_DEPLOY_TOKEN }}
          PAIR: ${{ github.run_id }}-${{ github.run_attempt }}
        run: pnpm exec wrangler versions upload --config wrangler.assets-only.jsonc --tag "assets-$PAIR" --message "assets-only half of $PAIR"
        working-directory: site/worker
      - name: Deploy the Worker
        # wrangler.jsonc names the account, so the token needs no account
        # listing and no variable can point the deploy elsewhere. While the
        # guard holds the code paths off, the full half is only uploaded and
        # the assets-only half goes live under the same mark the off state
        # had, so the guard (or quota-switch.mjs --mode on, for an off state
        # set by hand) switches this deploy back on with the rest. The guard,
        # or quota-switch.mjs, may switch between the read and this deploy:
        # the deployments made since the one read show it, and the deploy
        # then follows what that switch left, so it never puts full code over
        # an off state (or holds off a site just switched back on).
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PHONOMETRY_DEPLOY_TOKEN }}
          PAIR: ${{ github.run_id }}-${{ github.run_attempt }}
          TRIPPED: ${{ steps.guard.outputs.tripped }}
          MARK: ${{ steps.guard.outputs.mark }}
          DEPLOYMENT: ${{ steps.guard.outputs.deployment }}
        run: |
          set -euo pipefail
          hold_off() { # <mark>
            pnpm exec wrangler versions deploy --config wrangler.jsonc --version-tag "assets-$PAIR@100" --message "$1: off, deploy of $PAIR while the code paths are off" --yes
            echo "::notice::the code paths are held off: the assets-only half of $PAIR is live, the full half waits for the switch back" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          full_message() { # <mark>
            # After a switch back the guard may still have its rule to turn
            # off; carrying its mark keeps that rule the guard's to clear.
            if [ -n "$1" ]; then echo "$1: on, full half of $PAIR"; else echo "full half of $PAIR"; fi
          }
          if [ "$TRIPPED" = true ]; then
            pnpm exec wrangler versions upload --config wrangler.jsonc --tag "full-$PAIR" --message "full half of $PAIR"
            hold_off "$MARK"
          else
            pnpm exec wrangler deploy --config wrangler.jsonc --tag "full-$PAIR" --message "$(full_message "$MARK")"
          fi
          # A failed read is tried again (the promotion is not repeated): a
          # read that fails three times stops the job with the deploy as it
          # is, and the error says to run guard-state.mjs --since by hand.
          after=""
          for attempt in 1 2 3; do
            if after=$(node scripts/guard-state.mjs --since "$DEPLOYMENT" --pair "$PAIR"); then break; fi
            after=""
            if [ "$attempt" = 3 ]; then
              echo "::error::the deployments since $DEPLOYMENT could not be read: $PAIR was this run's last promotion and what is live now is unknown; run node scripts/guard-state.mjs --since $DEPLOYMENT --pair $PAIR by hand and promote what it says"
              exit 1
            fi
            sleep "${READ_RETRY_SECONDS:-5}"
          done
          if grep -qx 'switched=true' <<<"$after"; then
            tripped=$(sed -n 's/^tripped=//p' <<<"$after")
            mark=$(sed -n 's/^mark=//p' <<<"$after")
            if [ "$tripped" != "$TRIPPED" ] || [ "$mark" != "$MARK" ]; then
              echo "::warning::the code paths were switched during this deploy: it follows that switch (tripped=$tripped, mark=$mark)"
              if [ "$tripped" = true ]; then
                hold_off "$mark"
              else
                pnpm exec wrangler versions deploy --config wrangler.jsonc --version-tag "full-$PAIR@100" --message "$(full_message "$mark")" --yes
              fi
            fi
          fi
        working-directory: site/worker
      - name: Note when the pages went live
        # The IndexNow job of docs.yml keeps its record only while no deploy
        # has gone out after this moment.
        id: deployed
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Check the zone rules
        if: ${{ !inputs.apply_rules }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PHONOMETRY_RULES_TOKEN }}
        run: node site/worker/scripts/apply-rules.mjs --check
      - name: Put the zone rules, keeping what was there
        if: ${{ inputs.apply_rules }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PHONOMETRY_RULES_TOKEN }}
        run: node site/worker/scripts/apply-rules.mjs --apply --backup-dir "$RUNNER_TEMP/rules-backup"
      - name: Keep the rules that were replaced
        if: ${{ inputs.apply_rules && always() }}
        uses: actions/upload-artifact@v7
        with:
          name: zone-rules-before-${{ github.run_id }}
          path: ${{ runner.temp }}/rules-backup/
          if-no-files-found: ignore
          retention-days: 90
      - name: Check what the assets answer
        # After the rules are put: a deploy that moves the base path would
        # otherwise find its home page behind the old rule that sent the root
        # to the base path.
        env:
          # The beacon check reads the live deployment just before and after
          # its probe (scripts/check-beacon.mjs); the deploy token reads it.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PHONOMETRY_DEPLOY_TOKEN }}
          ORIGIN: ${{ steps.site.outputs.origin }}
          BASE: ${{ steps.site.outputs.base }}
          CANONICAL: ${{ steps.site.outputs.canonical }}
          INDEXABLE: ${{ steps.site.outputs.indexable }}
        run: |
          set -euo pipefail
          base="$ORIGIN$BASE"
          fail=0
          expect() { # <what> <url> <status> [header-regex]
            local got
            got=$(curl -sS -o /dev/null -D - --max-time 30 "$2")
            if ! grep -qE "^HTTP/[0-9.]+ $3" <<<"$got"; then echo "::error::$1: $2 did not answer $3"; fail=1; return; fi
            if [ -n "${4:-}" ] && ! grep -qiE "$4" <<<"$got"; then echo "::error::$1: $2 lacks $4"; fail=1; return; fi
            echo "ok   $1"
          }
          absent() { # <what> <header-regex> <url>
            local got
            got=$(curl -sS -o /dev/null -D - --max-time 30 "$3")
            if grep -qiE "$2" <<<"$got"; then echo "::error::$1: $(grep -iE "$2" <<<"$got" | head -1)"; fail=1; else echo "ok   $1"; fi
          }
          # The noindex follows the build (stage.mjs): gone when the build and
          # the canonical site are this host, kept on every page otherwise.
          if [ "$INDEXABLE" = true ]; then
            absent "a page carries no noindex" '^x-robots-tag:' "$base/signals/"
          else
            expect "a page, kept out of search indexes" "$base/signals/" 200 '^x-robots-tag: noindex'
          fi
          expect "the home page answers" "$base/" 200
          expect "llms.txt stays out of search indexes" "$base/llms.txt" 200 '^x-robots-tag: noindex'
          expect "a page names its Markdown copy" "$base/signals/" 200 "^link: <$BASE/signals/index.md>"
          expect "the copy names its page as canonical" "$base/signals/index.md" 200 "^link: <$CANONICAL/signals/>; rel=\"canonical\""
          expect "a retired address answers 301" "$base/about/" 301 "^location: $BASE/start/about/"
          expect "an unknown page answers 404" "$base/no-such-page/" 404
          expect "a copy says it is UTF-8" "$base/signals/index.md" 200 '^content-type: text/markdown; charset=utf-8'
          expect "llms.txt says it is UTF-8" "$base/llms.txt" 200 '^content-type: text/plain; charset=utf-8'
          expect "robots.txt at the root says it is UTF-8" "$ORIGIN/robots.txt" 200 '^content-type: text/plain; charset=utf-8'
          # 204 with full code live; while the code paths are held off, the
          # guard's WAF rule answers 403 before any Worker runs, or, while
          # that rule is not on yet, the assets-only half answers 404 (no
          # asset is called _v). A 204 then would mean code is running.
          node site/worker/scripts/check-beacon.mjs || fail=1
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$ORIGIN/_v")
          if [ "$code" != 403 ]; then echo "::error::a GET of the beacon answered $code, not the WAF's 403"; fail=1; else echo "ok   the WAF refuses a GET of the beacon"; fi
          n=$(curl -sS -o /dev/null -D - --max-time 30 "$base/signals/index.md" | grep -ci '^content-type:')
          if [ "$n" != 1 ]; then echo "::error::the copy carries $n Content-Type headers"; fail=1; else echo "ok   one Content-Type"; fi
          exit "$fail"
      - name: Check what the zone rules answer
        env:
          ORIGIN: ${{ steps.site.outputs.origin }}
          BASE: ${{ steps.site.outputs.base }}
          CLIP_BASE: ${{ steps.site.outputs.clip_base }}
          LEGACY_BASE: ${{ steps.site.outputs.legacy_base }}
        run: |
          set -euo pipefail
          fail=0
          check() { # <what> <status> <location-regex> <curl args...>
            local what=$1 status=$2 location=$3 got
            shift 3
            got=$(curl -sS -o /dev/null -D - --max-time 30 "$@")
            if ! grep -qE "^HTTP/[0-9.]+ $status" <<<"$got" || ! grep -qiE "^location: $location" <<<"$got"; then
              echo "::error::$what: got $(head -1 <<<"$got")"
              fail=1
            else
              echo "ok   $what"
            fi
          }
          check "www goes to the apex" 301 'https://phonometry.dev/x\?y=1' "https://www.phonometry.dev/x?y=1"
          if [ -n "$BASE" ]; then
            check "the root goes to the base path" 302 "$ORIGIN$BASE/" "$ORIGIN/"
          fi
          # The base path the site was served under before (the preview's,
          # and docs.jmrp.io's) answers at the root, one hop.
          if [ -n "$LEGACY_BASE" ]; then
            check "a page under the old base path goes to the root" 301 "$ORIGIN/signals/\?q=1" "$ORIGIN$LEGACY_BASE/signals/?q=1"
            check "the old base path itself goes to the home page" 301 "$ORIGIN/[[:space:]]*$" "$ORIGIN$LEGACY_BASE"
          fi
          # The asset server answers a page written without its slash with a
          # 307; the trailing-slash rule answers first, with a 301.
          check "a page without its slash goes to the page" 301 "$ORIGIN$BASE/signals/\?q=1" "$ORIGIN$BASE/signals?q=1"
          check "a Markdown request gets the copy" 302 "$BASE/signals/index.md" -H 'Accept: text/markdown' "$ORIGIN$BASE/signals/"
          check "a clip goes where ranges answer 206" 302 "$CLIP_BASE" "$ORIGIN$BASE/media/$(ls "site/worker/stage$BASE/media" | grep -m1 '\.webm$')"
          # _headers matches a path whatever the status; these three come
          # from the response rules, which can read it.
          absent() { # <what> <header-regex> <curl args...>
            local what=$1 header=$2 got
            shift 2
            got=$(curl -sS -o /dev/null -D - --max-time 30 "$@")
            if grep -qiE "$header" <<<"$got"; then echo "::error::$what: $(grep -iE "$header" <<<"$got" | head -1)"; fail=1; else echo "ok   $what"; fi
          }
          absent "an unknown page names no copy" '^link:' "$ORIGIN$BASE/no-such-page/"
          absent "an unknown copy names no canonical" '^link:' "$ORIGIN$BASE/no-such-page/index.md"
          absent "a missing build file is not cached for a year" '^cache-control:.*immutable' "$ORIGIN$BASE/_astro/no-such-file.ABCDEF12.css"
          exit "$fail"
      - name: Install the browser the clip check drives
        run: pnpm exec puppeteer browsers install chrome
        working-directory: site/worker
      - name: Check a clip plays in a browser
        # curl sees a clip as a 302 and a 206. A browser also holds the
        # address it is redirected to against the page's
        # Content-Security-Policy, which curl never reads; this plays two,
        # on a page of the deployed site with clips near the top.
        env:
          PAGE_URL: ${{ steps.site.outputs.page_url }}
        run: node scripts/check-clip.mjs --page "${PAGE_URL}vibration/machinery/machine-diagnostics/"
        working-directory: site/worker
