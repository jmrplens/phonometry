-width="1.1" stroke-linecap="round"/><line x1="410" y1="330.0" x2="402" y2="339.0" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><line x1="434" y1="330.0" x2="426" y2="339.0" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><line x1="458" y1="330.0" x2="450" y2="339.0" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><rect x="110.0" y="176.0" width="40" height="44" rx="5" fill="#1c2128" stroke="#4da3d8" stroke-width="2"/><circle cx="130.0" cy="198.0" r="8" fill="#4da3d8" stroke="none" stroke-width="1.5"/><text x="130.0" y="164.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="middle" font-weight="600">source</text><rect x="236.0" y="190.0" width="8.0" height="12.0" rx="2.5" fill="#e6e6e6" stroke="none" stroke-width="1.5"/><rect x="234.0" y="202.0" width="12.0" height="34.0" rx="4.0" fill="#4da3d8" stroke="none" stroke-width="1.5"/><line x1="240.0" y1="236.0" x2="240.0" y2="330.0" stroke="#e6e6e6" stroke-width="2.2" stroke-linecap="round"/><line x1="224.0" y1="330.0" x2="256.0" y2="330.0" stroke="#e6e6e6" stroke-width="2.2" stroke-linecap="round"/><text x="270.0" y="192.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="start" font-weight="600">microphone</text><line x1="152.0" y1="198.0" x2="232.0" y2="198.0" stroke="#4da3d8" stroke-width="2.4" stroke-linecap="round"/><text x="213.0" y="184.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#4da3d8" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan font-style="italic">r</tspan><tspan dy="3.5" font-size="11.2" font-style="italic">d</tspan><tspan dy="-3.5"> = 1.00 m</tspan></text><circle cx="130.0" cy="462.0" r="8" fill="none" stroke="#9a9a9a" stroke-width="1.6"/><text x="130.0" y="486.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#9a9a9a" text-anchor="middle">image source</text><line x1="130.0" y1="198.0" x2="130.0" y2="462.0" stroke="#9a9a9a" stroke-width="1.0" stroke-dasharray="4,4" stroke-linecap="round"/><line x1="130.0" y1="198.0" x2="185.0" y2="330.0" stroke="#e46a6a" stroke-width="2.2" stroke-linecap="round"/><line x1="185.0" y1="330.0" x2="240.0" y2="190.0" stroke="#e46a6a" stroke-width="2.2" stroke-linecap="round"/><line x1="130.0" y1="462.0" x2="240.0" y2="190.0" stroke="#9a9a9a" stroke-width="1.0" stroke-dasharray="4,4" stroke-linecap="round"/><circle cx="185.0" cy="330.0" r="4" fill="#e46a6a" stroke="none" stroke-width="1.5"/><text x="115.0" y="284.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e46a6a" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan font-style="italic">r</tspan><tspan dy="3.5" font-size="11.2" font-style="italic">r</tspan><tspan dy="-3.5"> = 2.60 m</tspan></text><line x1="286.0" y1="260.0" x2="286.0" y2="207.0" stroke="#9a9a9a" stroke-width="1.2" stroke-linecap="round"/><path d="M 286.0 198.0 L 289.6 207.0 L 282.4 207.0 Z" fill="#9a9a9a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="286.0" y1="268.0" x2="286.0" y2="321.0" stroke="#9a9a9a" stroke-width="1.2" stroke-linecap="round"/><path d="M 286.0 330.0 L 282.4 321.0 L 289.6 321.0 Z" fill="#9a9a9a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="295.0" y="270.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e6e6e6" text-anchor="start">1.20 m</text><line x1="240.0" y1="190.0" x2="286.0" y2="198.0" stroke="#9a9a9a" stroke-width="0.9" stroke-dasharray="3,3" stroke-linecap="round"/><line x1="181.0" y1="374.0" x2="139.0" y2="374.0" stroke="#9a9a9a" stroke-width="1.2" stroke-linecap="round"/><path d="M 130.0 374.0 L 139.0 370.4 L 139.0 377.6 Z" fill="#9a9a9a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="189.0" y1="374.0" x2="231.0" y2="374.0" stroke="#9a9a9a" stroke-width="1.2" stroke-linecap="round"/><path d="M 240.0 374.0 L 231.0 377.6 L 231.0 370.4 Z" fill="#9a9a9a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="185.0" y="367.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e6e6e6" text-anchor="middle">1.00 m</text><rect x="500.0" y="120" width="356" height="150" rx="10" fill="none" stroke="#e6e6e6" stroke-width="1.6"/><text x="678.0" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#e6e6e6" text-anchor="middle" font-weight="600">Floor reflection</text><text x="678.0" y="182" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#e6e6e6" text-anchor="middle" xml:space="preserve"><tspan>Δ</tspan><tspan font-style="italic">d</tspan><tspan> = </tspan><tspan font-style="italic">r</tspan><tspan dy="4.0" font-size="12.6" font-style="italic">r</tspan><tspan dy="-4.0"> − </tspan><tspan font-style="italic">r</tspan><tspan dy="4.0" font-size="12.6" font-style="italic">d</tspan><tspan dy="-4.0"> = 1.60 m</tspan></text><text x="678.0" y="210" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#e46a6a" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan font-style="italic">t</tspan><tspan dy="4.0" font-size="12.6">0</tspan><tspan dy="-4.0"> = Δ</tspan><tspan font-style="italic">d</tspan><tspan> / </tspan><tspan font-style="italic">c</tspan><tspan> = 4.7 ms</tspan></text><text x="678.0" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#e6e6e6" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">a</tspan><tspan> = </tspan><tspan font-style="italic">R</tspan><tspan> · </tspan><tspan font-style="italic">r</tspan><tspan dy="4.0" font-size="12.6" font-style="italic">d</tspan><tspan dy="-4.0"> / </tspan><tspan font-style="italic">r</tspan><tspan dy="4.0" font-size="12.6" font-style="italic">r</tspan><tspan dy="-4.0"> = 0.38 </tspan><tspan font-style="italic">R</tspan></text><rect x="500.0" y="292" width="356" height="168" rx="10" fill="none" stroke="#e46a6a" stroke-width="1.6"/><text x="678.0" y="322" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#e46a6a" text-anchor="middle" font-weight="600">The 8 ms example of this page</text><text x="678.0" y="352" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#e6e6e6" text-anchor="middle" xml:space="preserve"><tspan>Δ</tspan><tspan font-style="italic">d</tspan><tspan> = </tspan><tspan font-style="italic">c</tspan><tspan> · 8 ms = 2.74 m</tspan></text><text x="678.0" y="380" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="middle">a side wall 1.37 m from the direct path</text><text x="678.0" y="408" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#e6e6e6" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">R</tspan><tspan> = </tspan><tspan font-style="italic">a</tspan><tspan> · </tspan><tspan font-style="italic">r</tspan><tspan dy="4.0" font-size="12.6" font-style="italic">r</tspan><tspan dy="-4.0"> / </tspan><tspan font-style="italic">r</tspan><tspan dy="4.0" font-size="12.6" font-style="italic">d</tspan><tspan dy="-4.0"> = 3.74 </tspan><tspan font-style="italic">a</tspan><tspan> ≤ 1</tspan></text><text x="678.0" y="436" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#9a9a9a" text-anchor="middle" xml:space="preserve"><tspan>so </tspan><tspan font-style="italic">a</tspan><tspan> &gt; 0.27 is not one specular reflection</tspan></text><text x="450" y="512" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#9a9a9a" text-anchor="middle">The reflection has to arrive before the record ends and at least 10 dB above its noise floor;</text><text x="450" y="534" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#9a9a9a" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">c</tspan><tspan> moves about 0.6 m/s per kelvin, so convert the delay with the temperature you measured</tspan></text></svg>