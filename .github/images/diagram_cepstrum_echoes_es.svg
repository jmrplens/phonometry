<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"><rect width="900" height="560" fill="#ffffff"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1a1a1a" text-anchor="middle">La cadena del cepstro: un eco se vuelve un pico en quefrencia</text><rect x="48" y="64" width="190" height="86" rx="10" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="2"/><text x="143.0" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="600">Señal con un eco</text><text x="143.0" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">x = s(t) + a·s(t − t0)</text><text x="143.0" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">a = 0,5;  t0 = 8 ms</text><rect x="262" y="64" width="180" height="86" rx="10" fill="#f0f2f5" stroke="#1f77b4" stroke-width="2"/><text x="352.0" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="600">Espectro ondulado |X(f)|</text><text x="352.0" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">ondulación coseno de periodo</text><text x="352.0" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">1/t0 = 125 Hz</text><rect x="466" y="64" width="180" height="86" rx="10" fill="#f0f2f5" stroke="#1f77b4" stroke-width="2"/><text x="556.0" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="600">Logaritmo: ln |X|²</text><text x="556.0" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">el eco multiplicativo</text><text x="556.0" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">se vuelve ondulación aditiva</text><rect x="670" y="64" width="190" height="86" rx="10" fill="#f0f2f5" stroke="#d62728" stroke-width="2"/><text x="765.0" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="600">FFT inversa</text><text x="765.0" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">eje de quefrencia, en segundos</text><text x="765.0" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">el cepstro</text><line x1="240.0" y1="107" x2="251.0" y2="107.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 260.0 107.0 L 251.0 110.6 L 251.0 103.4 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="444.0" y1="107" x2="455.0" y2="107.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 464.0 107.0 L 455.0 110.6 L 455.0 103.4 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="648.0" y1="107" x2="659.0" y2="107.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 668.0 107.0 L 659.0 110.6 L 659.0 103.4 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="765" y1="152" x2="765.0" y2="187.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 765.0 196.0 L 761.4 187.0 L 768.6 187.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="70" y="200" width="760" height="240" rx="10" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="1.8"/><line x1="110.0" y1="370.0" x2="790" y2="370.0" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round"/><line x1="790" y1="370.0" x2="797.0" y2="370.0" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round"/><path d="M 806.0 370.0 L 797.0 373.6 L 797.0 366.4 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="800" y="390" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="end">quefrencia</text><path d="M 110 294 Q 132 360 178 370" fill="none" stroke="#666666" stroke-width="2.0" stroke-linejoin="round"/><text x="170" y="244" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">ondícula de la fuente,</text><text x="170" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">bajo 2 ms</text><line x1="382.0" y1="370.0" x2="382.0" y2="260.0" stroke="#1f77b4" stroke-width="2.6" stroke-linecap="round"/><circle cx="382.0" cy="260.0" r="3.5" fill="#1f77b4" stroke="none" stroke-width="1.5"/><text x="382.0" y="246" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f77b4" text-anchor="middle" font-weight="600">a = 0,5 en t0 = 8 ms</text><line x1="654.0" y1="370.0" x2="654.0" y2="397.0" stroke="#d62728" stroke-width="2.2" stroke-linecap="round"/><circle cx="654.0" cy="397.0" r="3.0" fill="#d62728" stroke="none" stroke-width="1.5"/><text x="668.0" y="404.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#d62728" text-anchor="start">−a²/2 = −0,125</text><line x1="246.0" y1="224" x2="246.0" y2="414" stroke="#2ca02c" stroke-width="1.6" stroke-dasharray="6,5" stroke-linecap="round"/><text x="246.0" y="432" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#2ca02c" text-anchor="middle">corte del lifter en 4 ms</text><text x="176" y="218" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">paso bajo: envolvente</text><text x="450" y="218" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">paso alto: solo la ondulación del eco</text><line x1="110.0" y1="370.0" x2="110.0" y2="376.0" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="round"/><text x="110.0" y="392.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">0</text><line x1="382.0" y1="370.0" x2="382.0" y2="376.0" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="round"/><text x="382.0" y="392.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">8 ms</text><line x1="654.0" y1="370.0" x2="654.0" y2="376.0" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="round"/><text x="654.0" y="420.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">16 ms</text><text x="450" y="478" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="600">rahmónicos en n·t0 con alturas a, −a²/2, a³/3, …, haga lo que haga el espectro de la fuente</text><text x="450" y="504" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle">la ondulación paso alto oscila entre 20·log10(1 ± a) = +3,5 y −6,0 dB; echo_detection lee t0 y a del pico</text></svg>