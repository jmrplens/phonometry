version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    # A release is proposed three days after it is published, not the
    # morning it appears: a compromised version is usually yanked within that
    # window, and a pin that lands on it would publish it with the next release.
    # The same window on every ecosystem below.
    cooldown:
      default-days: 3
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    cooldown:
      default-days: 3
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 5
    # The exact pins in requirements*.txt move to each new release, because
    # an `==` pin never admits it; the `>=` floors in pyproject.toml already
    # admit every newer release and stay where they were measured. "increase"
    # would raise them to the release being bumped to, with no failure behind
    # it (CONTRIBUTING.md, section 3a).
    versioning-strategy: "increase-if-necessary"
    groups:
      python:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/site"
    cooldown:
      default-days: 3
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "javascript"
    open-pull-requests-limit: 5
    # katex takes every update like the rest. rehype-katex renders the markup
    # with a katex of its own and still asks for ^0.16, but site/package.json
    # and an override in site/pnpm-workspace.yaml both read katex from one
    # catalog entry there, so a bump moves the renderer and the stylesheet
    # together, and `pnpm check:math` fails the build if they ever part.
    groups:
      site:
        patterns:
          - "*"

  # The Pyodide the CI job installs the wheel into, standing in for
  # JupyterLite: a new Pyodide ships new numpy and scipy builds, which is
  # what decides whether the package installs there.
  - package-ecosystem: "npm"
    directory: "/tests/pyodide"
    cooldown:
      default-days: 3
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "javascript"
    open-pull-requests-limit: 2
