600">Potencia acústica de control</text><text x="575.0" y="314" font-family="Consolas, Menlo, monospace" font-size="13" fill="#4da3d8" text-anchor="start" font-weight="600">LWA = LvA + 10 log10(S/S₀) + 10 log10 ε</text><text x="575.0" y="342" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9a9a9a" text-anchor="start">se asume ε = 1 → límite superior LWA,max</text><text x="575.0" y="368" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9a9a9a" text-anchor="start">velocidad normal eficaz, ponderada A</text></svg>