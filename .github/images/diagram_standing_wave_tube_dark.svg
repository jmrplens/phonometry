ll="#e6e6e6" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">x</tspan><tspan dy="3.5" font-size="11.2">min,1</tspan><tspan dy="-3.5"> = 12 cm</tspan></text><text x="340" y="450.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9a9a9a" text-anchor="middle">minima far from the specimen fill in (wall losses, exaggerated here): read the nearest one</text><text x="450" y="490" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">s</tspan><tspan> = 10</tspan><tspan dy="-6.5" font-size="11.9">Δ</tspan><tspan font-size="11.9" font-style="italic">L</tspan><tspan font-size="11.9">/20</tspan><tspan dy="6.5"> = 3</tspan></text><text x="450" y="514" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="middle" xml:space="preserve"><tspan>|</tspan><tspan font-style="italic">r</tspan><tspan>| = (</tspan><tspan font-style="italic">s</tspan><tspan> − 1)/(</tspan><tspan font-style="italic">s</tspan><tspan> + 1) = 0.5</tspan></text><text x="450" y="538" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">α</tspan><tspan> = 1 − |</tspan><tspan font-style="italic">r</tspan><tspan>|</tspan><tspan dy="-6.5" font-size="11.9">2</tspan><tspan dy="6.5"> = 0.75</tspan></text><text x="450" y="562" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="middle" xml:space="preserve"><tspan>Φ = 4</tspan><tspan font-style="italic">π</tspan><tspan> </tspan><tspan font-style="italic">x</tspan><tspan dy="3.7" font-size="11.9">min,1</tspan><tspan dy="-3.7">/</tspan><tspan font-style="italic">λ</tspan><tspan> − </tspan><tspan font-style="italic">π</tspan><tspan> = −54.1°</tspan></text><text x="450" y="586" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">Z</tspan><tspan>/</tspan><tspan font-style="italic">ρc</tspan><tspan dy="3.7" font-size="11.9">0</tspan><tspan dy="-3.7"> = (1 + </tspan><tspan font-style="italic">r</tspan><tspan>)/(1 − </tspan><tspan font-style="italic">r</tspan><tspan>) = 1.13 − 1.22j</tspan></text><text x="450" y="622" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#5abf5a" text-anchor="middle" font-weight="600">one channel: the microphone sensitivity cancels and there is no inter-channel phase mismatch</text><text x="450" y="648" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9a9a9a" text-anchor="middle">magnitude from the ratio, phase from the position — which is why Part 1 is the arbitration method</text></svg>