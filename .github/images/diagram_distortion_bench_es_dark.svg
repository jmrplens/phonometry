<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590"><rect width="900" height="590" fill="#0d1117"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6e6e6" text-anchor="middle">El banco de distorsión de IEC 60268-3 y su punto de funcionamiento</text><rect x="46" y="152.0" width="186" height="88" rx="10" fill="#1c2128" stroke="#4da3d8" stroke-width="2.2"/><text x="139.0" y="188.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#e6e6e6" text-anchor="middle" font-weight="600">Generador de señal</text><text x="139.0" y="214.0" font-family="Consolas, Menlo, monospace" font-size="15" fill="#9a9a9a" text-anchor="middle">sinusoide de 1 kHz</text><line x1="232" y1="196.0" x2="268" y2="196.0" stroke="#e6e6e6" stroke-width="2.0" stroke-linecap="round"/><rect x="268" y="181.0" width="66" height="30" rx="3" fill="#0d1117" stroke="#e6e6e6" stroke-width="2.0"/><text x="301" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">impedancia de</text><text x="301" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">fuente nominal</text><line x1="334" y1="196.0" x2="372" y2="196.0" stroke="#e6e6e6" stroke-width="2.0" stroke-linecap="round"/><rect x="372" y="152.0" width="206" height="88" rx="10" fill="#1c2128" stroke="#e46a6a" stroke-width="2.2"/><text x="475.0" y="188.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#e6e6e6" text-anchor="middle" font-weight="600">Amplificador</text><text x="475.0" y="214.0" font-family="Consolas, Menlo, monospace" font-size="15" fill="#9a9a9a" text-anchor="middle">Clase A / B / D</text><line x1="578" y1="196.0" x2="640" y2="196.0" stroke="#e6e6e6" stroke-width="2.0" stroke-linecap="round"/><circle cx="640" cy="196.0" r="5.0" fill="#0d1117" stroke="#e6e6e6" stroke-width="2.0"/><line x1="640" y1="196.0" x2="640" y2="270.0" stroke="#e6e6e6" stroke-width="2.0" stroke-linecap="round"/><rect x="618" y="270.0" width="44" height="62" rx="3" fill="#0d1117" stroke="#5abf5a" stroke-width="2.2"/><line x1="640" y1="332.0" x2="640" y2="358.0" stroke="#e6e6e6" stroke-width="2.0" stroke-linecap="round"/><line x1="618.0" y1="358.0" x2="662.0" y2="358.0" stroke="#e6e6e6" stroke-width="2.0" stroke-linecap="round"/><line x1="626.0" y1="365.0" x2="654.0" y2="365.0" stroke="#e6e6e6" stroke-width="2.0" stroke-linecap="round"/><line x1="633.0" y1="372.0" x2="647.0" y2="372.0" stroke="#e6e6e6" stroke-width="2.0" stroke-linecap="round"/><text x="676" y="292.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#5abf5a" text-anchor="start" font-weight="600">Carga nominal</text><text x="676" y="312.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="start">resistencia no inductiva de 8 Ω,</text><text x="676" y="330.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="start">nunca un altavoz</text><line x1="640" y1="196.0" x2="700" y2="196.0" stroke="#e6e6e6" stroke-width="2.0" stroke-linecap="round"/><rect x="700" y="162.0" width="152" height="68" rx="8" fill="#0d1117" stroke="#9a9a9a" stroke-width="1.8" stroke-dasharray="7,5"/><text x="776" y="186.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">Solo clase D:</text><text x="776" y="206.0" font-family="Consolas, Menlo, monospace" font-size="14" fill="#9a9a9a" text-anchor="middle">IEC 61606-1</text><text x="776" y="224.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9a9a9a" text-anchor="middle">paso bajo analógico</text><line x1="776" y1="162.0" x2="776" y2="116" stroke="#e6e6e6" stroke-width="2.0" stroke-linecap="round"/><rect x="596" y="46" width="256" height="70" rx="10" fill="#1c2128" stroke="#4da3d8" stroke-width="2.2"/><text x="724" y="74" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#e6e6e6" text-anchor="middle" font-weight="600">Analizador / ADC</text><text x="724" y="98" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">≥ 10 dB de margen</text><rect x="46" y="46" width="400" height="62" rx="10" fill="#1c2128" stroke="#e46a6a" stroke-width="2.0"/><text x="246" y="70" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="middle" font-weight="600">Condiciones normalizadas (3.1.3)</text><text x="246" y="94" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9a9a9a" text-anchor="middle">condiciones nominales (3.1.2), f.e.m. de la fuente −10 dB</text><line x1="246" y1="108" x2="246" y2="152.0" stroke="#9a9a9a" stroke-width="1.4" stroke-dasharray="6,5" stroke-linecap="round"/><text x="46" y="402" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e6e6e6" text-anchor="start">Apartado 9: mantener el amplificador en ese punto de funcionamiento 1 h antes de la primera lectura.</text><rect x="46" y="424" width="806" height="132" rx="12" fill="#1c2128" stroke="#5abf5a" stroke-width="2.0"/><text x="66" y="452" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="start" font-weight="600">Tres comprobaciones, del propio método</text><circle cx="76" cy="476" r="4.0" fill="#5abf5a" stroke="none" stroke-width="1.5"/><text x="92" y="481" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9a9a9a" text-anchor="start">THD de la fuente ≥ 10 dB por debajo de la distorsión más baja a medir (14.12.3.2 a)</text><circle cx="76" cy="500" r="4.0" fill="#5abf5a" stroke="none" stroke-width="1.5"/><text x="92" y="505" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9a9a9a" text-anchor="start">generador silenciado: residuo &lt; 1/3 de la tensión de distorsión, o el resultado se descarta (14.12.3.2 d)</text><circle cx="76" cy="524" r="4.0" fill="#5abf5a" stroke="none" stroke-width="1.5"/><text x="92" y="529" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9a9a9a" text-anchor="start">armónico significativo más alto dentro de la banda: f₁ ≤ f_limit / n (14.12.4.1 — 30 kHz y n = 5 dan 6 kHz)</text><text x="852" y="452" font-family="Consolas, Menlo, monospace" font-size="15" fill="#4da3d8" text-anchor="end">banda AES17 de 20 Hz – 20 kHz</text></svg>