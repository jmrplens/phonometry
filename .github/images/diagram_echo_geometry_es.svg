<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><rect width="900" height="600" fill="#ffffff"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1a1a1a" text-anchor="middle">De dónde sale la quefrencia: la geometría de una reflexión</text><line x1="50" y1="330.0" x2="470" y2="330.0" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round"/><line x1="50" y1="330.0" x2="42" y2="339.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="74" y1="330.0" x2="66" y2="339.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="98" y1="330.0" x2="90" y2="339.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="122" y1="330.0" x2="114" y2="339.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="146" y1="330.0" x2="138" y2="339.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="170" y1="330.0" x2="162" y2="339.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="194" y1="330.0" x2="186" y2="339.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="218" y1="330.0" x2="210" y2="339.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="242" y1="330.0" x2="234" y2="339.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="266" y1="330.0" x2="258" y2="339.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="290" y1="330.0" x2="282" y2="339.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="314" y1="330.0" x2="306" y2="339.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="338" y1="330.0" x2="330" y2="339.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="362" y1="330.0" x2="354" y2="339.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="386" y1="330.0" x2="378" y2="339.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="410" y1="330.0" x2="402" y2="339.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="434" y1="330.0" x2="426" y2="339.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="458" y1="330.0" x2="450" y2="339.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><rect x="110.0" y="176.0" width="40" height="44" rx="5" fill="#f0f2f5" stroke="#1f77b4" stroke-width="2"/><circle cx="130.0" cy="198.0" r="8" fill="#1f77b4" stroke="none" stroke-width="1.5"/><text x="130.0" y="164.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">fuente</text><rect x="236.0" y="190.0" width="8.0" height="12.0" rx="2.5" fill="#1a1a1a" stroke="none" stroke-width="1.5"/><rect x="234.0" y="202.0" width="12.0" height="34.0" rx="4.0" fill="#1f77b4" stroke="none" stroke-width="1.5"/><line x1="240.0" y1="236.0" x2="240.0" y2="330.0" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round"/><line x1="224.0" y1="330.0" x2="256.0" y2="330.0" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round"/><text x="270.0" y="192.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="600">micrófono</text><line x1="152.0" y1="198.0" x2="232.0" y2="198.0" stroke="#1f77b4" stroke-width="2.4" stroke-linecap="round"/><text x="213.0" y="184.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f77b4" text-anchor="middle" font-weight="600">r_d = 1,00 m</text><circle cx="130.0" cy="462.0" r="8" fill="none" stroke="#666666" stroke-width="1.6"/><text x="130.0" y="486.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#666666" text-anchor="middle">fuente imagen</text><line x1="130.0" y1="198.0" x2="130.0" y2="462.0" stroke="#666666" stroke-width="1.0" stroke-dasharray="4,4" stroke-linecap="round"/><line x1="130.0" y1="198.0" x2="185.0" y2="330.0" stroke="#d62728" stroke-width="2.2" stroke-linecap="round"/><line x1="185.0" y1="330.0" x2="240.0" y2="190.0" stroke="#d62728" stroke-width="2.2" stroke-linecap="round"/><line x1="130.0" y1="462.0" x2="240.0" y2="190.0" stroke="#666666" stroke-width="1.0" stroke-dasharray="4,4" stroke-linecap="round"/><circle cx="185.0" cy="330.0" r="4" fill="#d62728" stroke="none" stroke-width="1.5"/><text x="115.0" y="284.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#d62728" text-anchor="middle" font-weight="600">r_r = 2,60 m</text><line x1="286.0" y1="260.0" x2="286.0" y2="207.0" stroke="#666666" stroke-width="1.2" stroke-linecap="round"/><path d="M 286.0 198.0 L 289.6 207.0 L 282.4 207.0 Z" fill="#666666" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="286.0" y1="268.0" x2="286.0" y2="321.0" stroke="#666666" stroke-width="1.2" stroke-linecap="round"/><path d="M 286.0 330.0 L 282.4 321.0 L 289.6 321.0 Z" fill="#666666" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="295.0" y="270.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start">1,20 m</text><line x1="240.0" y1="190.0" x2="286.0" y2="198.0" stroke="#666666" stroke-width="0.9" stroke-dasharray="3,3" stroke-linecap="round"/><line x1="181.0" y1="374.0" x2="139.0" y2="374.0" stroke="#666666" stroke-width="1.2" stroke-linecap="round"/><path d="M 130.0 374.0 L 139.0 370.4 L 139.0 377.6 Z" fill="#666666" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="189.0" y1="374.0" x2="231.0" y2="374.0" stroke="#666666" stroke-width="1.2" stroke-linecap="round"/><path d="M 240.0 374.0 L 231.0 377.6 L 231.0 370.4 Z" fill="#666666" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="185.0" y="367.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle">1,00 m</text><rect x="500.0" y="120" width="356" height="150" rx="10" fill="none" stroke="#1a1a1a" stroke-width="1.6"/><text x="678.0" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="600">Reflexión en el suelo</text><text x="678.0" y="182" font-family="Consolas, Menlo, monospace" font-size="18" fill="#1a1a1a" text-anchor="middle">Delta d = r_r - r_d = 1,60 m</text><text x="678.0" y="210" font-family="Consolas, Menlo, monospace" font-size="18" fill="#d62728" text-anchor="middle" font-weight="600">t0 = Delta d / c = 4,7 ms</text><text x="678.0" y="240" font-family="Consolas, Menlo, monospace" font-size="18" fill="#1a1a1a" text-anchor="middle">a = R * r_d / r_r = 0,38 R</text><rect x="500.0" y="292" width="356" height="168" rx="10" fill="none" stroke="#d62728" stroke-width="1.6"/><text x="678.0" y="322" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#d62728" text-anchor="middle" font-weight="600">El ejemplo de 8 ms de esta página</text><text x="678.0" y="352" font-family="Consolas, Menlo, monospace" font-size="18" fill="#1a1a1a" text-anchor="middle">Delta d = c * 8 ms = 2,74 m</text><text x="678.0" y="380" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle">una pared lateral a 1,37 m del camino directo</text><text x="678.0" y="408" font-family="Consolas, Menlo, monospace" font-size="18" fill="#1a1a1a" text-anchor="middle">R = a * r_r / r_d = 3,74 a  &lt;= 1</text><text x="678.0" y="436" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#666666" text-anchor="middle">así que a &gt; 0,27 no es una sola reflexión especular</text><text x="450" y="512" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#666666" text-anchor="middle">La reflexión debe llegar antes de que acabe el registro y al menos 10 dB por encima de su ruido de fondo;</text><text x="450" y="534" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#666666" text-anchor="middle">c cambia unos 0,6 m/s por kelvin: convierte el retardo con la temperatura medida</text></svg>