# Project identification
sonar.projectKey=jmrplens_phonometry
sonar.organization=jmrplens

# Path to sources and tests
sonar.sources=src
sonar.tests=tests
sonar.python.version=3.13

# Encoding of the source files
sonar.sourceEncoding=UTF-8

# Coverage configuration
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions
sonar.exclusions=**/__pycache__/**, **/*.png, **/*.md
sonar.test.inclusions=tests/**/test_*.py
# Exclude overload-heavy type-stub files from duplication analysis
sonar.cpd.exclusions=src/phonometry/__init__.py,src/phonometry/metrology/core.py

# Increase authorized parameters for scientific APIs. event_level and
# noise_contour mirror the ECAC Doc 29 single-event parameter set (NPD tables
# plus per-segment masks); rotorcraft_event_level and rotorcraft_noise_contour
# (and their shared validation boundary) mirror the ECAC Doc 32 / NORAH2 one
# (hemisphere database, track, per-point radar-track overrides, ground and
# atmosphere). The slow-sound absorber functions carry the slit and resonator
# geometry alongside the shared air state (density, viscosity, Prandtl number,
# heat-capacity ratio, atmospheric pressure), matching the porous-absorber and
# JCA signatures. elastic_fdtd_simulation mirrors the acoustic
# fdtd_simulation piece by piece and adds only what the P-SV physics
# demands (the S-wave speed map, the recorded probe fields and the
# snapshot field). room_to_room_transmission carries the two rooms and the
# partition between them: the analysis bands, the partition (transmission
# loss and area), the receiving room (absorption area), the source room
# (either a level or a sound power level with its room constant,
# directivity and sound power model) and the design criterion (family,
# target, flanking allowance, label). All extras are keyword-only
# optionals, so the parameter count is the physics', not incidental
# complexity.
sonar.issue.ignore.multicriteria=S107A,S107B,S107C,S107D,S107F,S107E,S107G
sonar.issue.ignore.multicriteria.S107A.ruleKey=python:S107
sonar.issue.ignore.multicriteria.S107A.resourceKey=src/phonometry/__init__.py
sonar.issue.ignore.multicriteria.S107B.ruleKey=python:S107
sonar.issue.ignore.multicriteria.S107B.resourceKey=src/phonometry/aircraft/airport_noise.py
sonar.issue.ignore.multicriteria.S107C.ruleKey=python:S107
sonar.issue.ignore.multicriteria.S107C.resourceKey=src/phonometry/aircraft/rotorcraft_noise.py
sonar.issue.ignore.multicriteria.S107D.ruleKey=python:S107
sonar.issue.ignore.multicriteria.S107D.resourceKey=src/phonometry/materials/slow_sound_absorber.py
sonar.issue.ignore.multicriteria.S107F.ruleKey=python:S107
sonar.issue.ignore.multicriteria.S107F.resourceKey=src/phonometry/materials/metadiffuser.py
sonar.issue.ignore.multicriteria.S107E.ruleKey=python:S107
