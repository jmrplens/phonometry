<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><rect width="900" height="600" fill="#ffffff"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1a1a1a" text-anchor="middle">Predicción del tiempo de reverberación: Sabine frente a Eyring</text><rect x="170" y="52" width="560" height="78" rx="10" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="2"/><text x="450" y="77" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>Sala de 10 × 7 × 3,5 m — </tspan><tspan font-style="italic">V</tspan><tspan> = 245 m³, </tspan><tspan font-style="italic">S</tspan><tspan> = 259 m²</tspan></text><text x="450" y="97" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">testeros duros, laterales con tratamiento ligero, moqueta y techo acústico</text><text x="450" y="117" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle" xml:space="preserve"><tspan>la absorción media </tspan><tspan font-style="italic">ᾱ</tspan><tspan> va de 0,21 a 125 Hz a 0,51 a 4 kHz</tspan></text><rect x="60" y="178" width="380" height="96" rx="10" fill="#f0f2f5" stroke="#1f77b4" stroke-width="2"/><text x="250" y="203" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="600">Sabine</text><text x="250" y="224" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f77b4" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">T</tspan><tspan> = 0,161·</tspan><tspan font-style="italic">V</tspan><tspan> / (Σ </tspan><tspan font-style="italic">S</tspan><tspan dy="2.9" font-size="9.1" font-style="italic">i</tspan><tspan dy="-2.9">·</tspan><tspan font-style="italic">α</tspan><tspan dy="2.9" font-size="9.1" font-style="italic">i</tspan><tspan dy="-2.9"> + 4·</tspan><tspan font-style="italic">m</tspan><tspan>·</tspan><tspan font-style="italic">V</tspan><tspan>)</tspan></text><text x="250" y="245" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle" xml:space="preserve"><tspan>absorción baja y uniforme (</tspan><tspan font-style="italic">ᾱ</tspan><tspan> hasta ≈ 0,2);</tspan></text><text x="250" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle" xml:space="preserve"><tspan>queda finita incluso con </tspan><tspan font-style="italic">α</tspan><tspan> = 1</tspan></text><rect x="460" y="178" width="380" height="96" rx="10" fill="#f0f2f5" stroke="#d62728" stroke-width="2"/><text x="650" y="203" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="600">Eyring</text><text x="650" y="224" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#d62728" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">T</tspan><tspan> = 0,161·</tspan><tspan font-style="italic">V</tspan><tspan> / (−</tspan><tspan font-style="italic">S</tspan><tspan>·ln(1 − </tspan><tspan font-style="italic">ᾱ</tspan><tspan>) + 4·</tspan><tspan font-style="italic">m</tspan><tspan>·</tspan><tspan font-style="italic">V</tspan><tspan>)</tspan></text><text x="650" y="245" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">absorción fuerte y uniforme;</text><text x="650" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle" xml:space="preserve"><tspan>llega a </tspan><tspan font-style="italic">T</tspan><tspan> = 0 con absorción total</tspan></text><line x1="350" y1="130" x2="272.9926352411743" y2="169.86263587515685" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 265.0 174.0 L 271.3 166.7 L 274.6 173.1 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="550" y1="130" x2="627.0073647588257" y2="169.86263587515685" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 635.0 174.0 L 625.4 173.1 L 628.7 166.7 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="100" y="318" width="700" height="150" rx="10" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="1.8"/><text x="450" y="344" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan font-style="italic">T</tspan><tspan dy="3.1" font-size="9.8">60</tspan><tspan dy="-3.1"> predicho por banda de octava</tspan></text><text x="292.0" y="372" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle" font-weight="600">125 Hz</text><text x="386.0" y="372" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle" font-weight="600">250</text><text x="480.0" y="372" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle" font-weight="600">500</text><text x="574.0" y="372" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle" font-weight="600">1k</text><text x="668.0" y="372" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle" font-weight="600">2k</text><text x="762.0" y="372" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle" font-weight="600">4k</text><line x1="130" y1="382" x2="770" y2="382" stroke="#666666" stroke-width="1.0" stroke-linecap="round"/><text x="130" y="404" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f77b4" text-anchor="start" font-weight="600">Sabine [s]</text><text x="292.0" y="404" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">0,74</text><text x="386.0" y="404" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">0,47</text><text x="480.0" y="404" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">0,37</text><text x="574.0" y="404" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">0,31</text><text x="668.0" y="404" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">0,30</text><text x="762.0" y="404" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">0,30</text><text x="130" y="432" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#d62728" text-anchor="start" font-weight="600">Eyring [s]</text><text x="292.0" y="432" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">0,66</text><text x="386.0" y="432" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">0,39</text><text x="480.0" y="432" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">0,29</text><text x="574.0" y="432" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">0,23</text><text x="668.0" y="432" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">0,21</text><text x="762.0" y="432" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">0,22</text><text x="450" y="456" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle" xml:space="preserve"><tspan>Eyring sale entre un 11 y un 29 % más corto: </tspan><tspan font-style="italic">ᾱ</tspan><tspan> excede la zona cómoda de Sabine</tspan></text><line x1="250" y1="274" x2="312.1858117208799" y2="309.5347495547885" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 320.0 314.0 L 310.4 312.7 L 314.0 306.4 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="650" y1="274" x2="587.8141882791201" y2="309.5347495547885" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 580.0 314.0 L 586.0 306.4 L 589.6 312.7 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="130" y="500" width="640" height="68" rx="10" fill="none" stroke="#2ca02c" stroke-width="1.6" stroke-dasharray="6,5"/><text x="450" y="527" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#2ca02c" text-anchor="middle" font-weight="600">Dominio de validez: un campo difuso que sigue difuso mientras decae</text><text x="450" y="551" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" xml:space="preserve"><tspan>bajo la frecuencia de Schroeder, en volúmenes acoplados y en salas tipo pasillo no existe un </tspan><tspan font-style="italic">T</tspan><tspan dy="2.6" font-size="8.4">60</tspan><tspan dy="-2.6"> único</tspan></text></svg>