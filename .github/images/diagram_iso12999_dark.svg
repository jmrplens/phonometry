<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500"><rect width="900" height="500" fill="#0d1117"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6e6e6" text-anchor="middle">Measurement uncertainty from tables to expanded U (ISO 12999-1)</text><rect x="118.0" y="48" width="664.0" height="60.0" rx="10" fill="#1c2128" stroke="#e6e6e6" stroke-width="2"/><text x="450.0" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#e6e6e6" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>Standard uncertainty  </tspan><tspan font-style="italic">u</tspan><tspan>  — reproducibility read from the tables</tspan></text><text x="450.0" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9a9a9a" text-anchor="middle" xml:space="preserve"><tspan>bands: Tables 2/4 · ratings: Tables 3/5 · situation A (</tspan><tspan font-style="italic">σ</tspan><tspan dy="2.9" font-size="9.1" font-style="italic">R</tspan><tspan dy="-2.9">) / B (</tspan><tspan font-style="italic">σ</tspan><tspan dy="2.9" font-size="9.1" font-style="italic">situ</tspan><tspan dy="-2.9">) / C (</tspan><tspan font-style="italic">σ</tspan><tspan dy="2.9" font-size="9.1" font-style="italic">r</tspan><tspan dy="-2.9">)</tspan></text><line x1="450.0" y1="108" x2="450.0" y2="129.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 138.0 L 446.4 129.0 L 453.6 129.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="118.0" y="138" width="664.0" height="60.0" rx="10" fill="#1c2128" stroke="#e6e6e6" stroke-width="2"/><text x="450.0" y="163" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>Reduce by  </tspan><tspan font-style="italic">m</tspan><tspan>  independent measurements   </tspan><tspan font-style="italic">u</tspan><tspan>/√</tspan><tspan font-style="italic">m</tspan><tspan>   (Formula A.7)</tspan></text><text x="450.0" y="183" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9a9a9a" text-anchor="middle">and combine model with reality per Annex A when predicting</text><rect x="118.0" y="226" width="664.0" height="60.0" rx="10" fill="#1c2128" stroke="#4da3d8" stroke-width="2"/><text x="450.0" y="251" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>Combine uncorrelated contributions   </tspan><tspan font-style="italic">u</tspan><tspan dy="3.7" font-size="11.9" font-style="italic">c</tspan><tspan dy="-3.7"> = √(Σ </tspan><tspan font-style="italic">u</tspan><tspan dy="3.7" font-size="11.9" font-style="italic">i</tspan><tspan dy="-10.2" font-size="11.9">2</tspan><tspan dy="6.5">)   (Formula C.2)</tspan></text><text x="450.0" y="271" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9a9a9a" text-anchor="middle">single-number combination of Annex B uses Formula B.2</text><rect x="118.0" y="314" width="664.0" height="60.0" rx="10" fill="#1c2128" stroke="#e46a6a" stroke-width="2"/><text x="450.0" y="339" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>Expand   </tspan><tspan font-style="italic">U</tspan><tspan> = </tspan><tspan font-style="italic">k</tspan><tspan>·</tspan><tspan font-style="italic">u</tspan><tspan>   (Formula 2),   </tspan><tspan font-style="italic">k</tspan><tspan> from Table 8   (</tspan><tspan font-style="italic">k</tspan><tspan> ≥ 1)</tspan></text><text x="450.0" y="359" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9a9a9a" text-anchor="middle">the coverage factor depends on the reported quantity and situation</text><line x1="450.0" y1="198" x2="450.0" y2="217.0" s