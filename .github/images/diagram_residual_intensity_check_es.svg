<svg xmlns="http://www.w3.org/2000/svg" width="900" height="570" viewBox="0 0 900 570"><rect width="900" height="570" fill="#ffffff"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1a1a1a" text-anchor="middle">Ensayo de intensidad residual y comprobación previa de la sonda</text><rect x="46.0" y="62" width="256.0" height="300" rx="12" fill="#f0f2f5" stroke="#666666" stroke-width="1.6"/><text x="174.0" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">1 · Ensayo de intensidad residual</text><rect x="322.0" y="62" width="256.0" height="300" rx="12" fill="#f0f2f5" stroke="#666666" stroke-width="1.6"/><text x="450.0" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">2 · Comprobación de presión</text><rect x="598.0" y="62" width="256.0" height="300" rx="12" fill="#f0f2f5" stroke="#666666" stroke-width="1.6"/><text x="726.0" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">3 · Inversión de la sonda, in situ</text><rect x="96.0" y="124.0" width="156" height="124" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/><path d="M 114.0 146.0 q 20 -14 40 0 q 20 14 40 0" fill="none" stroke="#1f77b4" stroke-width="1.6" stroke-linejoin="round"/><path d="M 114.0 180.0 q 20 -14 40 0 q 20 14 40 0" fill="none" stroke="#1f77b4" stroke-width="1.6" stroke-linejoin="round"/><path d="M 114.0 214.0 q 20 -14 40 0 q 20 14 40 0" fill="none" stroke="#1f77b4" stroke-width="1.6" stroke-linejoin="round"/><rect x="131.0" y="162.0" width="26" height="48" rx="6" fill="#f0f2f5" stroke="#d62728" stroke-width="2.0"/><rect x="136.0" y="156.0" width="16" height="8" rx="2" fill="#1a1a1a" stroke="none" stroke-width="1.5"/><rect x="191.0" y="162.0" width="26" height="48" rx="6" fill="#f0f2f5" stroke="#d62728" stroke-width="2.0"/><rect x="196.0" y="156.0" width="16" height="8" rx="2" fill="#1a1a1a" stroke="none" stroke-width="1.5"/><rect x="162.0" y="181.0" width="24" height="10" rx="3" fill="#f0f2f5" stroke="#666666" stroke-width="1.2"/><text x="174.0" y="270.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle">ruido rosa o blanco, de 45 Hz a 7,1 kHz</text><text x="174.0" y="292.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle">ambas cápsulas dentro de ± 0,1 dB</text><text x="174.0" y="320.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1f77b4" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan font-style="italic">δ</tspan><tspan dy="4.0" font-size="12.6" font-style="italic">pI</tspan><tspan font-size="12.6">0</tspan><tspan dy="-4.0"> = </tspan><tspan font-style="italic">L</tspan><tspan dy="4.0" font-size="12.6" font-style="italic">p</tspan><tspan dy="-4.0"> − </tspan><tspan font-style="italic">L</tspan><tspan dy="4.0" font-size="12.6" font-style="italic">I</tspan><tspan font-size="12.6">0</tspan></text><rect x="376.0" y="146.0" width="62" height="80" rx="8" fill="#ffffff" stroke="#2ca02c" stroke-width="2.2"/><text x="407.0" y="190.0" font-family="Consolas, Menlo, monospace" font-size="15" fill="#2ca02c" text-anchor="middle" font-weight="600">94,0</text><text x="407.0" y="208.0" font-family="Consolas, Menlo, monospace" font-size="14" fill="#2ca02c" text-anchor="middle">dB</text><rect x="438.0" y="172.0" width="22" height="28" rx="5" fill="#f0f2f5" stroke="#d62728" stroke-width="2.0"/><rect x="460.0" y="178.0" width="44" height="16" rx="4" fill="#f0f2f5" stroke="#666666" stroke-width="1.4"/><rect x="504.0" y="172.0" width="22" height="28" rx="5" fill="#f0f2f5" stroke="#d62728" stroke-width="2.0"/><text x="450.0" y="252.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle">calibrador IEC 60942, clase 0 o 1</text><text x="450.0" y="274.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle">en cada micrófono por separado</text><text x="450.0" y="306.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#2ca02c" text-anchor="middle" font-weight="600">ajustar a ± 0,1 dB</text><text x="450.0" y="330.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#666666" text-anchor="middle">en ambos canales</text><line x1="626.0" y1="118.0" x2="626.0" y2="274.0" stroke="#1a1a1a" stroke-width="2.6" stroke-linecap="round"/><line x1="626.0" y1="120.0" x2="617.0" y2="129.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="626.0" y1="144.0" x2="617.0" y2="153.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="626.0" y1="168.0" x2="617.0" y2="177.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="626.0" y1="192.0" x2="617.0" y2="201.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="626.0" y1="216.0" x2="617.0" y2="225.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="626.0" y1="240.0" x2="617.0" y2="249.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="626.0" y1="264.0" x2="617.0" y2="273.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><text x="726.0" y="296.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle">superficie de medición</text><line x1="638.0" y1="122.0" x2="709.0" y2="122.0" stroke="#666666" stroke-width="2.0" stroke-linecap="round"/><path d="M 718.0 122.0 L 709.0 125.6 L 709.0 118.4 Z" fill="#666666" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="678.0" y="114.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle">energía que sale de la fuente</text><line x1="692.0" y1="160.0" x2="760.0" y2="160.0" stroke="#1a1a1a" stroke-width="2.0" stroke-linecap="round"/><circle cx="712.0" cy="160.0" r="5.5" fill="#1a1a1a" stroke="none" stroke-width="1.5"/><circle cx="740.0" cy="160.0" r="5.5" fill="#1a1a1a" stroke="none" stroke-width="1.5"/><line x1="726.0" y1="140.0" x2="755.0" y2="140.0" stroke="#d62728" stroke-width="2.0" stroke-linecap="round"/><path d="M 764.0 140.0 L 755.0 143.6 L 755.0 136.4 Z" fill="#d62728" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="776.0" y="165.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#d62728" text-anchor="start" font-weight="600" xml:space="preserve"><tspan>+ </tspan><tspan font-style="italic">I</tspan><tspan dy="3.3" font-size="10.5" font-style="italic">n</tspan></text><line x1="692.0" y1="232.0" x2="760.0" y2="232.0" stroke="#1a1a1a" stroke-width="2.0" stroke-linecap="round"/><circle cx="712.0" cy="232.0" r="5.5" fill="#1a1a1a" stroke="none" stroke-width="1.5"/><circle cx="740.0" cy="232.0" r="5.5" fill="#1a1a1a" stroke="none" stroke-width="1.5"/><line x1="726.0" y1="212.0" x2="697.0" y2="212.0" stroke="#1f77b4" stroke-width="2.0" stroke-linecap="round"/><path d="M 688.0 212.0 L 697.0 208.4 L 697.0 215.6 Z" fill="#1f77b4" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="776.0" y="237.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f77b4" text-anchor="start" font-weight="600" xml:space="preserve"><tspan>− </tspan><tspan font-style="italic">I</tspan><tspan dy="3.3" font-size="10.5" font-style="italic">n</tspan></text><path d="M 710.3 152.8 A 46.0 46.0 0 1 1 710.3 239.2" fill="none" stroke="#666666" stroke-width="1.8" stroke-linejoin="round"/><path d="M 710.3 239.2 L 721.2 238.5 L 718.2 246.8 Z" fill="#666666" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="674.0" y="201.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#666666" text-anchor="end">180°</text><text x="726.0" y="320.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle">el centro acústico no se mueve</text><rect x="46" y="390" width="808" height="62" rx="10" fill="#f0f2f5" stroke="#d62728" stroke-width="2.0"/><text x="450" y="416" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">se acepta cuando las dos lecturas tienen signos opuestos y difieren en menos de 1,5 dB</text><text x="450" y="440" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#666666" text-anchor="middle">en la banda de nivel máximo (ISO 9614-2, apartado 6.2.2)</text><text x="60" y="482" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#666666" text-anchor="start">mismos signos → los dos canales están intercambiados, o uno está invertido</text><text x="60" y="506" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#666666" text-anchor="start">más de 1,5 dB de diferencia → la sonda perturba su propio campo, o los canales no están emparejados</text><text x="60" y="530" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#666666" text-anchor="start" xml:space="preserve"><tspan font-style="italic">δ</tspan><tspan dy="3.3" font-size="10.5" font-style="italic">pI</tspan><tspan font-size="10.5">0</tspan><tspan dy="-3.3"> pertenece al conjunto sonda, separador y analizador, no a los micrófonos</tspan></text></svg>