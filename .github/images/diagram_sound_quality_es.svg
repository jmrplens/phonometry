<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500"><rect width="900" height="500" fill="#ffffff"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1a1a1a" text-anchor="middle">Calidad sonora más allá de la sonoridad: cuatro sensaciones</text><rect x="230" y="52" width="440" height="56" rx="10" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="2"/><text x="450" y="76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="600">Señal calibrada x(t) en pascales</text><text x="450" y="97" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">cualquier fs: cada métrica remuestrea internamente a 48 kHz</text><rect x="60" y="148" width="270" height="56" rx="10" fill="#f0f2f5" stroke="#1f77b4" stroke-width="2"/><text x="195" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="600">Sonoridad específica N'(z)</text><text x="195" y="192" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">patrón de Zwicker sobre 24 Bark</text><rect x="390" y="148" width="450" height="56" rx="10" fill="#f0f2f5" stroke="#1f77b4" stroke-width="2"/><text x="615" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="600">Etapa de entrada del modelo de Sottek (ECMA-418-2)</text><text x="615" y="192" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">filtro de oído externo/medio + 53 bandas auditivas (Bark_HMS)</text><line x1="350" y1="108" x2="218.71643639337165" y2="141.75863064170443" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 210.0 144.0 L 217.8 138.3 L 219.6 145.2 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="550" y1="108" x2="597.4696863479521" y2="139.0710674277505" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 605.0 144.0 L 595.5 142.1 L 599.4 136.1 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="42.0" y="248" width="196" height="128" rx="10" fill="#f0f2f5" stroke="#d62728" stroke-width="2"/><text x="140.0" y="271" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="600">Agudeza S</text><text x="140.0" y="289" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">DIN 45692</text><text x="140.0" y="308" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">primer momento ponderado</text><text x="140.0" y="322" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">por g(z) de N'(z), k = 0,108</text><text x="140.0" y="337" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">ruido de una banda crítica</text><text x="140.0" y="351" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">a 1 kHz, 60 dB</text><text x="140.0" y="363" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#d62728" text-anchor="middle" font-weight="600">→ S = 1,00 acum</text><rect x="262.0" y="248" width="196" height="128" rx="10" fill="#f0f2f5" stroke="#d62728" stroke-width="2"/><text x="360.0" y="271" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="600">Tonalidad T</text><text x="360.0" y="289" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">ECMA-418-2, cláusula 6</text><text x="360.0" y="308" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">la autocorrelación por banda</text><text x="360.0" y="324" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">detecta componentes periódicas</text><text x="360.0" y="345" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">tono de 1 kHz a 40 dB</text><text x="360.0" y="363" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#d62728" text-anchor="middle" font-weight="600">→ T = 1,000 tu_HMS (999 Hz)</text><rect x="482.0" y="248" width="196" height="128" rx="10" fill="#f0f2f5" stroke="#d62728" stroke-width="2"/><text x="580.0" y="271" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="600">Aspereza R</text><text x="580.0" y="289" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">ECMA-418-2, cláusula 7</text><text x="580.0" y="308" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">modulación rápida de la envolvente,</text><text x="580.0" y="324" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">paso banda con pico hacia 70 Hz</text><text x="580.0" y="345" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">1 kHz, AM 100 % a 70 Hz, 60 dB</text><text x="580.0" y="363" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#d62728" text-anchor="middle" font-weight="600">→ R = 0,9999 asper</text><rect x="702.0" y="248" width="196" height="128" rx="10" fill="#f0f2f5" stroke="#d62728" stroke-width="2"/><text x="800.0" y="271" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="600">Intensidad de fluctuación F</text><text x="800.0" y="289" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">ECMA-418-2, cláusula 9 (HSA)</text><text x="800.0" y="308" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">modulación lenta de la envolvente,</text><text x="800.0" y="324" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">paso banda con pico hacia 4 Hz</text><text x="800.0" y="345" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">1 kHz, AM 100 % a 4 Hz, 60 dB</text><text x="800.0" y="363" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#d62728" text-anchor="middle" font-weight="600">→ F = 0,9957 vacil_HMS</text><line x1="195" y1="204" x2="148.2320147401027" y2="238.64295204436837" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 141.0 244.0 L 146.1 235.8 L 150.4 241.5 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="615" y1="204" x2="368.891275737494" y2="242.6052900803931" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 360.0 244.0 L 368.3 239.0 L 369.4 246.2 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="615" y1="204" x2="585.9265414708167" y2="237.2268097476381" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 580.0 244.0 L 583.2 234.9 L 588.6 239.6 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="615" y1="204" x2="791.2032725110412" y2="242.09800486725214" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 800.0 244.0 L 790.4 245.6 L 792.0 238.6 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="130" y="412" width="640" height="68" rx="10" fill="none" stroke="#2ca02c" stroke-width="1.6" stroke-dasharray="6,5"/><text x="450" y="439" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#2ca02c" text-anchor="middle" font-weight="600">Aguas abajo, las sensaciones se combinan en molestia</text><text x="450" y="463" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">N5, S, R y F alimentan la molestia psicoacústica de Fastl y Zwicker PA = N5·(1 + √(wS² + wFR²))</text></svg>