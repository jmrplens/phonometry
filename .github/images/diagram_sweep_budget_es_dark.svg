span font-style="italic">T</tspan><tspan>   |   B.6: +3 dB de S/R efectiva por duplicación</tspan></text><text x="118.0" y="228" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#e6e6e6" text-anchor="start" font-weight="600" xml:space="preserve"><tspan>2  Si la excitación se repite, el periodo debe superar </tspan><tspan font-style="italic">T</tspan><tspan> (6.2.2.2)</tspan></text><rect x="118.0" y="266.0" width="327.6775" height="30" rx="3" fill="#0d1117" stroke="#e6e6e6" stroke-width="1.5" stroke-dasharray="4,4"/><text x="281.83875" y="286.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9a9a9a" text-anchor="middle">periodo 1, arranque: se descarta</text><rect x="445.6775" y="266.0" width="327.6775" height="30" rx="3" fill="#1c2128" stroke="#e6e6e6" stroke-width="1.5"/><text x="609.51625" y="286.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="600">periodo 2, se conserva</text><line x1="277.83875" y1="250.0" x2="127.0" y2="250.0" stroke="#9a9a9a" stroke-width="1.2" stroke-linecap="round"/><path d="M 118.0 250.0 L 127.0 246.4 L 127.0 253.6 Z" fill="#9a9a9a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="285.83875" y1="250.0" x2="436.6775" y2="250.0" stroke="#9a9a9a" stroke-width="1.2" stroke-linecap="round"/><path d="M 445.7 250.0 L 436.7 253.6 L 436.7 246.4 Z" fill="#9a9a9a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="281.83875" y="243.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle" xml:space="preserve"><tspan>orden 17 → 2,73 s ≥ </tspan><tspan font-style="italic">T</tspan></text><rect x="118.0" y="336.0" width="81.91749999999999" height="26" rx="3" fill="#0d1117" stroke="#e46a6a" stroke-width="1.6"/><text x="158.95875" y="354.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e46a6a" text-anchor="middle" font-wei