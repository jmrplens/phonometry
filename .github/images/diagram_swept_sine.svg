<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620"><rect width="900" height="620" fill="#ffffff"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1a1a1a" text-anchor="middle">Swept-sine distortion: deconvolution and harmonic pre-arrivals</text><rect x="60" y="64" width="240" height="76.0" rx="10" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="2"/><text x="180.0" y="96.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>Exponential sweep </tspan><tspan font-style="italic">x</tspan><tspan>(</tspan><tspan font-style="italic">t</tspan><tspan>)</tspan></text><text x="180.0" y="120.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle" xml:space="preserve"><tspan>20 Hz → 6 kHz in </tspan><tspan font-style="italic">T</tspan><tspan> = 4 s</tspan></text><rect x="340" y="64" width="220" height="76.0" rx="10" fill="#f0f2f5" stroke="#1f77b4" stroke-width="2"/><text x="450.0" y="96.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="600">Device under test</text><text x="450.0" y="120.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle">weakly nonlinear: gain + harmonics</text><rect x="600" y="64" width="240" height="76.0" rx="10" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="2"/><text x="720.0" y="96.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>Recording </tspan><tspan font-style="italic">y</tspan><tspan>(</tspan><tspan font-style="italic">t</tspan><tspan>)</tspan></text><text x="720.0" y="120.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle">sweep + distortion products</text><line x1="300.0" y1="102.0" x2="327.0" y2="102.0" stroke="#1a1a1a" stroke-width="2.0" stroke-linecap="round"/><path d="M 336.0 102.0 L 327.0 105.6 L 327.0 98.4 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="560.0" y1="102.0" x2="587.0" y2="102.0" stroke="#1a1a1a" stroke-width="2.0" stroke-linecap="round"/><path d="M 596.0 102.0 L 587.0 105.6 L 587.0 98.4 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="520" y="180" width="320" height="76.0" rx="10" fill="#f0f2f5" stroke="#d62728" stroke-width="2"/><text x="680.0" y="212.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="600">Deconvolve with the inverse filter</text><text x="680.0" y="236.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle">time-reversed sweep with a +6 dB/octave tilt</text><line x1="720.0" y1="140.0" x2="720.0" y2="167.0" stroke="#1a1a1a" stroke-width="2.0" stroke-linecap="round"/><path d="M 720.0 176.0 L 716.4 167.0 L 723.6 167.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="660.0" y1="256.0" x2="650.4724901510764" y2="289.3462844712326" stroke="#1a1a1a" stroke-width="2.0" stroke-linecap="round"/><path d="M 648.0 298.0 L 647.0 288.4 L 653.9 290.3 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="80.0" y1="430.0" x2="830.0" y2="430.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><line x1="830.0" y1="430.0" x2="841.0" y2="430.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 850.0 430.0 L 841.0 433.6 L 841.0 426.4 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="845.0" y="452.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="end">time</text><line x1="640.0" y1="425.0" x2="640.0" 