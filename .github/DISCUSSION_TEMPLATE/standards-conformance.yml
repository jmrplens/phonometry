labels: ["conformance"]
body:
  - type: markdown
    attributes:
      value: |
        Every method in phonometry is implemented from the standard itself and validated
        against reference data. This category is for questions about that: which clause or
        edition is covered, why a value differs from another implementation, or a defect you
        believe is in the published standard.

        Useful before posting:

        - [Conformance report](https://github.com/jmrplens/phonometry/blob/main/docs/CONFORMANCE.md),
          generated by the library against the standards on every change.
        - [Errata registry](https://github.com/jmrplens/phonometry/blob/main/docs/ERRATA.md),
          where confirmed defects in published standards are recorded.

        **Please do not paste substantial verbatim text, tables or figures from standards.**
        They are copyrighted. Cite the clause or table number and, where you need to be
        specific, quote the shortest fragment that makes the point.

  - type: dropdown
    id: kind
    attributes:
      label: What kind of question is this?
      options:
        - Is this clause, table or edition implemented?
        - A result differs from another implementation or from a published example
        - I believe the published standard itself contains a defect
        - Clarification on how a clause was interpreted
    validations:
      required: true

  - type: input
    id: standard
    attributes:
      label: Standard, edition and year
      description: Give the full designation. The edition matters, values often change between them.
      placeholder: "IEC 61672-1:2013, ISO 532-1:2017, ISO 9613-2:2024"
    validations:
      required: true

  - type: input
    id: clause
    attributes:
      label: Clause, table, annex or equation
      placeholder: "Clause 5.4.11, Table 3, Annex B, Eq. (12)"
    validations:
      required: true

  - type: input
    id: api
    attributes:
      label: Function or module involved
      description: Leave empty if your question is whether it exists at all.
      placeholder: "phonometry.levels.equivalent_level"
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected value and where it comes from
      description: >
        Name the source of the reference value: a worked example in the standard, an
        informative annex, a published paper, another implementation, or your own
        measurement. Independent sources are the most useful.
    validations:
      required: false

  - type: textarea
    id: obtained
    attributes:
      label: Value obtained, with the code that produces it
      description: A runnable snippet lets the discrepancy be reproduced immediately.
      render: python
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: phonometry version
      placeholder: "3.3.0"
    validations:
      required: false
