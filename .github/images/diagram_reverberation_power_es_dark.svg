127.0" r="2.2" fill="#0d1117" stroke="none" stroke-width="1.5"/><circle cx="606.0" cy="145.00000000000003" r="6.5" fill="#e46a6a" stroke="none" stroke-width="1.5"/><circle cx="606.0" cy="145.00000000000003" r="2.2" fill="#0d1117" stroke="none" stroke-width="1.5"/><circle cx="534.0" cy="190.0" r="6.5" fill="#e46a6a" stroke="none" stroke-width="1.5"/><circle cx="534.0" cy="190.0" r="2.2" fill="#0d1117" stroke="none" stroke-width="1.5"/><circle cx="669.0" cy="208.0" r="15.0" fill="#5abf5a" stroke="none" stroke-width="1.5"/><circle cx="669.0" cy="208.0" r="6.0" fill="#0d1117" stroke="none" stroke-width="1.5"/><text x="693.0" y="202.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#5abf5a" text-anchor="start" font-weight="600">Fuente sonora de</text><text x="693.0" y="220.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#5abf5a" text-anchor="start" font-weight="600">referencia (ISO 6926)</text><line x1="556.5" y1="275.5" x2="669.0" y2="208.0" stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="5,4" stroke-linecap="round"/><text x="618.75" y="263.75" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle">≥ 1,5 m</text><line x1="50" y1="386" x2="850" y2="386" stroke="#9a9a9a" stroke-width="1.0" stroke-linecap="round"/><text x="58" y="412" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#4da3d8" text-anchor="start" font-weight="600">d_min = D₁ √(V / T₆₀) ,  D₁ = 0,08  (0,16 recomendado por debajo de 5 kHz)</text><text x="58" y="435" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#4da3d8" text-anchor="start" font-weight="600">V = 200 m³ · T₆₀ = 2,0 s  →  d_min = 0,8 m,  o 1,6 m con el D₁ recomendado</text><text x="58" y="458" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start">seis posiciones: &gt; 1,0 m de toda superficie de la sala · &gt; d_min de la fuente · separación ≥ λ/2 (1,7 m a 100 Hz)</text><text x="58" y="481" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start">recorrido continuo: ≥ d_min de la fuente · ≥ 1,0 m de cualquier superficie · ≥ 0,5 m de un difusor</text><text x="58" y="504" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start">· fuera de todo plano a menos de 10° de una superficie · longitud ≥ 3λ o 10,3 m, la menor</text><text x="58" y="527" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#5abf5a" text-anchor="start" font-weight="600">método de comparación: las mismas seis posiciones, y sin A, sin V, sin S, sin Waterhouse y sin C₁ en la Ec. 21</text><text x="58" y="550" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e46a6a" text-anchor="start" font-weight="600">promediado ≥ 30 s hasta 160 Hz, ≥ 10 s desde 200 Hz · ruido de fondo en las mismas posiciones, justo antes o después</text><text x="58" y="573" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9a9a9a" text-anchor="start">paredes duras, α &lt; 0,06 a menos de una longitud de onda de la fuente · T₆₀ según ISO 3382-2, solo los primeros 10 dB o 15 dB</text></svg>