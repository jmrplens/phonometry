# Warns before the Phonometry Cloudflare account runs out of its daily
# Workers requests.
#
# Workers Free gives an account 100,000 Worker requests a day, from 00:00 UTC.
# The phonometry.dev preview runs no script, so it spends none of them, and
# requests for static assets are free and unlimited; this job is there for
# the day a script is added (the visitor analytics), and for a mistake that
# adds one. Cloudflare sends no notice for this count on the Free plan, so
# the job reads it from the GraphQL Analytics API every 30 minutes and fails
# from 70 % of the day (a warning from 50 %), when yesterday reached 99 %, or
# when a script runs that nobody listed in CF_PHONOMETRY_EXPECTED_SCRIPTS.
# A failed scheduled run mails the person who last changed the cron line
# below, which is why the maintainer authors that change. GitHub pauses the
# schedules of a public repository after 60 days without activity.
#
# The proof that the mail arrives: Run workflow with threshold 0, which fails
# on any day.
name: Workers quota

on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:
    inputs:
      threshold:
        description: "Fraction of the daily quota that fails the run (0 fails on any day; empty for 0.7)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: workers-quota
  cancel-in-progress: true

jobs:
  quota:
    name: Workers requests today
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # Until the account id is set as a repository variable (with the token
    # beside it), there is nothing to read and the job is skipped. Once it is,
    # a missing or wrong token fails the run.
    if: ${{ vars.CF_PHONOMETRY_ACCOUNT_ID != '' }}
    outputs:
      level: ${{ steps.check.outputs.level }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: site/worker
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Read the count and judge it
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PHONOMETRY_ANALYTICS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_PHONOMETRY_ACCOUNT_ID }}
          EXPECTED: ${{ vars.CF_PHONOMETRY_EXPECTED_SCRIPTS }}
          THRESHOLD: ${{ inputs.threshold }}
        run: |
          set -euo pipefail
          args=()
          for name in $EXPECTED; do args+=(--expect "$name"); done
          if [ -n "${THRESHOLD:-}" ]; then args+=(--threshold "$THRESHOLD"); fi
          node site/worker/scripts/check-quota.mjs "${args[@]}"
