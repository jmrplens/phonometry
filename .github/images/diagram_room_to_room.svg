1a1a1a" text-anchor="start" xml:space="preserve"><tspan>receiving side — </tspan><tspan font-style="italic">S</tspan><tspan dy="3.1" font-size="9.8">2</tspan><tspan dy="-3.1" font-style="italic">α</tspan><tspan dy="3.1" font-size="9.8">2</tspan><tspan dy="-3.1"> = 5.5 m² at 125 Hz rising to 39.2 m² at 4 kHz; </tspan><tspan font-style="italic">L</tspan><tspan dy="3.1" font-size="9.8" font-style="italic">p</tspan><tspan font-size="9.8">2</tspan><tspan dy="-3.1"> = 72.4 dB against 60 dB for NC 45</tspan></text><text x="50" y="558" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="start" xml:space="preserve"><tspan>NR = TL − 10 log</tspan><tspan dy="3.7" font-size="11.9">10</tspan><tspan dy="-3.7">[</tspan><tspan font-style="italic">S</tspan><tspan dy="3.7" font-size="11.9" font-style="italic">w</tspan><tspan dy="-3.7"> / (</tspan><tspan font-style="italic">S</tspan><tspan dy="3.7" font-size="11.9">2</tspan><tspan dy="-3.7" font-style="italic">α</tspan><tspan dy="3.7" font-size="11.9">2</tspan><tspan dy="-3.7"> + </tspan><tspan font-style="italic">τ</tspan><tspan> </tspan><tspan font-style="italic">S</tspan><tspan dy="3.7" font-size="11.9" font-style="italic">w</tspan><tspan dy="-3.7">)]</tspan></text><text x="50" y="584" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f77b4" text-anchor="start" xml:space="preserve"><tspan font-style="italic">S</tspan><tspan dy="3.3" font-size="10.5">2</tspan><tspan dy="-3.3" font-style="italic">α</tspan><tspan dy="3.3" font-size="10.5">2</tspan><tspan dy="-3.3"> passes the 15 m² of the wall between 250 and 500 Hz: below it the wall delivers less than its TL</tspan></text><text x="50" y="608" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#666666" text-anchor="start">both levels are reverberant-field spatial averages, and the balance says nothing below 163 Hz (Schroeder, 75 m³)</text></g></svg>