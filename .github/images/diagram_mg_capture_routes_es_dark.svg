ca, Arial, sans-serif" font-size="15" fill="#9a9a9a" text-anchor="start">capítulo 7.2.5</text><text x="520" y="588.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="start">ecualiza antes al campo libre o difuso</text><text x="450" y="646" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">presentation: monaural es un solo oído, diotic la misma señal en ambos, binaural dos señales independientes</text><text x="450" y="666" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">un sonido diótico suena unas 1,5 veces más fuerte que el mismo sonido en un solo oído (capítulo 8.1)</text></svg>