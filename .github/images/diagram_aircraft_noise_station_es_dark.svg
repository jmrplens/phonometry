ica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="start">within ±1.5 dB, and corrected for</text><line x1="156.0" y1="500.0" x2="156.0" y2="531.0" stroke="#9a9a9a" stroke-width="1.2" stroke-linecap="round"/><path d="M 156.0 540.0 L 152.4 531.0 L 159.6 531.0 Z" fill="#9a9a9a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="156.0" y1="508.0" x2="156.0" y2="477.0" stroke="#9a9a9a" stroke-width="1.2" stroke-linecap="round"/><path d="M 156.0 468.0 L 159.6 477.0 L 152.4 477.0 Z" fill="#9a9a9a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="147.0" y="510.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="end">1,2 m</text><line x1="184.0" y1="468.0" x2="156.0" y2="468.0" stroke="#9a9a9a" stroke-width="0.9" stroke-dasharray="3,3" stroke-linecap="round"/><text x="210.0" y="564.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">sensing element 1.2 m above local ground</text><text x="470.0" y="386.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="start" font-weight="600">Plan: the capsule axis</text><line x1="482.0" y1="452.0" x2="862.0" y2="452.0" stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="7,5" stroke-linecap="round"/><line x1="836.0" y1="452.0" x2="857.0" y2="452.0" stroke="#9a9a9a" stroke-width="1.5" stroke-linecap="round"/><path d="M 866.0 452.0 L 857.0 455.6 L 857.0 448.4 Z" fill="#9a9a9a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="858.0" y="440.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9a9a9a" text-anchor="end">trayectoria</text><line x1="672.0" y1="424.0" x2="672.0" y2="506.0" stroke="#4da3d8" stroke-width="2.6" stroke-linecap="round"/><circle cx="672.0" cy="486.0" r="8.0" fill="#e6e6e6" stroke="none" stroke-width="1.5"/><text x="672.0" y="530.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9a9a9a" text-anchor="middle">the capsule axis is perpendicular to the plane of the</text><text x="672.0" y="548.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9a9a9a" text-anchor="middle">flight path, so every ray arrives at 90°, grazing</text><rect x="478.0" y="566.0" width="388.0" height="40.0" rx="4.0" fill="#1c2128" stroke="#e6e6e6" stroke-width="1.6"/><text x="672.0" y="582.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e6e6e6" text-anchor="middle">24 one-third-octave bands, 50 Hz to 10 kHz</text><text x="672.0" y="600.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9a9a9a" text-anchor="middle">una muestra cada 500 ms ± 5 ms</text><text x="70.0" y="646.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start">Ventana de ensayo (aviones): sin precipitación; de −10 a 35 °C y de 20 a 95 % HR en el recorrido por encima de 10 m;</text><text x="70.0" y="670.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start">atenuación a 8 kHz ≤ 12 dB/100 m; viento ≤ 6,2 m/s medio y 7,7 m/s máximo, viento cruzado ≤ 3,6 y 5,1 m/s</text><text x="70.0" y="694.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9a9a9a" text-anchor="start">Helicópteros: viento medio ≤ 5,1 m/s y viento cruzado ≤ 2,6 m/s, con los límites de temperatura y humedad solo a 10 m</text><text x="70.0" y="718.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9a9a9a" text-anchor="start">Al menos seis pasadas válidas por punto de medición, con un límite de confianza del 90 % que no exceda ±1,5 EPNdB</text></svg>