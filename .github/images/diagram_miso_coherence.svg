381" y2="159.92654147081666" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 588.0 154.0 L 583.6 162.6 L 578.9 157.2 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="600" y="74" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle" xml:space="preserve"><tspan>noise </tspan><tspan font-style="italic">n</tspan><tspan>(</tspan><tspan font-style="italic">t</tspan><tspan>)</tspan></text><line x1="600" y1="82" x2="600.0" y2="115.0" stroke="#666666" stroke-width="1.4" stroke-linecap="round"/><path d="M 600.0 124.0 L 596.4 115.0 L 603.6 115.0 Z" fill="#666666" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="660" y="116" width="190" height="56" rx="10" fill="#f0f2f5" stroke="#d62728" stroke-width="2"/><text x="755.0" y="140.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>Output </tspan><tspan font-style="italic">y</tspan><tspan>(</tspan><tspan font-style="italic">t</tspan><tspan>)</tspan></text><text x="755.0" y="160.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">G</tspan><tspan dy="2.6" font-size="8.4" font-style="italic">yy</tspan><tspan dy="-2.6">(</tspan><tspan font-style="italic">f</tspan><tspan>)</tspan></text><line x1="616" y1="144" x2="647.0" y2="144.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 656.0 144.0 L 647.0 147.6 L 647.0 140.4 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="755" y1="172" x2="755.0" y2="227.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 755.0 236.0 L 751.4 227.0 L 758.6 227.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="90" y="240" width="720" height="64" rx="10" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="2"/><text x="450" y="265" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>Welch cross-spectral matrix — </tspan><tspan font-style="italic">G</tspan><tspan dy="3.5" font-size="11.2" font-style="italic">xx</tspan><tspan dy="-3.5"> (2×2) and </tspan><tspan font-style="italic">G</tspan><tspan dy="3.5" font-size="11.2" font-style="italic">xy</tspan><tspan dy="-3.5">, nperseg = 2048</tspan></text><text x="450" y="287" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle" xml:space="preserve"><tspan>conditioning: Schur steps </tspan><tspan font-style="italic">G</tspan><tspan dy="2.9" font-size="9.1" font-style="italic">ij</tspan><tspan font-size="9.1">·</tspan><tspan font-size="9.1" font-style="italic">r</tspan><tspan font-size="9.1">!</tspan><tspan dy="-2.9"> (Eq. 7.94), inputs ordered by descending ordinary coherence</tspan></text><line x1="270" y1="304" x2="270.0" y2="331.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 270.0 340.0 L 266.4 331.0 L 273.6 331.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="630" y1="304" x2="630.0" y2="331.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 630.0 340.0 L 626.4 331.0 L 633.6 331.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="70" y="344" width="370" height="88" rx="10" fill="#f0f2f5" stroke="#1f77b4" stroke-width="2"/><text x="255" y="370" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="600">Multiple and partial coherence</text><text x="255" y="392" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">input 2 in the 100-300 Hz band: ordinary 0.32 → partial 0.00</text><text x="255" y="412" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle" xml:space="preserve"><tspan>multiple </tspan><tspan font-style="italic">γ</tspan><tspan dy="-4.6" font-size="8.4">2</tspan><tspan dy="7.2" font-size="8.4" font-style="italic">y</tspan><tspan font-size="8.4">:</tspan><tspan font-size="8.4" font-style="italic">x</tspan><tspan dy="-2.6"> = 1 − </tspan><tspan font-style="italic">G</tspan><tspan dy="2.6" font-size="8.4" font-style="italic">nn</tspan><tspan dy="-2.6">/</tspan><tspan font-style="italic">G</tspan><tspan dy="2.6" font-size="8.4" font-style="italic">yy</tspan><tspan dy="-2.6"> ≈ 1.00 (100-300 Hz)</tspan></text><rect x="460" y="344" width="370" height="88" rx="10" fill="#f0f2f5" stroke="#2ca02c" stroke-width="2"/><text x="645" y="370" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="600">Contribution of each source</text><text x="645" y="392" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">G</tspan><tspan dy="2.6" font-size="8.4" font-style="italic">vi</tspan><tspan dy="-2.6"> = </tspan><tspan font-style="italic">γ</tspan><tspan dy="-4.6" font-size="8.4">2</tspan><tspan dy="7.2" font-size="8.4" font-style="italic">iy</tspan><tspan font-size="8.4">·(</tspan><tspan font-size="8.4" font-style="italic">i</tspan><tspan font-size="8.4">−1)!</tspan><tspan dy="-2.6">·</tspan><tspan font-style="italic">G</tspan><tspan dy="2.6" font-size="8.4" font-style="italic">yy</tspan><tspan dy="-2.6"> per input</tspan></text><text x="645" y="412" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle" xml:space="preserve"><tspan>Σ</tspan><tspan font-style="italic">G</tspan><tspan dy="2.6" font-size="8.4" font-style="italic">vi</tspan><tspan dy="-2.6"> + </tspan><tspan font-style="italic">G</tspan><tspan dy="2.6" font-size="8.4" font-style="italic">nn</tspan><tspan dy="-2.6"> = </tspan><tspan font-style="italic">G</tspan><tspan dy="2.6" font-size="8.4" font-style="italic">yy</tspan><tspan dy="-2.6">, band by band</tspan></text><text x="450" y="482" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" xml:space="preserve"><tspan>each conditioning step spends one average: the </tspan><tspan font-style="italic">i</tspan><tspan>-th ordered input carries </tspan><tspan font-style="italic">n</tspan><tspan dy="3.1" font-size="9.8" font-style="italic">d</tspan><tspan dy="-3.1"> − (</tspan><tspan font-style="italic">i</tspan><tspan> − 1); here </tspan><tspan font-style="italic">n</tspan><tspan dy="3.1" font-size="9.8" font-style="italic">d</tspan><tspan dy="-3.1"> = 242</tspan></text><text x="450" y="506" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle">average generously before reading a small partial coherence as zero</text></svg>