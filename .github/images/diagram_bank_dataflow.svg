<svg xmlns="http://www.w3.org/2000/svg" width="900" height="680" viewBox="0 0 900 680"><rect width="900" height="680" fill="#ffffff"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1a1a1a" text-anchor="middle">Inside a band: the decimation decision and the biquad cascade</text><rect x="290" y="54" width="320" height="64" rx="12" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="2"/><text x="450" y="84" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#1a1a1a" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>Input signal  </tspan><tspan font-style="italic">x</tspan><tspan>(</tspan><tspan font-style="italic">t</tspan><tspan>)</tspan></text><text x="450" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#666666" text-anchor="middle" xml:space="preserve"><tspan>sample rate </tspan><tspan font-style="italic">f</tspan><tspan dy="3.5" font-size="11.2" font-style="italic">s</tspan></text><line x1="450" y1="118" x2="450.0" y2="123.0" stroke="#1a1a1a" stroke-width="2.0" stroke-linecap="round"/><path d="M 450.0 132.0 L 446.4 123.0 L 453.6 123.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><path d="M 450 132 L 610 184 L 450 236 L 290 184 Z" fill="#f0f2f5" stroke="#1f77b4" stroke-width="2" stroke-linejoin="round"/><text x="450" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="600">Room to decimate?</text><text x="450" y="204" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">f</tspan><tspan dy="3.1" font-size="9.8" font-style="italic">s</tspan><tspan dy="-3.1"> / 2 ≥ 1.25 · </tspan><tspan font-style="italic">f</tspan><tspan dy="3.1" font-size="9.8">upper</tspan></text><line x1="290" y1="184" x2="190" y2="184" stroke="#1a1a1a" stroke-width="2.0" stroke-linecap="round"/><line x1="190" y1="184" x2="190.0" y2="235.0" stroke="#1a1a1a" stroke-width="2.0" stroke-linecap="round"/><path d="M 190.0 244.0 L 186.4 235.0 L 193.6 235.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="240" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#2ca02c" text-anchor="middle" font-weight="600">yes</text><line x1="610" y1="184" x2="710" y2="184" stroke="#1a1a1a" stroke-width="2.0" stroke-linecap="round"/><line x1="710" y1="184" x2="710.0" y2="351.0" stroke="#1a1a1a" stroke-width="2.0" stroke-linecap="round"/><path d="M 710.0 360.0 L 706.4 351.0 L 713.6 351.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="660" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#d62728" text-anchor="middle" font-weight="600">no</text><rect x="50" y="244" width="280" height="80" rx="12" fill="#f0f2f5" stroke="#1f77b4" stroke-width="2"/><text x="190" y="274" font-family="Consolas, Menlo, monospace" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="600">resample_poly(1, M)</text><text x="190" y="298" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">M</tspan><tspan> = floor[(</tspan><tspan font-style="italic">f</tspan><tspan dy="2.9" font-size="9.1" font-style="italic">s</tspan><tspan dy="-2.9"> / 2) / (1.25 · </tspan><tspan font-style="italic">f</tspan><tspan dy="2.9" font-size="9.1">upper</tspan><tspan dy="-2.9">)]</tspan></text><text x="190" y="318" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle" xml:space="preserve"><tspan>poles stay clear of </tspan><tspan font-style="italic">z</tspan><tspan> = 1</tspan></text><line x1="190" y1="324" x2="190.0" y2="351.0" stroke="#1a1a1a" stroke-width="2.0" stroke-linecap="round"/><path d="M 190.0 360.0 L 186.4 351.0 L 193.6 351.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="50.0" y="360" width="280" height="84" rx="12" fill="#f0f2f5" stroke="#1f77b4" stroke-width="2"/><text x="190.0" y="390" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>SOS band filter at </tspan><tspan font-style="italic">f</tspan><tspan dy="4.0" font-size="12.6" font-style="italic">s</tspan><tspan dy="-4.0"> / </tspan><tspan font-style="italic">M</tspan></text><text x="190.0" y="414" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#666666" text-anchor="middle">cascaded biquads</text><text x="190.0" y="434" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">designed on the IEC 61260-1 band edges</text><rect x="570.0" y="360" width="280" height="84" rx="12" fill="#f0f2f5" stroke="#1f77b4" stroke-width="2"/><text x="710.0" y="390" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>SOS band filter at </tspan><tspan font-style="italic">f</tspan><tspan dy="4.0" font-size="12.6" font-style="italic">s</tspan></text><text x="710.0" y="414" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#666666" text-anchor="middle">cascaded biquads</text><text x="710.0" y="434" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">designed on the IEC 61260-1 band edges</text><rect x="340" y="260" width="220" height="96" rx="12" fill="none" stroke="#d62728" stroke-width="1.8" stroke-dasharray="7,5"/><text x="450" y="288" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#d62728" text-anchor="middle" font-weight="600">Every band filter</text><text x="450" y="308" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#d62728" text-anchor="middle" font-weight="600">is a biquad cascade</text><text x="450" y="332" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle">not one high-order</text><text x="450" y="350" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle">(b, a) pair</text><line x1="190" y1="444" x2="321.5631725519121" y2="492.86632123356736" stroke="#1a1a1a" stroke-width="2.0" stroke-linecap="round"/><path d="M 330.0 496.0 L 320.3 496.2 L 322.8 489.5 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="710" y1="444" x2="578.4368274480879" y2="492.86632123356736" stroke="#1a1a1a" stroke-width="2.0" stroke-linecap="round"/><path d="M 570.0 496.0 L 577.2 489.5 L 579.7 496.2 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="270" y="500" width="360" height="76" rx="12" fill="none" stroke="#2ca02c" stroke-width="2.4"/><text x="450" y="530" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#1a1a1a" text-anchor="middle" font-weight="600">Band level</text><text x="450" y="554" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#2ca02c" text-anchor="middle">RMS or peak, in dB re 20 µPa</text><rect x="50" y="604" width="800" height="62" rx="12" fill="none" stroke="#d62728" stroke-width="1.8" stroke-dasharray="7,5"/><text x="450" y="632" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#d62728" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>sigbands=True also returns the band signal at </tspan><tspan font-style="italic">f</tspan><tspan dy="3.7" font-size="11.9" font-style="italic">s</tspan></text><text x="450" y="654" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle">the decimated branch is interpolated back with resample_poly(M, 1)</text></svg>