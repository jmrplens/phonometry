# Deploys the documentation docs.yml built to the phonometry.dev preview.
#
# The preview is one Cloudflare Worker with Static Assets (site/worker/README.md):
# pages and files run no script, so the daily request quota of Workers Free
# cannot stop them; only the visitor beacon and the files agents read run the
# Worker, which logs them, and the quota guard switches those off at 95 %.
# docs.jmrp.io stays the canonical site and this workflow never touches it.
#
# By hand for now: Actions > Site preview > Run workflow, with the id of a
# docs.yml run on main whose pages artifact has not expired. A later change
# makes docs.yml dispatch it after each deploy, as release.yml dispatches the
# GitLab mirror (no workflow_run: zizmor flags it).
name: Site preview

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Id of a successful docs.yml run on main whose pages artifact is deployed (checked before the download)"
        required: true
        type: string
      attempt:
        description: "The attempt of that run that built the artifact (github-pages-<attempt>)"
        required: false
        default: "1"
        type: string
      apply_rules:
        description: "Put the zone rules (redirects and the Markdown 302) as generated, instead of only checking them"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # One deploy at a time, and a deploy is never cancelled halfway.
  group: site-preview
  cancel-in-progress: false

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  WRANGLER_SEND_METRICS: "false"

jobs:
  deploy:
    name: Deploy the preview to phonometry.dev
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # The environment holds the two Cloudflare tokens and admits main only.
    environment:
      name: phonometry-preview
      url: https://phonometry.dev/phonometry/
    permissions:
      contents: read
      actions: read # the pages artifact of the docs.yml run
    steps:
      - name: Check the inputs
        env:
          RUN_ID: ${{ inputs.run_id }}
          ATTEMPT: ${{ inputs.attempt }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::run_id must be a number"; exit 1; }
          [[ "$ATTEMPT" =~ ^[0-9]+$ ]] || { echo "::error::attempt must be a number"; exit 1; }
      - name: Check the run is a docs.yml build of main in this repository
        # The environment admits this workflow from main only, which limits
        # who can read the tokens, not where the deployed pages come from:
        # docs.yml can be dispatched on any branch and uploads its pages
        # artifact whenever the event is not a pull request. So the run is
        # read back, and anything but a successful push or dispatch of
        # docs.yml on main, here, whose commit main contains, stops the deploy.
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")
          path=$(jq -r .path <<<"$run")
          branch=$(jq -r .head_branch <<<"$run")
          event=$(jq -r .event <<<"$run")
          repo=$(jq -r .head_repository.full_name <<<"$run")
          conclusion=$(jq -r .conclusion <<<"$run")
          sha=$(jq -r .head_sha <<<"$run")
          echo "run $RUN_ID: $path on $branch ($event) from $repo at $sha, $conclusion"
          fail=0
          [ "$path" = ".github/workflows/docs.yml" ] || { echo "::error::run $RUN_ID is $path, not docs.yml"; fail=1; }
          [ "$branch" = "main" ] || { echo "::error::run $RUN_ID built $branch, not main"; fail=1; }
          [[ "$event" = "push" || "$event" = "workflow_dispatch" ]] || { echo "::error::run $RUN_ID was a $event"; fail=1; }
          [ "$repo" = "$GITHUB_REPOSITORY" ] || { echo "::error::run $RUN_ID came from $repo"; fail=1; }
          [ "$conclusion" = "success" ] || { echo "::error::run $RUN_ID concluded $conclusion"; fail=1; }
          [ "$fail" = 0 ] || exit 1
          # A commit main contains compares as identical to it or behind it.
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$sha" --jq .status)
          [[ "$status" = "identical" || "$status" = "behind" ]] || { echo "::error::$sha is not on main ($status)"; exit 1; }
          echo "Deploying the pages docs.yml built from $sha" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The staging step reads the redirect map and the site's address from
          # site/src/data, site/src/lib and site/scripts; the rest of the
          # repository is not needed. site/worker/test/workflow.test.mjs fails
          # when a script run here loads a module outside these directories.
          sparse-checkout: |
            site/worker
            site/src/data
            site/src/lib
            site/scripts
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Enable the pnpm the Worker project pins, via corepack
        run: |
          corepack enable
          pnpm --version
        working-directory: site/worker
      - name: Install wrangler from the Worker project's lockfile
        run: pnpm install --frozen-lockfile
        working-directory: site/worker
      - name: Fetch the pages artifact of the docs.yml run
        uses: actions/download-artifact@v8
        with:
          name: github-pages-${{ inputs.attempt }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pages-artifact
      - name: Unpack it
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pages"
          tar -xf "$RUNNER_TEMP/pages-artifact/artifact.tar" -C "$RUNNER_TEMP/pages"
          echo "$(find "$RUNNER_TEMP/pages" -type f | wc -l) files in the build"
      - name: Stage the build with the beacon (every check runs before anything is written)
        run: node site/worker/stage.mjs --from "$RUNNER_TEMP/pages" --out site/worker/stage --beacon
      - name: Read whether the quota guard has switched the code paths off
        # At 95 % of the day's Workers requests the guard blocks the beacon
        # and rolls the Worker to its assets-only half until 00:00 UTC. A
        # deploy then has to keep them off, or the agent files would spend
        # what the guard is keeping (site/worker/README.md, "Quota").
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PHONOMETRY_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/guard-state.mjs | tee -a "$GITHUB_OUTPUT"
        working-directory: site/worker
      - name: Upload the assets-only version the quota guard rolls to
        # Same stage, no code: tagged as the other half of this deploy's pair,
        # so the guard (site/worker/guard) can switch between them. The pair
        # is named after this run and its attempt, not after the docs.yml run
        # it deploys: a re-run of a deploy that failed halfway uploads a new
        # pair instead of a second version under a tag already taken.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PHONOMETRY_DEPLOY_TOKEN }}
          PAIR: ${{ github.run_id }}-${{ github.run_attempt }}
        run: pnpm exec wrangler versions upload --config wrangler.assets-only.jsonc --tag "assets-$PAIR" --message "assets-only half of $PAIR"
        working-directory: site/worker
      - name: Deploy the Worker
        # wrangler.jsonc names the account, so the token needs no account
        # listing and no variable can point the deploy elsewhere. While the
        # guard holds the code paths off, the full half is only uploaded and
        # the assets-only half goes live under the same mark the off state
        # had, so the guard (or quota-switch.mjs --mode on, for an off state
        # set by hand) switches this deploy back on with the rest.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PHONOMETRY_DEPLOY_TOKEN }}
          PAIR: ${{ github.run_id }}-${{ github.run_attempt }}
          TRIPPED: ${{ steps.guard.outputs.tripped }}
          MARK: ${{ steps.guard.outputs.mark }}
        run: |
          set -euo pipefail
          if [ "$TRIPPED" = true ]; then
            pnpm exec wrangler versions upload --config wrangler.jsonc --tag "full-$PAIR" --message "full half of $PAIR"
            pnpm exec wrangler versions deploy --config wrangler.jsonc --version-tag "assets-$PAIR@100" --message "$MARK: off, deploy of $PAIR while the code paths are off" --yes
            echo "::notice::the quota guard holds the code paths off: the assets-only half of $PAIR is live, the full half waits for the switch back" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            # After a switch back the guard may still have its rule to turn
            # off; carrying its mark keeps that rule the guard's to clear.
            message="full half of $PAIR"
            if [ -n "$MARK" ]; then message="$MARK: on, $message"; fi
            pnpm exec wrangler deploy --config wrangler.jsonc --tag "full-$PAIR" --message "$message"
          fi
        working-directory: site/worker
      - name: Check what the assets answer
        env:
          TRIPPED: ${{ steps.guard.outputs.tripped }}
        run: |
          set -euo pipefail
          base=https://phonometry.dev/phonometry
          fail=0
          expect() { # <what> <url> <status> [header-regex]
            local got
            got=$(curl -sS -o /dev/null -D - --max-time 30 "$2")
            if ! grep -qE "^HTTP/[0-9.]+ $3" <<<"$got"; then echo "::error::$1: $2 did not answer $3"; fail=1; return; fi
            if [ -n "${4:-}" ] && ! grep -qiE "$4" <<<"$got"; then echo "::error::$1: $2 lacks $4"; fail=1; return; fi
            echo "ok   $1"
          }
          expect "a page, kept out of search indexes" "$base/signals/" 200 '^x-robots-tag: noindex'
          expect "a page names its Markdown copy" "$base/signals/" 200 '^link: </phonometry/signals/index.md>'
          expect "the copy names its page as canonical" "$base/signals/index.md" 200 '^link: <https://docs.jmrp.io/phonometry/signals/>; rel="canonical"'
          expect "a retired address answers 301" "$base/about/" 301 '^location: /phonometry/start/about/'
          expect "an unknown page answers 404" "$base/no-such-page/" 404
          expect "a copy says it is UTF-8" "$base/signals/index.md" 200 '^content-type: text/markdown; charset=utf-8'
          expect "llms.txt says it is UTF-8" "$base/llms.txt" 200 '^content-type: text/plain; charset=utf-8'
          expect "robots.txt at the root says it is UTF-8" "https://phonometry.dev/robots.txt" 200 '^content-type: text/plain; charset=utf-8'
          # While the guard holds the code paths off, its WAF rule answers
          # every beacon with 403 before any Worker runs.
          want=204
          if [ "$TRIPPED" = true ]; then want=403; fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -X POST -H 'Origin: https://phonometry.dev' -H 'Content-Type: text/plain' --data '{"p":"/phonometry/signals/","wd":1}' https://phonometry.dev/_v)
          if [ "$code" != "$want" ]; then
            echo "::error::the beacon answered $code, not $want (quota guard tripped: $TRIPPED)"
            fail=1
          elif [ "$TRIPPED" = true ]; then
            echo "ok   the beacon answers 403: the quota guard has switched it off until 00:00 UTC"
          else
            echo "ok   the beacon answers 204"
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 https://phonometry.dev/_v)
          if [ "$code" != 403 ]; then echo "::error::a GET of the beacon answered $code, not the WAF's 403"; fail=1; else echo "ok   the WAF refuses a GET of the beacon"; fi
          n=$(curl -sS -o /dev/null -D - --max-time 30 "$base/signals/index.md" | grep -ci '^content-type:')
          if [ "$n" != 1 ]; then echo "::error::the copy carries $n Content-Type headers"; fail=1; else echo "ok   one Content-Type"; fi
          exit "$fail"
      - name: Check the zone rules
        if: ${{ !inputs.apply_rules }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PHONOMETRY_RULES_TOKEN }}
        run: node site/worker/scripts/apply-rules.mjs --check
      - name: Put the zone rules, keeping what was there
        if: ${{ inputs.apply_rules }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PHONOMETRY_RULES_TOKEN }}
        run: node site/worker/scripts/apply-rules.mjs --apply --backup-dir "$RUNNER_TEMP/rules-backup"
      - name: Keep the rules that were replaced
        if: ${{ inputs.apply_rules && always() }}
        uses: actions/upload-artifact@v7
        with:
          name: zone-rules-before-${{ github.run_id }}
          path: ${{ runner.temp }}/rules-backup/
          if-no-files-found: ignore
          retention-days: 90
      - name: Check what the zone rules answer
        run: |
          set -euo pipefail
          fail=0
          check() { # <what> <status> <location-regex> <curl args...>
            local what=$1 status=$2 location=$3 got
            shift 3
            got=$(curl -sS -o /dev/null -D - --max-time 30 "$@")
            if ! grep -qE "^HTTP/[0-9.]+ $status" <<<"$got" || ! grep -qiE "^location: $location" <<<"$got"; then
              echo "::error::$what: got $(head -1 <<<"$got")"
              fail=1
            else
              echo "ok   $what"
            fi
          }
          check "www goes to the apex" 301 'https://phonometry.dev/x\?y=1' "https://www.phonometry.dev/x?y=1"
          check "the root goes to the base path" 302 'https://phonometry.dev/phonometry/' "https://phonometry.dev/"
          check "a Markdown request gets the copy" 302 '/phonometry/signals/index.md' -H 'Accept: text/markdown' "https://phonometry.dev/phonometry/signals/"
          check "a clip goes where ranges answer 206" 302 'https://docs.jmrp.io/phonometry/media/' "https://phonometry.dev/phonometry/media/$(ls site/worker/stage/phonometry/media | grep -m1 '\.webm$')"
          # _headers matches a path whatever the status; these three come
          # from the response rules, which can read it.
          absent() { # <what> <header-regex> <curl args...>
            local what=$1 header=$2 got
            shift 2
            got=$(curl -sS -o /dev/null -D - --max-time 30 "$@")
            if grep -qiE "$header" <<<"$got"; then echo "::error::$what: $(grep -iE "$header" <<<"$got" | head -1)"; fail=1; else echo "ok   $what"; fi
          }
          absent "an unknown page names no copy" '^link:' "https://phonometry.dev/phonometry/no-such-page/"
          absent "an unknown copy names no canonical" '^link:' "https://phonometry.dev/phonometry/no-such-page/index.md"
          absent "a missing build file is not cached for a year" '^cache-control:.*immutable' "https://phonometry.dev/phonometry/_astro/no-such-file.ABCDEF12.css"
          exit "$fail"
      - name: Install the browser the clip check drives
        run: pnpm exec puppeteer browsers install chrome
        working-directory: site/worker
      - name: Check a clip plays in a browser
        # curl sees a clip as a 302 and a 206. A browser also holds the
        # address it is redirected to against the page's
        # Content-Security-Policy, which curl never reads; this plays two.
        run: node scripts/check-clip.mjs
        working-directory: site/worker
