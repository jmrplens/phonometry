[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phonometry"
dynamic = ["version"]
authors = [
  { name="José Manuel Requena Plens", email="mail@jmrp.io" },
]
# The one line PyPI shows under the name and in a search result. It froze at
# 3.x on the three things the library started as, and named none of the
# eleven domains it grew. A description is frozen per release, so it is
# rewritten here rather than left to the next one. The counts stay out: the
# long description carries them and is regenerated from README.md, which the
# conformance-claims checker keeps honest.
description = "Acoustic measurement, analysis and prediction for Python: levels and metrology, psychoacoustics, rooms and buildings, materials, vibration, environmental, aircraft and underwater acoustics, each implemented from its governing standard."
# The PyPI long description is generated from README.md (which uses
# theme-aware <picture> elements that PyPI's renderer strips) by
# scripts/generate_pypi_readme.py; `make pypi-readme` refreshes it and the
# packaging tests fail on drift.
readme = "README_PYPI.md"
requires-python = ">=3.12"
# PEP 639, which setuptools 84 wants: the expression and the file, not the
# classifier. The classifier is deprecated and raised four
# SetuptoolsDeprecationWarning on every build.
license = "MIT"
license-files = ["LICENSE"]
# Search terms for PyPI: the domains the library actually covers, plus the
# designations of the standards its metrics are implemented from, so a search
# for a standard number finds the package.
keywords = [
    "acoustics",
    "sound level meter",
    "sound level",
    "octave band",
    "fractional octave band",
    "octave filter bank",
    "frequency weighting",
    "signal processing",
    "psychoacoustics",
    "loudness",
    "sharpness",
    "roughness",
    "room acoustics",
    "reverberation time",
    "sound absorption",
    "sound insulation",
    "building acoustics",
    "sound power",
    "vibration",
    "human vibration exposure",
    "environmental noise",
    "aircraft noise",
    "underwater acoustics",
    "electroacoustics",
    "loudspeaker measurement",
    "broadcast loudness",
    "noise control",
    "acoustic metrology",
    "standards conformance",
    "ANSI S1.11",
    "IEC 61260-1",
    "IEC 61672-1",
    "IEC 60942",
    "IEC 60268-3",
    "ISO 226",
    "ISO 532-1",
    "ISO 354",
    "ISO 3382-1",
    "ISO 717-1",
    "ISO 16283-1",
    "EN 12354",
    "ISO 1996-1",
    "ISO 9613-2",
    "ISO 2631-1",
    "ISO 7196",
    "ECMA-418-1",
    "EBU R 128",
    "ITU-R BS.1770",
    "ICAO Annex 16",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
# The floors are measured, not guessed: each is the oldest release the
# library's suite passes with, with every other floor installed beside it, on
# each Python the package supports, and a CI job (minimum-versions in
# python-app.yml) installs exactly these on each of those Pythons and runs the
# suite, so a floor cannot rot into a promise nobody checks. A floor rises
# only with a failure measured at it; the pins the repository develops on live
# in requirements*.txt and stay at the latest releases.
#
# Where the oldest release has no wheel for a newer Python, that Python has a
# floor of its own, the oldest release with a wheel for it, written behind a
# python_version marker. Held at the floors of 3.12, a resolver on 3.13 or
# 3.14 builds NumPy and SciPy from their sources, which fails without a
# compiler, and gets no numba or torch at all: the sources of numba 0.60.0
# refuse any Python above 3.12, and torch publishes none. The markers give each
# distribution one floor on every Python from 3.12 up, the last of them open
# above, and scripts/minimum_requirements.py refuses a gap or an overlap. The
# first wheel for each, on 3.13 and on 3.14:
#   numpy  2.1.0 and 2.3.2      scipy  1.14.1 and 1.16.1
#   numba  0.61.0 and 0.63.0    torch  2.5.0 and 2.9.0
# torch's are those of Linux on x86-64, the platform of the CI job; its first
# 3.13 wheel for macOS on ARM, Windows on x86-64 and Linux on ARM is 2.6.0,
# which a resolver there takes instead, since 2.5.0 has nothing to build from.
#
# What each floor rests on, on Python 3.12:
#   numpy 2.0.2   2.0.0 and 2.0.1 return a multiple coherence that differs in
#                 the last bit between a Signal block and the same records
#                 passed one by one, in about half the runs
#   scipy 1.14.0  1.13 cannot read an RF64 WAV
#   numba 0.60.0  the first release that installs beside numpy 2
#   matplotlib 3.10.7  3.10.0 and 3.10.1 drop `lw` in hist(), and 3.10.3 to
#                 3.10.6 warn through pyparsing 3.3 when they parse mathtext
#   reportlab 4.3.0    4.0.4 to 4.2.5 warn when they are imported, through
#                 importlib's load_module and ast.NameConstant, both
#                 deprecated, so a .report() under -W error failed; 4.0.0
#                 requires pycairo, a C build
#   svglib 0.9.1  0.9.0 raises a SyntaxWarning (invalid escape sequence '\d'
#                 in svglib/utils.py) when it is compiled, which Python shows
#                 under its default filters on the first import after an
#                 install that did not precompile it, as uv installs: a
#                 warning a plain user sees, as matplotlib's above was. 1.4.0
#                 is excluded: it calls pdb.set_trace() where it styles each
#                 shape it converts, so a .report() stops at a debugger
#                 prompt, or fails without a terminal; 1.4.1 removed it
#   soundfile 0.12.0   the first release with a Linux wheel that carries its
#                 own libsndfile, for x86-64; 0.11 needs one installed on the
#                 system there. Where no wheel carries it, musl at every
#                 release, Linux on ARM before 0.13.0 and Windows on ARM
#                 before 0.14.0, pip takes the pure wheel, which loads the
#                 system's
#   torch 2.3.0   2.2.0 to 2.2.2 are built against NumPy 1 and cannot read
#                 an array of NumPy 2 ("Numpy is not available"); 2.1 has no
#                 wheel for Python 3.12
#   array-api-compat 1.5.1  1.5 refuses a Python scalar in where()
dependencies = [
    "numpy>=2.0.2; python_version<'3.13'",
    "numpy>=2.1.0; python_version=='3.13'",
    "numpy>=2.3.2; python_version>='3.14'",
    "scipy>=1.14.0; python_version<'3.13'",
    "scipy>=1.14.1; python_version=='3.13'",
    "scipy>=1.16.1; python_version>='3.14'",
]

[project.optional-dependencies]
perf = [
    "numba>=0.60.0; python_version<'3.13'",
    "numba>=0.61.0; python_version=='3.13'",
    "numba>=0.63.0; python_version>='3.14'",
]
plot = ["matplotlib>=3.10.7"]
report = ["reportlab>=4.3.0", "svglib>=0.9.1,!=1.4.0"]
# The base install already reads the whole linear WAV family (PCM, float,
# EXTENSIBLE, BWF, RF64) through scipy; the extra adds the remaining
# containers and codecs (FLAC, AIFF, Ogg/Opus, MP3, compressed WAV) via
# python-soundfile, whose wheel bundles libsndfile (LGPL-2.1, dynamically
# linked).
audio = ["soundfile>=0.12.0"]
# The torch backend of the FDTD engines (phonometry.simulation.Compute): CPU,
# CUDA or Apple MPS. CuPy is not an extra: its wheel depends on the CUDA
# version, and no CI job can measure a floor for it; the guide names the
# version the GPU proof ran on.
torch = [
    "torch>=2.3.0; python_version<'3.13'",
    "torch>=2.5.0; python_version=='3.13'",
    "torch>=2.9.0; python_version>='3.14'",
    "array-api-compat>=1.5.1",
]
full = [
    "numba>=0.60.0; python_version<'3.13'",
    "numba>=0.61.0; python_version=='3.13'",
    "numba>=0.63.0; python_version>='3.14'",
    "matplotlib>=3.10.7",
    "reportlab>=4.3.0",
    "svglib>=0.9.1,!=1.4.0",
    "soundfile>=0.12.0",
]

[project.urls]
"Homepage" = "https://docs.jmrp.io/phonometry/"
"Author" = "https://jmrp.io/"
"Documentation" = "https://docs.jmrp.io/phonometry/"
"Source" = "https://github.com/jmrplens/phonometry"
"Changelog" = "https://github.com/jmrplens/phonometry/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/jmrplens/phonometry/issues"
"DOI" = "https://doi.org/10.5281/zenodo.21215280"

# The data files the package ships are the ones [tool.setuptools.package-data]
# names, glob by glob, and nothing else. With setuptools' default,
# include-package-data = true, the build also took each data directory the
# sdist carries (aircraft/data/anp, building/data and seven more) for a
# package that namespaces = false leaves out, and printed a "Package would be
# ignored" warning for each of the nine on every build; under
# PYTHONWARNINGS=error the build failed on the first. The globs name every
# data file, so the wheel is byte for byte the one the default built, and
# scripts/check_release_artifacts.py fails a build whose wheel lacks a file
# git tracks under src/phonometry.
[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
# A package is a directory with an __init__.py, which every code directory
# has: the default would also take a directory of modules without one as a
# namespace package. The package a client ships to a node
# (phonometry.simulation._remote.package) follows this rule, and
# tests/test_package_architecture.py refuses a code directory without one.
namespaces = false

[tool.setuptools.package-data]
phonometry = [
    "py.typed",
    "aircraft/data/anp/*.csv",
    "aircraft/data/anp/*.md",
    "building/data/*.json",
    "environment/propagation/data/*.json",
    "fluids/data/*.json",
    "materials/absorbers/data/*.json",
    "materials/diffusers/data/*.json",
    "materials/resilient/data/*.json",
    "noise_control/data/*.json",
    "solids/data/*.json",
]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

# Ruff is this project's formatter and linter. Before this section it had no
# configuration at all: `ruff check .` ran with the default rule set (E4, E7,
# E9, F) and nothing formatted the tree, so 673 of the 812 Python files had
# drifted from any single style.
[tool.ruff]
line-length = 88
target-version = "py312"
# Markdown is excluded on purpose. Ruff formats fenced Python inside `.md` but
# does not recognise `.mdx` at all, and every snippet in `docs/` is mirrored by
# hand into `site/src/content/docs/` in English and Spanish. Formatting one
# side would silently drift the three copies apart, and the aligned trailing
# comments those snippets use to show expected output are a teaching device,
# not an accident.
extend-exclude = ["*.md"]
# The node bootstrap runs on whatever Python a node has, so that an old one
# can say it is too old instead of failing to parse the file: it is held to
# Python 3.8 syntax, and tests/simulation/test_remote_bootstrap.py parses it
# with that grammar.
per-file-target-version = { "src/phonometry/simulation/_remote/bootstrap.py" = "py38" }

[tool.ruff.lint]
# The default set (E4, E7, E9, F) plus the families this tree already satisfies
# or very nearly does, so the gate stays honest instead of drowning in noise.
# Deliberately absent, with the count each would raise today:
#   PL   (5265) minus PLR2004, which is selected below. The rest is mostly
#               complexity counts and design opinions this tree does not share.
#   RUF  (1705) ambiguous-unicode in prose that legitimately carries the
#               degree sign, the multiplication sign and ISO symbols.
#   TID  (2218) bans the relative imports this package uses by design.
#   N     (184) would rename `Rw`, `LAeq`, `alpha_w` and every other symbol
#               that a standard spells that way.
#   T20   (600) prints, which is what the scripts in `scripts/` are for.
#   COM  (5992) trailing commas, which the formatter already decides.
select = [
    "E4", "E7", "E9", "F",  # ruff's default set
    "W",                    # whitespace, which the formatter also settles
    "I",                    # import order; this tree already satisfied it
    "UP", "B", "SIM", "C4", "RET", "A",
    "PIE", "DTZ", "G",      # zero findings today: these only guard the future
    "FBT",                  # a boolean is written by name, in the definition
                            # and at the call. `bank.filter(x, True)` says
                            # nothing about which of five flags was thrown, and
                            # a flag inserted before it changes what the same
                            # call means without changing a character of it.
                            # The private half is held to the rule too: a
                            # helper is where the next public function comes
                            # from. FBT003, the call side, came down to
                            # `ax.grid(True, alpha=0.3)` in 295 of its 296
                            # sites; matplotlib names that parameter `visible`,
                            # so the sites say `visible=True` and the rule
                            # stands rather than being excused
    "FURB",                 # long-hand forms of builtins
    "TC",                   # imports only a type checker needs
    "ICN",                  # the conventional alias for a well-known package
    "N812",                 # an alias must not disguise a function as a class
    "INP", "T20",           # both already clean in `src`, and kept that way
    "B905",                 # every `zip()` says whether its inputs must be
                            # the same length. Read one at a time: `strict=`
                            # is a judgement about the data, not a formality
    "PLR2004",              # a number in a comparison carries a name or a
                            # reasoned noqa; every site was censused one by
                            # one before this went on (str/bytes stay exempt:
                            # that vocabulary is its own name)
    "EM",                   # the message lives in a variable, so a traceback
                            # shows `raise ClauseError(msg)` and the text once,
                            # not a two-line message split across the frame
    "D105",                 # a magic method still explains itself
    "D2", "D301",           # docstring shape: where the summary sits and how
                            # quotes and backslashes are spelled. Shape only;
                            # no rule here rewords prose.
    "PT",                   # a test that expects an error says which one. Every
                            # `pytest.raises` names a fragment of the message it
                            # waits for, and the fragment is the part that does
                            # not move: the parameter it is about, not the
                            # sentence around it, not a bound, not a list of
                            # allowed values, not wording numpy owns.
    "PTH",                  # a path is a `Path`. Read one at a time: the two
                            # spell the same destination but not the same type,
                            # and a `Path` prints like its string while
                            # comparing unequal to it, so the sites that hand
                            # their value to a sort, a comparison or a
                            # dictionary key were the ones worth reading.
    "PERF",                 # a loop whose whole body is one `append` is a
                            # comprehension, unless saying so costs more lines
                            # than it saves
    "ANN0", "ANN2",         # every parameter and return says its type. The
                            # suite was the last unannotated corner, and its
                            # fixtures were the point: a parametrize argument
                            # is typed from the values really in its list, a
                            # helper from what its body builds, and pytest's
                            # own plumbing from pytest's own types
    "ANN401",               # an `Any` earns its keep or names its replacement.
                            # A forwarding `*args`/`**kwargs` is exempt below:
                            # matplotlib's keyword surface is an open set and
                            # promising it closed would be the lie this rule
                            # exists to catch. Everything else carries the type
                            # the code actually handles, `object` when it never
                            # looks inside, or a reasoned noqa when openness is
                            # the point; every site was read one by one before
                            # this went on
    "PGH003",               # a `type: ignore` names the error it silences.
                            # mypy's `ignore-without-code` says the same where
                            # mypy reads; this holds every file ruff reads
]
ignore = [
    # TC006 quotes the first argument of `typing.cast`, which that function
    # ignores entirely at run time. It is inert, and it moved the recorded
    # fingerprint of two clips through `figures.media._save_animation`. The
    # clip gate says plainly that an alarm nobody believes is worse than no
    # alarm, so an inert rewrite is not worth one.
    "TC006",
    # SIM300 calls anything with an upper-case name a literal, and gets three
    # idioms in this tree backwards for it. `spectrum[OCTAVE_BANDS == f]` is a
    # numpy mask, not a condition, and `res.transmission_loss[BANDS <= f0]`
    # reads "the bands at or below f0" until it is flipped to `f0 >= BANDS`.
    # `value == pytest.approx(x)` is how pytest is written. It is right about
    # two of the nineteen it finds here, and wrong about the rest; SonarCloud
    # flagged the result as assertions whose argument order no longer agrees.
    "SIM300",
    # Four docstring rules are measured out because they would rewrite prose,
    # and the documentation's voice is content here, not shape:
    #   D401  (999) demands imperative mood ("Return the..."); the house style
    #               opens with a noun phrase and the API reference renders it.
    #   D205  (528) wants a one-line summary, a blank line, then the rest.
    #               Measured, 516 of the 528 openings are deliberate multi-line
    #               sentences; satisfying the rule means rewriting them all.
    #   D403   (50) would capitalise the first word, which here is `dBFS`,
    #               `dL`, `fc`, `matplotlib`: symbols and identifiers.
    #   D404/D415   wording rules with 2 and 5 hits; same principle.
    #   D400    (9) the trailing period. All nine first lines are right as
    #               they stand: four are questions, which end in the mark
    #               they deserve, and five open a sentence that finishes on
    #               the next line.
    "D205", "D400", "D401", "D403", "D404", "D415",
    "D203",  # a blank line before a class docstring; D211 is the house shape
    "D213",  # the summary on the second line; D212 is the house shape
]
[tool.ruff.lint.flake8-annotations]
# The seam ANN401 needs to stay honest: a star-argument that only forwards is
# allowed to be `Any`, because the set of keywords matplotlib and friends
# accept is open and no TypedDict can close it truthfully.
allow-star-arg-any = true

[tool.ruff.lint.flake8-pytest-style]
# PT011 asks for `match=` only on the broad exceptions by default. An
# AttributeError is how a withdrawn name, a misspelt field and an assignment
# to a frozen record all fail, so a bare one passes on whichever of them
# happened: the match names the attribute.
raises-extend-require-match-for = ["AttributeError"]

[tool.ruff.lint.per-file-ignores]
# `matplotlib.use("Agg")` has to run between `import matplotlib` and the first
# `import matplotlib.pyplot`, and the scripts put the repository on `sys.path`
# before importing from it. Both are imports that cannot be at the top of the
# file. `src/` raises no E402 at all, which is where it would matter.
# A print is what a command line tool is for, and neither the scripts nor the
# tests are packages anyone imports by name. Both rules are here to hold `src`,
# where they already find nothing.
# Scripts lay out figures with bare halves and angles, and the tests compare
# against printed oracle values; a name for every such number would be noise.
# The census that named the `src` sites covered neither, deliberately.
"scripts/**" = ["E402", "T201", "INP001", "PLR2004"]
# A test may open its docstring with the clause it checks, quoted verbatim:
# `""" "Up till about 1000 Hz..." `. The space after the triple quote is what
# keeps that from being four quotation marks in a row; D210 wants it gone and
# has no way to fix it. The quotation stays, so the rule stands down in tests
# and holds `src`, where it finds nothing.
"tests/**" = ["E402", "T201", "INP001", "D210", "PLR2004"]
# The PR-comment script reads the committed conformance artefact through
# `scripts/conformance/metrics.py`, so it puts `scripts/` on `sys.path` before
# importing from it - the same import-after-statement the scripts themselves do.
".github/**" = ["E402", "T201", "INP001"]
# The PyOctaveBand transition shim exists to re-export the whole package under
# the old name; the star import is the point of the file.
"stub/src/pyoctaveband/__init__.py" = ["F403"]

[tool.ruff.lint.isort]
known-first-party = ["phonometry"]

# Bare `mypy` is the command everywhere: CI, `make lint` and every page that
# states it read the paths from here, so no two of them can drift apart again.
[tool.mypy]
python_version = "3.12"
strict = true
# `.github/scripts` holds the PR-comment script CI runs, which no other root
# reached. `stub/src` is the PyOctaveBand transition shim, outside the package.
files = ["src", "scripts", "stub/src", "tests/static_typing", ".github/scripts"]
# The conformance scripts import the oracle tables (`reference_data`) and the
# shared ISO 12354 fixture from `tests/`, as `scripts/conformance/registry.py`
# arranges at run time. Without this the checker could not find them, and the
# old global `ignore_missing_imports` turned every value read from them into
# `Any`: the scripts were never checked against the oracles they compare with.
# `scripts` is here for the same reason: the PR-comment script imports the
# conformance package from it, and a file checked on its own has to find it.
mypy_path = ["tests", "scripts"]
# Untracked local oracle work, never part of the repository.
exclude = ['^tests/data-local/']
# An ignore names the error it silences, so it cannot hide a second one.
enable_error_code = ["ignore-without-code"]

# The packages the type checker cannot read types for, here or in CI, and only
# those: a missing stub anywhere else is an error, not a silent `Any`. Six ship
# no type information (scipy, reportlab, pypdfium2, soundfile, mpl_toolkits and
# fontTools). The CI quality job does not install the other four: numba, which
# is in neither of its requirement files, and cupy, torch and array_api_compat,
# the optional compute backends. The list is what a run with no exemption
# reports, here and in an environment installed the way that job installs it.
[[tool.mypy.overrides]]
module = [
    "array_api_compat.*",
    "cupy.*",
    "fontTools.*",
    "mpl_toolkits.*",
    "numba.*",
    "pypdfium2.*",
    "reportlab.*",
    "scipy.*",
    "soundfile.*",
    "torch.*",
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.coverage.run]
relative_files = true
# Python's own monitoring (PEP 669) on every Python the package supports, as
# coverage already picks it on 3.14. On 3.12 and 3.13 the default is the C
# tracer, which takes an event for every call of the run, those of the guards
# under scripts/ too though nothing there is measured, and one for every line
# of src/ each time it runs. Under it a guard that reads the whole package ran
# 2.2 to 2.7 times as long as without coverage, and the tests at the root of
# tests/ and the Zwicker loudness tests 1.7 and 3.6 times as long as under
# sysmon, which counts the same lines: a line once counted, and a function
# outside src/, report nothing more. On 3.12 and 3.13 it measures lines only,
# and no branch coverage is configured.
core = "sysmon"

[tool.pytest.ini_options]
# faulthandler_exit_on_timeout, which the hang guard below rests on, came
# with pytest 9.0; an older pytest would fail every failing test with an
# INTERNALERROR instead of the failure.
minversion = "9.0"
pythonpath = ["tests"]
# Group-aware distribution for `-n auto` runs: tests marked with
# `xdist_group` land on one worker, so an expensive module-scoped fixture
# (FDTD steady states, ECMA-418-2 reference results, the memoized
# conformance registry) is computed once per run instead of once per worker
# that happens to pick one of its consumers. Unmarked tests are distributed
# exactly as with the default `load` mode, and the flag is inert without `-n`.
#
# A worker that dies is not replaced (--max-worker-restart=0). Without it,
# pytest-xdist 3.8 replaces the dead worker: if the queue has already
# emptied, as when a test hangs near the end of a run, the controller then
# waits forever with the other workers idle; if it has not, it puts the group
# back with the hung test in it, another worker hangs on that test in its
# turn, and the run only ends after 4 x n restarts, hours past the job's
# limit. Without restarts the run stops at the first worker the guard below
# ends, which costs the tests still queued, run by no worker and named by
# nothing, and that worker's coverage; the test that hung is the one to fix
# first. Inert without `-n` too.
addopts = ["--dist=loadgroup", "--max-worker-restart=0"]
# A test still running after fifteen minutes has hung. The slowest test takes
# up to 258 s on a CI runner, a Windows one: the metadiffuser NTFF test with
# its group's fixture, between 104 s and 258 s over 27 Windows cells of 9
# runs, where the slowest on Linux took 125 s and on macOS 112 s. 900 s is
# three and a half times the slowest seen, since a limit hit by a slow runner
# ends the whole run. The tests-perf and minimum-versions jobs write no JUnit
# file, so their slowest test is not measured; they run on Linux, and each
# of their runs takes half as long as a Windows one.
# pytest then prints the stack of every thread, the test's own frames among
# them, and ends the process. Under `-n` the controller fails the test that
# worker was running, by name, and stops the run once the other workers have
# run the tests already sent to them, with the JUnit and coverage files
# written; without `-n` the process ends at the stacks, with no summary.
# pytest lifts the limit when a test fails, and tests/hang_guard.py sets it
# again, so the teardown of a failed test has the whole limit from the
# failure. Entering pdb turns it off, and `-o faulthandler_timeout=0` turns
# it off for a session that needs longer.
faulthandler_timeout = 900
faulthandler_exit_on_timeout = true
markers = [
    # The minimum-versions CI job runs the library's tests at the dependency
    # floors with --without-pinned-stack, which leaves the modules carrying
    # this mark out before importing them: the figure, diagram and badge
    # tooling is tied to the pinned stack its committed artefacts are drawn
    # with (tests/pinned_stack.py).
    "pinned_stack: tests the figure, diagram or badge tooling, which runs on the pinned figure stack only",
    # The numba and dependency-floors CI jobs leave the tests carrying this
    # mark out with --without-whole-tree: they read the repository's own
    # text, which neither the jitted kernel nor a dependency floor changes,
    # and the test matrix runs them (tests/whole_tree.py).
    "whole_tree: reads the repository whole, a guard, a census or a generator run over the package, the scripts, the documentation, the site or the committed figures",
    # A tree unpacked from a source archive (GitHub's "Source code", or a
    # packager's export) has no .git, and git refuses to list its files: the
    # tests carrying this mark are skipped there, saying why, and an unmarked
    # test that runs git on the repository fails (tests/git_checkout.py).
    "git_checkout: asks git about the repository, its tracked files or their attributes, and so needs a git checkout",
]
filterwarnings = [
    # A warning a test does not ask for fails it: every advisory of the
    # library is a UserWarning, and a RuntimeWarning is NumPy's word for an
    # overflow, a division by zero or a NaN. A test asserts the advisory it
    # means to meet with pytest.warns and its topic class, or gives the call
    # the input the clause asks for (tests.md, T28). The entries below this
    # pair are later, so they override it for what they name.
    "error::UserWarning",
    "error::RuntimeWarning",
    # pytest's own PytestCacheWarning, a UserWarning named here by its builtin
    # class and its two messages, says it cannot write its cache directory, as
    # in a read-only checkout or container. It speaks of no test and comes
    # once the last has run, so it is shown, not raised; `-p no:cacheprovider`
    # keeps pytest from writing a cache at all.
    "default:could not create cache path:UserWarning",
    "default:cache could not write path:UserWarning",
    # The clip-frame audit, the figure checks, the doc-snippet runner and the
    # process-exit tests fork on purpose, so a child shares what its parent
    # computed. Python 3.12 and later warn at a fork while another thread
    # lives, and under pytest one always does: the faulthandler watchdog of
    # faulthandler_timeout, and under -n the xdist worker's own thread, so a
    # filter around one fork would race the other threads' warnings anyway.
    "ignore:This process \\(pid=\\d+\\) is multi-threaded, use of fork\\(\\) may lead to deadlocks in the child:DeprecationWarning",
    # 4.0 carries no deprecated names: the aliases the 3.x layout left behind
    # were removed with the shims that served them. The rule stays as a guard,
    # so the day a deprecation is introduced the suite fails instead of
    # logging, and it costs nothing while nothing matches it.
    "error:.*is deprecated since phonometry.*:DeprecationWarning",
    # A fixture of class, module, package or session scope written as an
    # instance method runs once for its scope on an instance no test sees, and
    # pytest 10 refuses it. pytest 9.2 only warns, for each of the four scopes,
    # with a PytestRemovedIn10Warning, a DeprecationWarning named here by its
    # builtin class and its message, which starts with the scope's name
    # (pytest 9.1 warned for class scope alone, in the singular), so the test
    # that uses such a fixture fails at its setup.
    "error:(Class|Module|Package|Session)-scoped fixtures? defined as instance methods? (is|are) deprecated:DeprecationWarning",
]