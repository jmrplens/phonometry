ne x1="293.0" y1="354" x2="285.0" y2="363" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><line x1="317.0" y1="354" x2="309.0" y2="363" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><line x1="341.0" y1="354" x2="333.0" y2="363" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><line x1="365.0" y1="354" x2="357.0" y2="363" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><text x="250.0" y="388" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9a9a9a" text-anchor="middle">Cimentación rígida</text><text x="250.0" y="470" font-family="Consolas, Menlo, monospace" font-size="16" fill="#e6e6e6" text-anchor="middle">salida bloqueada:  u₂ ≈ 0 → se mide F₂,b</text><text x="250.0" y="500" font-family="Consolas, Menlo, monospace" font-size="20" fill="#4da3d8" text-anchor="middle" font-weight="600">k₂,₁ = F₂,b / u₁</text><rect x="565.0" y="310" width="170" height="60" rx="6" fill="#1c2128" stroke="#e6e6e6" stroke-width="2.4"/><text x="650.0" y="346" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="middle">masa de bloqueo m₂</text><rect x="698.0" y="296.0" width="14.0" height="14.0" rx="2.5" fill="#e46a6a" stroke="#e6e6e6" stroke-width="1.3"/><line x1="705.0" y1="296.0" x2="705.0" y2="288.0" stroke="#e6e6e6" stroke-width="1.3" stroke-linecap="round"/><text x="722.0" y="296" font-family="Consolas, Menlo, monospace" font-size="15" fill="#e46a6a" text-anchor="start">a₂</text><path d="M 600.0 370.0 L 600.0 377.2 L 608.0 384.8 L 592.0 392.4 L 608.0 400.0 L 592.0 407.6 L 608.0 415.2 L 600.0 422.8 L 600.0 430.0" fill="none" stroke="#9a9a9a" stroke-width="1.6" stroke-linejoin="round"/><path d="M 700.0 370.0 L 700.0 377.2 L 708.0 384.8 L 692.0 392.4 L 708.0 400.0 L 692.0 407.6 L 708.0 415.2 L 700.0 422.8 L 700.0 430.0" fill="none" stroke="#9a9a9a" stroke-width="1.6" stroke-linejoin="round"/><line x1="535.0" y1="430" x2="765.0" y2="430" stroke="#e6e6e6" stroke-width="2.2" stroke-linecap="round"/><line x1="535.0" y1="430" x2="527.0" y2="439" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><line x1="559.0" y1="430" x2="551.0" y2="439" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><line x1="583.0" y1="430" x2="575.0" y2="439" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><line x1="607.0" y1="430" x2="599.0" y2="439" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><line x1="631.0" y1="430" x2="623.0" y2="439" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><line x1="655.0" y1="430" x2="647.0" y2="439" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><line x1="679.0" y1="430" x2="671.0" y2="439" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><line x1="703.0" y1="430" x2="695.0" y2="439" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><line x1="727.0" y1="430" x2="719.0" y2="439" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><line x1="751.0" y1="430" x2="743.0" y2="439" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><text x="720.0" y="408" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="start">apoyo blando</text><text x="650.0" y="470" font-family="Consolas, Menlo, monospace" font-size="16" fill="#e6e6e6" text-anchor="middle">se mide T = u₂ / u₁  (pequeña)</text><text x="650.0" y="500" font-family="Consolas, Menlo, monospace" font-size="20" fill="#4da3d8" text-anchor="middle" font-weight="600">k₂,₁ = −(2πf)²·(m₂+mf)·T</text><text x="450" y="556" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#9a9a9a" text-anchor="middle">válido donde ΔL₁,₂ = La₁ − La₂ ≥ 20 dB, es decir |T| ≤ 0,1   (Parte 3, Desigualdad 2)</text><text x="450" y="582" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9a9a9a" text-anchor="middle" font-style="italic">la fuerza de bloqueo aproxima la fuerza entregada a un receptor rígido (Parte 1, Ec. 7)</text><text x="450" y="640" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#e6e6e6" text-anchor="middle" font-weight="600">Las dos formas de aplicar la precarga estática (ISO 10846-1, 6.3.3.1)</text><rect x="48" y="664" width="388" height="196" rx="10" fill="none" stroke="#e6e6e6" stroke-width="1.6"/><text x="70" y="692" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="start" font-weight="600">a) gravedad: la masa de salida es la precarga</text><rect x="150" y="712" width="130" height="30" rx="4" fill="#1c2128" stroke="#e6e6e6" stroke-width="2.0"/><path d="M 215.0 742.0 L 215.0 747.3 L 225.0 752.9 L 205.0 758.4 L 225.0 764.0 L 205.0 769.6 L 225.0 775.1 L 215.0 780.7 L 215.0 786.0" fill="none" stroke="#5abf5a" stroke-width="2.0" stroke-linejoin="round"/><rect x="140" y="786" width="150" height="34" rx="4" fill="#1c2128" stroke="#e6e6e6" stroke-width="2.2"/><text x="215" y="808" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle">masa de carga</text><line x1="120" y1="820" x2="310" y2="820" stroke="#e6e6e6" stroke-width="2.2" stroke-linecap="round"/><line x1="120" y1="820" x2="112" y2="829" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><line x1="144" y1="820" x2="136" y2="829" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><line x1="168" y1="820" x2="160" y2="829" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><line x1="192" y1="820" x2="184" y2="829" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><line x1="216" y1="820" x2="208" y2="829" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><line x1="240" y1="820" x2="232" y2="829" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><line x1="264" y1="820" x2="256" y2="829" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><line x1="288" y1="820" x2="280" y2="829" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><line x1="330" y1="760" x2="330.0" y2="791.0" stroke="#e46a6a" stroke-width="2.2" stroke-linecap="round"/><path d="M 330.0 800.0 L 326.4 791.0 L 333.6 791.0 Z" fill="#e46a6a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="340" y="784" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e46a6a" text-anchor="start">W = carga</text><text x="70" y="848" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="start">sencillo, pero inestable con precargas altas</text><rect x="464" y="664" width="388" height="196" rx="10" fill="none" stroke="#4da3d8" stroke-width="1.6"/><text x="486" y="692" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="start" font-weight="600">b) bastidor y actuador, con muelles de desacoplo</text><line x1="500" y1="706" x2="820" y2="706" stroke="#e6e6e6" stroke-width="2.6" stroke-linecap="round"/><line x1="500" y1="706" x2="500" y2="822" stroke="#e6e6e6" stroke-width="2.2" stroke-linecap="round"/><line x1="820" y1="706" x2="820" y2="822" stroke="#e6e6e6" stroke-width="2.2" stroke-linecap="round"/><rect x="628" y="712" width="64" height="34" rx="4" fill="#1c2128" stroke="#e46a6a" stroke-width="2.0"/><line x1="660" y1="748" x2="660.0" y2="759.0" stroke="#e46a6a" stroke-width="2.2" stroke-linecap="round"/><path d="M 660.0 768.0 L 656.4 759.0 L 663.6 759.0 Z" fill="#e46a6a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="676" y="734" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e46a6a" text-anchor="start">actuador: 100 % de la</text><text x="676" y="752" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e46a6a" text-anchor="start">carga estática admisible</text><path d="M 660.0 768.0 L 660.0 771.8 L 670.0 775.9 L 650.0 779.9 L 670.0 784.0 L 650.0 788.1 L 670.0 792.1 L 660.0 796.2 L 660.0 800.0" fill="none" stroke="#5abf5a" stroke-width="2.0" stroke-linejoin="round"/><rect x="600" y="800" width="120" height="26" rx="4" fill="#1c2128" stroke="#e6e6e6" stroke-width="2.2"/><text x="660" y="818" font-family="Consolas, Menlo, monospace" font-size="15" fill="#e6e6e6" text-anchor="middle">m₂</text><path d="M 556.0 800.0 L 556.0 804.8 L 563.0 812.4 L 549.0 820.0 L 563.0 827.6 L 556.0 835.2 L 556.0 840.0" fill="none" stroke="#9a9a9a" stroke-width="1.5" stroke-linejoin="round"/><path d="M 764.0 800.0 L 764.0 804.8 L 771.0 812.4 L 757.0 820.0 L 771.0 827.6 L 764.0 835.2 L 764.0 840.0" fill="none" stroke="#9a9a9a" stroke-width="1.5" stroke-linejoin="round"/><text x="500" y="856" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="start">los muelles auxiliares desacoplan m₂ del bastidor</text><text x="450" y="900" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#e6e6e6" text-anchor="middle" font-weight="600">Las traslaciones transversales también están normalizadas (ISO 10846-2, 5.2)</text><rect x="48" y="924" width="804" height="132" rx="10" fill="none" stroke="#9a9a9a" stroke-width="1.4"/><rect x="300" y="950" width="190" height="30" rx="4" fill="#1c2128" stroke="#e6e6e6" stroke-width="2.2"/><text x="395" y="971" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e6e6e6" text-anchor="middle">placa de reparto de fuerza</text><line x1="268" y1="965" x2="268.0" y2="952.0" stroke="#e46a6a" stroke-width="2.0" stroke-linecap="round"/><path d="M 268.0 943.0 L 271.6 952.0 L 264.4 952.0 Z" fill="#e46a6a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="268" y1="965" x2="268.0" y2="978.0" stroke="#e46a6a" stroke-width="2.0" stroke-linecap="round"/><path d="M 268.0 987.0 L 264.4 978.0 L 271.6 978.0 Z" fill="#e46a6a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="255" y="940" font-family="Consolas, Menlo, monospace" font-size="16" fill="#e46a6a" text-anchor="end">a₁ₓ</text><circle cx="330.0" cy="940" r="9" fill="#0d1117" stroke="#e6e6e6" stroke-width="1.6"/><circle cx="460.0" cy="940" r="9" fill="#0d1117" stroke="#e6e6e6" stroke-width="1.6"/><text x="508" y="942" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="start">los rodamientos, o dos elementos</text><text x="508" y="962" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="start">simétricos, suprimen la entrada no deseada</text><rect x="320" y="980" width="150" height="26" rx="4" fill="#5abf5a" stroke="#e6e6e6" stroke-width="1.8"/><text x="395" y="999" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#0d1117" text-anchor="middle">elemento a cortante</text><rect x="326.0" y="1006" width="44" height="16" rx="3" fill="#1c2128" stroke="#e46a6a" stroke-width="1.6"/><rect x="420.0" y="1006" width="44" height="16" rx="3" fill="#1c2128" stroke="#e46a6a" stroke-width="1.6"/><text x="508" y="1000" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e6e6e6" text-anchor="start">fuerza cortante de salida sumada</text><text x="508" y="1020" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e6e6e6" text-anchor="start">de dos transductores,  F₂ = F₂′ + F₂″</text><line x1="300" y1="1022" x2="490" y2="1022" stroke="#e6e6e6" stroke-width="2.2" stroke-linecap="round"/><line x1="300" y1="1022" x2="292" y2="1031" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><line x1="324" y1="1022" x2="316" y2="1031" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><line x1="348" y1="1022" x2="340" y2="1031" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><line x1="372" y1="1022" x2="364" y2="1031" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><line x1="396" y1="1022" x2="388" y2="1031" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><line x1="420" y1="1022" x2="412" y2="1031" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><line x1="444" y1="1022" x2="436" y2="1031" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><line x1="468" y1="1022" x2="460" y2="1031" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><text x="450" y="1082" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9a9a9a" text-anchor="middle">un apoyo trabaja a cortante además de a compresión, y la rigidez transversal suele ser la menor de las dos</text></svg>