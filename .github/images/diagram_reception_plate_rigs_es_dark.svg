 x="161.0" y="416.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle">≥ 6 posiciones de velocidad, a ≈ 0,5 m entre sí</text><text x="161.0" y="440.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle">y a ≥ 0,1 m de cualquier punto de contacto</text><text x="161.0" y="464.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle">apoyos elásticos ≤ 100 × 100 mm</text><text x="450.0" y="96.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#e6e6e6" text-anchor="middle" font-weight="600">Placa de alta movilidad (7.3.2)</text><rect x="332.0" y="184.0" width="236" height="112" rx="5" fill="none" stroke="#9a9a9a" stroke-width="3.0"/><rect x="346.0" y="202.0" width="208" height="22" rx="0.0" fill="#1c2128" stroke="#e6e6e6" stroke-width="2.2"/><circle cx="356" cy="213.0" r="3.2" fill="#0d1117" stroke="#9a9a9a" stroke-width="1.0"/><circle cx="370" cy="213.0" r="3.2" fill="#0d1117" stroke="#9a9a9a" stroke-width="1.0"/><circle cx="384" cy="213.0" r="3.2" fill="#0d1117" stroke="#9a9a9a" stroke-width="1.0"/><circle cx="398" cy="213.0" r="3.2" fill="#0d1117" stroke="#9a9a9a" stroke-width="1.0"/><circle cx="412" cy="213.0" r="3.2" fill="#0d1117" stroke="#9a9a9a" stroke-width="1.0"/><circle cx="426" cy="213.0" r="3.2" fill="#0d1117" stroke="#9a9a9a" stroke-width="1.0"/><circle cx="440" cy="213.0" r="3.2" fill="#0d1117" stroke="#9a9a9a" stroke-width="1.0"/><circle cx="454" cy="213.0" r="3.2" fill="#0d1117" stroke="#9a9a9a" stroke-width="1.0"/><circle cx="468" cy="213.0" r="3.2" fill="#0d1117" stroke="#9a9a9a" stroke-width="1.0"/><circle cx="482" cy="213.0" r="3.2" fill="#0d1117" stroke="#9a9a9a" stroke-width="1.0"/><circle cx="496" cy="213.0" r="3.2" fill="#0d1117" stroke="#9a9a9a" stroke-width="1.0"/><circle cx="510" cy="213.0" r="3.2" fill="#0d1117" stroke="#9a9a9a" stroke-width="1.0"/><circle cx="524" cy="213.0" r="3.2" fill="#0d1117" stroke="#9a9a9a" stroke-width="1.0"/><circle cx="538" cy="213.0" r="3.2" fill="#0d1117" stroke="#9a9a9a" stroke-width="1.0"/><rect x="413.0" y="146.0" width="74" height="56" rx="6" fill="#1c2128" stroke="#4da3d8" stroke-width="2.2"/><line x1="427.0" y1="200.0" x2="427.0" y2="224.0" stroke="#e6e6e6" stroke-width="2.6" stroke-linecap="round"/><line x1="473.0" y1="200.0" x2="473.0" y2="224.0" stroke="#e6e6e6" stroke-width="2.6" stroke-linecap="round"/><text x="450.0" y="136.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#4da3d8" text-anchor="middle" font-style="italic">fuente atornillada rígidamente</text><rect x="367.0" y="238.0" width="14.0" height="14.0" rx="2.5" fill="#e46a6a" stroke="#e6e6e6" stroke-width="1.3"/><line x1="374.0" y1="238.0" x2="374.0" y2="230.0" stroke="#e6e6e6" stroke-width="1.3" stroke-linecap="round"/><rect x="519.0" y="238.0" width="14.0" height="14.0" rx="2.5" fill="#e46a6a" stroke="#e6e6e6" stroke-width="1.3"/><line x1="526.0" y1="238.0" x2="526.0" y2="230.0" stroke="#e6e6e6" stroke-width="1.3" stroke-linecap="round"/><text x="450.0" y="314.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle" font-style="italic">bastidor de sujeción</text><text x="450.0" y="344.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle">acero de 1 mm o aluminio de 1,5 mm</text><text x="450.0" y="366.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle">|Y| ≥ 10⁻² m/(N·s)</text><text x="450.0" y="388.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle">≈ 50 % perforada, agujeros de ⌀ ≈ 6 mm,</text><text x="450.0" y="410.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle">para que el ruido aéreo de la propia fuente</text><text x="450.0" y="432.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle">no excite la lámina</text><text x="450.0" y="454.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle">Ts e Y medidos con la</text><text x="450.0" y="476.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle">fuente instalada (7.1)</text><text x="748.0" y="96.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#e6e6e6" text-anchor="middle" font-weight="600">Banco de tres placas (figura 2)</text><rect x="630.0" y="212.0" width="68.0" height="20" rx="0.0" fill="#1c2128" stroke="#e6e6e6" stroke-width="2.2"/><path d="M 664.0 232.0 L 664.0 236.6 L 671.0 243.8 L 657.0 251.0 L 671.0 258.2 L 664.0 265.4 L 664.0 270.0" fill="none" stroke="#5abf5a" stroke-width="1.6" stroke-linejoin="round"/><rect x="714.0" y="212.0" width="68.0" height="20" rx="0.0" fill="#1c2128" stroke="#e6e6e6" stroke-width="2.2"/><path d="M 748.0 232.0 L 748.0 236.6 L 755.0 243.8 L 741.0 251.0 L 755.0 258.2 L 748.0 265.4 L 748.0 270.0" fill="none" stroke="#5abf5a" stroke-width="1.6" stroke-linejoin="round"/><rect x="798.0" y="212.0" width="68.0" height="20" rx="0.0" fill="#1c2128" stroke="#e6e6e6" stroke-width="2.2"/><path d="M 832.0 232.0 L 832.0 236.6 L 839.0 243.8 L 825.0 251.0 L 839.0 258.2 L 832.0 265.4 L 832.0 270.0" fill="none" stroke="#5abf5a" stroke-width="1.6" stroke-linejoin="round"/><line x1="618.0" y1="270.0" x2="878.0" y2="270.0" stroke="#e6e6e6" stroke-width="2.2" stroke-linecap="round"/><line x1="618.0" y1="270.0" x2="610.0" y2="279.0" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><line x1="642.0" y1="270.0" x2="634.0" y2="279.0" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><line x1="666.0" y1="270.0" x2="658.0" y2="279.0" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><line x1="690.0" y1="270.0" x2="682.0" y