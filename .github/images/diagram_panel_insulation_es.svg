ión en fc</text><line x1="305.0" y1="360.0" x2="382.0" y2="326.0" stroke="#666666" stroke-width="1.0" stroke-linecap="round"/><text x="388" y="404" font-family="Consolas, Menlo, monospace" font-size="16" fill="#1a1a1a" text-anchor="middle">m″ = 8,8 kg/m²</text><line x1="572.0" y1="390.0" x2="850.0" y2="390.0" stroke="#666666" stroke-width="1.3" stroke-linecap="round"/><line x1="572.0" y1="390.0" x2="572.0" y2="137.0" stroke="#666666" stroke-width="1.3" stroke-linecap="round"/><path d="M 572.0 128.0 L 575.6 137.0 L 568.4 137.0 Z" fill="#666666" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="564.0" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="end" font-style="italic">R</text><text x="854" y="406.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="end" font-style="italic">f</text><text x="645" y="198" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f77b4" text-anchor="middle" font-style="italic">R(f) predicho</text><line x1="612.6390494146375" y1="390.0" x2="612.6390494146375" y2="395.0" stroke="#666666" stroke-width="1.2" stroke-linecap="round"/><text x="612.6390494146375" y="410.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">100</text><line x1="747.6390494146375" y1="390.0" x2="747.6390494146375" y2="395.0" stroke="#666666" stroke-width="1.2" stroke-linecap="round"/><text x="747.6390494146375" y="410.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">1k</text><path d="M 572.0 349.7 L 585.6 336.6 L 599.6 322.9 L 612.6 309.9 L 625.7 296.9 L 640.2 282.5 L 653.3 269.4 L 666.4 256.4 L 679.9 242.7 L 693.9 228.3 L 707.0 215.3 L 720.6 201.5 L 734.6 187.1 L 747.6 173.4 L 760.7 160.4 L 775.2 178.2 L 788.3 201.5 L 801.4 224.2 L 814.9 212.5 L 828.9 191.3 L 842.0 171.4" fill="none" stroke="#1f77b4" stroke-width="2.