<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620"><rect width="900" height="620" fill="#ffffff"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1a1a1a" text-anchor="middle">Calificación de datos: decisión de estacionariedad (B&amp;P 10.3)</text><rect x="170.0" y="52" width="560.0" height="54" rx="10" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="2"/><text x="450.0" y="75" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>Registro temporal </tspan><tspan font-style="italic">x</tspan><tspan>(</tspan><tspan font-style="italic">t</tspan><tspan>)</tspan></text><text x="450.0" y="95" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">antes de confiar en cualquier promedio PSD, Leq o GUM</text><rect x="170.0" y="134" width="560.0" height="54" rx="10" fill="#f0f2f5" stroke="#1f77b4" stroke-width="2"/><text x="450.0" y="157" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>Media cuadrática por intervalo — </tspan><tspan font-style="italic">N</tspan><tspan> = 20 segmentos iguales</tspan></text><text x="450.0" y="177" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">cada intervalo largo frente a las frecuencias más bajas del registro; también rms, media o varianza</text><rect x="170.0" y="216" width="560.0" height="54" rx="10" fill="#f0f2f5" stroke="#1f77b4" stroke-width="2"/><text x="450.0" y="239" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>Recuento de inversiones </tspan><tspan font-style="italic">A</tspan></text><text x="450.0" y="259" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle" xml:space="preserve"><tspan>pares </tspan><tspan font-style="italic">i</tspan><tspan> &lt; </tspan><tspan font-style="italic">j</tspan><tspan> con </tspan><tspan font-style="italic">x</tspan><tspan dy="2.6" font-size="8.4" font-style="italic">i</tspan><tspan dy="-2.6"> &gt; </tspan><tspan font-style="italic">x</tspan><tspan dy="2.6" font-size="8.4" font-style="italic">j</tspan><tspan dy="-2.6">; media sin tendencia </tspan><tspan font-style="italic">μ</tspan><tspan dy="2.6" font-size="8.4" font-style="italic">A</tspan><tspan dy="-2.6"> = </tspan><tspan font-style="italic">N</tspan><tspan>(</tspan><tspan font-style="italic">N</tspan><tspan>−1)/4 = 95</tspan></text><line x1="450.0" y1="106" x2="450.0" y2="121.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 130.0 L 446.4 121.0 L 453.6 121.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="450.0" y1="188" x2="450.0" y2="203.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 212.0 L 446.4 203.0 L 453.6 203.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="450.0" y1="270" x2="450.0" y2="285.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 294.0 L 446.4 285.0 L 453.6 285.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><path d="M 240 340 L 450 296 L 660 340 L 450 384 Z" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/><text x="450.0" y="336" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>64 &lt; </tspan><tspan font-style="italic">A</tspan><tspan> ≤ 125 ?</tspan></text><text x="450.0" y="358" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle" xml:space="preserve"><tspan>(Tabla A.6, </tspan><tspan font-style="italic">α</tspan><tspan> = 0,05)</tspan></text><line x1="390" y1="380" x2="258.5502857413644" y2="423.190620399266" stroke="#d62728" stroke-width="1.8" stroke-linecap="round"/><path d="M 250.0 426.0 L 257.4 419.8 L 259.7 426.6 Z" fill="#d62728" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="298" y="392" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#d62728" text-anchor="middle" font-weight="600">no</text><line x1="510" y1="380" x2="641.4497142586356" y2="423.190620399266" stroke="#2ca02c" stroke-width="1.8" stroke-linecap="round"/><path d="M 650.0 426.0 L 640.3 426.6 L 642.6 419.8 Z" fill="#2ca02c" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="602" y="392" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#2ca02c" text-anchor="middle" font-weight="600">sí</text><rect x="60" y="430" width="360" height="96" rx="10" fill="#f0f2f5" stroke="#d62728" stroke-width="2.2"/><text x="240" y="458" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="600">No estacionario: no promediar</text><text x="240" y="482" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#d62728" text-anchor="middle" xml:space="preserve"><tspan>rampa de ganancia del +20 %: </tspan><tspan font-style="italic">A</tspan><tspan> = 7 → rechazado</tspan></text><text x="240" y="504" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">divide en el cambio, o pasa a corto plazo (espectrograma)</text><rect x="480" y="430" width="360" height="96" rx="10" fill="#f0f2f5" stroke="#2ca02c" stroke-width="2.2"/><text x="660" y="458" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="600">Estacionario: analizar</text><text x="660" y="482" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2ca02c" text-anchor="middle" xml:space="preserve"><tspan>ruido estable: </tspan><tspan font-style="italic">A</tspan><tspan> = 91 → aceptado</tspan></text><text x="660" y="504" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">los IC chi-cuadrado y las fórmulas de error valen</text><text x="450.0" y="566" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">el test de rachas (method="runs") es el compañero bilateral: demasiadas rachas son tan sospechosas como muy pocas</text><text x="450.0" y="590" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle">un deslizamiento en frecuencia puede esconderse de la media cuadrática: prueba statistic="mean" o copias filtradas por bandas</text></svg>