<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><rect width="900" height="600" fill="#0d1117"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6e6e6" text-anchor="middle">Predicting the reverberation time: Sabine against Eyring</text><rect x="170" y="52" width="560" height="78" rx="10" fill="#1c2128" stroke="#e6e6e6" stroke-width="2"/><text x="450" y="77" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e6e6e6" text-anchor="middle" font-weight="600">Room 10 × 7 × 3.5 m — V = 245 m³, S = 259 m²</text><text x="450" y="97" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">hard end walls, lightly treated side walls, carpet and acoustic ceiling</text><text x="450" y="117" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">mean absorption ᾱ runs from 0.21 at 125 Hz to 0.51 at 4 kHz</text><rect x="60" y="178" width="380" height="96" rx="10" fill="#1c2128" stroke="#4da3d8" stroke-width="2"/><text x="250" y="203" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="600">Sabine</text><text x="250" y="224" font-family="Consolas, Menlo, monospace" font-size="13" fill="#4da3d8" text-anchor="middle">T = 0.161·V / (Σ Si·αi + 4mV)</text><text x="250" y="245" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#9a9a9a" text-anchor="middle">low, even absorption (ᾱ up to ≈ 0.2);</text><text x="250" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#9a9a9a" text-anchor="middle">stays finite even at α = 1</text><rect x="460" y="178" width="380" height="96" rx="10" fill="#1c2128" stroke="#e46a6a" stroke-width="2"/><text x="650" y="203" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="600">Eyring</text><text x="650" y="224" font-family="Consolas, Menlo, monospace" font-size="13" fill="#e46a6a" text-anchor="middle">T = 0.161·V / (−S·ln(1 − ᾱ) + 4mV)</text><text x="650" y="245" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#9a9a9a" text-anchor="middle">strong, even absorption;</text><text x="650" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#9a9a9a" text-anchor="middle">reaches T = 0 at total absorption</text><line x1="350" y1="130" x2="272.9926352411743" y2="169.86263587515685" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 265.0 174.0 L 271.3 166.7 L 274.6 173.1 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="550" y1="130" x2="627.0073647588257" y2="169.86263587515685" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 635.0 174.0 L 625.4 173.1 L 628.7 166.7 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="100" y="318" width="700" height="150" rx="10" fill="#1c2128" stroke="#e6e6e6" stroke-width="1.8"/><text x="450" y="344" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="600">Predicted T60 per octave band</text><text x="292.0" y="372" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle" font-weight="600">125 Hz</text><text x="386.0" y="372" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle" font-weight="600">250</text><text x="480.0" y="372" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle" font-weight="600">500</text><text x="574.0" y="372" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle" font-weight="600">1k</text><text x="668.0" y="372" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle" font-weight="600">2k</text><text x="762.0" y="372" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle" font-weight="600">4k</text><line x1="130" y1="382" x2="770" y2="382" stroke="#9a9a9a" stroke-width="1.0" stroke-linecap="round"/><text x="130" y="404" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4da3d8" text-anchor="start" font-weight="600">Sabine [s]</text><text x="292.0" y="404" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e6e6e6" text-anchor="middle">0.74</text><text x="386.0" y="404" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e6e6e6" text-anchor="middle">0.47</text><text x="480.0" y="404" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e6e6e6" text-anchor="middle">0.37</text><text x="574.0" y="404" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e6e6e6" text-anchor="middle">0.31</text><text x="668.0" y="404" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e6e6e6" text-anchor="middle">0.30</text><text x="762.0" y="404" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e6e6e6" text-anchor="middle">0.30</text><text x="130" y="432" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#e46a6a" text-anchor="start" font-weight="600">Eyring [s]</text><text x="292.0" y="432" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e6e6e6" text-anchor="middle">0.66</text><text x="386.0" y="432" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e6e6e6" text-anchor="middle">0.39</text><text x="480.0" y="432" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e6e6e6" text-anchor="middle">0.29</text><text x="574.0" y="432" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e6e6e6" text-anchor="middle">0.23</text><text x="668.0" y="432" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e6e6e6" text-anchor="middle">0.21</text><text x="762.0" y="432" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e6e6e6" text-anchor="middle">0.22</text><text x="450" y="456" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle" font-style="italic">Eyring runs 11 to 29 % shorter here: ᾱ is past Sabine's comfort zone</text><line x1="250" y1="274" x2="312.1858117208799" y2="309.5347495547885" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 320.0 314.0 L 310.4 312.7 L 314.0 306.4 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="650" y1="274" x2="587.8141882791201" y2="309.5347495547885" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 580.0 314.0 L 586.0 306.4 L 589.6 312.7 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="130" y="500" width="640" height="68" rx="10" fill="none" stroke="#5abf5a" stroke-width="1.6" stroke-dasharray="6,5"/><text x="450" y="527" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#5abf5a" text-anchor="middle" font-weight="600">Domain of validity: a diffuse field that stays diffuse while it decays</text><text x="450" y="551" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#e6e6e6" text-anchor="middle">below the Schroeder frequency, in coupled volumes and in corridor-like rooms no single T60 exists</text></svg>