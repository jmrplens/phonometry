ext-anchor="start" font-weight="600">cruz rígida:</text><text x="210.0" y="468.0" font-family="Consolas, Menlo, monospace" font-size="13" fill="#666666" text-anchor="start">'rigid_cross', 'through' / 'corner'</text><text x="70.0" y="492.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="600">T rígida:</text><text x="210.0" y="492.0" font-family="Consolas, Menlo, monospace" font-size="13" fill="#666666" text-anchor="start">'rigid_t', 'through' / 'corner'</text><text x="70.0" y="516.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="600">T flexible:</text><text x="210.0" y="516.0" font-family="Consolas, Menlo, monospace" font-size="13" fill="#666666" text-anchor="start">'flexible_t', 'through' / 'corner'</text><text x="532.0" y="468.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="600">esquina:</text><text x="672.0" y="468.0" font-family="Consolas, Menlo, monospace" font-size="13" fill="#666666" text-anchor="start">'corner', 'corner'</text><text x="532.0" y="492.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="600">cambio de espesor:</text><text x="672.0" y="492.0" font-family="Consolas, Menlo, monospace" font-size="13" fill="#666666" text-anchor="start">'thickness_change', 'through'</text><text x="70.0" y="540" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="600">doble hoja ligera:</text><text x="260.0" y="540" font-family="Consolas, Menlo, monospace" font-size="13" fill="#666666" text-anchor="start">'lightweight_double_homogeneous', 'double_leaf'</text><rect x="48" y="568" width="804" height="96" rx="10" fill="none" stroke="#666666" stroke-width="1.5" stroke-dasharray="6,5"/><text x="70" y="594" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" xml:space="preserve"><tspan font-style="italic">M</tspan><tspan> = lg(</tspan><tspan font-style="italic">m</tspan><tspan>′</tspan><tspan dy="3.3" font-size="10.5" font-style="italic">perp</tspan><tspan font-size="10.5">,</tspan><tspan font-size="10.5" font-style="italic">i</tspan><tspan dy="-3.3"> / </tspan><tspan font-style="italic">m</tspan><tspan>′</tspan><tspan dy="3.3" font-size="10.5" font-style="italic">i</tspan><tspan dy="-3.3">): </tspan><tspan font-style="italic">m</tspan><tspan>′</tspan><tspan dy="3.3" font-size="10.5" font-style="italic">i</tspan><tspan dy="-3.3"> es el elemento que lleva la vía, así que el cociente es por vía, no por unión.</tspan></text><text x="70" y="620" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" xml:space="preserve"><tspan>Las funciones toman el COCIENTE, no </tspan><tspan font-style="italic">M</tspan><tspan>. Forjado del anexo H.3, cociente 1,61: 'through' -&gt; </tspan><tspan font-style="italic">K</tspan><tspan dy="3.3" font-size="10.5">13</tspan><tspan dy="-3.3"> = 12,5 dB, 'corner' -&gt; </tspan><tspan font-style="italic">K</tspan><tspan dy="3.3" font-size="10.5">12</tspan><tspan dy="-3.3"> = 8,9 dB</tspan></text><text x="70" y="646" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#2ca02c" text-anchor="start" xml:space="preserve"><tspan font-style="italic">ℓ</tspan><tspan dy="3.3" font-size="10.5" font-style="italic">f</tspan><tspan dy="-3.3"> es la longitud de acoplamiento a lo largo de la unión, medida de superficie a superficie. Los valores del anexo E se leen a 500 Hz, ± 3 dB.</tspan></text></svg>