allowBuilds:
  esbuild: true
  sharp: true
  puppeteer: true

# Disable pnpm 11's minimum-release-age supply-chain gate: the committed
# lockfile is the trust root here, and the 24 h default kept blocking docs
# deploys whenever a transitive dependency (e.g. the lightningcss platform
# binaries) published shortly before a scheduled run.
minimumReleaseAge: 0

# Security advisories against transitive dependencies, none of which we depend
# on directly: ip-address through socks/proxy-agent, undici through
# cheerio/pa11y-ci, nanoid through postcss/vite, js-yaml through astro's
# internal helpers. Each parent's own range already admits the patched
# release, so these only force the resolution forward and are removed once the
# parents float past them on their own.
overrides:
  ip-address: ^10.3.1
  js-yaml@^4: ^4.3.1
  nanoid@^3: ^3.3.17
  undici: ^6.28.0
  brace-expansion@^1: ^1.1.18
  # pa11y and pa11y-ci both still require puppeteer ^24, which pins
  # @puppeteer/browsers to 2.13.2. That release extracts downloaded browser
  # archives with extract-zip, whose symlink handling lets a crafted archive
  # write outside the target directory. @puppeteer/browsers 3.x replaced
  # extract-zip with OS tar/unzip and puppeteer-core 24.43.1 works fine
  # against it (verified by running the pa11y audit); the pin only matters at
  # install time, so this can go once pa11y ships on puppeteer 25.
  "@puppeteer/browsers@<3": ^3.1.0
  # satori pins fflate at exactly 0.7.3, whose unzipSync can be walked into
  # an infinite loop by a malformed ZIP64 archive. The site never unzips
  # anything, so this is reachable by nothing here, but the patch release is
  # a drop-in and the tree already carries 0.7.5 for another parent. Goes
  # once satori floats past the pin.
  "fflate@0.7.3": ^0.7.5
