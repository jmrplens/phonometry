t-size="10.5">60</tspan><tspan dy="-3.3">) ,  </tspan><tspan font-style="italic">D</tspan><tspan dy="3.3" font-size="10.5">1</tspan><tspan dy="-3.3"> = 0,08  (0,16 recommended below 5 kHz)</tspan></text><text x="58" y="435" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#4da3d8" text-anchor="start" font-weight="600" xml:space="preserve"><tspan font-style="italic">V</tspan><tspan> = 200 m³ · </tspan><tspan font-style="italic">T</tspan><tspan dy="3.3" font-size="10.5">60</tspan><tspan dy="-3.3"> = 2,0 s  →  </tspan><tspan font-style="italic">d</tspan><tspan dy="3.3" font-size="10.5">min</tspan><tspan dy="-3.3"> = 0,8 m,  or 1,6 m at the recommended </tspan><tspan font-style="italic">D</tspan><tspan dy="3.3" font-size="10.5">1</tspan></text><text x="58" y="458" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" xml:space="preserve"><tspan>six positions: &gt; 1,0 m from every room surface · &gt; </tspan><tspan font-style="italic">d</tspan><tspan dy="3.3" font-size="10.5">min</tspan><tspan dy="-3.3"> from the source · spacing ≥ </tspan><tspan font-style="italic">λ</tspan><tspan>/2 (1,7 m at 100 Hz)</tspan></text><text x="58" y="481" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" xml:space="preserve"><tspan>traverse instead: ≥ </tspan><tspan font-style="italic">d</tspan><tspan dy="3.3" font-size="10.5">min</tspan><tspan dy="-3.3"> from the source · ≥ 1,0 m from any surface · ≥ 0,5 m from a diffuser</tspan></text><text x="58" y="504" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" xml:space="preserve"><tspan>· not within 10° of a room surface · length ≥ 3</tspan><tspan font-style="italic">λ</tspan><tspan> or 10,3 m, whichever is smaller</tspan></text><text x="58" y="527" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#5abf5a" text-anchor="start" font-weight="600" xml:space="preserve"><tspan>comparison method: the same six positions, and no </tspan><tspan font-style="italic">A</tspan><tspan>, no </tspan><tspan font-style="italic">V</tspan><tspan>, no </tspan><tspan font-style="italic">S</tspan><tspan>, no Waterhouse and no </tspan><tspan font-style="italic">C</tspan><tspan dy="3.3" font-size="10.5">1</tspan><tspan dy="-3.3"> in Eq. 21</tspan></text><text x="58" y="550" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e46a6a" text-anchor="start" font-weight="600">averaging ≥ 30 s at and below 160 Hz, ≥ 10 s from 200 Hz up · background at the same positions, just before or after</text><text x="58" y="573" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9a9a9a" text-anchor="start" xml:space="preserve"><tspan>hard walls, </tspan><tspan font-style="italic">α</tspan><tspan> &lt; 0,06 within one wavelength of the source · </tspan><tspan font-style="italic">T</tspan><tspan dy="3.3" font-size="10.5">60</tspan><tspan dy="-3.3"> per ISO 3382-2 from the first 10 dB or 15 dB only</tspan></text></svg>