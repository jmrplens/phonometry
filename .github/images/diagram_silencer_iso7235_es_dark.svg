" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">caja de altavoces estanca</text><text x="230.0" y="468" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">filtro modal</text><text x="320.0" y="468" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">transición</text><text x="687.5" y="468" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">conducto de ensayo, terminación anecoica</text><text x="687.5" y="488" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">tres posiciones en una línea inclinada respecto al eje, a media longitud</text><text x="450.0" y="488" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle" xml:space="preserve"><tspan>planos </tspan><tspan font-style="italic">r</tspan><tspan> ≤ 0,3</tspan></text><text x="60" y="532" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="start" xml:space="preserve"><tspan font-style="italic">D</tspan><tspan dy="3.7" font-size="11.9" font-style="italic">i</tspan><tspan dy="-3.7"> = </tspan><tspan font-style="italic">L</tspan><tspan dy="3.7" font-size="11.9" font-style="italic">pI</tspan><tspan dy="-3.7"> − </tspan><tspan font-style="italic">L</tspan><tspan dy="3.7" font-size="11.9" font-style="italic">pII</tspan><tspan dy="-3.7">, tercio de octava a tercio de octava</tspan></text><text x="60" y="562" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="start">filtro modal: ≥ 3 dB sobre el modo fundamental en el extremo grave,</text><text x="60" y="582" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="start">≥ 5 dB por encima del corte de los modos superiores (5.2.2.3)</text><text x="60" y="602" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="start">conducto de sustitución: la carcasa vacía si es posible; si no,</text><text x="60" y="622" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="start">ajustado al 5 % en cada dimensión lineal (5.2.3)</text><text x="468" y="562" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="start" xml:space="preserve"><tspan>coeficiente de reflexión </tspan><tspan font-style="italic">r</tspan><tspan> ≤ 0,3 en los planos de calificación</tspan></text><text x="468" y="582" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="start">emisor y receptor (5.2.2.5, 5.2.4.3)</text><text x="468" y="602" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="start">señal ≥ 6 dB y preferiblemente ≥ 10 dB sobre el ruido de fondo</text><text x="468" y="622" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="start">(5.2.2.2); tercios de octava IEC 61260, cadena clase 1 (5.2.4.6)</text><text x="60" y="668" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e6e6e6" text-anchor="start">lo que se declara es una pérdida por inserción frente a un conducto de sustitución, no por transmisión</text><text x="60" y="692" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9a9a9a" text-anchor="start">y la pérdida por inserción límite de la instalación, por flancos en las paredes del conducto, acota lo que puede declarar</text></svg>