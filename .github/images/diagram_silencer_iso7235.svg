tica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">sealed, lined loudspeaker box</text><text x="230.0" y="468" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">modal filter</text><text x="320.0" y="468" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">transition</text><text x="687.5" y="468" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">test duct, anechoic termination</text><text x="687.5" y="488" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">three positions on a line inclined to the axis, at mid-length</text><text x="450.0" y="488" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">r</tspan><tspan> ≤ 0.3 planes</tspan></text><text x="60" y="532" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="start" xml:space="preserve"><tspan font-style="italic">D</tspan><tspan dy="3.7" font-size="11.9" font-style="italic">i</tspan><tspan dy="-3.7"> = </tspan><tspan font-style="italic">L</tspan><tspan dy="3.7" font-size="11.9" font-style="italic">pI</tspan><tspan dy="-3.7"> − </tspan><tspan font-style="italic">L</tspan><tspan dy="3.7" font-size="11.9" font-style="italic">pII</tspan><tspan dy="-3.7">, one third octave at a time</tspan></text><text x="60" y="562" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="start">modal filter: ≥ 3 dB on the fundamental at the low-frequency end,</text><text x="60" y="582" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="start">≥ 5 dB above the cut-on of higher-order modes (5.2.2.3)</text><text x="60" y="602" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="start">substitution duct: the empty housing where possible, otherwise</text><text x="60" y="622" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="start">matched within 5 % in every linear dimension (5.2.3)</text><text x="468" y="562" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="start" xml:space="preserve"><tspan>reflection coefficient </tspan><tspan font-style="italic">r</tspan><tspan> ≤ 0.3 at the source and receiving</tspan></text><text x="468" y="582" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="start">qualification planes (5.2.2.5, 5.2.4.3)</text><text x="468" y="602" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="start">signal ≥ 6 dB and preferably ≥ 10 dB above the background</text><text x="468" y="622" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="start">(5.2.2.2); IEC 61260 third octaves, class 1 chain (5.2.4.6)</text><text x="60" y="668" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start">the reported figure is an insertion loss against a substitution duct, not a transmission loss</text><text x="60" y="692" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#666666" text-anchor="start">and the facility's own limiting insertion loss — flanking along the duct walls — caps what it can report at all</text></svg>