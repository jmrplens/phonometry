name: Python CI

on:
  push:
    branches: [ "master", "main" ]
  # No base-branch filter: a pull request stacked on another branch is the
  # half still to be reviewed, and runs every job. Nothing runs twice: push
  # fires on the two trunks alone, and sonar and pr-comment key on
  # github.event_name, not on the base.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A push to a pull request cancels the run of the commit it replaces, which
# can no longer be merged, and hands its runners to the run that can. Only
# pull request runs give way, and only to a newer run of the same pull
# request: a push to main and a run dispatched by hand each get a group of
# their own, so the run the release waits for on a merge commit is never
# cancelled by another. A re-run cancels nothing: re-run jobs of an older
# commit wait for the run of the newer head to finish instead of cancelling it.
concurrency:
  group: python-app-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

# Every job ends at a limit of its own, above its longest measured run with
# room for a slow mirror or a loaded runner: one still going past it has hung,
# and would otherwise hold a runner, under the account's cap on concurrent
# jobs, for six hours. A hung test ends fifteen minutes after it started
# (pyproject.toml), and the test jobs run one thread per pool, so the xdist
# workers do not oversubscribe the cores.
#
# pip prints a notice whenever the pip a step runs lags its newest
# release, which says nothing about the build and lands in every log.
env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

# The test jobs, the figures, the snippets, the remote node and the macOS
# job start with the run; the short jobs run one after another in two lanes,
# one from quality and one from release-build, the two jobs pr-comment and
# the macOS rebuild wait for, so a run holds a few runners under the
# account's cap rather than one for every job. Each link waits on the one
# before it under !cancelled(): a red link skips none after it, and a
# cancelled run stops the lane. Re-running a failed link re-runs the links
# after it. tests/ci_lanes.json lists the lanes and the durations they are
# balanced on, each lane well inside the test matrix.
jobs:
  # Scope. Each job that can skip runs only when the pull request changes a
  # file it reads: scripts/ci_scope.py names, job by job, the paths and the
  # scripts (with every module they import) that reach it, and writes the
  # jobs no changed file reaches. One leg of the tests, lint, the guard
  # groups, the release builds, SonarCloud and the comment run on every pull
  # request. The library, its pins, VERSION, the Makefile, this workflow and
  # its scripts reach every job, and so does a file the map does not know. A
  # push, a dispatch and any doubt run everything: a job skips only when the
  # answer names it, so a failed or empty answer runs it.
  scope:
    name: Scope / jobs to run
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.scope.outputs.skip }}
      tests-exclude: ${{ steps.scope.outputs.tests-exclude }}
    steps:
    # The scope reads the imports of the modules under scripts/ and tests/,
    # and nothing else of the checkout.
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        sparse-checkout: |
          scripts/**/*.py
          tests/**/*.py
        sparse-checkout-cone-mode: false
    # The newest Python the package supports parses every module it reads.
    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    # A renamed file counts by both its names, so a file moved out of the code
    # into docs/ is still a change to the code.
    - name: Name the jobs no changed file reaches
      id: scope
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT: ${{ github.event_name }}
        REPOSITORY: ${{ github.repository }}
        PULL: ${{ github.event.pull_request.number }}
      run: |
        : > changed.txt
        if [ "$EVENT" = pull_request ]; then
          gh api --paginate "repos/$REPOSITORY/pulls/$PULL/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' > changed.txt || : > changed.txt
        fi
        python scripts/ci_scope.py < changed.txt | tee -a "$GITHUB_OUTPUT"

  # Tests. The library's suite on every Python the package supports and on
  # the three systems, the numba-jitted kernel on the newest Python, and the
  # library at its dependency floors. They hold most of a run's runner time
  # and its critical path, so they come first.

  tests:
    name: Tests / ${{ matrix.python-version }} ${{ startsWith(matrix.os, 'ubuntu') && 'Linux' || startsWith(matrix.os, 'macos') && 'macOS' || 'Windows' }}
    needs: scope
    # The scope only narrows the matrix: a failed scope leaves every cell.
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    # Longest cell measured: 65 min, macOS on 3.12 in run 44041238523.
    timeout-minutes: 95
    permissions:
      contents: read
      # Required for the OIDC-based Codecov upload (no token secret needed).
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest, windows-latest]
        # tests/test_minimum_requirements.py holds this list to pyproject.toml.
        python-version: ["3.12", "3.13", "3.14"]
        # Every cell but Linux on 3.13 (the one SonarCloud and the comment
        # read) on a documentation change; none on any other.
        exclude: ${{ fromJSON(needs.scope.outputs.tests-exclude || '[]') }}
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install the dev dependencies
      id: install
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -e .
    # The heavy oracle sets are not fetched: their suites read tests/data/.
    - name: The library's tests pass
      id: tests
      # The step took at most 43 min; a hung test still ends inside 80.
      timeout-minutes: 80
      env:
        OMP_NUM_THREADS: "1"
        MKL_NUM_THREADS: "1"
        OPENBLAS_NUM_THREADS: "1"
        NUMEXPR_NUM_THREADS: "1"
        VECLIB_MAXIMUM_THREADS: "1"
      run: |
        pytest -n auto --junitxml=test-results-${{ matrix.os }}-${{ matrix.python-version }}.xml --cov=src --cov-report=xml
    # Leaves each runner's float32 measurement in the log (torch: array-api).
    - name: Record the NumPy float32 measurement
      run: pytest -q -rfEP tests/simulation/test_backend_tolerance.py -k "cpu and float32 and not torch"
    - name: Keep the test results
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
        path: |
          test-results-${{ matrix.os }}-${{ matrix.python-version }}.xml
          coverage.xml
      if: always()
    - name: Send the coverage to Codecov
      if: matrix.os == 'ubuntu-26.04'
      uses: codecov/codecov-action@v7
      with:
        files: coverage.xml
        use_oidc: true
        fail_ci_if_error: false

  # The numba-jitted kernel on the newest numba, in an environment of its own
  # since numba pins numpy; minimum-versions builds it at the floor.
  tests-perf:
    name: Tests / numba JIT 3.14
    needs: scope
    if: ${{ !cancelled() && (!contains(needs.scope.outputs.skip, ',tests-perf,')) }}
    runs-on: ubuntu-26.04
    # 14 to 40 min in its passing runs on main, nearly all in the tests.
    timeout-minutes: 50
    permissions:
      contents: read
    env:
      # conftest.py disables JIT by default, for coverage; this job turns it on.
      NUMBA_DISABLE_JIT: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    # The newest Python the package supports, where a compiled extension is
    # likeliest to break: numba ships cp314 wheels from 0.63.0, and
    # pyproject.toml gives 3.14 numba>=0.63.0 as its floor.
    - name: Set up Python 3.14
      id: python
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"
        cache: 'pip'
    - name: Install the dev dependencies and the perf and plot extras
      id: install
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -e ".[perf,plot]"
    # Fails on a fallback to the interpreted path, and warms numba's cache.
    - name: The jitted kernel compiles
      id: jit-kernel
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: python scripts/check_jit_kernel.py
    - name: The library's tests pass with the kernel jitted
      id: tests
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      # The matrix runs the whole-tree tests; with them this step took 39 min.
      run: pytest -q -n auto --without-whole-tree

  # The floors pyproject.toml declares for each Python, installed exactly
  # (scripts/minimum_requirements.py --check), with the type completeness,
  # the jitted kernels and the library's tests at them.
  minimum-versions:
    name: Tests / floors
    needs: scope
    if: ${{ !cancelled() && (!contains(needs.scope.outputs.skip, ',minimum-versions,')) }}
    runs-on: ubuntu-26.04
    # 14 to 40 min in its passing runs, nearly all in the tests.
    timeout-minutes: 50
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # tests/test_minimum_requirements.py holds this list to pyproject.toml.
        python-version: ["3.12", "3.13", "3.14"]
    env:
      NUMBA_DISABLE_JIT: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      id: python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install the floors pyproject.toml declares for this Python, exactly
      id: install
      run: |
        python -m pip install --upgrade pip
        python scripts/minimum_requirements.py > minimum-requirements.txt
        cat minimum-requirements.txt
        # The test tools at the versions the main matrix pins.
        grep -E '^(pytest|pytest-xdist|pypdf|pypdfium2|pystoi|pyyaml|jsonschema)==' requirements-dev.txt | cut -d' ' -f1 > test-tools.txt
        # torch's floor alone from its CPU index: the CUDA wheels are
        # gigabytes, and with PyPI beside that index pip could take them.
        pip install --index-url https://download.pytorch.org/whl/cpu torch -c minimum-requirements.txt
        pip install -r minimum-requirements.txt -r test-tools.txt
        pip install --no-deps -e .
        python scripts/minimum_requirements.py --check
    - name: Type completeness is 100% at the floors
      id: type-completeness
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: |
        set -o pipefail
        grep -E '^pyright\[nodejs\]==' requirements-dev.txt | cut -d' ' -f1 > pyright-pin.txt
        pip install -r pyright-pin.txt -c minimum-requirements.txt
        python scripts/minimum_requirements.py --check
        pyright --verifytypes phonometry --ignoreexternal | tee "$RUNNER_TEMP/verifytypes.txt"
        grep -qx 'Type completeness score: 100%' "$RUNNER_TEMP/verifytypes.txt"
    - name: The jitted kernels compile at the numba floor
      id: jit-kernel
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: python scripts/check_jit_kernel.py
    # The floors again: pyright, installed beside them, may stop before it.
    - name: The library's tests pass at the floors
      id: library-tests
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: |
        python scripts/minimum_requirements.py --check
        pytest -q -n auto --without-pinned-stack --without-whole-tree

  # Generated. The committed figures and example fiches against a fresh
  # regeneration on their pinned stacks.

  # The committed figures against a fresh `make graphs` on the pinned stack
  # (requirements-figures.txt), which also fixes the plates' glyph outlines.
  figures:
    name: Generated / figures
    needs: scope
    if: ${{ !cancelled() && (!contains(needs.scope.outputs.skip, ',figures,')) }}
    runs-on: ubuntu-26.04
    # 32 min at the longest in the measured runs, nearly all of it make graphs.
    timeout-minutes: 65
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python 3.13
      id: python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
        cache: 'pip'
    - name: Install the locked figure-rendering stack
      id: install
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        # Pin the render+compute stack last so it wins over looser deps.
        pip install -r requirements-figures.txt
    - name: Every label's mathematics parses
      id: mathtext
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      # Before the regeneration, which an unparseable label aborts.
      run: python scripts/check_mathtext.py
    - name: No Spanish label keeps an English decimal point
      id: decimal-comma-labels
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: python scripts/check_decimal_comma.py --labels
    # Runs after a red decimal-comma check, not after a red mathematics one.
    - name: Regenerate figures and diagrams
      id: graphs
      if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.mathtext.outcome == 'success' }}
      run: make graphs
    - name: The plates regenerate to identical bytes
      id: plates-reproducible
      if: ${{ !cancelled() && steps.graphs.outcome == 'success' }}
      # Two runs in one job agree byte for byte, stricter than the gate below.
      run: |
        mkdir /tmp/plates-first-run
        cp .github/images/diagram_*.svg .github/images/sound_power_methods*.svg /tmp/plates-first-run/
        python scripts/generate_diagrams.py
        for f in /tmp/plates-first-run/*.svg; do
          cmp "$f" ".github/images/$(basename "$f")"
        done
    - name: Documentation figures up to date
      id: figures
      if: ${{ !cancelled() && steps.graphs.outcome == 'success' }}
      run: python scripts/check_figures.py
    - name: Every shaded region is legible
      id: figure-contrast
      if: ${{ !cancelled() && steps.graphs.outcome == 'success' }}
      run: python scripts/check_figure_contrast.py
    - name: Every line can be seen on the dark page
      id: stroke-contrast
      if: ${{ !cancelled() && steps.graphs.outcome == 'success' }}
      run: python scripts/check_stroke_contrast.py
    - name: The Spanish figures are in Spanish
      id: figure-language
      if: ${{ !cancelled() && steps.graphs.outcome == 'success' }}
      run: python scripts/check_figure_language.py
    - name: Every annotation on a figure can be read
      id: figure-annotations
      if: ${{ !cancelled() && steps.graphs.outcome == 'success' }}
      run: python scripts/check_figure_annotations.py
    - name: No two tick labels of one axis run into each other
      id: figure-ticks
      if: ${{ !cancelled() && steps.graphs.outcome == 'success' }}
      run: python scripts/check_figure_ticks.py
    - name: No Spanish figure numbers a tick with an English point
      id: figure-decimal-point
      if: ${{ !cancelled() && steps.graphs.outcome == 'success' }}
      run: python scripts/check_figure_decimal_point.py
    - name: No legend closes over a plotted point
      id: figure-legends
      if: ${{ !cancelled() && steps.graphs.outcome == 'success' }}
      run: python scripts/check_figure_legends.py
    - name: No legend, curve or marker covers a tick label
      id: figure-tick-clearance
      if: ${{ !cancelled() && steps.graphs.outcome == 'success' }}
      run: python scripts/check_figure_tick_clearance.py
    - name: No label is drawn over a tick label, another label or a line
      id: figure-text-clearance
      if: ${{ !cancelled() && steps.graphs.outcome == 'success' }}
      run: python scripts/check_figure_text_clearance.py
    - name: No figure signs a number with a hyphen
      id: figure-minus-sign
      if: ${{ !cancelled() && steps.graphs.outcome == 'success' }}
      run: python scripts/check_figure_minus_sign.py

  # The committed example fiches (.github/reports) against a fresh `make
  # reports`, on the stack requirements-figures.txt and requirements-reports.txt
  # pin between them: every link of the chain fixes the page the check compares.
  reports:
    name: Generated / fiches
    needs: [built-package, scope]
    if: ${{ !cancelled() && (!contains(needs.scope.outputs.skip, ',reports,')) }}
    runs-on: ubuntu-26.04
    # 4.2 min at the longest in the measured runs.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
        cache: 'pip'
    - name: Install the locked fiche-rendering stack
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        # Pin the render+compute stack last so it wins over looser deps.
        pip install -r requirements-figures.txt -r requirements-reports.txt
    - name: Regenerate the example fiches
      run: make reports
    - name: Example report fiches up to date
      id: reports
      # The text exactly and the page within a pixel tolerance: the runners' CPUs
      # move the embedded plot by ~1 ULP (scripts/check_reports.py).
      run: python scripts/check_reports.py

  # Docs. The snippets the guides print, run as a reader runs them.

  # Every Python snippet the guides print, run in page order as a reader runs
  # it, on the extras and the pinned figure and report stacks the pages use.
  doc-snippets:
    name: Docs / snippets run
    runs-on: ubuntu-26.04
    needs: scope
    if: ${{ !cancelled() && (!contains(needs.scope.outputs.skip, ',doc-snippets,')) }}
    # 12 min at the longest in the measured runs, and installing
    # ffmpeg from Ubuntu's mirror took 15 and 17 min in two runs of the video
    # job.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
        cache: 'pip'
    # The video guide's examples encode, so the snippets run where ffmpeg is.
    - name: Install ffmpeg
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends ffmpeg
    - name: Install the audio extra and the figure and report stacks
      id: install
      run: |
        python -m pip install --upgrade pip
        # The io guide reads and writes audio, the contributor guide's examples
        # wait on pytest.raises.
        pip install -e ".[audio]"
        pip install -r requirements-figures.txt -r requirements-reports.txt
        grep -E '^pytest==' requirements-dev.txt | cut -d' ' -f1 > snippet-tools.txt
        pip install -r snippet-tools.txt
    - name: Documentation snippets run
      id: doc-snippets
      run: python scripts/check_doc_snippets.py

  # Lint. Ruff, mypy, bandit and zizmor over the tree, with the checks that
  # need the dev install beside them.

  quality:
    name: Lint / code, workflows
    runs-on: ubuntu-26.04
    # 3.4 min at the longest in the measured runs.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - id: checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python 3.13
      id: python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
        cache: 'pip'
    - name: Install the runtime, dev and notebook dependencies
      id: install
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -r requirements-notebook.txt
        pip install -e .
    # Each check runs whatever the ones before it said.
    - name: No merge-conflict marker is committed
      id: conflict-markers
      if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
      run: |
        if git grep -nE '^(<{7} |>{7} )' -- . ; then
          echo "::error::Unresolved merge-conflict markers found in the files listed above."
          exit 1
        fi
    # Blobless: the clips' names are a few hundred kB, the clips 0.3 GB.
    - name: Fetch the names of the published clips, without the clips
      id: clip-names
      if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
      run: |
        git init -q assets-tree
        git -C assets-tree remote add origin https://github.com/jmrplens/phonometry-assets.git
        git -C assets-tree fetch -q --depth 1 --filter=blob:none origin "$(cat assets.lock)"
        git -C assets-tree ls-tree -r --name-only FETCH_HEAD images/ > assets-manifest.txt
        echo "$(wc -l < assets-manifest.txt) clip files published at $(cut -c1-12 assets.lock)"
    - name: Every published clip matches the code that draws it
      id: animation-freshness
      if: ${{ !cancelled() && steps.python.outcome == 'success' && steps.clip-names.outcome == 'success' }}
      run: python scripts/check_animation_freshness.py --manifest assets-manifest.txt
    - name: No lint finding (ruff)
      id: ruff
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: ruff check .
    - name: Every file formatted (ruff format)
      id: ruff-format
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: ruff format --check .
    # Bare `mypy`: the paths it checks are `files` under [tool.mypy] in
    # pyproject.toml, which `make lint` and every page that gives the command
    # read too. While each of them spelled the list out, two had already
    # dropped `stub/src` without anything noticing.
    # `stub/src` is in that list because it was in no path list at all. The
    # PyOctaveBand transition shim lives outside the package this repository
    # installs, so nothing here ever imported or type checked it, and two
    # defects reached its published page that way. Ruff walks the tree from
    # `.` and has always reached the shim; mypy takes the paths it is given,
    # and this one was never among them. `tests/static_typing` holds what
    # only a type checker can see, such as a published catalogue joined with
    # a caller's being accepted by a lookup's `catalogue=`: the suite runs
    # those files, but a wrong annotation passes at run time.
    # `.github/scripts` holds the scripts CI runs itself, the one that writes
    # this pull request's comment and the one that names the failed steps of
    # a grouped job, which sat under none of the paths. And the conformance
    # scripts compare against the oracle tables in `tests/`: until the
    # checker was told where those live, every value read from them was
    # `Any` and the comparison went unchecked.
    - name: Every annotation type checks (mypy)
      id: mypy
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: mypy
    - name: No security finding in src (bandit)
      id: bandit
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: bandit -r src
    # Settings in .github/zizmor.yml; the token lets it look up advisories.
    - name: No workflow finding (zizmor)
      id: zizmor
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: zizmor --config .github/zizmor.yml --format github .github/

  # Guards. The repository's own checks, one job for each thing they need:
  # nothing installed for the published text and for the source, the runtime
  # dependencies for the package. Each guard is a step of its own that runs
  # whatever the others said and writes no bytecode; the guards only read, so
  # a file one leaves behind fails the clean-tree step. The last step names
  # every failed step on the checks page, unless the checkout itself failed.

  # The guards that read the published text, then the llms drift gate.
  # Nothing is installed with pip (tests/test_scripts_without_numpy.py).
  guards-prose:
    name: Guards / prose
    needs: guards-package
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    # About 5.1 min by the medians of its steps, 5.8 by their maxima.
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
    - id: checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python 3.13
      id: python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: Errata entries cite their page
      id: errata-evidence
      if: ${{ !cancelled() && steps.python.outcome == 'success' }}
      run: python scripts/check_errata_evidence.py
    - name: Generated evidence pages up to date
      id: site-reports
      if: ${{ !cancelled() && steps.python.outcome == 'success' }}
      run: python scripts/generate_site_reports.py --check
    - name: Every catalogue link opens the document beside it
      id: catalogue-links
      if: ${{ !cancelled() && steps.python.outcome == 'success' }}
      run: python scripts/check_catalogue_links.py
    - name: Euler's number is upright
      id: euler-number
      if: ${{ !cancelled() && steps.python.outcome == 'success' }}
      run: python scripts/check_euler_number.py
    - name: No stray control character
      id: control-characters
      if: ${{ !cancelled() && steps.python.outcome == 'success' }}
      run: python scripts/check_control_characters.py
    - name: No style default collides with its own alias
      id: plot-style-defaults
      if: ${{ !cancelled() && steps.python.outcome == 'success' }}
      run: python scripts/check_plot_style_defaults.py
    - name: One meaning per subscript per file
      id: subscript-slope
      if: ${{ !cancelled() && steps.python.outcome == 'success' }}
      run: python scripts/check_subscript_slope.py
    - name: Markdown renders the way it reads
      id: markdown-hazards
      if: ${{ !cancelled() && steps.python.outcome == 'success' }}
      run: python scripts/check_markdown_hazards.py
    - name: Docstring mathematics reaches the page intact
      id: docstring-math
      if: ${{ !cancelled() && steps.python.outcome == 'success' }}
      run: python scripts/check_docstring_math.py
    - name: Every install command quotes its extras
      id: quoted-extras
      if: ${{ !cancelled() && steps.python.outcome == 'success' }}
      run: python scripts/check_quoted_extras.py
    - name: Documentation fences read in order
      id: fence-names
      if: ${{ !cancelled() && steps.python.outcome == 'success' }}
      run: python scripts/check_fence_names.py
    - name: Every script reads an inline code span the one way
      id: span-readers
      if: ${{ !cancelled() && steps.python.outcome == 'success' }}
      run: python scripts/check_span_readers.py
    - name: Every Spanish string keeps its accents and eñes and uses the glossary's terms
      id: spanish-accents
      if: ${{ !cancelled() && steps.python.outcome == 'success' }}
      run: python scripts/check_spanish_accents.py
    - name: Every script reads a fence the one way
      id: fence-readers
      if: ${{ !cancelled() && steps.python.outcome == 'success' }}
      run: python scripts/check_fence_readers.py
    - name: No grouped number can break across a line
      id: digit-grouping
      if: ${{ !cancelled() && steps.python.outcome == 'success' }}
      run: python scripts/check_digit_grouping.py
    - name: English text writes the decimal point
      id: decimal-comma
      if: ${{ !cancelled() && steps.python.outcome == 'success' }}
      run: python scripts/check_decimal_comma.py --english --strict
    - name: No em dash in the published prose
      id: em-dashes
      if: ${{ !cancelled() && steps.python.outcome == 'success' }}
      run: python scripts/check_em_dashes.py
    - name: Every call passes the language on
      id: language-forwarding
      if: ${{ !cancelled() && steps.python.outcome == 'success' }}
      run: python scripts/check_language_forwarding.py
    - name: The guards left the checkout as they found it
      id: clean-tree
      if: ${{ !cancelled() && steps.python.outcome == 'success' }}
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          git status --porcelain
          echo "::error::A guard of this job wrote into the checkout: the files above are what it left."
          exit 1
        fi
    - name: Put the checkout back as committed
      id: reset
      if: ${{ !cancelled() && steps.python.outcome == 'success' }}
      run: |
        git reset --hard -q
        git clean -fdq
    # The llms chain sets up the site's Node and packages as docs.yml does.
    - id: node
      if: ${{ !cancelled() && steps.python.outcome == 'success' }}
      uses: actions/setup-node@v7
      with:
        node-version: 24
    - name: Enable the pnpm the site pins, via corepack
      id: corepack
      if: ${{ !cancelled() && steps.node.outcome == 'success' }}
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      working-directory: site
      run: |
        corepack enable
        pnpm --version
    - name: Resolve pnpm store path
      id: pnpm-store
      if: ${{ !cancelled() && steps.corepack.outcome == 'success' }}
      working-directory: site
      run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
    - name: Cache pnpm store
      id: pnpm-cache
      if: ${{ !cancelled() && steps.pnpm-store.outcome == 'success' }}
      uses: actions/cache@v6
      with:
        path: ${{ env.PNPM_STORE }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('site/pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-
    - name: Regenerate the llms artifacts
      id: llms-regenerate
      if: ${{ !cancelled() && steps.reset.outcome == 'success' && steps.pnpm-store.outcome == 'success' }}
      env:
        PUPPETEER_SKIP_DOWNLOAD: "true"
      run: make llms
    - name: llms artifacts up to date
      id: llms
      if: ${{ !cancelled() && steps.llms-regenerate.outcome == 'success' }}
      run: |
        if ! git diff --exit-code -- llms.txt docs site/src/data/llms-shards.json; then
          echo "::error::The llms artifacts are out of date - run 'make llms' and commit the result."
          exit 1
        fi
        untracked=$(git ls-files --others --exclude-standard -- docs)
        if [ -n "$untracked" ]; then
          echo "::error::Generated llms files are not committed:"
          echo "$untracked"
          exit 1
        fi
    - name: Name the guards that failed
      if: ${{ failure() && steps.checkout.outcome == 'success' }}
      env:
        STEPS: ${{ toJSON(steps) }}
      run: python3 .github/scripts/failed_steps.py

  # The guards that read the source, the tests and the scripts, cheapest
  # first. Nothing is installed (tests/test_scripts_without_numpy.py).
  guards-source:
    name: Guards / source
    needs: guards-prose
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    # About 6.5 min by the medians of its steps, 8.5 by their maxima.
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
    - id: checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python 3.13
      id: python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: Every conformance row runs the library
      id: conformance-rows
      if: ${{ !cancelled() && steps.python.outcome == 'success' }}
      run: python scripts/check_conformance_rows.py
    - name: Every reference value points at ISO 1683 or names its source
      id: reference-values
      if: ${{ !cancelled() && steps.python.outcome == 'success' }}
      run: python scripts/check_reference_values.py
    - name: No private constant goes unread
      id: dead-constants
      if: ${{ !cancelled() && steps.python.outcome == 'success' }}
      run: python scripts/check_dead_constants.py
    - name: Every exception test waits on one call
      id: raises-blocks
      if: ${{ !cancelled() && steps.python.outcome == 'success' }}
      run: python scripts/check_raises_blocks.py
    - name: Every public record shows itself as a table in a notebook
      id: record-display
      if: ${{ !cancelled() && steps.python.outcome == 'success' }}
      run: python scripts/check_record_display.py
    - name: Every numpy type an annotation names carries its type arguments
      id: bare-array-annotations
      if: ${{ !cancelled() && steps.python.outcome == 'success' }}
      run: python scripts/check_bare_array_annotations.py
    - name: Every reader asks what a name holds before it opens it
      id: regular-file-reads
      if: ${{ !cancelled() && steps.python.outcome == 'success' }}
      run: python scripts/check_regular_file_reads.py
    - name: Every return an argument decides is overloaded on it
      id: return-overloads
      if: ${{ !cancelled() && steps.python.outcome == 'success' }}
      run: python scripts/check_return_overloads.py
    - name: No verdict hangs on the last bits of a computed decimal
      id: boundary-comparisons
      if: ${{ !cancelled() && steps.python.outcome == 'success' }}
      run: python scripts/check_boundary_comparisons.py
    - name: Every conversion of a caller's numbers goes through a check
      id: real-conversions
      if: ${{ !cancelled() && steps.python.outcome == 'success' }}
      run: python scripts/check_real_conversions.py
    - name: Every result keeps its own copy of the arrays it was given
      id: array-aliasing
      if: ${{ !cancelled() && steps.python.outcome == 'success' }}
      run: python scripts/check_array_aliasing.py
    - name: Every public parameter admits what its body converts
      id: parameter-annotations
      if: ${{ !cancelled() && steps.python.outcome == 'success' }}
      run: python scripts/check_parameter_annotations.py
    - name: The guards left the checkout as they found it
      id: clean-tree
      if: ${{ !cancelled() && steps.python.outcome == 'success' }}
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          git status --porcelain
          echo "::error::A guard of this job wrote into the checkout: the files above are what it left."
          exit 1
        fi
    - name: Name the guards that failed
      if: ${{ failure() && steps.checkout.outcome == 'success' }}
      env:
        STEPS: ${{ toJSON(steps) }}
      run: python3 .github/scripts/failed_steps.py

  # The guards that import the package, on requirements.txt alone; those that
  # read the committed conformance artefact run before its regeneration. Each
  # drift gate starts from a checkout put back as committed, and the
  # conformance one reads the whole tree, since `make conformance` also
  # rewrites the counts quoted across docs/, .zenodo.json and the site.
  guards-package:
    name: Guards / package
    needs: release-build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    # About 6.7 min by the medians of its steps, 7.6 by their maxima.
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
    - id: checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python 3.13
      id: python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
        cache: 'pip'
    - name: Install the runtime dependencies
      id: install
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
    - name: The books agree about the solids they share
      id: solid-agreement
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: python scripts/check_solid_agreement.py
    - name: Every published catalogue reaches the catalogues page
      id: published-catalogues
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: python scripts/check_published_catalogues_reach_the_page.py
    - name: The committed conformance artefact is internally consistent
      id: conformance-artifact
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: python scripts/check_conformance_artifact.py
    - name: The site accepts and words every conformance vocabulary
      id: conformance-vocabulary
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: python scripts/check_conformance_vocabulary.py
    - name: The catalogue schema the site publishes is current
      id: catalogue-schema
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: python scripts/generate_catalogue_schema.py --check
    - name: The catalogue data the site renders is current
      id: catalogue-data
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: python scripts/generate_catalogue_data.py --check
    - name: The rows two books took from the same place agree
      id: shared-sources
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: python scripts/check_shared_sources.py
    - name: Every published table refuses writes
      id: frozen-constants
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: python scripts/check_frozen_constants.py
    - name: Every published value names its page
      id: published-sources
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: python scripts/check_published_sources.py
    - name: Every public identifier is spelled in American English
      id: identifier-spelling
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: python scripts/check_identifier_spelling.py
    - name: No page quotes a stale conformance count
      id: conformance-claims
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: python scripts/check_conformance_claims.py
    - name: Curated API quick table covers __all__
      id: api-reference
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: python scripts/check_api_reference.py
    - name: Every public quantity names its unit
      id: parameter-units
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: python scripts/check_parameter_units.py
    - name: Every fixed public choice is typed Literal
      id: choice-literals
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: python scripts/check_choice_literals.py
    - name: The guards left the checkout as they found it
      id: clean-tree
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          git status --porcelain
          echo "::error::A guard of this job wrote into the checkout: the files above are what it left."
          exit 1
        fi
    - name: Put the checkout back as committed for the conformance gate
      id: reset-conformance
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: |
        git reset --hard -q
        git clean -fdq
    - name: Regenerate the conformance artefact, the report and the quoted counts
      id: conformance-regenerate
      if: ${{ !cancelled() && steps.reset-conformance.outcome == 'success' }}
      run: make conformance
    - name: Conformance report up to date
      id: conformance
      if: ${{ !cancelled() && steps.conformance-regenerate.outcome == 'success' }}
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          git status --porcelain
          git diff
          echo "::error::The conformance artefact, the report or a count quoted from either is out of date, or a generated file is untracked - run 'make conformance' and commit the result."
          exit 1
        fi
    - name: Put the checkout back as committed for the API reference gate
      id: reset-api-docs
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: |
        git reset --hard -q
        git clean -fdq
    - name: Regenerate the API reference
      id: api-docs-regenerate
      if: ${{ !cancelled() && steps.reset-api-docs.outcome == 'success' }}
      run: make api-docs
    - name: Generated API reference up to date
      id: api-docs
      if: ${{ !cancelled() && steps.api-docs-regenerate.outcome == 'success' }}
      run: |
        if ! git diff --exit-code -- site/src/content/docs/reference/api site/src/generated; then
          echo "::error::The generated API reference is out of date - run 'make api-docs' and commit the result."
          exit 1
        fi
        untracked=$(git ls-files --others --exclude-standard -- site/src/content/docs/reference/api site/src/generated)
        if [ -n "$untracked" ]; then
          echo "::error::Generated API pages are not committed:"
          echo "$untracked"
          exit 1
        fi
    - name: Name the guards that failed
      if: ${{ failure() && steps.checkout.outcome == 'success' }}
      env:
        STEPS: ${{ toJSON(steps) }}
      run: python3 .github/scripts/failed_steps.py

  # Package. What is published, built as it is published: the release build
  # twice and again on macOS, the transition stub, and the wheel as a type
  # checker and Pyodide read it. The stub is stamped with the commit's time
  # (SOURCE_DATE_EPOCH), and only its wheel is rebuilt to compare: setuptools
  # writes the builder's clock, user and modes into the sdist.

  # The build the release publishes (scripts/build_release.py), run on every
  # pull request: twice here, the second held to the checksum file of the
  # first, and once more on macOS against the same file, so a bump of the
  # release tooling that breaks it or a difference between the two systems
  # shows here and not after publishing. The checksum file goes under the
  # runner's temporary directory, since the build refuses a stray file.
  release-build:
    name: Package / build twice
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: Install the release tooling
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements-release.txt
    - name: Build the sdist and the wheel
      env:
        PYTHONWARNINGS: error
      run: python scripts/build_release.py --outdir dist
    - name: Write the checksum file
      run: |
        VERSION=$(tr -d ' \n' < VERSION)
        mkdir "$RUNNER_TEMP/extras"
        (cd dist && sha256sum -- *) > "$RUNNER_TEMP/extras/phonometry-$VERSION.sha256"
        cat "$RUNNER_TEMP/extras/phonometry-$VERSION.sha256"
    - name: Both rebuilds match the checksum file byte for byte
      env:
        PYTHONWARNINGS: error
      run: |
        VERSION=$(tr -d ' \n' < VERSION)
        python scripts/build_release.py --outdir "$RUNNER_TEMP/rebuild" --check "$RUNNER_TEMP/extras/phonometry-$VERSION.sha256"
    - name: The sdist and wheel pass twine check and carry the expected contents
      run: |
        VERSION=$(tr -d ' \n' < VERSION)
        python -m twine check --strict dist/*
        check-wheel-contents dist/*.whl
        python scripts/check_release_artifacts.py dist --version "$VERSION"
    - name: Keep the release checksums
      uses: actions/upload-artifact@v7
      with:
        name: release-checksums
        path: ${{ runner.temp }}/extras/
        if-no-files-found: error
        retention-days: 7

  release-rebuild-macos:
    name: Package / macOS rebuild
    needs: release-build
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    # The Python of the release build: the deflate stream in both files comes
    # from the zlib Python is linked against.
    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    # In a virtual environment of its own, as SECURITY.md has anyone rebuild
    # a release and as the release's own rebuild does.
    - name: Install the release tooling
      run: |
        python -m venv "$RUNNER_TEMP/build-env"
        "$RUNNER_TEMP/build-env/bin/python" -m pip install --upgrade pip
        "$RUNNER_TEMP/build-env/bin/python" -m pip install -r requirements-release.txt
    - name: Fetch the release checksums
      uses: actions/download-artifact@v8
      with:
        name: release-checksums
        path: ${{ runner.temp }}/extras
    - name: A rebuild on macOS matches the Linux build byte for byte
      env:
        PYTHONWARNINGS: error
      run: |
        VERSION=$(tr -d ' \n' < VERSION)
        "$RUNNER_TEMP/build-env/bin/python" scripts/build_release.py --outdir "$RUNNER_TEMP/rebuilt" \
          --check "$RUNNER_TEMP/extras/phonometry-$VERSION.sha256"

  # The transition stub, and the wheel as the release builds it, read by a
  # type checker and loaded in Pyodide: one install of the release tooling,
  # one build of the wheel, and the wheel's checks only when it was built.
  built-package:
    name: Package / stub and wheel
    needs: [quality, scope]
    if: ${{ !cancelled() && (!contains(needs.scope.outputs.skip, ',built-package,')) }}
    runs-on: ubuntu-26.04
    # The type check took most of it; about 1.5 min in all.
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
    - id: checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python 3.13
      id: python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: Install the release tooling
      id: tooling
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements-release.txt
    # First, while the checkout holds nothing build_release.py would refuse.
    - name: Build the wheel as the release does
      id: wheel
      if: ${{ !cancelled() && steps.tooling.outcome == 'success' }}
      env:
        PYTHONWARNINGS: error
      run: python scripts/build_release.py --outdir dist
    - name: The stub builds and passes twine check with the expected contents
      id: stub-build
      if: ${{ !cancelled() && steps.tooling.outcome == 'success' }}
      run: |
        SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) PYTHONWARNINGS=error python -m build --no-isolation stub/
        python -m twine check --strict stub/dist/*
        check-wheel-contents stub/dist/*.whl
    - name: The stub's wheel builds again byte for byte
      id: stub-reproducible
      if: ${{ !cancelled() && steps.stub-build.outcome == 'success' }}
      run: |
        SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) PYTHONWARNINGS=error python -m build --no-isolation --wheel stub/ --outdir "$RUNNER_TEMP/stub-rebuild"
        cmp stub/dist/*.whl "$RUNNER_TEMP"/stub-rebuild/*.whl
    - name: The built stub caps phonometry below the next major and carries its licence
      id: stub-metadata
      if: ${{ !cancelled() && steps.stub-build.outcome == 'success' }}
      run: python scripts/check_stub_metadata.py
    - name: Install the wheel and the pinned pyright in an environment of their own
      id: venv
      if: ${{ !cancelled() && steps.wheel.outcome == 'success' }}
      run: |
        python -m venv "$RUNNER_TEMP/user"
        "$RUNNER_TEMP/user/bin/python" -m pip install --upgrade pip
        grep -E '^pyright\[nodejs\]==' requirements-dev.txt | cut -d' ' -f1 > "$RUNNER_TEMP/pyright-pin.txt"
        "$RUNNER_TEMP/user/bin/python" -m pip install dist/phonometry-*.whl -r "$RUNNER_TEMP/pyright-pin.txt"
    - name: Every public name has a type a type checker knows
      id: type-completeness
      if: ${{ !cancelled() && steps.venv.outcome == 'success' }}
      run: |
        set -o pipefail
        export PATH="$RUNNER_TEMP/user/bin:$PATH" VIRTUAL_ENV="$RUNNER_TEMP/user"
        pyright --verifytypes phonometry --ignoreexternal | tee "$RUNNER_TEMP/verifytypes.txt"
        grep -qx 'Type completeness score: 100%' "$RUNNER_TEMP/verifytypes.txt"
    - id: node
      if: ${{ !cancelled() && steps.wheel.outcome == 'success' }}
      uses: actions/setup-node@v7
      with:
        node-version: 24
    - name: Install the Pyodide tests/pyodide pins, with the pnpm it pins
      id: pyodide-deps
      if: ${{ !cancelled() && steps.node.outcome == 'success' }}
      working-directory: tests/pyodide
      run: |
        corepack enable
        pnpm install --frozen-lockfile
    - name: Restore the packages Pyodide downloads
      id: pyodide-cache
      if: ${{ !cancelled() && steps.pyodide-deps.outcome == 'success' }}
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/pyodide-packages
        key: pyodide-packages-${{ hashFiles('tests/pyodide/pnpm-lock.yaml') }}
    - name: Install the wheel and its plot and report extras with micropip
      id: pyodide-install
      if: ${{ !cancelled() && steps.pyodide-deps.outcome == 'success' }}
      env:
        PYODIDE_PACKAGE_CACHE_DIR: ${{ runner.temp }}/pyodide-packages
      run: node tests/pyodide/smoke.mjs install dist/phonometry-*.whl
    - name: An octave filter bank runs on the numpy and scipy Pyodide ships
      id: pyodide-run
      if: ${{ !cancelled() && steps.pyodide-deps.outcome == 'success' }}
      env:
        PYODIDE_PACKAGE_CACHE_DIR: ${{ runner.temp }}/pyodide-packages
      run: node tests/pyodide/smoke.mjs run dist/phonometry-*.whl
    # Names each failed step on the checks page, unless the checkout failed.
    - name: Name the steps that failed
      if: ${{ failure() && steps.checkout.outcome == 'success' }}
      env:
        STEPS: ${{ toJSON(steps) }}
      run: python3 .github/scripts/failed_steps.py

  # Platform. The numbers held to one platform's C library: Ubuntu 24.04's
  # baseline glibc 2.39, which Ubuntu 26.04 no longer installs. The digests'
  # bits depend on libm and on NumPy's SIMD dispatch, so they are checked in
  # the one environment engine-digests.json records, AVX-512 kernels off.

  # The FDTD engines' golden digests, then the weighting design on glibc's
  # routines without FMA, on one runner, each whatever the other said.
  baseline-glibc:
    name: Platform / glibc 2.39
    needs: [video, scope]
    if: ${{ !cancelled() && (!contains(needs.scope.outputs.skip, ',baseline-glibc,')) }}
    runs-on: ubuntu-24.04
    # Its checks take seconds and the install a few minutes.
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
    - id: checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python 3.13
      id: python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
        cache: 'pip'
    - name: Install the dev dependencies
      id: install
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt
        pip install -e .
    # A meant move is committed with `make engine-digests RUN=<this run's id>`.
    - name: Name NumPy's AVX-512 kernels to switch off
      id: avx512
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: |
        features="$(python scripts/engine_digests.py --avx512-features)"
        echo "features=$features" >> "$GITHUB_OUTPUT"
    - name: Measure the engines' digests
      id: digests-measure
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      env:
        PHONOMETRY_ENGINE_DIGESTS: require
        NPY_DISABLE_CPU_FEATURES: ${{ steps.avx512.outputs.features }}
      run: python scripts/engine_digests.py --output engine-digests.measured.json
    - name: FDTD engines hold their golden digests
      id: engine-digests
      if: (success() || failure()) && steps.avx512.outcome == 'success'
      env:
        PHONOMETRY_ENGINE_DIGESTS: require
        NPY_DISABLE_CPU_FEATURES: ${{ steps.avx512.outputs.features }}
      run: pytest -q -n0 tests/simulation/test_engine_golden_digests.py
    - name: Keep the measured digests
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: engine-digests-measured
        path: engine-digests.measured.json
    # Last, on NumPy's own kernels; a skip checks nothing, so any fails it.
    - name: The weighting design on glibc's routines without FMA
      id: glibc-without-fma
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: |
        set -o pipefail
        pytest -q --color=no -rfEPs tests/test_libm_identity.py \
          "tests/filters/test_weighting_design.py::test_glibc_without_its_fma_variant_designs_the_documented_bytes" \
          | tee "$RUNNER_TEMP/glibc-tests.txt"
        if grep -q '^SKIPPED' "$RUNNER_TEMP/glibc-tests.txt"; then
          echo "::error::A test of glibc's build skipped instead of running on the baseline glibc."
          exit 1
        fi
    # Names each failed step on the checks page, unless the checkout failed.
    - name: Name the steps that failed
      if: ${{ failure() && steps.checkout.outcome == 'success' }}
      env:
        STEPS: ${{ toJSON(steps) }}
      run: python3 .github/scripts/failed_steps.py

  # FDTD. The simulation engines on the Array API backends, on Apple's GPU
  # and on a remote node.

  # The FDTD engines on array-api-strict, which refuses any call outside the
  # standard, and on torch on CPU, held to the tolerance the guide publishes.
  array-api:
    name: FDTD / array-api, torch
    needs: [baseline-glibc, scope]
    if: ${{ !cancelled() && (!contains(needs.scope.outputs.skip, ',array-api,')) }}
    runs-on: ubuntu-26.04
    # Under 5 min in its last 18 passing runs.
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    # A pip cache key of its own, so the cache it saves holds torch.
    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt
          requirements-torch.txt
    # torch from its CPU index alone: PyPI's would bring the CUDA wheels.
    - name: Install the dev dependencies and torch from its CPU index
      id: install
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt
        pip install --index-url https://download.pytorch.org/whl/cpu torch -c requirements-torch.txt
        pip install -r requirements-torch.txt
        pip install -e .
    # -rfEP prints what each passing tolerance test measured, and where.
    - name: The simulation tests pass on array-api-strict and torch
      id: backend-tests
      run: pytest -q -rfEP -n auto tests/simulation

  # Apple's MPS device, on the macOS runners that can allocate on it: the
  # float32 tolerance the guide gives torch:mps and the compensated contour.
  mps:
    name: FDTD / torch MPS
    needs: scope
    if: ${{ !cancelled() && (!contains(needs.scope.outputs.skip, ',mps,')) }}
    runs-on: macos-15
    # Under 2 min in its last 18 passing runs.
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    # A cache key of its own too, apart from the macOS 3.13 cell of the matrix.
    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt
          requirements-torch.txt
    # torch 2.15 skips the runners' paravirtual GPU as no MPS device
    # (pytorch/pytorch#202529); this job keeps 2.14.1 until a release reads it.
    - name: Install the dev dependencies and torch
      id: install
      run: |
        python -m pip install --upgrade pip
        grep -v '^torch==' requirements-torch.txt > requirements-torch-mps.txt
        pip install -r requirements.txt -r requirements-dev.txt -r requirements-torch-mps.txt torch==2.14.1
        pip install -e .
    - name: The tolerance and contour tests pass on a usable MPS device
      id: mps-tests
      run: |
        python -c "import torch, sys; ok = torch.backends.mps.is_available() and torch.ones(4, device='mps').sum().item() == 4.0; sys.exit(0 if ok else 'no usable MPS device on this runner')"
        pytest -q -rfEP tests/simulation/test_backend_tolerance.py tests/simulation/test_fdtd_backends.py -k "torch:mps"

  # A run on a node matches the run here bit for bit: the image's cpu stage,
  # served through sshd on localhost, runs the simulations and a video.
  remote-node:
    name: FDTD / remote node
    needs: scope
    if: ${{ !cancelled() && (!contains(needs.scope.outputs.skip, ',remote-node,')) }}
    # The release the image's cpu stage starts from, for the same libm.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # An uncached image build takes minutes, Ubuntu's ffmpeg up to 17 min.
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: The node image's Dockerfile and provisioning script lint clean
      run: |
        docker run --rm -i hadolint/hadolint:v2.15.1 hadolint --failure-threshold warning - < docker/node/Dockerfile
        shellcheck docker/node/provision.sh
    # No pip cache: zizmor's cache-poisoning rule reads this job as publishing.
    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: Install the dev dependencies
      id: install
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt
        pip install -e .
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build the node image for a CPU
      uses: docker/build-push-action@v7
      env:
        DOCKER_BUILD_RECORD_UPLOAD: "false"
      with:
        context: .
        file: docker/node/Dockerfile
        target: cpu
        tags: phonometry-node:cpu
        load: true
        cache-from: type=gha,scope=node-cpu
        cache-to: type=gha,mode=max,scope=node-cpu
    # sshd on 127.0.0.1 alone, with a key made here; each run ends at 5 min.
    - name: Serve the node through sshd on localhost
      run: |
        user="$(id -un)"
        sudo usermod -p '*' "$user"
        sudo ssh-keygen -A
        sudo mkdir -p /run/sshd
        sudo /usr/sbin/sshd -p 2222 -o ListenAddress=127.0.0.1 -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no \
          -E "$RUNNER_TEMP/sshd.log"
        install -d -m 700 ~/.ssh
        ssh-keygen -q -t ed25519 -N "" -f ~/.ssh/node_key
        cat ~/.ssh/node_key.pub >> ~/.ssh/authorized_keys
        chmod 600 ~/.ssh/authorized_keys
        chmod go-w ~
        printf '%s\n' "Host phonometry-ci-node" "  HostName 127.0.0.1" "  Port 2222" "  User $user" \
          "  IdentityFile ~/.ssh/node_key" "  IdentitiesOnly yes" \
          "  StrictHostKeyChecking accept-new" "  UserKnownHostsFile ~/.ssh/known_hosts_node" >> ~/.ssh/config
        chmod 600 ~/.ssh/config
        ssh -o BatchMode=yes phonometry-ci-node "docker image inspect --format '{{.Id}}' phonometry-node:cpu"
        printf '%s\n' "[hosts.ci]" 'ssh = "phonometry-ci-node"' 'runner = "docker"' \
          'image = "phonometry-node:cpu"' 'label = "the localhost node of CI"' 'timeout_s = 300' \
          > "$RUNNER_TEMP/hosts.toml"
    - name: Install ffmpeg
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends ffmpeg
    - name: The simulations run on the node match the ones run here
      id: node-runs
      env:
        PHONOMETRY_TEST_NODE: ci
        PHONOMETRY_HOSTS_FILE: ${{ runner.temp }}/hosts.toml
      run: |
        set -o pipefail
        pytest -q --color=no -rfEPs tests/simulation/test_localhost_node.py tests/simulation/test_video_remote_node.py \
          | tee "$RUNNER_TEMP/node-tests.txt"
        if grep -q '^SKIPPED' "$RUNNER_TEMP/node-tests.txt"; then
          echo "::error::The localhost-node tests skipped instead of running on the node."
          exit 1
        fi
    - name: Show sshd's log
      if: failure() || cancelled()
      run: |
        if [ -f "$RUNNER_TEMP/sshd.log" ]; then
          sudo cat "$RUNNER_TEMP/sshd.log"
        fi

  # Runtime. The package where a user runs it: writing video with a real
  # ffmpeg, and in a notebook kernel.

  # The real encodes the matrix runs against a fake ffmpeg: Ubuntu's ffmpeg
  # writes WebM, MP4 and GIF, and ffprobe decodes and counts them. Whether
  # that ffmpeg has SVT-AV1 decides whether the AV1-first CPU path is tested,
  # and the summary says which before the tests run.
  video:
    name: Runtime / ffmpeg video
    needs: [reports, scope]
    if: ${{ !cancelled() && (!contains(needs.scope.outputs.skip, ',video,')) }}
    runs-on: ubuntu-26.04
    # Tests under a minute; Ubuntu's ffmpeg has taken up to 17 min to install.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
        cache: 'pip'
    - name: Install ffmpeg
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends ffmpeg
    - name: Say which CPU encoders this ffmpeg has
      run: |
        ffmpeg -hide_banner -version | head -1
        if ffmpeg -hide_banner -encoders | grep -q ' libsvtav1 '; then
          echo "This ffmpeg has SVT-AV1, so the AV1-first CPU path is tested below" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "This ffmpeg has no SVT-AV1, so the AV1-first CPU path is not tested below (VP9 is)" >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Install the dev dependencies
      id: install
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt
        pip install -e .
    # -rs prints why a test skipped, so a missing encoder reads in the log.
    - name: Every video writes and decodes with a real ffmpeg
      id: videos
      run: >-
        pytest -q -rs -n auto
        tests/io/test_video_encoders.py tests/io/test_write_video.py
        tests/io/test_write_video_ffmpeg.py
        tests/simulation/test_write_fdtd_animation.py
        tests/simulation/test_write_elastic_fdtd_animation.py
        tests/simulation/test_video_job.py

  # tests/notebooks/smoke.ipynb on a real ipykernel through nbclient, with the
  # package installed as a user installs it: what IPython picks to show and
  # what each cell puts out, which the suite, calling the methods itself,
  # cannot see (scripts/check_notebook.py).
  notebook:
    name: Runtime / notebook
    needs: [guards-source, scope]
    if: ${{ !cancelled() && (!contains(needs.scope.outputs.skip, ',notebook,')) }}
    runs-on: ubuntu-26.04
    # 1.4 min at the longest in the measured runs.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
        cache: 'pip'
    - name: Install the package, its plot and report extras, and a kernel
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-reports.txt -r requirements-notebook.txt
        pip install ".[plot,report]"
    - name: Every cell of the smoke notebook puts out what it should
      id: notebook
      run: python scripts/check_notebook.py tests/notebooks/smoke.ipynb

  # Report. What the run reports once the tests are done: the SonarCloud
  # analysis and the pull request comment.

  sonar:
    name: Report / SonarCloud
    needs: tests
    runs-on: ubuntu-26.04
    # 3.2 min at the longest in the measured runs.
    timeout-minutes: 15
    # Dependabot runs with a restricted token and no access to repository secrets, so
    # SONAR_TOKEN is empty there and the scan can only ever fail. Skip it for those runs.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Fetch the coverage report
      uses: actions/download-artifact@v8
      with:
        name: test-results-ubuntu-26.04-3.13
    # SonarCloud counts as new code everything since the version changed, so
    # each release opens a new period; the value, in release.yml's PEP 440 form,
    # reaches the scan as an input, never through a shell.
    - name: Read the version in VERSION (the last release until a release commit bumps it)
      id: version
      run: |
        version=$(tr -d ' \n' < VERSION)
        if ! printf '%s\n' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)((a|b|rc)(0|[1-9][0-9]*))?(\.post(0|[1-9][0-9]*))?(\.dev(0|[1-9][0-9]*))?$'; then
          echo "::error::VERSION is not a PEP 440 normal-form version: '$version'"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - name: Scan with SonarCloud
      uses: SonarSource/sonarqube-scan-action@v8
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: -Dsonar.projectVersion=${{ steps.version.outputs.version }}

  pr-comment:
    name: Report / PR comment
    needs: [quality, tests]
    runs-on: ubuntu-26.04
    # Under a minute in the measured runs.
    timeout-minutes: 10
    # After a red quality or tests job, never in a run a newer push cancelled,
    # whose partial results would rewrite the comment.
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
    # Full history: the comment diffs the artefact against the base branch's.
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"

    # Stdlib only: the comment joins two committed JSON files and runs no check.

    - name: Fetch the test results
      uses: actions/download-artifact@v8
      with:
        pattern: test-results-*
        path: test-results
      continue-on-error: true
    
    - name: Write the comment
      run: python .github/scripts/comment_pr.py
      env:
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        # The base the artefact is diffed against, and the head the links pin.
        GITHUB_BASE_REF: ${{ github.base_ref }}
        GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    - name: Post the comment on the pull request
      uses: actions/github-script@v9
      with:
        script: |
          const fs = require('fs');
          const body = fs.readFileSync('pr_comment_body.md', 'utf8');
          const marker = '<!-- phonometry-ci-conformance -->';

          // Update the single sticky conformance comment instead of posting a
          // new one every run: find the existing marked comment and edit it.
          const { data: comments } = await github.rest.issues.listComments({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 100,
          });
          const existing = comments.find(
            (c) => c.body && c.body.includes(marker)
          );
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body: body,
            });
          } else {
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body,
            });
          }
