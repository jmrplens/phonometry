L 531.2 218.5 L 536.8 213.9 Z" fill="#d62728" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><circle cx="512.0" cy="189.0" r="6.0" fill="#d62728" stroke="none" stroke-width="1.5"/><circle cx="512.0" cy="189.0" r="2.0" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="518.0" y="177.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="start" xml:space="preserve"><tspan>en una esquina: apuntando a </tspan><tspan font-style="italic">O</tspan></text><circle cx="631.0" cy="336.0" r="3.8" fill="#1a1a1a" stroke="none" stroke-width="1.5"/><text x="641.0" y="328.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="600" xml:space="preserve"><tspan font-style="italic">O</tspan></text><line x1="750.0" y1="336.0" x2="786.0" y2="336.0" stroke="#666666" stroke-width="0.9" stroke-dasharray="3,3" stroke-linecap="round"/><line x1="750.0" y1="189.0" x2="786.0" y2="189.0" stroke="#666666" stroke-width="0.9" stroke-dasharray="3,3" stroke-linecap="round"/><line x1="786.0" y1="258.5" x2="786.0" y2="327.0" stroke="#666666" stroke-width="1.2" stroke-linecap="round"/><path d="M 786.0 336.0 L 782.4 327.0 L 789.6 327.0 Z" fill="#666666" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="786.0" y1="266.5" x2="786.0" y2="198.0" stroke="#666666" stroke-width="1.2" stroke-linecap="round"/><path d="M 786.0 189.0 L 789.6 198.0 L 782.4 198.0 Z" fill="#666666" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="795.0" y="268.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" xml:space="preserve"><tspan font-style="italic">c</tspan><tspan> = 2,1 m</tspan></text><line x1="50" y1="418" x2="850" y2="418" stroke="#666666" stroke-width="1.0" stroke-linecap="round"/><text x="60" y="446" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#2ca02c" text-anchor="start" font-weight="600" xml:space="preserve"><tspan font-style="italic">S</tspan><tspan> = 4(</tspan><tspan font-style="italic">a</tspan><tspan>·</tspan><tspan font-style="italic">b</tspan><tspan> + </tspan><tspan font-style="italic">b</tspan><tspan>·</tspan><tspan font-style="italic">c</tspan><tspan> + </tspan><tspan font-style="italic">c</tspan><tspan>·</tspan><tspan font-style="italic">a</tspan><tspan>) = 36,3 m²   para </tspan><tspan font-style="italic">l</tspan><tspan dy="3.3" font-size="10.5">1</tspan><tspan dy="-3.3"> × </tspan><tspan font-style="italic">l</tspan><tspan dy="3.3" font-size="10.5">2</tspan><tspan dy="-3.3"> × </tspan><tspan font-style="italic">l</tspan><tspan dy="3.3" font-size="10.5">3</tspan><tspan dy="-3.3"> = 1,4 × 0,9 × 1,1 m con </tspan><tspan font-style="italic">d</tspan><tspan> = 1 m</tspan></text><text x="60" y="471" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" xml:space="preserve"><tspan>cada uno de los cinco planos se divide por separado en áreas parciales iguales de lado ≤ 3</tspan><tspan font-style="italic">d</tspan><tspan> (apartado C.1)</tspan></text><text x="60" y="496" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start">posiciones fundamentales: el centro de cada área parcial y sus esquinas, salvo las del plano reflectante</text><text x="60" y="521" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#666666" text-anchor="start" xml:space="preserve"><tspan>nueve es el mínimo, con un área parcial por plano; aquí 2</tspan><tspan font-style="italic">a</tspan><tspan> &gt; 3</tspan><tspan font-style="italic">d</tspan><tspan>, así que las caras largas se dividen y la malla crece</tspan></text><text x="60" y="546" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#666666" text-anchor="start">el método de control (ISO 3746) conserva solo los centros de las áreas parciales</text></svg>