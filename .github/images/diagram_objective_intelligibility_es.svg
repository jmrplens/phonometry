<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><rect width="900" height="600" fill="#ffffff"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1a1a1a" text-anchor="middle">STOI y ESTOI: correlación entre habla limpia y degradada</text><rect x="150.0" y="52" width="600.0" height="58" rx="10" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="2"/><text x="450.0" y="77" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>Referencia limpia </tspan><tspan font-style="italic">x</tspan><tspan>(</tspan><tspan font-style="italic">t</tspan><tspan>) y versión degradada </tspan><tspan font-style="italic">y</tspan><tspan>(</tspan><tspan font-style="italic">t</tspan><tspan>)</tspan></text><text x="450.0" y="97" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">el ejemplo de la guía: material tipo habla en un enmascarador plano a 0 dB de SNR</text><rect x="150.0" y="138" width="600.0" height="58" rx="10" fill="#f0f2f5" stroke="#1f77b4" stroke-width="2"/><text x="450.0" y="163" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="600">Remuestreo a 10 kHz y descarte de tramas silenciosas</text><text x="450.0" y="183" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">las tramas 40 dB bajo la trama limpia más alta no aportan inteligibilidad</text><rect x="150.0" y="224" width="600.0" height="58" rx="10" fill="#f0f2f5" stroke="#1f77b4" stroke-width="2"/><text x="450.0" y="249" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="600">DFT de corto plazo: tramas Hann de 256 muestras, 50 % de solape</text><text x="450.0" y="269" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">magnitudes agrupadas en 15 bandas de tercio de octava desde 150 Hz</text><rect x="150.0" y="310" width="600.0" height="58" rx="10" fill="#f0f2f5" stroke="#1f77b4" stroke-width="2"/><text x="450.0" y="335" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="600">Segmentos de 384 ms — 30 tramas, la unidad de comparación</text><text x="450.0" y="355" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">lo bastante largos para las modulaciones lentas que llevan el habla</text><line x1="450.0" y1="110" x2="450.0" y2="125.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 134.0 L 446.4 125.0 L 453.6 125.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="450.0" y1="196" x2="450.0" y2="211.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 220.0 L 446.4 211.0 L 453.6 211.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="450.0" y1="282" x2="450.0" y2="297.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 306.0 L 446.4 297.0 L 453.6 297.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="150" y="404" width="285" height="76" rx="10" fill="#f0f2f5" stroke="#d62728" stroke-width="2"/><text x="292" y="428" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="600">STOI: correlación de envolventes</text><text x="292" y="447" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">por banda y segmento; normaliza,</text><text x="292" y="464" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">recorta en −15 dB y promedia</text><rect x="465" y="404" width="285" height="76" rx="10" fill="#f0f2f5" stroke="#d62728" stroke-width="2"/><text x="607" y="428" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="600">ESTOI: correlación espectral</text><text x="607" y="447" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">segmentos normalizados por filas y columnas;</text><text x="607" y="464" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">acredita los atisbos en enmascaradores modulados</text><line x1="450" y1="368" x2="308.8019355278188" y2="398.12225375406535" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 300.0 400.0 L 308.1 394.6 L 309.6 401.6 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="450" y1="368" x2="591.1980644721813" y2="398.12225375406535" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 600.0 400.0 L 590.4 401.6 L 591.9 394.6 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="150.0" y="516" width="600.0" height="60" rx="10" fill="none" stroke="#2ca02c" stroke-width="2.4"/><text x="450.0" y="541" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">STOI = 0,727 para el ejemplo</text><text x="450.0" y="563" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">la banda más baja conserva 0,27 de la correlación; sobre 1,9 kHz llega a 0,90</text><line x1="292" y1="480" x2="381.4445508915812" y2="509.20638396459793" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 390.0 512.0 L 380.3 512.6 L 382.6 505.8 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="607" y1="480" x2="518.5469200211528" y2="509.18039751879496" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 510.0 512.0 L 517.4 505.8 L 519.7 512.6 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/></svg>