# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Review guidance that would otherwise be retyped in every pull request. The
# first entries send every review of code, tests, scripts and docs to the
# contributor style guide, whose rules each carry an identifier a review can
# cite. The `docs/**` entry also answers a claim the bot has made repeatedly
# and that is not true of this repository: that everything under `docs/` is
# generated output. The last entry is the narrow exception, so its glob has to
# name exactly the files `scripts/mirror_overviews.py` writes and no others.
reviews:
  # Review a pull request whatever it is aimed at, not only the ones aimed at
  # the default branch. Work here is often stacked, and the lower pull request
  # of a stack is aimed at the branch below it rather than at `main`, so the
  # default left exactly the part that most needs reading unreviewed and
  # answered with a note about checking this file.
  auto_review:
    enabled: true
    base_branches:
      - ".*"
    # A bot commit carries no reviewable intent: dependabot bumps a pin and
    # github-actions stamps a generated artifact, and neither is a decision
    # anyone needs read back to them.
    ignore_usernames:
      - "github-actions[bot]"
      - "dependabot[bot]"
  path_instructions:
    - path: "src/**"
      instructions: >-
        Review changes against the contributor style guide in docs/contributing/
        and cite the rule ID (for example N4) when a change departs from it.
    - path: "tests/**"
      instructions: >-
        Review changes against the contributor style guide in docs/contributing/
        and cite the rule ID (for example N4) when a change departs from it.
    - path: "scripts/**"
      instructions: >-
        Review changes against the contributor style guide in docs/contributing/
        and cite the rule ID (for example N4) when a change departs from it.
    - path: "docs/**"
      instructions: >-
        Review changes against the contributor style guide in docs/contributing/
        and cite the rule ID (for example N4) when a change departs from it.

        `docs/` is NOT a generated mirror of the website, and edits to it are
        not build output to be skipped or regenerated. It is the plain-markdown
        edition of the guides, authored by hand for people reading the
        repository on GitHub and for the llms.txt artifacts built from it. Each
        guide deliberately exists twice, as `docs/<path>.md` and as
        `site/src/content/docs/<path>.md` or `.mdx`, and the two are written
        differently on purpose, as rule F2 of
        docs/contributing/docs-and-figures.md#f2 says: an added `<picture>`
        figure in the mirror is the convention and not a mistake. Review
        changes here as ordinary prose, and expect a guide edit to touch the
        English page, its Spanish twin and this mirror together (rule F1,
        docs/contributing/docs-and-figures.md#f1). Flag it when one of the
        three is missing. The one exception is `docs/contributing/`, the
        contributor guide itself: it is repository-only, with no site page and
        no Spanish twin (rule F1), so an edit there touches only the guide and
        is reviewed against its own rules.

        The generated files under `docs/` are the topic and section overview
        indexes (`scripts/mirror_overviews.py`), `docs/reference/glossary.md`
        (`scripts/mirror_glossary.py`) and `docs/CONFORMANCE.md`
        (`make conformance`); everything else there is written by hand,
        `docs/README.md` included (rule F5,
        docs/contributing/docs-and-figures.md#f5). An edit to the
        hand-maintained `docs/reference/api/index.md` is the expected shape of
        a pull request that adds a public name (rule A7,
        docs/contributing/api.md#a7), not build output.
    - path: "docs/!(reference|contributing)/**/index.md"
      instructions: >-
        This file is generated by `scripts/mirror_overviews.py` from the
        matching `index.md*` under `site/src/content/docs/`, and CI fails on
        drift. A change made here by hand will be overwritten: the edit belongs
        in the site page it is generated from, with `make llms` re-run to
        regenerate this one. The pattern excludes `docs/reference/` on purpose,
        because the generator does: the indexes under it are written by hand.
        It excludes `docs/contributing/` too: the contributor guide has no
        site page, so nothing generates its index.
