<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540"><rect width="900" height="540" fill="#ffffff"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1a1a1a" text-anchor="middle">MISO coherence: from correlated sources to per-source contributions</text><rect x="60" y="64" width="220" height="56" rx="10" fill="#f0f2f5" stroke="#1f77b4" stroke-width="2"/><text x="170.0" y="88.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>Input </tspan><tspan font-style="italic">x</tspan><tspan dy="3.5" font-size="11.2">1</tspan></text><text x="170.0" y="108.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">white noise</text><rect x="60" y="168" width="220" height="56" rx="10" fill="#f0f2f5" stroke="#1f77b4" stroke-width="2"/><text x="170.0" y="192.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>Input </tspan><tspan font-style="italic">x</tspan><tspan dy="3.1" font-size="9.8">2</tspan><tspan dy="-3.1"> = 0.7·</tspan><tspan font-style="italic">x</tspan><tspan dy="3.1" font-size="9.8">1</tspan><tspan dy="-3.1"> + noise</tspan></text><text x="170.0" y="212.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle" xml:space="preserve"><tspan>correlated with </tspan><tspan font-style="italic">x</tspan><tspan dy="2.6" font-size="8.4">1</tspan></text><line x1="110" y1="120" x2="110" y2="168" stroke="#666666" stroke-width="1.4" stroke-dasharray="5,4" stroke-linecap="round"/><rect x="340" y="64" width="200" height="56" rx="10" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="2"/><text x="440.0" y="88.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" te