<svg xmlns="http://www.w3.org/2000/svg" width="900" height="545" viewBox="0 0 900 545"><rect width="900" height="545" fill="#ffffff"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1a1a1a" text-anchor="middle">Capturing a STOI pair through a real device</text><rect x="26" y="242.0" width="96" height="92" rx="8" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="2"/><text x="74" y="280.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">clean</text><text x="74" y="302.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#666666" text-anchor="middle">speech file</text><path d="M 122 274 C 168 274 168 144 212 144" fill="none" stroke="#1f77b4" stroke-width="2.2" stroke-linejoin="round"/><line x1="200" y1="144.0" x2="205.0" y2="144.0" stroke="#1f77b4" stroke-width="2.2" stroke-linecap="round"/><path d="M 214.0 144.0 L 205.0 147.6 L 205.0 140.4 Z" fill="#1f77b4" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="122" y1="288.0" x2="205.0" y2="288.0" stroke="#d62728" stroke-width="2.2" stroke-linecap="round"/><path d="M 214.0 288.0 L 205.0 291.6 L 205.0 284.4 Z" fill="#d62728" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="214" y="118.0" width="300" height="56" rx="8" fill="#f0f2f5" stroke="#1f77b4" stroke-width="2"/><text x="364.0" y="142.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="600">reference path</text><text x="364.0" y="163.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle">the original file, never a re-recording</text><line x1="514" y1="146.0" x2="587.0" y2="146.0" stroke="#1f77b4" stroke-width="2.2" stroke-linecap="round"/><path d="M 596.0 146.0 L 587.0 149.6 L 587.0 142.4 Z" fill="#1f77b4" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="214" y="262.0" width="118" height="52" rx="8" fill="#f0f2f5" stroke="#d62728" stroke-width="2"/><text x="273.0" y="284.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="600">playback</text><text x="273.0" y="305.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle">amp + loudspeaker</text><line x1="332" y1="288.0" x2="347.0" y2="288.0" stroke="#d62728" stroke-width="2.2" stroke-linecap="round"/><path d="M 356.0 288.0 L 347.0 291.6 L 347.0 284.4 Z" fill="#d62728" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="356" y="214.0" width="172" height="148" rx="8" fill="none" stroke="#666666" stroke-width="1.6" stroke-dasharray="6,5"/><text x="442" y="204.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle">test box</text><rect x="370" y="236.0" width="144" height="46" rx="8" fill="#f0f2f5" stroke="#d62728" stroke-width="2"/><text x="442.0" y="265.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="600">device under test</text><text x="442" y="308.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle">hearing aid on an artificial ear,</text><text x="442" y="328.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle">or a headset on a torso simulator</text><line x1="528" y1="288.0" x2="543.0" y2="288.0" stroke="#d62728" stroke-width="2.2" stroke-linecap="round"/><path d="M 552.0 288.0 L 543.0 291.6 L 543.0 284.4 Z" fill="#d62728" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="552" y="262.0" width="116" height="52" rx="8" fill="#f0f2f5" stroke="#d62728" stroke-width="2"/><text x="610.0" y="284.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="600">capture</text><text x="610.0" y="305.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle">mic + preamp</text><path d="M 668 288 C 696 288 696 248 696 226" fill="none" stroke="#d62728" stroke-width="2.2" stroke-linejoin="round"/><line x1="696" y1="238.0" x2="696.0" y2="215.0" stroke="#d62728" stroke-width="2.2" stroke-linecap="round"/><path d="M 696.0 206.0 L 699.6 215.0 L 692.4 215.0 Z" fill="#d62728" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="596" y="112.0" width="200" height="88" rx="10" fill="#f0f2f5" stroke="#2ca02c" stroke-width="2.4"/><text x="696" y="140.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="600">align and trim</text><text x="696" y="164.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2ca02c" text-anchor="middle">cross-correlate the envelopes</text><text x="696" y="184.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2ca02c" text-anchor="middle">equal length · one clock</text><line x1="796" y1="156.0" x2="805.0" y2="156.0" stroke="#2ca02c" stroke-width="2.2" stroke-linecap="round"/><path d="M 814.0 156.0 L 805.0 159.6 L 805.0 152.4 Z" fill="#2ca02c" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="816" y="112.0" width="60" height="88" rx="8" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="2"/><text x="846" y="150.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="600">STOI /</text><text x="846" y="170.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="600">ESTOI</text><rect x="214" y="392" width="454" height="56" rx="10" fill="none" stroke="#1f77b4" stroke-width="1.6" stroke-dasharray="6,5"/><text x="441" y="416" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f77b4" text-anchor="middle" font-weight="600">run it once with the device bypassed</text><text x="441" y="438" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle">the loudspeaker, the box noise and the microphone are scored as degradation too</text><line x1="268" y1="392" x2="268" y2="318.0" stroke="#1f77b4" stroke-width="1.2" stroke-dasharray="5,4" stroke-linecap="round"/><line x1="610" y1="392" x2="610" y2="318.0" stroke="#1f77b4" stroke-width="1.2" stroke-dasharray="5,4" stroke-linecap="round"/><rect x="26" y="468" width="850" height="62" rx="10" fill="none" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="6,5"/><text x="450" y="494" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="600">Play at the device's operating level, and repeat the capture</text><text x="450" y="518" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle">the index is invariant to level, the device is not; a single capture carries the acoustic path's run-to-run spread</text></svg>