<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620"><rect width="900" height="620" fill="#0d1117"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6e6e6" text-anchor="middle">Data qualification: the stationarity decision (Bendat &amp; Piersol 10.3)</text><rect x="170.0" y="52" width="560.0" height="54" rx="10" fill="#1c2128" stroke="#e6e6e6" stroke-width="2"/><text x="450.0" y="75" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e6e6e6" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>Time record </tspan><tspan font-style="italic">x</tspan><tspan>(</tspan><tspan font-style="italic">t</tspan><tspan>)</tspan></text><text x="450.0" y="95" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">before trusting any PSD, Leq or GUM average</text><rect x="170.0" y="134" width="560.0" height="54" rx="10" fill="#1c2128" stroke="#4da3d8" stroke-width="2"/><text x="450.0" y="157" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e6e6e6" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>Mean square per interval — </tspan><tspan font-style="italic">N</tspan><tspan> = 20 equal segments</tspan></text><text x="450.0" y="177" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">each interval long against the record's lowest frequencies; also rms, mean or variance</text><rect x="170.0" y="216" width="560.0" height="54" rx="10" fill="#1c2128" stroke="#4da3d8" stroke-width="2"/><text x="450.0" y="239" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e6e6e6" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>Reverse arrangement count </tspan><tspan font-style="italic">A</tspan></text><text x="450.0" y="259" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle" xml:space="preserve"><tspan>pairs </tspan><tspan font-style="italic">i</tspan><tspan> &lt; </tspan><tspan font-style="italic">j</tspan><tspan> with </tspan><tspan font-style="italic">x</tspan><tspan dy="2.6" font-size="8.4" font-style="italic">i</tspan><tspan dy="-2.6"> &gt; </tspan><tspan font-style="italic">x</tspan><tspan dy="2.6" font-size="8.4" font-style="italic">j</tspan><tspan dy="-2.6">; trend-free mean </tspan><tspan font-style="italic">μ</tspan><tspan dy="2.6" font-size="8.4" font-style="italic">A</tspan><tspan dy="-2.6"> = </tspan><tspan font-style="italic">N</tspan><tspan>(</tspan><tspan font-style="italic">N</tspan><tspan>−1)/4 = 95</tspan></text><line x1="450.0" y1="106" x2="450.0" y2="121.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 130.0 L 446.4 121.0 L 453.6 121.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="450.0" y1="188" x2="450.0" y2="203.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 212.0 L 446.4 203.0 L 453.6 203.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="450.0" y1="270" x2="450.0" y2="285.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 294.0 L 446.4 285.0 L 453.6 285.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><path d="M 240 340 L 450 296 L 660 340 L 450 384 Z" fill="#1c2128" stroke="#e6e6e6" stroke-width="2" stroke-linejoin="round"/><text x="450.0" y="336" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>64 &lt; </tspan><tspan font-style="italic">A</tspan><tspan> ≤ 125 ?</tspan></text><text x="450.0" y="358" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle" xml:space="preserve"><tspan>(Table A.6, </tspan><tspan font-style="italic">α</tspan><tspan> = 0.05)</tspan></text><line x1="390" y1="380" x2="258.5502857413644" y2="423.190620399266" stroke="#e46a6a" stroke-width="1.8" stroke-linecap="round"/><path d="M 250.0 426.0 L 257.4 419.8 L 259.7 426.6 Z" fill="#e46a6a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="298" y="392" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e46a6a" text-anchor="middle" font-weight="600">no</text><line x1="510" y1="380" x2="641.4497142586356" y2="423.190620399266" stroke="#5abf5a" stroke-width="1.8" stroke-linecap="round"/><path d="M 650.0 426.0 L 640.3 426.6 L 642.6 419.8 Z" fill="#5abf5a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="602" y="392" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#5abf5a" text-anchor="middle" font-weight="600">yes</text><rect x="60" y="430" width="360" height="96" rx="10" fill="#1c2128" stroke="#e46a6a" stroke-width="2.2"/><text x="240" y="458" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="600">Nonstationary: do not average</text><text x="240" y="482" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e46a6a" text-anchor="middle" xml:space="preserve"><tspan>+20 % gain ramp: </tspan><tspan font-style="italic">A</tspan><tspan> = 7 → rejected</tspan></text><text x="240" y="504" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">split at the change, or go short-time (spectrogram)</text><rect x="480" y="430" width="360" height="96" rx="10" fill="#1c2128" stroke="#5abf5a" stroke-width="2.2"/><text x="660" y="458" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="600">Stationary: analyse</text><text x="660" y="482" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5abf5a" text-anchor="middle" xml:space="preserve"><tspan>steady noise: </tspan><tspan font-style="italic">A</tspan><tspan> = 91 → accepted</tspan></text><text x="660" y="504" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">the chi-square CIs and error formulas hold</text><text x="450.0" y="566" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e6e6e6" text-anchor="middle">the runs test (method="runs") is the two-sided companion: too many runs is as suspect as too few</text><text x="450.0" y="590" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9a9a9a" text-anchor="middle">a frequency glide can hide from the mean square: test statistic="mean" or band-filtered copies too</text></svg>