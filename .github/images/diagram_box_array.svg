.8" fill="#1a1a1a" stroke="none" stroke-width="1.5"/><text x="641.0" y="328.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="600">O</text><line x1="750.0" y1="336.0" x2="786.0" y2="336.0" stroke="#666666" stroke-width="0.9" stroke-dasharray="3,3" stroke-linecap="round"/><line x1="750.0" y1="189.0" x2="786.0" y2="189.0" stroke="#666666" stroke-width="0.9" stroke-dasharray="3,3" stroke-linecap="round"/><line x1="786.0" y1="258.5" x2="786.0" y2="327.0" stroke="#666666" stroke-width="1.2" stroke-linecap="round"/><path d="M 786.0 336.0 L 782.4 327.0 L 789.6 327.0 Z" fill="#666666" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="786.0" y1="266.5" x2="786.0" y2="198.0" stroke="#666666" stroke-width="1.2" stroke-linecap="round"/><path d="M 786.0 189.0 L 789.6 198.0 L 782.4 198.0 Z" fill="#666666" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="795.0" y="268.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start">c = 2,1 m</text><line x1="50" y1="418" x2="850" y2="418" stroke="#666666" stroke-width="1.0" stroke-linecap="round"/><text x="60" y="446" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#2ca02c" text-anchor="start" font-weight="600">S = 4(ab + bc + ca) = 36,3 m²   for l₁ × l₂ × l₃ = 1,4 × 0,9 × 1,1 m at d = 1 m</text><text x="60" y="471" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start">each of the five planes is split on its own into equal partial areas of side ≤ 3d (clause C.1)</text><text x="60" y="496" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start">key positions: the centre of every partial area, plus its corners except those in the reflecting plane</text><text x="60" y="521" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#666666" text-anchor="start">nine is the minimum, for one partial area per plane; here 2a &gt; 3d, so the long faces split and the array grows</text><text x="60" y="546" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#666666" text-anchor="start">the survey method (ISO 3746) keeps only the partial-area centres</text></svg>