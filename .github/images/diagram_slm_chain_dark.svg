t-weight="600">Sound calibrator (class 1)</text><rect x="103.0" y="82.0" width="124" height="84" rx="10" fill="#1c2128" stroke="#e6e6e6" stroke-width="2"/><text x="165.0" y="118.0" font-family="Consolas, Menlo, monospace" font-size="26" fill="#e46a6a" text-anchor="middle" font-weight="600">94.0 dB</text><text x="165.0" y="146.0" font-family="Consolas, Menlo, monospace" font-size="20" fill="#9a9a9a" text-anchor="middle">1 kHz</text><rect x="150.0" y="166.0" width="30" height="12" rx="3" fill="#e6e6e6" stroke="none" stroke-width="1.5"/><line x1="165.0" y1="184.0" x2="165.0" y2="227.0" stroke="#e46a6a" stroke-width="2.0" stroke-linecap="round"/><path d="M 165.0 236.0 L 161.4 227.0 L 168.6 227.0 Z" fill="#e46a6a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="149.0" y="202.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9a9a9a" text-anchor="end" font-style="italic">coupled for</text><text x="149.0" y="222.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9a9a9a" text-anchor="end" font-style="italic">the level check</text><rect x="160.0" y="248.0" width="10.0" height="15.0" rx="3.125" fill="#e6e6e6" stroke="none" stroke-width="1.5"/><rect x="157.5" y="263.0" width="15.0" height="42.5" rx="5.0" fill="#4da3d8" stroke="none" stroke-width="1.5"/><line x1="165.0" y1="305.5" x2="165.0" y2="508.0" stroke="#e6e6e6" stroke-width="2.2" stroke-linecap="round"/><line x1="145.0" y1="508.0" x2="185.0" y2="508.0" stroke="#e6e6e6" stroke-width="2.2" stroke-linecap="round"/><ellipse cx="165.0" cy="266.0" rx="42" ry="42" fill="none" stroke="#9a9a9a" stroke-width="1.6" stroke-dasharray="5,4"/><line x1="135.0" y1="297.0" x2="100.0" y2="324.0" stroke="#9a9a9a" stroke-width="1.0" stroke-linecap="round"/><text x="86.0" y="342.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="middle">Windscreen</text><rect x="410.0" y="96.0" width="400.0" height="78.0" rx="12" fill="#1c