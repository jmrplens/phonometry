<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"><rect width="900" height="560" fill="#0d1117"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6e6e6" text-anchor="middle">Two-channel FRF measurement: the H1 estimator and coherence</text><rect x="60" y="68" width="190" height="72.0" rx="10" fill="#1c2128" stroke="#e6e6e6" stroke-width="2"/><text x="155.0" y="98.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#e6e6e6" text-anchor="middle" font-weight="600">Signal generator</text><text x="155.0" y="122.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">broadband noise or a sweep</text><rect x="310" y="68" width="150" height="72.0" rx="10" fill="#1c2128" stroke="#e6e6e6" stroke-width="2"/><text x="385.0" y="98.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#e6e6e6" text-anchor="middle" font-weight="600">Power amplifier</text><text x="385.0" y="122.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle"></text><line x1="250.0" y1="104.0" x2="297.0" y2="104.0" stroke="#e6e6e6" stroke-width="2.0" stroke-linecap="round"/><path d="M 306.0 104.0 L 297.0 107.6 L 297.0 100.4 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="460.0" y1="104.0" x2="487.0" y2="104.0" stroke="#e6e6e6" stroke-width="2.0" stroke-linecap="round"/><path d="M 496.0 104.0 L 487.0 107.6 L 487.0 100.4 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="500" y="76" width="44" height="56" rx="6" fill="#1c2128" stroke="#4da3d8" stroke-width="2"/><circle cx="522.0" cy="96.0" r="10.0" fill="#4da3d8" stroke="none" stroke-width="1.5"/><circle cx="522.0" cy="96.0" r="4.0" fill="#0d1117" stroke="none" stroke-width="1.5"/><circle cx="522.0" cy="119.0" r="5.5" fill="#4da3d8" stroke="none" stroke-width="1.5"/><text x="522.0" y="60.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="600">Loudspeaker under test</text><path d="M 555 92 A 22 22 0 0 1 560 111" fill="none" stroke="#5abf5a" stroke-width="1.5" stroke-linejoin="round"/><path d="M 559 83 A 38 38 0 0 1 569 115" fill="none" stroke="#5abf5a" stroke-width="1.5" stroke-linejoin="round"/><path d="M 564 74 A 54 54 0 0 1 578 120" fill="none" stroke="#5abf5a" stroke-width="1.5" stroke-linejoin="round"/><rect x="640" y="99" width="12" height="10" rx="2.5" fill="#e6e6e6" stroke="none" stroke-width="1.5"/><rect x="652" y="96" width="30" height="16" rx="5" fill="#4da3d8" stroke="none" stroke-width="1.5"/><text x="680.0" y="76.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="600">measurement microphone</text><line x1="682.0" y1="104.0" x2="706.0" y2="104.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><line x1="706.0" y1="104.0" x2="706.0" y2="176.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><circle cx="278.0" cy="104.0" r="3.5" fill="#e6e6e6" stroke="none" stroke-width="1.5"/><line x1="278.0" y1="104.0" x2="278.0" y2="176.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><rect x="150" y="208" width="270" height="60.0" rx="10" fill="#1c2128" stroke="#4da3d8" stroke-width="2"/><text x="285.0" y="238.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#e6e6e6" text-anchor="middle" font-weight="600">Channel 1: reference x(t)</text><text x="285.0" y="262.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">the electrical drive signal</text><rect x="470" y="208" width="280" height="60.0" rx="10" fill="#1c2128" stroke="#e46a6a" stroke-width="2"/><text x="610.0" y="238.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#e6e6e6" text-anchor="middle" font-weight="600">Channel 2: response y(t)</text><text x="610.0" y="262.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">acoustic output at the microphone</text><line x1="278.0" y1="176.0" x2="278.0" y2="195.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 278.0 204.0 L 274.4 195.0 L 281.6 195.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="706.0" y1="176.0" x2="706.0" y2="195.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 706.0 204.0 L 702.4 195.0 L 709.6 195.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="150" y="300" width="600" height="72.0" rx="10" fill="#1c2128" stroke="#e6e6e6" stroke-width="2"/><text x="450.0" y="330.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#e6e6e6" text-anchor="middle" font-weight="600">Dual-channel FFT analysis (Welch)</text><text x="450.0" y="354.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">Hann segments, 50 % overlap  →  Gxx(f), Gyy(f), Gxy(f)</text><line x1="285.0" y1="268.0" x2="285.0" y2="287.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 285.0 296.0 L 281.4 287.0 L 288.6 287.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="610.0" y1="268.0" x2="610.0" y2="287.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 610.0 296.0 L 606.4 287.0 L 613.6 287.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="60" y="404" width="380" height="72.0" rx="10" fill="#1c2128" stroke="#4da3d8" stroke-width="2"/><text x="250.0" y="434.0" font-family="Consolas, Menlo, monospace" font-size="18" fill="#e6e6e6" text-anchor="middle" font-weight="600">H1(f) = Gxy / Gxx</text><text x="250.0" y="458.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">unbiased with output noise; H2 = Gyy/Gyx for input noise</text><rect x="460" y="404" width="380" height="72.0" rx="10" fill="#1c2128" stroke="#e46a6a" stroke-width="2"/><text x="650.0" y="434.0" font-family="Consolas, Menlo, monospace" font-size="18" fill="#e6e6e6" text-anchor="middle" font-weight="600">γ²(f) = |Gxy|² / (Gxx·Gyy)</text><text x="650.0" y="458.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">1 for a noiseless linear path; less with output noise</text><line x1="280.0" y1="372.0" x2="268.4652504452115" y2="392.1858117208799" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 264.0 400.0 L 265.3 390.4 L 271.6 394.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="620.0" y1="372.0" x2="631.5347495547885" y2="392.1858117208799" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 636.0 400.0 L 628.4 394.0 L 634.7 390.4 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="450.0" y="528.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="middle" font-weight="600">trust |H1| only where γ² stays near 1: coherence dips flag noise, distortion or an unresolved delay</text></svg>