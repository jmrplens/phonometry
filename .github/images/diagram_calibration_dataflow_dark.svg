<svg xmlns="http://www.w3.org/2000/svg" width="900" height="616" viewBox="0 0 900 616"><rect width="900" height="616" fill="#0d1117"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6e6e6" text-anchor="middle">Calibration data flow: one factor, every level function</text><rect x="40.0" y="54" width="360" height="72" rx="12" fill="#1c2128" stroke="#4da3d8" stroke-width="2"/><text x="220.0" y="84" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#e6e6e6" text-anchor="middle" font-weight="600">Calibrator recording</text><text x="220.0" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#9a9a9a" text-anchor="middle">1 kHz tone through the chain</text><rect x="500.0" y="54" width="360" height="72" rx="12" fill="#1c2128" stroke="#4da3d8" stroke-width="2"/><text x="680.0" y="84" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#e6e6e6" text-anchor="middle" font-weight="600">Measurement recording</text><text x="680.0" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#9a9a9a" text-anchor="middle">the same chain, untouched</text><line x1="400" y1="90" x2="500" y2="90" stroke="#9a9a9a" stroke-width="1.4" stroke-dasharray="6,5" stroke-linecap="round"/><text x="450" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9a9a9a" text-anchor="middle" font-style="italic">nothing in the chain may change between the two</text><line x1="220" y1="126" x2="220.0" y2="157.0" stroke="#e6e6e6" stroke-width="2.0" stroke-linecap="round"/><path d="M 220.0 166.0 L 216.4 157.0 L 223.6 157.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="40" y="166" width="360" height="88" rx="12" fill="#1c2128" stroke="#4da3d8" stroke-width="2"/><text x="220" y="196" font-family="Consolas, Menlo, monospace" font-size="12" fill="#e6e6e6" text-anchor="middle" font-weight="600">sensitivity(calibrator, target_spl=94.0, fs=fs)</text><text x="220" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e6e6e6" text-anchor="middle">S = p_ref · 10^(L_cal / 20) / x̃_ref</text><text x="220" y="244" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">fs enables the IEC 60942 stability check</text><line x1="220" y1="254" x2="220.0" y2="281.0" stroke="#e6e6e6" stroke-width="2.0" stroke-linecap="round"/><path d="M 220.0 290.0 L 216.4 281.0 L 223.6 281.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="40" y="290" width="360" height="72" rx="12" fill="none" stroke="#5abf5a" stroke-width="2.4"/><text x="220" y="320" font-family="Consolas, Menlo, monospace" font-size="18" fill="#e6e6e6" text-anchor="middle" font-weight="600">calibration_factor  S</text><text x="220" y="344" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#5abf5a" text-anchor="middle">pascals per digital unit</text><line x1="240" y1="362" x2="311.8705024608114" y2="396.13848866888543" stroke="#e6e6e6" stroke-width="2.0" stroke-linecap="round"/><path d="M 320.0 400.0 L 310.3 399.4 L 313.4 392.9 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="680" y1="126" x2="680.0" y2="391.0" stroke="#e6e6e6" stroke-width="2.0" stroke-linecap="round"/><path d="M 680.0 400.0 L 676.4 391.0 L 683.6 391.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="60" y="400" width="780" height="86" rx="12" fill="#1c2128" stroke="#e6e6e6" stroke-width="2"/><text x="450" y="430" font-family="Consolas, Menlo, monospace" font-size="14" fill="#e6e6e6" text-anchor="middle">octave_filter · leq · laeq · sel · ln_levels · lc_peak · OctaveFilterBank</text><text x="450" y="456" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="middle" font-weight="600">every level function accepts calibration_factor=</text><text x="450" y="478" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">one factor for the whole library</text><line x1="450" y1="486" x2="450.0" y2="513.0" stroke="#e6e6e6" stroke-width="2.0" stroke-linecap="round"/><path d="M 450.0 522.0 L 446.4 513.0 L 453.6 513.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="270" y="522" width="360" height="64" rx="12" fill="none" stroke="#5abf5a" stroke-width="2.4"/><text x="450" y="550" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#e6e6e6" text-anchor="middle" font-weight="600">Levels in dB SPL</text><text x="450" y="574" font-family="Consolas, Menlo, monospace" font-size="16" fill="#5abf5a" text-anchor="middle">re 20 µPa</text><rect x="650" y="514" width="210" height="80" rx="12" fill="none" stroke="#e46a6a" stroke-width="1.8" stroke-dasharray="7,5"/><text x="755" y="542" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e46a6a" text-anchor="middle" font-weight="600">No calibrator?</text><text x="755" y="564" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9a9a9a" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">S</tspan><tspan> = 1, samples read as Pa</tspan></text><text x="755" y="584" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e6e6e6" text-anchor="middle">use dbfs=True for dBFS</text></svg>