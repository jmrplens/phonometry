<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><rect width="900" height="600" fill="#ffffff"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1a1a1a" text-anchor="middle">PSD de Welch: segmentar, enventanar, promediar (Bendat &amp; Piersol)</text><rect x="110.0" y="52" width="680.0" height="58.0" rx="10" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="2"/><text x="450.0" y="77" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">Registro x(t) — fs = 48 kHz, 20 s de ruido rosa</text><text x="450.0" y="97" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle">960 000 muestras, calibrado de extremo a extremo: pascales dentro, Pa²/Hz fuera</text><rect x="110.0" y="138" width="680.0" height="58.0" rx="10" fill="#f0f2f5" stroke="#1f77b4" stroke-width="2"/><text x="450.0" y="163" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">División en segmentos con 50 % de solape — nperseg = 4096</text><text x="450.0" y="183" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle">467 segmentos de 85,3 ms; separación de bins Δf = fs/4096 = 11,7 Hz</text><rect x="110.0" y="224" width="680.0" height="58.0" rx="10" fill="#f0f2f5" stroke="#1f77b4" stroke-width="2"/><text x="450.0" y="249" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">Ventana de Hann en cada segmento</text><text x="450.0" y="269" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle">ENBW = 1,5 bins → ancho de banda de resolución Be = 1,5·Δf = 17,6 Hz</text><rect x="110.0" y="310" width="680.0" height="58.0" rx="10" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="2"/><text x="450.0" y="335" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">Periodograma unilateral |FFT|² de cada segmento, y promedio</text><text x="450.0" y="355" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle">correlación por solape (Welch 1967): 467 segmentos → n_d = 442 promedios efectivos</text><rect x="110.0" y="396" width="680.0" height="60" rx="10" fill="none" stroke="#2ca02c" stroke-width="2.4"/><text x="450.0" y="421" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">Gxx(f) con su intervalo de confianza chi-cuadrado</text><text x="450.0" y="443" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle">error aleatorio εr = 1/√n_d = 4,8 %;  2·n_d ≈ 885 grados de libertad</text><line x1="450.0" y1="110" x2="450.0" y2="125.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 134.0 L 446.4 125.0 L 453.6 125.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="450.0" y1="196" x2="450.0" y2="211.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 220.0 L 446.4 211.0 L 453.6 211.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="450.0" y1="282" x2="450.0" y2="297.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 306.0 L 446.4 297.0 L 453.6 297.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="450.0" y1="368" x2="450.0" y2="383.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 392.0 L 446.4 383.0 L 453.6 383.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="450.0" y1="456" x2="450.0" y2="475.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 484.0 L 446.4 475.0 L 453.6 475.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="130" y="488" width="640" height="72" rx="10" fill="none" stroke="#d62728" stroke-width="1.6" stroke-dasharray="6,5"/><text x="450.0" y="517" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#d62728" text-anchor="middle" font-weight="600">El compromiso: el segmento compra resolución o estabilidad, nunca ambas</text><text x="450.0" y="543" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">segmentos más largos → Be más fino pero menos promedios (mayor εr); más cortos → lo contrario</text></svg>