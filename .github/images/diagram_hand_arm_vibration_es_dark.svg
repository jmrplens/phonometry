<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660"><rect width="900" height="660" fill="#0d1117"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6e6e6" text-anchor="middle">Vibración mano-brazo: dónde va el acelerómetro</text><text x="258" y="74" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#e6e6e6" text-anchor="middle" font-weight="600">En la herramienta (ISO 5349-2, 6.1.3)</text><rect x="60" y="187.0" width="400" height="26.0" rx="13" fill="#1c2128" stroke="#e6e6e6" stroke-width="2"/><rect x="230.0" y="148" width="100.0" height="52.0" rx="14" fill="#9a9a9a" stroke="#e6e6e6" stroke-width="1.6"/><rect x="236.0" y="217.0" width="19" height="34" rx="9" fill="#9a9a9a" stroke="#e6e6e6" stroke-width="1.4"/><rect x="259.0" y="217.0" width="19" height="34" rx="9" fill="#9a9a9a" stroke="#e6e6e6" stroke-width="1.4"/><rect x="282.0" y="217.0" width="19" height="34" rx="9" fill="#9a9a9a" stroke="#e6e6e6" stroke-width="1.4"/><rect x="305.0" y="217.0" width="19" height="34" rx="9" fill="#9a9a9a" stroke="#e6e6e6" stroke-width="1.4"/><line x1="254" y1="156" x2="188" y2="92" stroke="#9a9a9a" stroke-width="15" stroke-linecap="round"/><line x1="276.0" y1="272.0" x2="239.0" y2="272.0" stroke="#9a9a9a" stroke-width="1.2" stroke-linecap="round"/><path d="M 230.0 272.0 L 239.0 268.4 L 239.0 275.6 Z" fill="#9a9a9a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="284.0" y1="272.0" x2="321.0" y2="272.0" stroke="#9a9a9a" stroke-width="1.2" stroke-linecap="round"/><path d="M 330.0 272.0 L 321.0 275.6 L 321.0 268.4 Z" fill="#9a9a9a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="280.0" y="265.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e6e6e6" text-anchor="middle">zona de agarre ≈ 100 mm</text><rect x="268" y="213.0" width="24" height="19" rx="3" fill="#e46a6a" stroke="#e6e6e6" stroke-width="1.5"/><circle cx="280" cy="174" r="12" fill="#e46a6a" stroke="#0d1117" stroke-width="2"/><text x="280" y="179" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#0d1117" text-anchor="middle" font-weight="600">1</text><rect x="184" y="168.0" width="24" height="19" rx="3" fill="#e46a6a" stroke="#e6e6e6" stroke-width="1.5"/><circle cx="196" cy="148" r="12" fill="#e46a6a" stroke="#0d1117" stroke-width="2"/><text x="196" y="153" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#0d1117" text-anchor="middle" font-weight="600">2</text><rect x="360" y="168.0" width="24" height="19" rx="3" fill="#e46a6a" stroke="#e6e6e6" stroke-width="1.5"/><circle cx="372" cy="148" r="12" fill="#e46a6a" stroke="#0d1117" stroke-width="2"/><text x="372" y="153" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#0d1117" text-anchor="middle" font-weight="600">2</text><rect x="360" y="213.0" width="24" height="19" rx="3" fill="#e46a6a" stroke="#e6e6e6" stroke-width="1.5"/><circle cx="372" cy="253" r="12" fill="#e46a6a" stroke="#0d1117" stroke-width="2"/><text x="372" y="258" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#0d1117" text-anchor="middle" font-weight="600">3</text><text x="520" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9a9a9a" text-anchor="end">empuñadura delantera</text><text x="520" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9a9a9a" text-anchor="end">de motosierra, tubo Ø 30 mm</text><line x1="455" y1="126" x2="455" y2="183.0" stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="4,4" stroke-linecap="round"/><path d="M 378 232.0 L 432 246 L 432 306 L 110 306" fill="none" stroke="#4da3d8" stroke-width="2.0" stroke-linejoin="round"/><rect x="170.0" y="300" width="12" height="12" rx="2" fill="#4da3d8" stroke="#e6e6e6" stroke-width="1.0"/><rect x="250.0" y="300" width="12" height="12" rx="2" fill="#4da3d8" stroke="#e6e6e6" stroke-width="1.0"/><text x="110" y="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#4da3d8" text-anchor="start">cable fijado a la empuñadura junto al transductor (6.2.3)</text><line x1="306" y1="110" x2="306.0" y2="137.0" stroke="#5abf5a" stroke-width="2.2" stroke-linecap="round"/><path d="M 306.0 146.0 L 302.4 137.0 L 309.6 137.0 Z" fill="#5abf5a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="210" y1="250" x2="210.0" y2="227.0" stroke="#5abf5a" stroke-width="2.2" stroke-linecap="round"/><path d="M 210.0 218.0 L 213.6 227.0 L 206.4 227.0 Z" fill="#5abf5a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="306" y="102" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#5abf5a" text-anchor="middle">fuerza de agarre</text><text x="45" y="366" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">1  centro de la zona de agarre, bajo la mano</text><text x="62" y="385" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9a9a9a" text-anchor="start">la ubicación más representativa; exige un adaptador</text><text x="45" y="410" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">2  a ambos lados de la mano — práctica habitual</text><text x="62" y="429" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9a9a9a" text-anchor="start">en empuñadura lateral, se promedian las dos</text><text x="45" y="454" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">3  bajo la empuñadura, junto a la mano</text><text x="45" y="480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="start">las fuerzas de agarre y empuje alteran la lectura:</text><text x="45" y="497" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="start">documéntense postura y fuerzas (7.1, capítulo 9 g))</text><line x1="110.0" y1="578.0" x2="175.0" y2="578.0" stroke="#4da3d8" stroke-width="2.2" stroke-linecap="round"/><path d="M 184.0 578.0 L 175.0 581.6 L 175.0 574.4 Z" fill="#4da3d8" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="190.0" y="583.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#4da3d8" text-anchor="start" font-weight="600">y_h</text><line x1="110.0" y1="578.0" x2="110.0" y2="541.0" stroke="#4da3d8" stroke-width="2.2" stroke-linecap="round"/><path d="M 110.0 532.0 L 113.6 541.0 L 106.4 541.0 Z" fill="#4da3d8" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="110.0" y="524.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#4da3d8" text-anchor="middle" font-weight="600">z_h</text><line x1="110.0" y1="578.0" x2="77.37308728467137" y2="600.83883890073" stroke="#4da3d8" stroke-width="2.2" stroke-linecap="round"/><path d="M 70.0 606.0 L 75.3 597.9 L 79.4 603.8 Z" fill="#4da3d8" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="64.0" y="618.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#4da3d8" text-anchor="end" font-weight="600">x_h</text><text x="236" y="534" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e6e6e6" text-anchor="start">sistema basicéntrico (ISO 5349-1 Fig. 1):</text><text x="236" y="552" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e6e6e6" text-anchor="start">girado para que y_h siga el eje de</text><text x="236" y="570" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e6e6e6" text-anchor="start">la empuñadura. Se miden los tres</text><text x="236" y="588" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e6e6e6" text-anchor="start">ejes, y todo k = 1.</text><rect x="545.0" y="90.0" width="320.0" height="66.0" rx="12" fill="#1c2128" stroke="#4da3d8" stroke-width="2"/><text x="705.0" y="118.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#e6e6e6" text-anchor="middle" font-weight="600">a_hwx , a_hwy , a_hwz</text><text x="705.0" y="140.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">ponderada Wh, una por eje (ISO 5349-1 A.1)</text><rect x="545.0" y="176.0" width="320.0" height="66.0" rx="12" fill="#1c2128" stroke="#e6e6e6" stroke-width="2"/><text x="705.0" y="204.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#e6e6e6" text-anchor="middle" font-weight="600">a_hv = √(a²_hwx + a²_hwy + a²_hwz)</text><text x="705.0" y="226.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">valor total de vibración (Ec. (1))</text><rect x="545.0" y="262.0" width="320.0" height="66.0" rx="12" fill="#1c2128" stroke="#e6e6e6" stroke-width="2"/><text x="705.0" y="290.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#e6e6e6" text-anchor="middle" font-weight="600">A_i(8) = a_hv,i · √(T_i / T₀)</text><text x="705.0" y="312.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">T_i es el tiempo total de contacto diario (5.5)</text><rect x="545.0" y="348.0" width="320.0" height="66.0" rx="12" fill="#1c2128" stroke="#e46a6a" stroke-width="2"/><text x="705.0" y="376.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#e6e6e6" text-anchor="middle" font-weight="600">A(8) = √(Σ A_i(8)²)</text><text x="705.0" y="398.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">una por mano, dos cifras significativas (capítulo 8)</text><line x1="705.0" y1="156" x2="705.0" y2="167.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 705.0 176.0 L 701.4 167.0 L 708.6 167.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="705.0" y1="242" x2="705.0" y2="253.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 705.0 262.0 L 701.4 253.0 L 708.6 253.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="705.0" y1="328" x2="705.0" y2="339.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 705.0 348.0 L 701.4 339.0 L 708.6 339.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="705.0" y1="414" x2="705.0" y2="429.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 705.0 438.0 L 701.4 429.0 L 708.6 429.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="545.0" y="438" width="320.0" height="62" rx="12" fill="none" stroke="#e46a6a" stroke-width="2.4" stroke-dasharray="6,5"/><text x="705.0" y="464" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#e6e6e6" text-anchor="middle" font-weight="600">EAV 2,5 m/s²   ·   ELV 5 m/s²</text><text x="705.0" y="486" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">Directiva 2002/44/CE, artículo 3</text><rect x="524" y="518" width="336" height="130" rx="12" fill="#1c2128" stroke="#9a9a9a" stroke-width="1.6"/><circle cx="542" cy="535" r="3.4" fill="#e46a6a" stroke="none" stroke-width="1.5"/><text x="556" y="540" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e6e6e6" text-anchor="start">transductor y montaje por debajo del</text><text x="556" y="554" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e6e6e6" text-anchor="start">5 % de la masa sobre la que van (6.1.5)</text><circle cx="542" cy="563" r="3.4" fill="#e46a6a" stroke="none" stroke-width="1.5"/><text x="556" y="568" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e6e6e6" text-anchor="start">promediado lineal sobre ciclos de</text><text x="556" y="582" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e6e6e6" text-anchor="start">trabajo completos (6.1.11)</text><circle cx="542" cy="591" r="3.4" fill="#e46a6a" stroke="none" stroke-width="1.5"/><text x="556" y="596" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e6e6e6" text-anchor="start">tres muestras por operación, un minuto</text><text x="556" y="610" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e6e6e6" text-anchor="start">de registro, ninguna bajo 8 s (5.4.1)</text><circle cx="542" cy="619" r="3.4" fill="#e46a6a" stroke="none" stroke-width="1.5"/><text x="556" y="624" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e6e6e6" text-anchor="start">el menor rango de entrada que no</text><text x="556" y="638" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e6e6e6" text-anchor="start">sature, hallado por tanteo (6.1.10)</text></svg>