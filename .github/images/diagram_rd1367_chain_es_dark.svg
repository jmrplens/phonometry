<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580"><rect width="900" height="580" fill="#0d1117"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6e6e6" text-anchor="middle">RD 1367/2007: de la fase de ruido a los tres criterios de aceptación</text><text x="70.0" y="78.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#e6e6e6" text-anchor="start" font-weight="600">1 — el día, dividido en períodos de evaluación (Anexo I A.2)</text><rect x="70.0" y="90.0" width="221.66666666666666" height="42" rx="0.0" fill="#1c2128" stroke="#4da3d8" stroke-width="2.0"/><text x="180.83333333333331" y="118.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="middle">noche 23-07</text><rect x="291.66666666666663" y="90.0" width="380.0" height="42" rx="0.0" fill="#1c2128" stroke="#5abf5a" stroke-width="2.0"/><text x="481.6666666666667" y="118.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="middle">día 07-19</text><rect x="671.6666666666666" y="90.0" width="126.66666666666667" height="42" rx="0.0" fill="#1c2128" stroke="#e8a838" stroke-width="2.0"/><text x="735.0" y="118.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="middle">tarde 19-23</text><rect x="798.3333333333334" y="90.0" width="31.666666666666668" height="42" rx="0.0" fill="#1c2128" stroke="#4da3d8" stroke-width="2.0"/><rect x="291.66666666666663" y="152.0" width="63.333333333333336" height="34" rx="0.0" fill="#1c2128" stroke="#9a9a9a" stroke-width="1.2"/><text x="323.33333333333337" y="175.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e6e6e6" text-anchor="middle">2 h cerrada</text><rect x="355.0" y="152.0" width="190.0" height="34" rx="0.0" fill="#1c2128" stroke="#9a9a9a" stroke-width="1.2"/><text x="450.0" y="175.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e6e6e6" text-anchor="middle">6 h, máquina</text><rect x="545.0" y="152.0" width="126.66666666666667" height="34" rx="0.0" fill="#1c2128" stroke="#9a9a9a" stroke-width="1.2"/><text x="608.3333333333334" y="175.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e6e6e6" text-anchor="middle">4 h, resto</text><text x="70.0" y="210.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#9a9a9a" text-anchor="start">fases de ruido Ti de nivel percibido uniforme</text><rect x="70.0" y="250.0" width="360" height="108" rx="8" fill="#1c2128" stroke="#9a9a9a" stroke-width="1.2"/><text x="84.0" y="278.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#e6e6e6" text-anchor="start" font-weight="600">2 — cada fase, corregida</text><text x="84.0" y="306.0" font-family="Consolas, Menlo, monospace" font-size="17" fill="#e6e6e6" text-anchor="start">LKeq,Ti = LAeq,Ti + Kt + Kf + Ki</text><text x="84.0" y="332.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e46a6a" text-anchor="start">Kt + Kf + Ki ≤ 9 dB (Anexo IV A.3.3)</text><line x1="442.0" y1="304.0" x2="485.0" y2="304.0" stroke="#9a9a9a" stroke-width="1.8" stroke-linecap="round"/><path d="M 494.0 304.0 L 485.0 307.6 L 485.0 300.4 Z" fill="#9a9a9a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="506.0" y="250.0" width="324" height="124" rx="8" fill="#1c2128" stroke="#9a9a9a" stroke-width="1.2"/><text x="520.0" y="278.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#e6e6e6" text-anchor="start" font-weight="600">3 — el nivel del período</text><text x="520.0" y="304.0" font-family="Consolas, Menlo, monospace" font-size="16" fill="#e6e6e6" text-anchor="start">LKeq,x = 10 lg[ (1/T) Σ Ti</text><text x="520.0" y="324.0" font-family="Consolas, Menlo, monospace" font-size="16" fill="#e6e6e6" text-anchor="start">                10^(LKeq,Ti/10) ]</text><text x="520.0" y="348.0" font-family="Consolas, Menlo, monospace" font-size="17" fill="#5abf5a" text-anchor="start">round_reported_level → 57 dB</text><rect x="70.0" y="400.0" width="360" height="96" rx="8" fill="#1c2128" stroke="#9a9a9a" stroke-width="1.2"/><text x="84.0" y="428.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#e6e6e6" text-anchor="start" font-weight="600">4 — el valor anual</text><text x="84.0" y="456.0" font-family="Consolas, Menlo, monospace" font-size="18" fill="#e6e6e6" text-anchor="start">LK,x sobre los días de actividad</text><text x="84.0" y="482.0" font-family="Consolas, Menlo, monospace" font-size="17" fill="#5abf5a" text-anchor="start">303 abierta / 62 cerrada → 56 dB</text><line x1="250.0" y1="368.0" x2="250.0" y2="383.0" stroke="#9a9a9a" stroke-width="1.8" stroke-linecap="round"/><path d="M 250.0 392.0 L 246.4 383.0 L 253.6 383.0 Z" fill="#9a9a9a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="442.0" y1="446.0" x2="485.0" y2="446.0" stroke="#9a9a9a" stroke-width="1.8" stroke-linecap="round"/><path d="M 494.0 446.0 L 485.0 449.6 L 485.0 442.4 Z" fill="#9a9a9a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="506.0" y="400.0" width="324" height="32" rx="6" fill="#0d1117" stroke="#5abf5a" stroke-width="1.8"/><text x="518.0" y="422.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e6e6e6" text-anchor="start">peor fase ≤ límite + 5 dB</text><text x="818.0" y="422.0" font-family="Consolas, Menlo, monospace" font-size="16" fill="#5abf5a" text-anchor="end">59 ≤ 60 ✓</text><rect x="506.0" y="440.0" width="324" height="32" rx="6" fill="#0d1117" stroke="#5abf5a" stroke-width="1.8"/><text x="518.0" y="462.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e6e6e6" text-anchor="start">LKeq,x diario ≤ límite + 3 dB</text><text x="818.0" y="462.0" font-family="Consolas, Menlo, monospace" font-size="16" fill="#5abf5a" text-anchor="end">57 ≤ 58 ✓</text><rect x="506.0" y="480.0" width="324" height="32" rx="6" fill="#0d1117" stroke="#e46a6a" stroke-width="1.8"/><text x="518.0" y="502.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e6e6e6" text-anchor="start">LK,x anual ≤ límite</text><text x="818.0" y="502.0" font-family="Consolas, Menlo, monospace" font-size="16" fill="#e46a6a" text-anchor="end">56 &gt; 55 ✗</text><text x="70.0" y="546.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#9a9a9a" text-anchor="start">El artículo 25.2 suprime el tercer criterio para una actividad ya en funcionamiento</text></svg>