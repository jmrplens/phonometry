name: Docs

# The build job is the only thing in the repository that compiles the site, so
# until it ran on pull requests a page could break the deploy while its pull
# request stayed green: nothing in Python CI touches Astro. That is not a
# hypothetical. A repeated word in an import statement took the deploy down for
# fifteen hours across five merges, and the over-long page titles that surfaced
# once the build came back had ridden in the same way. Both would have been
# caught here before the merge, so the build now runs on pull requests too and
# only the publishing half is reserved for main.
on:
  push:
    branches: ["main"]
    # The build regenerates llms.txt from the markdown mirror before running
    # Astro, so a change to docs/ or to the generator has to redeploy the site
    # too: otherwise the published llms.txt silently falls behind the docs.
    paths:
      - "site/**"
      - "docs/**"
      # The Open Graph cards are composed at build time from the brand fonts
      # and the per-area artwork, which live outside site/. Without this a new
      # artwork or a font change would not redeploy and the published cards
      # would silently fall behind, the same gap the note above guards for
      # llms.txt. (The icons are written into site/public and are covered by
      # the first entry already.)
      - ".github/brand/**"
      - "scripts/generate_llms.py"
      # The release commit. site/src/data/citation.mjs reads all three of these
      # from the repository root, and repo-stats.mjs reads VERSION: without
      # them here, publishing a release rebuilt nothing, and the site kept
      # citing the previous version until something under site/ happened to
      # change.
      - "VERSION"
      - "CHANGELOG.md"
      - "CITATION.cff"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: ["main"]
    # Deliberately the same set as the push trigger above, spelled out because
    # GitHub Actions does not resolve YAML anchors. Keep the two lists in step:
    # a path that deploys on push but is not validated here would be exactly the
    # blind spot this trigger exists to close.
    paths:
      - "site/**"
      - "docs/**"
      - ".github/brand/**"
      - "scripts/generate_llms.py"
      - "VERSION"
      - "CHANGELOG.md"
      - "CITATION.cff"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Production deploys share a single queue because the Pages environment
  # accepts one in-flight deployment at a time. A pull-request build must not
  # join that queue: cancel-in-progress would let a validation run abort a
  # deploy that is already publishing. Each pull request gets its own group
  # instead, so a fixup push cancels only that branch's stale build.
  group: pages-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  build:
    name: Site builds and validates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Full history: add-sitemap-lastmod.mjs stamps per-file git dates.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Enable latest pnpm via corepack
        # corepack ships with Node and installs pnpm cleanly. We avoid
        # pnpm/action-setup, whose bundled installer crashes while self-updating
        # to the latest release ("Cannot use 'in' operator ... integrity").
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm --version
      - name: Resolve pnpm store path
        # Derive the store path from pnpm itself rather than hardcoding it: it
        # varies with pnpm version and XDG configuration.
        run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
        working-directory: site
      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('site/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Check the overview mirrors, then regenerate llms.txt
        run: |
          python3 scripts/mirror_overviews.py --check
          python3 scripts/generate_llms.py
      - name: Check the icon sheet is not stale
        # The sheet is the index of the site's own icons and the only place a
        # changed drawing is visible in a diff. It costs nothing to keep in
        # step and is worthless once it is not.
        run: pnpm run check:icons
        working-directory: site
      - name: Check the guides index lists every guide
        # The page the Start topic offers as the map of the library is written
        # by hand, and it had drifted to 100 of 104 links while stating 104 in
        # the prose and in its own meta description, in both languages. Cheap,
        # so it runs before the build rather than after it.
        run: pnpm run check:guides
        working-directory: site
      - name: Check EN/ES translation parity
        run: node scripts/check-i18n-parity.mjs
        working-directory: site
      - name: Build site
        run: pnpm install --frozen-lockfile && pnpm build
        working-directory: site
      - name: Validate HTML
        run: pnpm run html-validate
        working-directory: site
      - name: Check every formula rendered
        # KaTeX does not fail a build on a parse error: it emits a
        # `katex-error` span and ships the page. A display block whose `$$`
        # sits on a content line is worse than mis-rendered, because the
        # parser then eats the rest of the document; that silently cost one
        # guide six sections in both locales. HTML validation and the
        # accessibility audit both pass on such a page.
        run: pnpm run check:math
        working-directory: site
      - name: Accessibility audit (pa11y, WCAG2AA)
        run: pnpm run pa11y
        working-directory: site
      - name: Check the sidebar a reader actually gets
        # The navigation is thirteen trees now, one per topic, and the shape a
        # reader meets is the product of the topic data, the plugin, our
        # overrides and Starlight's own current-page marking. None of the
        # checks above look at it. A page listed in no topic does fail the
        # build, since the plugin throws, but a page that lands in a tree with
        # nothing marked, at the wrong depth, or through a closed parent
        # leaves the build, the HTML validation and the accessibility audit
        # all green.
        run: pnpm run check:sidebar
        working-directory: site
      - name: Check the landing, the contrast and the language bar
        # Three audits that existed and ran for nobody: the colour tokens of
        # both themes against the contrast floor, the landing page's headings
        # and grid at ten viewport and font-size combinations, and the
        # behaviour of the language suggestion bar. They share one preview.
        run: pnpm run check:visual
        working-directory: site
      # Only the branch that publishes needs the tarball. A pull request has
      # already got what it came for once the checks above have run.
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  indexnow:
    name: Submit URLs to IndexNow
    needs: deploy
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 10
    steps:
      - name: Submit sitemap URLs to IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          if [ -z "${INDEXNOW_KEY:-}" ]; then
            echo "::error::INDEXNOW_KEY secret is not set"; exit 1
          fi
          python3 - <<'PY'
          import json, os, sys, time, urllib.request, xml.etree.ElementTree as ET
          from urllib.parse import urlparse

          TIMEOUT = 30
          key = os.environ["INDEXNOW_KEY"]
          base = os.environ["PAGE_URL"].rstrip("/")
          host = urlparse(base).netloc

          def fetch(url):
              with urllib.request.urlopen(url, timeout=TIMEOUT) as r:
                  return r.read()

          # Pages can take a moment to propagate after deploy: retry the key file.
          key_url = f"{base}/{key}.txt"
          for attempt in range(6):
              try:
                  assert fetch(key_url).decode().strip() == key
                  break
              except Exception:
                  if attempt == 5:
                      sys.exit(f"key file unreachable: {key_url}")
                  time.sleep(2 ** attempt)

          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          index = ET.fromstring(fetch(f"{base}/sitemap-index.xml"))
          urls = []
          for shard in index.findall("sm:sitemap/sm:loc", ns):
              tree = ET.fromstring(fetch(shard.text.strip()))
              urls += [loc.text.strip() for loc in tree.findall("sm:url/sm:loc", ns)]
          if not urls:
              sys.exit("sitemap produced no URLs")

          payload = json.dumps({
              "host": host, "key": key, "keyLocation": key_url, "urlList": urls,
          }).encode()
          req = urllib.request.Request(
              "https://api.indexnow.org/IndexNow", data=payload,
              headers={"Content-Type": "application/json; charset=utf-8"},
          )
          with urllib.request.urlopen(req, timeout=TIMEOUT) as r:
              print(f"IndexNow HTTP {r.status} ({len(urls)} URLs submitted)")
              if r.status not in (200, 202):
                  sys.exit(f"unexpected status {r.status}: {r.read()[:300]}")
          PY
