 x="748.0" y="378.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle">varios elementos constructivos</text><text x="748.0" y="400.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle">la diferencia de nivel de velocidad</text><text x="748.0" y="422.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle">se mide según la EN ISO 10848-1</text><text x="748.0" y="444.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle">en cada banda, con el</text><text x="748.0" y="466.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle">equipo desmontado</text><rect x="48" y="502" width="804" height="72" rx="10" fill="none" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="6,5"/><text x="450" y="528" font-family="Consolas, Menlo, monospace" font-size="15" fill="#e6e6e6" text-anchor="middle">placa de baja movilidad -&gt; fuerza bloqueada (15) -&gt; potencia característica L_Wsn (17)</text><text x="450" y="556" font-family="Consolas, Menlo, monospace" font-size="15" fill="#e6e6e6" text-anchor="middle">placa de alta movilidad -&gt; velocidad libre (18) -&gt; movilidad de fuente |Y_S,eq| (19)</text></svg>