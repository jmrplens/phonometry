<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><rect width="900" height="600" fill="#ffffff"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1a1a1a" text-anchor="middle">Condition monitoring on a motor-gearbox train (Norton Section 8.4)</text><rect x="110" y="262.0" width="460" height="18" rx="0.0" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="2.0"/><line x1="110" y1="280.0" x2="570" y2="280.0" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round"/><line x1="110" y1="280.0" x2="102" y2="289.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="134" y1="280.0" x2="126" y2="289.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="158" y1="280.0" x2="150" y2="289.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="182" y1="280.0" x2="174" y2="289.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="206" y1="280.0" x2="198" y2="289.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="230" y1="280.0" x2="222" y2="289.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="254" y1="280.0" x2="246" y2="289.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="278" y1="280.0" x2="270" y2="289.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="302" y1="280.0" x2="294" y2="289.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="326" y1="280.0" x2="318" y2="289.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="350" y1="280.0" x2="342" y2="289.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="374" y1="280.0" x2="366" y2="289.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="398" y1="280.0" x2="390" y2="289.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="422" y1="280.0" x2="414" y2="289.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="446" y1="280.0" x2="438" y2="289.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="470" y1="280.0" x2="462" y2="289.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="494" y1="280.0" x2="486" y2="289.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="518" y1="280.0" x2="510" y2="289.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="542" y1="280.0" x2="534" y2="289.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="566" y1="280.0" x2="558" y2="289.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><rect x="130" y="182" width="136" height="80" rx="6" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="2.2"/><text x="198" y="228" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="600">motor</text><rect x="390" y="172" width="148" height="90" rx="6" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="2.2"/><text x="464" y="224" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="600">gearbox</text><line x1="60" y1="222.0" x2="130" y2="222.0" stroke="#1a1a1a" stroke-width="3.0" stroke-linecap="round"/><line x1="266" y1="222.0" x2="390" y2="222.0" stroke="#1a1a1a" stroke-width="3.0" stroke-linecap="round"/><rect x="316" y="210.0" width="26" height="24" rx="3" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="1.8"/><text x="329" y="256.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle">coupling</text><rect x="266.0" y="204.0" width="32" height="36" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><rect x="358.0" y="204.0" width="32" height="36" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><rect x="275.0" y="190.0" width="14.0" height="14.0" rx="2.5" fill="#d62728" stroke="#1a1a1a" stroke-width="1.3"/><line x1="282.0" y1="190.0" x2="282.0" y2="182.0" stroke="#1a1a1a" stroke-width="1.3" stroke-linecap="round"/><rect x="367.0" y="190.0" width="14.0" height="14.0" rx="2.5" fill="#d62728" stroke="#1a1a1a" stroke-width="1.3"/><line x1="374.0" y1="190.0" x2="374.0" y2="182.0" stroke="#1a1a1a" stroke-width="1.3" stroke-linecap="round"/><rect x="538" y="196" width="15" height="16" rx="2.5" fill="#d62728" stroke="#1a1a1a" stroke-width="1.3"/><line x1="553" y1="204" x2="566" y2="204" stroke="#1a1a1a" stroke-width="1.3" stroke-linecap="round"/><text x="572" y="209" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#d62728" text-anchor="start">axial</text><text x="328" y="322" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#666666" text-anchor="middle">radial, in the load zone, on the housing itself: no joint between the bearing and the sensor</text><line x1="282" y1="300" x2="276" y2="262" stroke="#666666" stroke-width="1.0" stroke-dasharray="3,3" stroke-linecap="round"/><line x1="374" y1="300" x2="380" y2="262" stroke="#666666" stroke-width="1.0" stroke-dasharray="3,3" stroke-linecap="round"/><rect x="74" y="146" width="40" height="28" rx="5" fill="#f0f2f5" stroke="#2ca02c" stroke-width="2.0"/><line x1="94" y1="174" x2="94.0" y2="201.0" stroke="#2ca02c" stroke-width="1.8" stroke-linecap="round"/><path d="M 94.0 210.0 L 90.4 201.0 L 97.6 201.0 Z" fill="#2ca02c" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="86" y="215.0" width="16" height="14" rx="0.0" fill="#2ca02c" stroke="#1a1a1a" stroke-width="1.0"/><text x="122" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#2ca02c" text-anchor="start">once-per-revolution</text><text x="122" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#2ca02c" text-anchor="start">pickup on a mark</text><line x1="94" y1="146" x2="94" y2="96" stroke="#2ca02c" stroke-width="1.6" stroke-linecap="round"/><line x1="282" y1="182.0" x2="282" y2="96" stroke="#d62728" stroke-width="1.6" stroke-linecap="round"/><line x1="374" y1="182.0" x2="374" y2="96" stroke="#d62728" stroke-width="1.6" stroke-linecap="round"/><line x1="553" y1="204" x2="553" y2="96" stroke="#d62728" stroke-width="1.6" stroke-linecap="round"/><line x1="94" y1="96" x2="640" y2="96" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><line x1="640" y1="96" x2="684.0058580762203" y2="145.28656104536677" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 690.0 152.0 L 681.3 147.7 L 686.7 142.9 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="628" y="158" width="246" height="118" rx="12" fill="#f0f2f5" stroke="#1f77b4" stroke-width="2.2"/><text x="751" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="600">Analyser</text><text x="751" y="218" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle">ch 1: acceleration</text><text x="751" y="242" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle">ch 2: tacho pulse</text><text x="751" y="264" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle">band-pass → envelope → spectrum</text><rect x="48" y="356" width="396" height="244" rx="10" fill="none" stroke="#1a1a1a" stroke-width="1.6"/><text x="70" y="386" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="600">Mounting sets the usable upper frequency</text><text x="70" y="420.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start">stud into a prepared flat</text><text x="422" y="420.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#666666" text-anchor="end">tens of kHz</text><text x="70" y="450.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start">adhesive / thin cyanoacrylate</text><text x="422" y="450.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#666666" text-anchor="end">~10 kHz</text><text x="70" y="480.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start">magnet base</text><text x="422" y="480.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#666666" text-anchor="end">a few kHz</text><text x="70" y="510.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start">hand-held probe</text><text x="422" y="510.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#666666" text-anchor="end">~1 kHz</text><text x="70" y="552" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#d62728" text-anchor="start">this page band-passes 2-4 kHz, so a magnet base is</text><text x="70" y="572" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#d62728" text-anchor="start">marginal there and a hand-held probe is useless</text><rect x="470" y="356" width="382" height="244" rx="10" fill="none" stroke="#1f77b4" stroke-width="1.6"/><text x="492" y="386" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="600">Acquisition</text><text x="492" y="420" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start">fs = 20 kHz clears the 3 kHz housing resonance</text><text x="492" y="450" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start">T = 2 s at 2000 r/min = 67 revolutions</text><text x="492" y="480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start">Δf = 1/T = 0.5 Hz, against fs = 33.3 Hz</text><text x="492" y="522" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="start">enough to resolve the ± fs sidebands, which are</text><text x="492" y="542" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="start">what separates an inner-race defect from an</text><text x="492" y="562" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="start">outer-race one</text></svg>