<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500"><rect width="900" height="500" fill="#0d1117"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6e6e6" text-anchor="middle">Sound quality beyond loudness: four calibrated sensations</text><rect x="230" y="52" width="440" height="56" rx="10" fill="#1c2128" stroke="#e6e6e6" stroke-width="2"/><text x="450" y="76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e6e6e6" text-anchor="middle" font-weight="600">Calibrated signal x(t) in pascals</text><text x="450" y="97" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">any sample rate: each metric resamples to 48 kHz internally</text><rect x="60" y="148" width="270" height="56" rx="10" fill="#1c2128" stroke="#4da3d8" stroke-width="2"/><text x="195" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="600">Specific loudness N'(z)</text><text x="195" y="192" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">Zwicker pattern over 24 Bark</text><rect x="390" y="148" width="450" height="56" rx="10" fill="#1c2128" stroke="#4da3d8" stroke-width="2"/><text x="615" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="600">Sottek Hearing Model front end (ECMA-418-2)</text><text x="615" y="192" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">outer/middle-ear filter + 53 auditory bands (Bark_HMS)</text><line x1="350" y1="108" x2="218.71643639337165" y2="141.75863064170443" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 210.0 144.0 L 217.8 138.3 L 219.6 145.2 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="550" y1="108" x2="597.4696863479521" y2="139.0710674277505" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 605.0 144.0 L 595.5 142.1 L 599.4 136.1 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="42.0" y="248" width="196" height="128" rx="10" fill="#1c2128" stroke="#e46a6a" stroke-width="2"/><text x="140.0" y="271" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="600">Sharpness S</text><text x="140.0" y="289" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#9a9a9a" text-anchor="middle">DIN 45692</text><text x="140.0" y="308" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#9a9a9a" text-anchor="middle">g(z)-weighted first moment</text><text x="140.0" y="322" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#9a9a9a" text-anchor="middle">of N'(z), with k = 0.108</text><text x="140.0" y="337" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#e6e6e6" text-anchor="middle">critical-band-wide noise</text><text x="140.0" y="351" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#e6e6e6" text-anchor="middle">at 1 kHz, 60 dB</text><text x="140.0" y="363" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#e46a6a" text-anchor="middle" font-weight="600">→ S = 1.00 acum</text><rect x="262.0" y="248" width="196" height="128" rx="10" fill="#1c2128" stroke="#e46a6a" stroke-width="2"/><text x="360.0" y="271" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="600">Tonality T</text><text x="360.0" y="289" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#9a9a9a" text-anchor="middle">ECMA-418-2 clause 6</text><text x="360.0" y="308" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#9a9a9a" text-anchor="middle">band autocorrelation finds</text><text x="360.0" y="324" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#9a9a9a" text-anchor="middle">periodic components</text><text x="360.0" y="345" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#e6e6e6" text-anchor="middle">1 kHz tone at 40 dB</text><text x="360.0" y="363" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#e46a6a" text-anchor="middle" font-weight="600">→ T = 1.000 tu_HMS (999 Hz)</text><rect x="482.0" y="248" width="196" height="128" rx="10" fill="#1c2128" stroke="#e46a6a" stroke-width="2"/><text x="580.0" y="271" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="600">Roughness R</text><text x="580.0" y="289" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#9a9a9a" text-anchor="middle">ECMA-418-2 clause 7</text><text x="580.0" y="308" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#9a9a9a" text-anchor="middle">fast envelope modulation,</text><text x="580.0" y="324" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#9a9a9a" text-anchor="middle">band-pass peaking near 70 Hz</text><text x="580.0" y="345" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#e6e6e6" text-anchor="middle">1 kHz, 100 % AM at 70 Hz, 60 dB</text><text x="580.0" y="363" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#e46a6a" text-anchor="middle" font-weight="600">→ R = 0.9999 asper</text><rect x="702.0" y="248" width="196" height="128" rx="10" fill="#1c2128" stroke="#e46a6a" stroke-width="2"/><text x="800.0" y="271" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="600">Fluctuation strength F</text><text x="800.0" y="289" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#9a9a9a" text-anchor="middle">ECMA-418-2 clause 9 (HSA)</text><text x="800.0" y="308" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#9a9a9a" text-anchor="middle">slow envelope modulation,</text><text x="800.0" y="324" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#9a9a9a" text-anchor="middle">band-pass peaking near 4 Hz</text><text x="800.0" y="345" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#e6e6e6" text-anchor="middle">1 kHz, 100 % AM at 4 Hz, 60 dB</text><text x="800.0" y="363" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#e46a6a" text-anchor="middle" font-weight="600">→ F = 0.9957 vacil_HMS</text><line x1="195" y1="204" x2="148.2320147401027" y2="238.64295204436837" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 141.0 244.0 L 146.1 235.8 L 150.4 241.5 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="615" y1="204" x2="368.891275737494" y2="242.6052900803931" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 360.0 244.0 L 368.3 239.0 L 369.4 246.2 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="615" y1="204" x2="585.9265414708167" y2="237.2268097476381" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 580.0 244.0 L 583.2 234.9 L 588.6 239.6 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="615" y1="204" x2="791.2032725110412" y2="242.09800486725214" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 800.0 244.0 L 790.4 245.6 L 792.0 238.6 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="130" y="412" width="640" height="68" rx="10" fill="none" stroke="#5abf5a" stroke-width="1.6" stroke-dasharray="6,5"/><text x="450" y="439" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#5abf5a" text-anchor="middle" font-weight="600">Downstream, the sensations combine into annoyance</text><text x="450" y="463" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#e6e6e6" text-anchor="middle">N5, S, R and F feed the Fastl and Zwicker psychoacoustic annoyance PA = N5·(1 + √(wS² + wFR²))</text></svg>