<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><rect width="900" height="600" fill="#0d1117"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6e6e6" text-anchor="middle">STOI and ESTOI: correlating clean against degraded speech</text><rect x="150.0" y="52" width="600.0" height="58" rx="10" fill="#1c2128" stroke="#e6e6e6" stroke-width="2"/><text x="450.0" y="77" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e6e6e6" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>Clean reference </tspan><tspan font-style="italic">x</tspan><tspan>(</tspan><tspan font-style="italic">t</tspan><tspan>) and degraded version </tspan><tspan font-style="italic">y</tspan><tspan>(</tspan><tspan font-style="italic">t</tspan><tspan>)</tspan></text><text x="450.0" y="97" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">the guide's example: speech-like material in a flat masker at 0 dB SNR</text><rect x="150.0" y="138" width="600.0" height="58" rx="10" fill="#1c2128" stroke="#4da3d8" stroke-width="2"/><text x="450.0" y="163" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e6e6e6" text-anchor="middle" font-weight="600">Resample to 10 kHz and drop the silent frames</text><text x="450.0" y="183" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">frames 40 dB below the loudest clean frame carry no intelligibility</text><rect x="150.0" y="224" width="600.0" height="58" rx="10" fill="#1c2128" stroke="#4da3d8" stroke-width="2"/><text x="450.0" y="249" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e6e6e6" text-anchor="middle" font-weight="600">Short-time DFT: 256-sample Hann frames, 50 % overlap</text><text x="450.0" y="269" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">magnitudes grouped into 15 one-third-octave bands from 150 Hz</text><rect x="150.0" y="310" width="600.0" height="58" rx="10" fill="#1c2128" stroke="#4da3d8" stroke-width="2"/><text x="450.0" y="335" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e6e6e6" text-anchor="middle" font-weight="600">384 ms segments — 30 frames, the unit of comparison</text><text x="450.0" y="355" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">long enough to hold the slow modulations that carry speech</text><line x1="450.0" y1="110" x2="450.0" y2="125.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 134.0 L 446.4 125.0 L 453.6 125.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="450.0" y1="196" x2="450.0" y2="211.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 220.0 L 446.4 211.0 L 453.6 211.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="450.0" y1="282" x2="450.0" y2="297.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 306.0 L 446.4 297.0 L 453.6 297.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="150" y="404" width="285" height="76" rx="10" fill="#1c2128" stroke="#e46a6a" stroke-width="2"/><text x="292" y="428" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="600">STOI: envelope correlation</text><text x="292" y="447" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#9a9a9a" text-anchor="middle">per band and segment; normalise,</text><text x="292" y="464" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#9a9a9a" text-anchor="middle">clip at −15 dB, then average</text><rect x="465" y="404" width="285" height="76" rx="10" fill="#1c2128" stroke="#e46a6a" stroke-width="2"/><text x="607" y="428" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e6e6e6" text-anchor="middle" font-weight="600">ESTOI: spectral correlation</text><text x="607" y="447" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#9a9a9a" text-anchor="middle">row- and column-normalised segments;</text><text x="607" y="464" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#9a9a9a" text-anchor="middle">credits glimpses in modulated maskers</text><line x1="450" y1="368" x2="308.8019355278188" y2="398.12225375406535" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 300.0 400.0 L 308.1 394.6 L 309.6 401.6 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="450" y1="368" x2="591.1980644721813" y2="398.12225375406535" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 600.0 400.0 L 590.4 401.6 L 591.9 394.6 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="150.0" y="516" width="600.0" height="60" rx="10" fill="none" stroke="#5abf5a" stroke-width="2.4"/><text x="450.0" y="541" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="middle" font-weight="600">STOI = 0.727 for the example</text><text x="450.0" y="563" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">the lowest band keeps 0.27 of the correlation; above 1.9 kHz it reaches 0.90</text><line x1="292" y1="480" x2="381.4445508915812" y2="509.20638396459793" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 390.0 512.0 L 380.3 512.6 L 382.6 505.8 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="607" y1="480" x2="518.5469200211528" y2="509.18039751879496" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 510.0 512.0 L 517.4 505.8 L 519.7 512.6 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/></svg>