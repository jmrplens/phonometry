2" y2="309" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="274" y1="300" x2="266" y2="309" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="298" y1="300" x2="290" y2="309" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="322" y1="300" x2="314" y2="309" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="346" y1="300" x2="338" y2="309" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="370" y1="300" x2="362" y2="309" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="394" y1="300" x2="386" y2="309" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><text x="262" y="322" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle">suspension travel</text><rect x="206" y="191" width="80" height="9" rx="4" fill="#d62728" stroke="#1a1a1a" stroke-width="1.5"/><rect x="234" y="192.5" width="24" height="6" rx="1.5" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="1.0"/><line x1="300" y1="190" x2="300.0" y2="137.0" stroke="#2ca02c" stroke-width="2.4" stroke-linecap="round"/><path d="M 300.0 128.0 L 303.6 137.0 L 296.4 137.0 Z" fill="#2ca02c" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="308" y="138" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#2ca02c" text-anchor="start" font-weight="600" xml:space="preserve"><tspan font-style="italic">z</tspan><tspan> +</tspan></text><rect x="186" y="190" width="15" height="11" rx="2" fill="#1f77b4" stroke="#1a1a1a" stroke-width="1.2"/><line x1="186" y1="196" x2="128" y2="196" stroke="#1f77b4" stroke-width="1.8" stroke-linecap="round"/><circle cx="124" cy="196" r="4" fill="#1f77b4" stroke="none" stroke-width="1.5"/><circle cx="50" cy="351" r="3.4" fill="#d62728" stroke="none" stroke-width="1.5"/><text x="64" y="356" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">semi-rigid mounting disc Ø 250 ± 50 mm, height ≤ 12 mm,</text><text x="64" y="373" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">80-90 durometer (A), carrying a Ø 75 ± 5 mm × 1.5 mm</text><text x="64" y="390" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">metal disc for the accelerometers (ISO 10326-1, 5.2.3)</text><circle cx="50" cy="402" r="3.4" fill="#d62728" stroke="none" stroke-width="1.5"/><text x="64" y="407" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">taped to the cushion so the accelerometers sit midway</text><text x="64" y="424" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">between the ischial tuberosities (5.1.2)</text><circle cx="50" cy="436" r="3.4" fill="#d62728" stroke="none" stroke-width="1.5"/><text x="64" y="441" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" xml:space="preserve"><tspan font-style="italic">z</tspan><tspan> is positive to cranial: the method is about</tspan></text><text x="64" y="458" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">compressive spinal loading (5.1.3, first step)</text><circle cx="50" cy="470" r="3.4" fill="#d62728" stroke="none" stroke-width="1.5"/><text x="64" y="475" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">a contact switch or video detects loss of contact,</text><text x="64" y="492" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">which is reported and excluded from the exposure</text><text x="681" y="78" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="600">The record, split where contact is lost</text><text x="681" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#d62728" text-anchor="middle">accelerations recorded while contact is lost</text><text x="681" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#d62728" text-anchor="middle">shall not be counted as exposure, and the</text><text x="681" y="146" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#d62728" text-anchor="middle">landing impact after a free fall shall be (5.1.2)</text><rect x="608.6" y="214.0" width="36.20000000000001" height="184" rx="0.0" fill="#f0f2f5" stroke="#d62728" stroke-width="1.4" stroke-dasharray="5,4"/><rect x="738.9200000000001" y="214.0" width="21.719999999999978" height="184" rx="0.0" fill="#f0f2f5" stroke="#d62728" stroke-width="1.4" stroke-dasharray="5,4"/><path d="M 500.0 301.0 L 502.0 297.3 L 504.0 294.9 L 506.0 293.8 L 508.0 293.8 L 510.0 294.5 L 512.0 295.4 L 514.0 296.1 L 516.0 296.2 L 518.0 295.6 L 520.0 294.4 L 522.0 292.8 L 524.0 291.3 L 526.0 290.3 L 528.0 290.4 L 530.0 291.8 L 532.0 294.7 L 534.0 298.9 L 536.0 303.9 L 538.0 309.4 L 540.0 314.6 L 542.0 318.9 L 544.0 322.0 L 546.0 323.6 L 548.0 323.7 L 550.0 322.6 L 552.0 320.7 L 554.0 318.5 L 556.0 316.6 L 558.0 315.2 L 560.0 314.6 L 562.0 302.6 L 564.0 274.4 L 566.0 283.7 L 568.0 309.4 L 570.0 327.9 L 572.0 329.0 L 574.0 317.1 L 576.0 302.6 L 578.0 293.0 L 580.0 289.7 L 582.0 289.6 L 584.0 289.5 L 586.0 288.0 L 588.0 286.2 L 590.0 285.8 L 592.0 287.6 L 594.0 291.2 L 596.0 295.4 L 598.0 299.1 L 600.0 301.6 L 602.0 302.9 L 604.0 303.4 L 606.0 303.5 L 608.0 303.6 L 610.0 340.0 L 612.0 340.0 L 614.0 340.0 L 616.0 340.0 L 618.0 340.0 L 620.0 340.0 L 622.0 340.0 L 624.0 340.0 L 626.0 340.0 L 628.0 340.0 L 630.0 340.0 L 632.0 340.0 L 634.0 340.0 L 636.0 340.0 L 638.0 340.0 L 640.0 340.0 L 642.0 340.0 L 644.0 340.0 L 646.0 300.9 L 648.0 300.6 L 650.0 300.7 L 652.0 300.7 L 654.0 300.1 L 656.0 298.8 L 658.0 296.6 L 660.0 293.9 L 662.0 290.9 L