ound"/><line x1="816.0" y1="250.0" x2="808.0" y2="259.0" stroke="#666666" stroke-width="1.1" stroke-linecap="round"/><line x1="546.0" y1="202.0" x2="546.0" y2="250.0" stroke="#1a1a1a" stroke-width="2.0" stroke-linecap="round"/><rect x="522.0" y="150.0" width="48" height="52" rx="5" fill="#ffffff" stroke="#1f77b4" stroke-width="2.0"/><circle cx="546.0" cy="178.0" r="10" fill="#1f77b4" stroke="none" stroke-width="1.5"/><line x1="762.0" y1="184.0" x2="762.0" y2="250.0" stroke="#1a1a1a" stroke-width="2.0" stroke-linecap="round"/><rect x="742.0" y="172.0" width="32" height="12" rx="4" fill="#1f77b4" stroke="none" stroke-width="1.5"/><rect x="774.0" y="174.0" width="10" height="8" rx="2" fill="#1a1a1a" stroke="none" stroke-width="1.5"/><line x1="570.0" y1="178.0" x2="742.0" y2="178.0" stroke="#1a1a1a" stroke-width="2.0" stroke-linecap="round"/><line x1="546.0" y1="178.0" x2="546.0" y2="140.0" stroke="#666666" stroke-width="0.9" stroke-dasharray="3,3" stroke-linecap="round"/><line x1="762.0" y1="178.0" x2="762.0" y2="140.0" stroke="#666666" stroke-width="0.9" stroke-dasharray="3,3" stroke-linecap="round"/><line x1="650.0" y1="140.0" x2="555.0" y2="140.0" stroke="#666666" stroke-width="1.2" stroke-linecap="round"/><path d="M 546.0 140.0 L 555.0 136.4 L 555.0 143.6 Z" fill="#666666" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="658.0" y1="140.0" x2="753.0" y2="140.0" stroke="#666666" stroke-width="1.2" stroke-linecap="round"/><path d="M 762.0 140.0 L 753.0 143.6 L 753.0 136.4 Z" fill="#666666" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="654.0" y="133.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle">d = 1.00 m</text><line x1="546.0" y1="178.0" x2="654.0" y2="250.0" stroke="#d62728" stroke-width="1.8" stroke-dasharray="8,5" stroke-linecap="round"/><line x1="654.0" y1="250.0" x2="762.0" y2="178.0" stroke="#d62728" stroke-width="1.8" stroke-dasharray="8,5" stroke-linecap="round"/><text x="654.0" y="240.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#d62728" text-anchor="middle">camino reflejado de 2,60 m</text><text x="450" y="296" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle">Tiempo libre de reflexiones t_g = (2,60 − 1,00) m / (343 m/s) = 4,7 ms: después, la grabación es la sala, no el altavoz.</text><text x="450" y="336" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">La grabación, en el eje temporal del barrido: f₁ = 20 Hz, f₂ = 6 kHz, T = 4 s, y L = T / ln(f₂/f₁) = 0,70 s</text><line x1="90.0" y1="412.0" x2="830.0" y2="412.0" stroke="#1a1a1a" stroke-width="2.0" stroke-linecap="round"/><line x1="800.0" y1="412.0" x2="821.0" y2="412.0" stroke="#1a1a1a" stroke-width="2.0" stroke-linecap="round"/><path d="M 830.0 412.0 L 821.0 415.6 L 821.0 408.4 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="628.4615384615385" y1="412.0" x2="628.4615384615385" y2="366.0" stroke="#1f77b4" stroke-width="3.0" stroke-linecap="round"/><text x="628.4615384615385" y="357.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f77b4" text-anchor="middle" font-weight="600">h₁ (lineal)</text><line x1="366.7692307692308" y1="412.0" x2="366.7692307692308" y2="378.0" stroke="#d62728" stroke-width="3.0" stroke-linecap="round"/><text x="366.7692307692308" y="369.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#d62728" text-anchor="middle" font-weight="600">h₂  −0.49 s</text><line x1="213.84615384615384" y1="412.0" x2="213.84615384615384" y2="386.0" stroke="#2ca02c" stroke-width="3.0" stroke-linecap="round"/><text x="213.84615384615384" y="377.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#2ca02c" text-anchor="middle" font-weight="600">h₃  −0.77 s</text><text x="628.4615384615385" y="434.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle">t = 0</text><rect x="366.7692307692308" y="426.0" width="152.92307692307685" height="26" rx="5" fill="#f0f2f5" stroke="#666666" stroke-width="1.4"/><text x="443.23076923076917" y="474.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle">ventana por orden: 8192 muestras = 0,17 s a 48 kHz</text><line x1="286.3076923076923" y1="516.0" x2="222.84615384615384" y2="516.0" stroke="#666666" stroke-width="1.2" stroke-linecap="round"/><path d="M 213.8 516.0 L 222.8 512.4 L 222.8 519.6 Z" fill="#666666" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="294.3076923076923" y1="516.0" x2="357.7692307692308" y2="516.0" stroke="#666666" stroke-width="1.2" stroke-linecap="round"/><path d="M 366.8 516.0 L 357.8 519.6 L 357.8 512.4 Z" fill="#666666" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="290.3076923076923" y="509.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle">L ln(3/2) = 0,28 s: el par de llegadas más próximo</text><text x="40" y="556.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start">Se graba hasta que muere la caída, o las prellegadas rodean la deconvolución circular hasta el final de h₁.</text><text x="40" y="580.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#666666" text-anchor="start">La amplitud de excitación y el fundido se declaran con el resultado, y el mismo fundido se pasa al análisis.</text></svg>