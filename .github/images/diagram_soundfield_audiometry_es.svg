family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#d62728" text-anchor="middle">no en un punto de una sala</text><text x="735.0" y="424.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#d62728" text-anchor="middle">0 dB HL aquí es el RETSPL del auricular</text><text x="735.0" y="442.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#d62728" text-anchor="middle">colocado (ISO 389-1 / -2 / -8), referido a un</text><text x="735.0" y="460.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#d62728" text-anchor="middle">acoplador, nunca un valor de ISO 389-7</text><rect x="24" y="486" width="852" height="68" rx="10" fill="none" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="6,5"/><text x="450" y="514" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="600">Punto de referencia: el punto medio entre las entradas de los conductos auditivos</text><text x="450" y="540" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle">el oyente en la posición de escucha; en A y B el nivel se mide ahí sin el sujeto ni la silla</text></svg>