<svg xmlns="http://www.w3.org/2000/svg" width="900" height="670" viewBox="0 0 900 670"><rect width="900" height="670" fill="#0d1117"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6e6e6" text-anchor="middle">Sonoridad de programa: la cadena de medición BS.1770 / R 128</text><rect x="170.0" y="52" width="560.0" height="58" rx="10" fill="#1c2128" stroke="#e6e6e6" stroke-width="2"/><text x="450.0" y="77" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="600">Programa x — pesos de canal Gi: 1,0 frontales, 1,41 envolventes</text><text x="450.0" y="97" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">ancla: un seno de 997 Hz a 0 dB FS en un canal frontal marca −3,01 LKFS</text><rect x="170.0" y="138" width="560.0" height="58" rx="10" fill="#1c2128" stroke="#4da3d8" stroke-width="2"/><text x="450.0" y="163" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="600">Ponderación K: estante de +4 dB (cabeza esférica) + paso alto RLB</text><text x="450.0" y="183" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">LK = −0,691 + 10·log10 Σ Gi·zi;  LKFS ≡ LUFS, 1 LU = 1 dB</text><rect x="170.0" y="224" width="560.0" height="58" rx="10" fill="#1c2128" stroke="#4da3d8" stroke-width="2"/><text x="450.0" y="249" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="600">Media cuadrática en bloques de 400 ms, 75 % de solape</text><text x="450.0" y="269" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">puerta absoluta: se descartan los bloques bajo −70 LUFS</text><rect x="170.0" y="310" width="560.0" height="58" rx="10" fill="#1c2128" stroke="#4da3d8" stroke-width="2"/><text x="450.0" y="335" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="600">Puerta relativa: −10 LU bajo los supervivientes</text><text x="450.0" y="355" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">ejemplo: 10 s a −23 dBFS + 30 s de silencio → umbral −39,0 LUFS</text><rect x="170.0" y="396" width="560.0" height="60" rx="10" fill="none" stroke="#5abf5a" stroke-width="2.4"/><text x="450.0" y="421" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e6e6e6" text-anchor="middle" font-weight="600">Sonoridad integrada I = −23,1 LUFS: la cola queda fuera</text><text x="450.0" y="443" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">objetivo EBU R 128 −23,0 LUFS; tolerancia ±0,2 LU en QC, ±1,0 LU en directo</text><line x1="450.0" y1="110" x2="450.0" y2="125.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 134.0 L 446.4 125.0 L 453.6 125.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="450.0" y1="196" x2="450.0" y2="211.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 220.0 L 446.4 211.0 L 453.6 211.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="450.0" y1="282" x2="450.0" y2="297.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 306.0 L 446.4 297.0 L 453.6 297.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="450.0" y1="368" x2="450.0" y2="383.0" stroke="#e6e6e6" stroke-width="1.8" stroke-linecap="round"/><path d="M 450.0 392.0 L 446.4 383.0 L 453.6 383.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="170" y1="167" x2="120" y2="167" stroke="#9a9a9a" stroke-width="1.4" stroke-linecap="round"/><line x1="120" y1="167" x2="120" y2="484" stroke="#9a9a9a" stroke-width="1.4" stroke-linecap="round"/><line x1="120" y1="484" x2="120.0" y2="479.0" stroke="#9a9a9a" stroke-width="1.4" stroke-linecap="round"/><path d="M 120.0 488.0 L 116.4 479.0 L 123.6 479.0 Z" fill="#9a9a9a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="120" y="157" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#9a9a9a" text-anchor="middle">ponderada K</text><line x1="730" y1="81" x2="780" y2="81" stroke="#9a9a9a" stroke-width="1.4" stroke-linecap="round"/><line x1="780" y1="81" x2="780" y2="484" stroke="#9a9a9a" stroke-width="1.4" stroke-linecap="round"/><line x1="780" y1="484" x2="780.0" y2="479.0" stroke="#9a9a9a" stroke-width="1.4" stroke-linecap="round"/><path d="M 780.0 488.0 L 776.4 479.0 L 783.6 479.0 Z" fill="#9a9a9a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="780" y="71" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#9a9a9a" text-anchor="middle">señal sin filtrar</text><rect x="70" y="492" width="360" height="82" rx="10" fill="#1c2128" stroke="#e46a6a" stroke-width="2"/><text x="250" y="517" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="600">Rango de sonoridad LRA = P95 − P10</text><text x="250" y="538" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#9a9a9a" text-anchor="middle">ventanas de corto plazo de 3 s, puerta más honda de −20 LU</text><text x="250" y="558" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#e46a6a" text-anchor="middle" font-weight="600">10,0 LU en el caso de dos escalones de Tech 3342</text><rect x="470" y="492" width="360" height="82" rx="10" fill="#1c2128" stroke="#e46a6a" stroke-width="2"/><text x="650" y="517" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e6e6e6" text-anchor="middle" font-weight="600">Pico verdadero: sobremuestreo 4×, en dBTP</text><text x="650" y="538" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#9a9a9a" text-anchor="middle">el tono a fs/4: pico muestral −3,01 dB, pico verdadero +0,12 dBTP</text><text x="650" y="558" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#e46a6a" text-anchor="middle" font-weight="600">techo de producción de R 128: −1 dBTP</text><text x="450" y="618" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e6e6e6" text-anchor="middle">las puertas evitan que los pasajes silenciosos arrastren el primer plano</text><text x="450" y="642" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9a9a9a" text-anchor="middle">sin puertas, el mismo ejemplo de 40 s marcaría cerca de −29 LUFS</text></svg>