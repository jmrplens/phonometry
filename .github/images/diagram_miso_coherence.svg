<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540"><rect width="900" height="540" fill="#ffffff"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1a1a1a" text-anchor="middle">MISO coherence: from correlated sources to per-source contributions</text><rect x="60" y="64" width="220" height="56" rx="10" fill="#f0f2f5" stroke="#1f77b4" stroke-width="2"/><text x="170.0" y="88.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="600">Input x1</text><text x="170.0" y="108.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">white noise</text><rect x="60" y="168" width="220" height="56" rx="10" fill="#f0f2f5" stroke="#1f77b4" stroke-width="2"/><text x="170.0" y="192.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="600">Input x2 = 0.7·x1 + noise</text><text x="170.0" y="212.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">correlated with x1</text><line x1="110" y1="120" x2="110" y2="168" stroke="#666666" stroke-width="1.4" stroke-dasharray="5,4" stroke-linecap="round"/><rect x="340" y="64" width="200" height="56" rx="10" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="2"/><text x="440.0" y="88.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="600">Path H1(f)</text><text x="440.0" y="108.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">low-pass, 400 Hz</text><rect x="340" y="168" width="200" height="56" rx="10" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="2"/><text x="440.0" y="192.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="600">Path H2(f)</text><text x="440.0" y="212.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">high-pass, 1.5 kHz</text><line x1="280" y1="92" x2="327.0" y2="92.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 336.0 92.0 L 327.0 95.6 L 327.0 88.4 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="280" y1="196" x2="327.0" y2="196.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 336.0 196.0 L 327.0 199.6 L 327.0 192.4 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><circle cx="600" cy="144" r="16" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="2"/><text x="600" y="151" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#1a1a1a" text-anchor="middle" font-weight="600">+</text><line x1="540" y1="92" x2="581.2268097476381" y2="128.07345852918334" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 588.0 134.0 L 578.9 130.8 L 583.6 125.4 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="540" y1="196" x2="581.2268097476381" y2="159.92654147081666" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 588.0 154.0 L 583.6 162.6 L 578.9 157.2 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="600" y="74" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle">noise n(t)</text><line x1="600" y1="82" x2="600.0" y2="115.0" stroke="#666666" stroke-width="1.4" stroke-linecap="round"/><path d="M 600.0 124.0 L 596.4 115.0 L 603.6 115.0 Z" fill="#666666" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="660" y="116" width="190" height="56" rx="10" fill="#f0f2f5" stroke="#d62728" stroke-width="2"/><text x="755.0" y="140.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="600">Output y(t)</text><text x="755.0" y="160.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">Gyy(f)</text><line x1="616" y1="144" x2="647.0" y2="144.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 656.0 144.0 L 647.0 147.6 L 647.0 140.4 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="755" y1="172" x2="755.0" y2="227.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 755.0 236.0 L 751.4 227.0 L 758.6 227.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="90" y="240" width="720" height="64" rx="10" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="2"/><text x="450" y="265" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="600">Welch cross-spectral matrix — Gxx (2×2) and Gxy, nperseg = 2048</text><text x="450" y="287" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle">conditioning: Schur steps Gij·r! (Eq. 7.94), inputs ordered by descending ordinary coherence</text><line x1="270" y1="304" x2="270.0" y2="331.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 270.0 340.0 L 266.4 331.0 L 273.6 331.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="630" y1="304" x2="630.0" y2="331.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 630.0 340.0 L 626.4 331.0 L 633.6 331.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="70" y="344" width="370" height="88" rx="10" fill="#f0f2f5" stroke="#1f77b4" stroke-width="2"/><text x="255" y="370" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="600">Multiple and partial coherence</text><text x="255" y="392" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">input 2 in the 100-300 Hz band: ordinary 0.32 → partial 0.00</text><text x="255" y="412" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">multiple γ²y:x = 1 − Gnn/Gyy ≈ 1.00 (100-300 Hz)</text><rect x="460" y="344" width="370" height="88" rx="10" fill="#f0f2f5" stroke="#2ca02c" stroke-width="2"/><text x="645" y="370" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="600">Contribution of each source</text><text x="645" y="392" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">Gvi = γ²iy·(i−1)!·Gyy per input</text><text x="645" y="412" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">ΣGvi + Gnn = Gyy, band by band</text><text x="450" y="482" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">each conditioning step spends one average: the i-th ordered input carries n_d − (i − 1); here n_d = 242</text><text x="450" y="506" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle">average generously before reading a small partial coherence as zero</text></svg>