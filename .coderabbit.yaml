# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Review guidance that would otherwise be retyped in every pull request. The
# entries here answer a claim the bot has made repeatedly and that is not true
# of this repository: that everything under `docs/` is generated output. The
# second entry is the narrow exception, so its glob has to name exactly the
# files `scripts/mirror_overviews.py` writes and no others.
reviews:
  path_instructions:
    - path: "docs/**"
      instructions: >-
        `docs/` is NOT a generated mirror of the website, and edits to it are
        not build output to be skipped or regenerated. It is the plain-markdown
        edition of the guides, authored by hand for people reading the
        repository on GitHub and for the llms.txt artifacts built from it. Each
        guide deliberately exists twice, as `docs/<path>.md` and as
        `site/src/content/docs/<path>.md` or `.mdx`, and the two are written
        differently on purpose: the mirror carries no frontmatter, no Astro
        components and no images. Review changes here as ordinary prose, and
        expect a guide edit to touch the English page, its Spanish twin under
        `site/src/content/docs/es/` and this mirror together. Flag it when one
        of the three is missing.

        The only generated files under `docs/` are the topic and section
        overview indexes (`scripts/mirror_overviews.py`),
        `docs/reference/glossary.md` (`scripts/mirror_glossary.py`) and
        `docs/CONFORMANCE.md` (`make conformance`). Those three are the
        exception, not the rule. `docs/README.md` is not one of them: it is the
        hand-kept front door of the mirror, and both `mirror_overviews.py
        --check` and `generate_llms.py` fail when a new guide goes unlinked
        from it. Neither are the two indexes under `docs/reference/`, which the
        overview generator skips: `docs/reference/api/index.md` is a
        hand-maintained table that `scripts/check_api_reference.py` requires to
        be extended whenever a public name is added, so an edit to it is the
        expected shape of a pull request, not build output.
    - path: "docs/!(reference)/**/index.md"
      instructions: >-
        This file is generated by `scripts/mirror_overviews.py` from the
        matching `index.md*` under `site/src/content/docs/`, and CI fails on
        drift. A change made here by hand will be overwritten: the edit belongs
        in the site page it is generated from, with `make llms` re-run to
        regenerate this one. The pattern excludes `docs/reference/` on purpose,
        because the generator does: the indexes under it are written by hand.
