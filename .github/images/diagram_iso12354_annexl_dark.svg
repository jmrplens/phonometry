<svg xmlns="http://www.w3.org/2000/svg" width="900" height="616" viewBox="0 0 900 616"><rect width="900" height="616" fill="#0d1117"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6e6e6" text-anchor="middle">ISO 12354-1 Annex L worked building: elements, junctions, paths</text><text x="240.0" y="96.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#e6e6e6" text-anchor="middle" font-weight="600">Section: two stacked dwellings</text><rect x="86.0" y="112.0" width="24.0" height="240.0" rx="0.0" fill="#1c2128" stroke="#e6e6e6" stroke-width="2.0"/><rect x="370.0" y="112.0" width="24.0" height="240.0" rx="0.0" fill="#1c2128" stroke="#e6e6e6" stroke-width="2.0"/><rect x="264.0" y="112.0" width="24.0" height="240.0" rx="0.0" fill="#1c2128" stroke="#e6e6e6" stroke-width="2.0"/><rect x="110.0" y="222.0" width="260.0" height="20.0" rx="0.0" fill="#1c2128" stroke="#e6e6e6" stroke-width="2.2"/><rect x="110.0" y="210.0" width="260.0" height="5" rx="0.0" fill="#5abf5a" stroke="#e6e6e6" stroke-width="1.0"/><rect x="110.0" y="215.0" width="260.0" height="7" rx="0.0" fill="#1c2128" stroke="#e6e6e6" stroke-width="1.0"/><text x="240.0" y="164.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="middle">source dwelling</text><text x="240.0" y="310.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="middle">receiving dwelling</text><circle cx="98.0" cy="232.0" r="11.0" fill="#0d1117" stroke="#e46a6a" stroke-width="2.4"/><text x="98.0" y="238.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e46a6a" text-anchor="middle" font-weight="600">T</text><circle cx="382.0" cy="232.0" r="11.0" fill="#0d1117" stroke="#e46a6a" stroke-width="2.4"/><text x="382.0" y="238.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e46a6a" text-anchor="middle" font-weight="600">T</text><circle cx="276.0" cy="232.0" r="11.0" fill="#0d1117" stroke="#e46a6a" stroke-width="2.4"/><text x="276.0" y="238.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e46a6a" text-anchor="middle" font-weight="600">X</text><text x="46.0" y="368.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e46a6a" text-anchor="start" xml:space="preserve"><tspan>T  rigid T (floor to external wall): </tspan><tspan font-style="italic">K</tspan><tspan dy="3.3" font-size="10.5" font-style="italic">ij</tspan><tspan dy="-3.3"> = 6,4 / 11,2 dB</tspan></text><text x="46.0" y="390.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e46a6a" text-anchor="start" xml:space="preserve"><tspan>X  rigid cross (floor to internal wall): </tspan><tspan font-style="italic">K</tspan><tspan dy="3.3" font-size="10.5" font-style="italic">ij</tspan><tspan dy="-3.3"> = 8,8 / 11,0 dB</tspan></text><text x="46.0" y="418.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e6e6e6" text-anchor="start" xml:space="preserve"><tspan>separating floor  220 mm concrete, 484 kg/m², </tspan><tspan font-style="italic">f</tspan><tspan dy="3.1" font-size="9.8" font-style="italic">c</tspan><tspan dy="-3.1"> = 76,8 Hz</tspan></text><text x="46.0" y="440.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#5abf5a" text-anchor="start" xml:space="preserve"><tspan>on it  35 mm screed, 73,5 kg/m², on </tspan><tspan font-style="italic">s</tspan><tspan>′ = 8 MN/m³</tspan></text><text x="46.0" y="462.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="start" xml:space="preserve"><tspan>external walls  365 mm AAC, 219 kg/m², </tspan><tspan font-style="italic">f</tspan><tspan dy="3.1" font-size="9.8" font-style="italic">c</tspan><tspan dy="-3.1"> = 92,6 Hz</tspan></text><text x="46.0" y="484.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="start" xml:space="preserve"><tspan>internal walls  200 mm calcium silicate, 360 kg/m², </tspan><tspan font-style="italic">f</tspan><tspan dy="3.1" font-size="9.8" font-style="italic">c</tspan><tspan dy="-3.1"> = 128,4 Hz</tspan></text><text x="680.0" y="96.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#e6e6e6" text-anchor="middle" font-weight="600">Plan: the separating floor</text><rect x="546.0" y="150.0" width="268.0" height="214.0" rx="0.0" fill="#1c2128" stroke="#e6e6e6" stroke-width="2.4"/><rect x="546.0" y="143.0" width="268.0" height="7" rx="0.0" fill="#e46a6a" stroke="#e6e6e6" stroke-width="1.0"/><rect x="546.0" y="364.0" width="268.0" height="7" rx="0.0" fill="#e46a6a" stroke="#e6e6e6" stroke-width="1.0"/><rect x="539.0" y="150.0" width="7" height="214.0" rx="0.0" fill="#e46a6a" stroke="#e6e6e6" stroke-width="1.0"/><rect x="814.0" y="150.0" width="7" height="214.0" rx="0.0" fill="#e46a6a" stroke="#e6e6e6" stroke-width="1.0"/><text x="680.0" y="253.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#e6e6e6" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan font-style="italic">S</tspan><tspan> = 20 m²</tspan></text><text x="680.0" y="279.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9a9a9a" text-anchor="middle">5,00 m × 4,00 m</text><line x1="676.0" y1="390.0" x2="555.0" y2="390.0" stroke="#9a9a9a" stroke-width="1.2" stroke-linecap="round"/><path d="M 546.0 390.0 L 555.0 386.4 L 555.0 393.6 Z" fill="#9a9a9a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="684.0" y1="390.0" x2="805.0" y2="390.0" stroke="#9a9a9a" stroke-width="1.2" stroke-linecap="round"/><path d="M 814.0 390.0 L 805.0 393.6 L 805.0 386.4 Z" fill="#9a9a9a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="680.0" y="383.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e6e6e6" text-anchor="middle">5,00 m</text><line x1="520.0" y1="253.0" x2="520.0" y2="159.0" stroke="#9a9a9a" stroke-width="1.2" stroke-linecap="round"/><path d="M 520.0 150.0 L 523.6 159.0 L 516.4 159.0 Z" fill="#9a9a9a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="520.0" y1="261.0" x2="520.0" y2="355.0" stroke="#9a9a9a" stroke-width="1.2" stroke-linecap="round"/><path d="M 520.0 364.0 L 516.4 355.0 L 523.6 355.0 Z" fill="#9a9a9a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="511.0" y="263.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e6e6e6" text-anchor="end">4,00 m</text><text x="680.0" y="132.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e46a6a" text-anchor="middle">external wall (T)</text><text x="680.0" y="426.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e46a6a" text-anchor="middle">internal wall (X)</text><text x="680.0" y="456.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle">two external and two internal walls meet the floor, with</text><text x="680.0" y="478.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle">5,00 m of junction along each long edge and 4,00 m along</text><text x="680.0" y="500.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#5abf5a" text-anchor="middle">each short one: perimeter sum 9 m external + 9 m internal</text><rect x="40" y="508" width="820" height="84" rx="10" fill="none" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="6,5"/><text x="450" y="536" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e6e6e6" text-anchor="middle">13 airborne paths = 1 direct (Dd) + 4 flanking elements × 3 branches (Ff, Df, Fd)</text><text x="450" y="564" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#4da3d8" text-anchor="middle">5 impact paths = 1 direct + 4 Df: only the floor is excited, so there is no Ff or Fd</text></svg>