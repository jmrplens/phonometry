<svg xmlns="http://www.w3.org/2000/svg" width="900" height="570" viewBox="0 0 900 570"><rect width="900" height="570" fill="#0d1117"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6e6e6" text-anchor="middle">Residual-intensity test and the before-use probe check</text><rect x="46.0" y="62" width="256.0" height="300" rx="12" fill="#1c2128" stroke="#9a9a9a" stroke-width="1.6"/><text x="174.0" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="middle" font-weight="600">1 · Residual-intensity test</text><rect x="322.0" y="62" width="256.0" height="300" rx="12" fill="#1c2128" stroke="#9a9a9a" stroke-width="1.6"/><text x="450.0" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="middle" font-weight="600">2 · Pressure check</text><rect x="598.0" y="62" width="256.0" height="300" rx="12" fill="#1c2128" stroke="#9a9a9a" stroke-width="1.6"/><text x="726.0" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="middle" font-weight="600">3 · Probe reversal, in situ</text><rect x="96.0" y="124.0" width="156" height="124" rx="10" fill="#0d1117" stroke="#e6e6e6" stroke-width="2.4"/><path d="M 114.0 146.0 q 20 -14 40 0 q 20 14 40 0" fill="none" stroke="#4da3d8" stroke-width="1.6" stroke-linejoin="round"/><path d="M 114.0 180.0 q 20 -14 40 0 q 20 14 40 0" fill="none" stroke="#4da3d8" stroke-width="1.6" stroke-linejoin="round"/><path d="M 114.0 214.0 q 20 -14 40 0 q 20 14 40 0" fill="none" stroke="#4da3d8" stroke-width="1.6" stroke-linejoin="round"/><rect x="131.0" y="162.0" width="26" height="48" rx="6" fill="#1c2128" stroke="#e46a6a" stroke-width="2.0"/><rect x="136.0" y="156.0" width="16" height="8" rx="2" fill="#e6e6e6" stroke="none" stroke-width="1.5"/><rect x="191.0" y="162.0" width="26" height="48" rx="6" fill="#1c2128" stroke="#e46a6a" stroke-width="2.0"/><rect x="196.0" y="156.0" width="16" height="8" rx="2" fill="#e6e6e6" stroke="none" stroke-width="1.5"/><rect x="162.0" y="181.0" width="24" height="10" rx="3" fill="#1c2128" stroke="#9a9a9a" stroke-width="1.2"/><text x="174.0" y="270.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">pink or white noise, 45 Hz to 7,1 kHz</text><text x="174.0" y="292.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">both capsules within ± 0,1 dB</text><text x="174.0" y="320.0" font-family="Consolas, Menlo, monospace" font-size="18" fill="#4da3d8" text-anchor="middle" font-weight="600">δpI0 = L_p − L_I0</text><rect x="376.0" y="146.0" width="62" height="80" rx="8" fill="#0d1117" stroke="#5abf5a" stroke-width="2.2"/><text x="407.0" y="190.0" font-family="Consolas, Menlo, monospace" font-size="15" fill="#5abf5a" text-anchor="middle" font-weight="600">94,0</text><text x="407.0" y="208.0" font-family="Consolas, Menlo, monospace" font-size="14" fill="#5abf5a" text-anchor="middle">dB</text><rect x="438.0" y="172.0" width="22" height="28" rx="5" fill="#1c2128" stroke="#e46a6a" stroke-width="2.0"/><rect x="460.0" y="178.0" width="44" height="16" rx="4" fill="#1c2128" stroke="#9a9a9a" stroke-width="1.4"/><rect x="504.0" y="172.0" width="22" height="28" rx="5" fill="#1c2128" stroke="#e46a6a" stroke-width="2.0"/><text x="450.0" y="252.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">IEC 60942 calibrator, class 0 or 1</text><text x="450.0" y="274.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">on each microphone in turn</text><text x="450.0" y="306.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#5abf5a" text-anchor="middle" font-weight="600">adjust to ± 0,1 dB</text><text x="450.0" y="330.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9a9a9a" text-anchor="middle">in both channels</text><line x1="626.0" y1="118.0" x2="626.0" y2="274.0" stroke="#e6e6e6" stroke-width="2.6" stroke-linecap="round"/><line x1="626.0" y1="120.0" x2="617.0" y2="129.0" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><line x1="626.0" y1="144.0" x2="617.0" y2="153.0" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><line x1="626.0" y1="168.0" x2="617.0" y2="177.0" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><line x1="626.0" y1="192.0" x2="617.0" y2="201.0" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><line x1="626.0" y1="216.0" x2="617.0" y2="225.0" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><line x1="626.0" y1="240.0" x2="617.0" y2="249.0" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><line x1="626.0" y1="264.0" x2="617.0" y2="273.0" stroke="#9a9a9a" stroke-width="1.1" stroke-linecap="round"/><text x="726.0" y="296.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">measurement surface</text><line x1="638.0" y1="122.0" x2="709.0" y2="122.0" stroke="#9a9a9a" stroke-width="2.0" stroke-linecap="round"/><path d="M 718.0 122.0 L 709.0 125.6 L 709.0 118.4 Z" fill="#9a9a9a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="678.0" y="114.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9a9a9a" text-anchor="middle">energy leaving the source</text><line x1="692.0" y1="160.0" x2="760.0" y2="160.0" stroke="#e6e6e6" stroke-width="2.0" stroke-linecap="round"/><circle cx="712.0" cy="160.0" r="5.5" fill="#e6e6e6" stroke="none" stroke-width="1.5"/><circle cx="740.0" cy="160.0" r="5.5" fill="#e6e6e6" stroke="none" stroke-width="1.5"/><line x1="726.0" y1="140.0" x2="755.0" y2="140.0" stroke="#e46a6a" stroke-width="2.0" stroke-linecap="round"/><path d="M 764.0 140.0 L 755.0 143.6 L 755.0 136.4 Z" fill="#e46a6a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="776.0" y="165.0" font-family="Consolas, Menlo, monospace" font-size="15" fill="#e46a6a" text-anchor="start" font-weight="600">+ I_n</text><line x1="692.0" y1="232.0" x2="760.0" y2="232.0" stroke="#e6e6e6" stroke-width="2.0" stroke-linecap="round"/><circle cx="712.0" cy="232.0" r="5.5" fill="#e6e6e6" stroke="none" stroke-width="1.5"/><circle cx="740.0" cy="232.0" r="5.5" fill="#e6e6e6" stroke="none" stroke-width="1.5"/><line x1="726.0" y1="212.0" x2="697.0" y2="212.0" stroke="#4da3d8" stroke-width="2.0" stroke-linecap="round"/><path d="M 688.0 212.0 L 697.0 208.4 L 697.0 215.6 Z" fill="#4da3d8" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="776.0" y="237.0" font-family="Consolas, Menlo, monospace" font-size="15" fill="#4da3d8" text-anchor="start" font-weight="600">− I_n</text><path d="M 710.3 152.8 A 46.0 46.0 0 1 1 710.3 239.2" fill="none" stroke="#9a9a9a" stroke-width="1.8" stroke-linejoin="round"/><path d="M 710.3 239.2 L 721.2 238.5 L 718.2 246.8 Z" fill="#9a9a9a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="674.0" y="201.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9a9a9a" text-anchor="end">180°</text><text x="726.0" y="320.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">acoustic centre held in place</text><rect x="46" y="390" width="808" height="62" rx="10" fill="#1c2128" stroke="#e46a6a" stroke-width="2.0"/><text x="450" y="416" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="middle" font-weight="600">accepted when the two readings have opposite signs and differ by less than 1,5 dB</text><text x="450" y="440" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9a9a9a" text-anchor="middle">in the band of maximum level (ISO 9614-2, clause 6.2.2)</text><text x="60" y="482" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9a9a9a" text-anchor="start">same signs → the two channels are swapped, or one is inverted</text><text x="60" y="506" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9a9a9a" text-anchor="start">more than 1,5 dB apart → the probe disturbs its own field, or the channels are not matched</text><text x="60" y="530" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9a9a9a" text-anchor="start">δpI0 belongs to the probe, its spacer and the analyser together — not to the microphones</text></svg>