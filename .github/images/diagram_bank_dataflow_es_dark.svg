<svg xmlns="http://www.w3.org/2000/svg" width="900" height="680" viewBox="0 0 900 680"><rect width="900" height="680" fill="#0d1117"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6e6e6" text-anchor="middle">Dentro de una banda: diezmado y cascada de biquads</text><rect x="290" y="54" width="320" height="64" rx="12" fill="#1c2128" stroke="#e6e6e6" stroke-width="2"/><text x="450" y="84" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#e6e6e6" text-anchor="middle" font-weight="600">Señal de entrada  x(t)</text><text x="450" y="108" font-family="Consolas, Menlo, monospace" font-size="16" fill="#9a9a9a" text-anchor="middle">frecuencia de muestreo fs</text><line x1="450" y1="118" x2="450.0" y2="123.0" stroke="#e6e6e6" stroke-width="2.0" stroke-linecap="round"/><path d="M 450.0 132.0 L 446.4 123.0 L 453.6 123.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><path d="M 450 132 L 610 184 L 450 236 L 290 184 Z" fill="#1c2128" stroke="#4da3d8" stroke-width="2" stroke-linejoin="round"/><text x="450" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#e6e6e6" text-anchor="middle" font-weight="600">¿Cabe diezmar?</text><text x="450" y="204" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">fs / 2 ≥ 1,25 · f_sup</text><line x1="290" y1="184" x2="190" y2="184" stroke="#e6e6e6" stroke-width="2.0" stroke-linecap="round"/><line x1="190" y1="184" x2="190.0" y2="235.0" stroke="#e6e6e6" stroke-width="2.0" stroke-linecap="round"/><path d="M 190.0 244.0 L 186.4 235.0 L 193.6 235.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="240" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#5abf5a" text-anchor="middle" font-weight="600">sí</text><line x1="610" y1="184" x2="710" y2="184" stroke="#e6e6e6" stroke-width="2.0" stroke-linecap="round"/><line x1="710" y1="184" x2="710.0" y2="351.0" stroke="#e6e6e6" stroke-width="2.0" stroke-linecap="round"/><path d="M 710.0 360.0 L 706.4 351.0 L 713.6 351.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="660" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e46a6a" text-anchor="middle" font-weight="600">no</text><rect x="50" y="244" width="280" height="80" rx="12" fill="#1c2128" stroke="#4da3d8" stroke-width="2"/><text x="190" y="274" font-family="Consolas, Menlo, monospace" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="600">resample_poly(1, M)</text><text x="190" y="298" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9a9a9a" text-anchor="middle">M = floor[(fs / 2) / (1,25 · f_sup)]</text><text x="190" y="318" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">los polos se alejan de z = 1</text><line x1="190" y1="324" x2="190.0" y2="351.0" stroke="#e6e6e6" stroke-width="2.0" stroke-linecap="round"/><path d="M 190.0 360.0 L 186.4 351.0 L 193.6 351.0 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="50.0" y="360" width="280" height="84" rx="12" fill="#1c2128" stroke="#4da3d8" stroke-width="2"/><text x="190.0" y="390" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#e6e6e6" text-anchor="middle" font-weight="600">Filtro SOS de banda a fs / M</text><text x="190.0" y="414" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9a9a9a" text-anchor="middle">biquads en cascada</text><text x="190.0" y="434" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">diseñado sobre los bordes IEC 61260-1</text><rect x="570.0" y="360" width="280" height="84" rx="12" fill="#1c2128" stroke="#4da3d8" stroke-width="2"/><text x="710.0" y="390" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#e6e6e6" text-anchor="middle" font-weight="600">Filtro SOS de banda a fs</text><text x="710.0" y="414" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9a9a9a" text-anchor="middle">biquads en cascada</text><text x="710.0" y="434" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a" text-anchor="middle">diseñado sobre los bordes IEC 61260-1</text><rect x="340" y="260" width="220" height="96" rx="12" fill="none" stroke="#e46a6a" stroke-width="1.8" stroke-dasharray="7,5"/><text x="450" y="288" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e46a6a" text-anchor="middle" font-weight="600">Todo filtro de banda</text><text x="450" y="308" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e46a6a" text-anchor="middle" font-weight="600">es una cascada de biquads</text><text x="450" y="332" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">no un par (b, a)</text><text x="450" y="350" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">de orden alto</text><line x1="190" y1="444" x2="321.5631725519121" y2="492.86632123356736" stroke="#e6e6e6" stroke-width="2.0" stroke-linecap="round"/><path d="M 330.0 496.0 L 320.3 496.2 L 322.8 489.5 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="710" y1="444" x2="578.4368274480879" y2="492.86632123356736" stroke="#e6e6e6" stroke-width="2.0" stroke-linecap="round"/><path d="M 570.0 496.0 L 577.2 489.5 L 579.7 496.2 Z" fill="#e6e6e6" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="270" y="500" width="360" height="76" rx="12" fill="none" stroke="#5abf5a" stroke-width="2.4"/><text x="450" y="530" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#e6e6e6" text-anchor="middle" font-weight="600">Nivel de banda</text><text x="450" y="554" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#5abf5a" text-anchor="middle">RMS o pico, en dB re 20 µPa</text><rect x="50" y="604" width="800" height="62" rx="12" fill="none" stroke="#e46a6a" stroke-width="1.8" stroke-dasharray="7,5"/><text x="450" y="632" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e46a6a" text-anchor="middle" font-weight="600">sigbands=True devuelve además la señal de banda a fs</text><text x="450" y="654" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">la rama diezmada se interpola de vuelta con resample_poly(M, 1)</text></svg>