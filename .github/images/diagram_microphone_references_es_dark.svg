<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590"><rect width="900" height="590" fill="#0d1117"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6e6e6" text-anchor="middle">The three fields a microphone sensitivity is defined in (IEC 60268-4)</text><rect x="34.0" y="54" width="260.0" height="306" rx="12" fill="#1c2128" stroke="#9a9a9a" stroke-width="1.6"/><text x="164.0" y="80" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#e6e6e6" text-anchor="middle" font-weight="600">Free field (11.2.1)</text><rect x="320.0" y="54" width="260.0" height="306" rx="12" fill="#1c2128" stroke="#9a9a9a" stroke-width="1.6"/><text x="450.0" y="80" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#e6e6e6" text-anchor="middle" font-weight="600">Diffuse field (11.2.2)</text><rect x="606.0" y="54" width="260.0" height="306" rx="12" fill="#1c2128" stroke="#9a9a9a" stroke-width="1.6"/><text x="736.0" y="80" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#e6e6e6" text-anchor="middle" font-weight="600">Pressure (11.2.4)</text><path d="M 74.0 124.0 q 10 52 0 104" fill="none" stroke="#4da3d8" stroke-width="1.6" stroke-linejoin="round"/><path d="M 96.0 124.0 q 10 52 0 104" fill="none" stroke="#4da3d8" stroke-width="1.6" stroke-linejoin="round"/><path d="M 118.0 124.0 q 10 52 0 104" fill="none" stroke="#4da3d8" stroke-width="1.6" stroke-linejoin="round"/><path d="M 140.0 124.0 q 10 52 0 104" fill="none" stroke="#4da3d8" stroke-width="1.6" stroke-linejoin="round"/><line x1="152.0" y1="176.0" x2="165.0" y2="176.0" stroke="#4da3d8" stroke-width="1.8" stroke-linecap="round"/><path d="M 174.0 176.0 L 165.0 179.6 L 165.0 172.4 Z" fill="#4da3d8" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="198.0" y="161.0" width="54" height="30" rx="6" fill="#1c2128" stroke="#4da3d8" stroke-width="2.0"/><rect x="184.0" y="164.0" width="14" height="24" rx="3" fill="#e6e6e6" stroke="none" stroke-width="1.5"/><line x1="184.0" y1="164.0" x2="184.0" y2="188.0" stroke="#e46a6a" stroke-width="2.6" stroke-linecap="round"/><line x1="184.0" y1="176.0" x2="280.0" y2="176.0" stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="7,5" stroke-linecap="round"/><text x="164.0" y="254.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">one source on the reference axis,</text><text x="164.0" y="272.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">far enough that r ≥ d,</text><text x="164.0" y="290.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">r ≥ d²/λ and r ≥ 3 × the source</text><text x="164.0" y="320.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#4da3d8" text-anchor="middle" font-weight="600">M_ff : the undisturbed</text><text x="164.0" y="340.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9a9a9a" text-anchor="middle">pressure of the plane wave</text><line x1="546.0" y1="176.0" x2="499.0" y2="176.0" stroke="#5abf5a" stroke-width="1.4" stroke-linecap="round"/><path d="M 490.0 176.0 L 499.0 172.4 L 499.0 179.6 Z" fill="#5abf5a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="533.1384387633061" y1="224.0" x2="492.4352447854375" y2="200.5" stroke="#5abf5a" stroke-width="1.4" stroke-linecap="round"/><path d="M 484.6 196.0 L 494.2 197.4 L 490.6 203.6 Z" fill="#5abf5a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="498.0" y1="259.1384387633061" x2="474.5" y2="218.43524478543748" stroke="#5abf5a" stroke-width="1.4" stroke-linecap="round"/><path d="M 470.0 210.6 L 477.6 216.6 L 471.4 220.2 Z" fill="#5abf5a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="450.0" y1="272.0" x2="450.0" y2="225.0" stroke="#5abf5a" stroke-width="1.4" stroke-linecap="round"/><path d="M 450.0 216.0 L 453.6 225.0 L 446.4 225.0 Z" fill="#5abf5a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="402.0" y1="259.1384387633061" x2="425.5" y2="218.4352447854375" stroke="#5abf5a" stroke-width="1.4" stroke-linecap="round"/><path d="M 430.0 210.6 L 428.6 220.2 L 422.4 216.6 Z" fill="#5abf5a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="366.8615612366939" y1="224.0" x2="407.5647552145625" y2="200.5" stroke="#5abf5a" stroke-width="1.4" stroke-linecap="round"/><path d="M 415.4 196.0 L 409.4 203.6 L 405.8 197.4 Z" fill="#5abf5a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="354.0" y1="176.0" x2="401.0" y2="176.0" stroke="#5abf5a" stroke-width="1.4" stroke-linecap="round"/><path d="M 410.0 176.0 L 401.0 179.6 L 401.0 172.4 Z" fill="#5abf5a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="366.8615612366939" y1="127.99999999999999" x2="407.5647552145625" y2="151.5" stroke="#5abf5a" stroke-width="1.4" stroke-linecap="round"/><path d="M 415.4 156.0 L 405.8 154.6 L 409.4 148.4 Z" fill="#5abf5a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="401.99999999999994" y1="92.86156123669392" x2="425.5" y2="133.56475521456252" stroke="#5abf5a" stroke-width="1.4" stroke-linecap="round"/><path d="M 430.0 141.4 L 422.4 135.4 L 428.6 131.8 Z" fill="#5abf5a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="450.0" y1="80.0" x2="450.0" y2="127.0" stroke="#5abf5a" stroke-width="1.4" stroke-linecap="round"/><path d="M 450.0 136.0 L 446.4 127.0 L 453.6 127.0 Z" fill="#5abf5a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="498.0" y1="92.86156123669389" x2="474.5" y2="133.56475521456252" stroke="#5abf5a" stroke-width="1.4" stroke-linecap="round"/><path d="M 470.0 141.4 L 471.4 131.8 L 477.6 135.4 Z" fill="#5abf5a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="533.1384387633061" y1="127.99999999999996" x2="492.4352447854375" y2="151.49999999999997" stroke="#5abf5a" stroke-width="1.4" stroke-linecap="round"/><path d="M 484.6 156.0 L 490.6 148.4 L 494.2 154.6 Z" fill="#5abf5a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="424.0" y="161.0" width="54" height="30" rx="6" fill="#1c2128" stroke="#4da3d8" stroke-width="2.0"/><rect x="410.0" y="164.0" width="14" height="24" rx="3" fill="#e6e6e6" stroke="none" stroke-width="1.5"/><line x1="410.0" y1="164.0" x2="410.0" y2="188.0" stroke="#e46a6a" stroke-width="2.6" stroke-linecap="round"/><text x="450.0" y="254.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">sound from every direction,</text><text x="450.0" y="272.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">with equal probability</text><text x="450.0" y="290.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">(a reverberation room)</text><text x="450.0" y="320.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#5abf5a" text-anchor="middle" font-weight="600">M_diff : the r.m.s. of M(θ)</text><text x="450.0" y="340.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9a9a9a" text-anchor="middle">D = 20 lg(M₀ / M_diff)</text><rect x="638.0" y="128.0" width="122" height="96" rx="8" fill="#0d1117" stroke="#e46a6a" stroke-width="2.2"/><circle cx="664.0" cy="176.0" r="16" fill="#1c2128" stroke="#9a9a9a" stroke-width="1.6"/><line x1="664.0" y1="206.0" x2="664.0" y2="155.0" stroke="#e46a6a" stroke-width="1.6" stroke-linecap="round"/><path d="M 664.0 146.0 L 667.6 155.0 L 660.4 155.0 Z" fill="#e46a6a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="752.0" y="161.0" width="54" height="30" rx="6" fill="#1c2128" stroke="#4da3d8" stroke-width="2.0"/><rect x="738.0" y="164.0" width="14" height="24" rx="3" fill="#e6e6e6" stroke="none" stroke-width="1.5"/><line x1="738.0" y1="164.0" x2="738.0" y2="188.0" stroke="#e46a6a" stroke-width="2.6" stroke-linecap="round"/><text x="700.0" y="114.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">cavity small against λ</text><text x="736.0" y="254.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">a coupler or a calibrator:</text><text x="736.0" y="272.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">the pressure the capsule</text><text x="736.0" y="290.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="middle">itself replaces</text><text x="736.0" y="320.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e46a6a" text-anchor="middle" font-weight="600">M_p : pressure at</text><text x="736.0" y="340.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9a9a9a" text-anchor="middle">the acoustic entry</text><rect x="34" y="380" width="832" height="116" rx="12" fill="#1c2128" stroke="#4da3d8" stroke-width="2.0"/><text x="54" y="408" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#e6e6e6" text-anchor="start" font-weight="600">The bench (clauses 5.5.2, 5.6.2, 5.7)</text><circle cx="64" cy="432" r="4.0" fill="#4da3d8" stroke="none" stroke-width="1.5"/><text x="80" y="437" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="start">anechoic room; the spherical wave counts as plane at least λ/2 from the centre of curvature at the lowest frequency</text><circle cx="64" cy="454" r="4.0" fill="#4da3d8" stroke="none" stroke-width="1.5"/><text x="80" y="459" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="start">substitution: the microphone under test and a calibrated reference at the same point, one after the other (highest accuracy)</text><circle cx="64" cy="476" r="4.0" fill="#4da3d8" stroke="none" stroke-width="1.5"/><text x="80" y="481" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9a9a9a" text-anchor="start">simultaneous comparison at two nearby points only after showing it agrees with substitution within ± 1 dB</text><text x="846" y="408" font-family="Consolas, Menlo, monospace" font-size="15" fill="#4da3d8" text-anchor="end">overall accuracy ± 2 dB or better</text><text x="450" y="528" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e6e6e6" text-anchor="middle">Polar cuts (13.1.2 a): distance, sound pressure and frequency held constant while θ is stepped, preferably by 10° or 15°,</text><text x="450" y="552" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#9a9a9a" text-anchor="middle">at the octave centres 125 Hz to 16 kHz, with the reference axis as 0° of the polar diagram.</text></svg>