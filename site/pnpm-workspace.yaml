allowBuilds:
  esbuild: true
  sharp: true
  puppeteer: true

# Disable pnpm 11's minimum-release-age supply-chain gate: the committed
# lockfile is the trust root here, and the 24 h default kept blocking docs
# deploys whenever a transitive dependency (e.g. the lightningcss platform
# binaries) published shortly before a scheduled run.
minimumReleaseAge: 0

# Security advisories against transitive dependencies, none of which we depend
# on directly: nanoid through postcss/vite, js-yaml through astro's internal
# helpers. Each parent's own range already admits the patched release, so
# these only force the resolution forward and are removed once the parents
# float past them on their own.
# ip-address and undici went that way with pa11y-ci 5: puppeteer 25 no longer
# brings socks or proxy-agent, and cheerio 1.2 asks for undici ^7.19, so an
# unscoped undici pin would now drag it, and astro's font loader, back to 6.
# brace-expansion went that way at 1.1.21: its only parent, pa11y-ci's
# minimatch 3.1.5, asks for ^1.1.7, which admits it, so the lockfile alone
# holds the copy past GHSA-q2hr-2g5m-vwhr.
overrides:
  js-yaml@^4: ^4.3.1
  nanoid@^3: ^3.3.17
  # @sentry/bundler-plugins 11 asks for glob ^13.0.6 (through @sentry/node, from
  # lighthouse, a dev dependency), and nothing on that path floats past
  # GHSA-3g3m-2fjr-6pw4 on glob or GHSA-g3hv-75wg-m249 on the minimatch 10.2.6 it
  # brings, which glob 13 reaches at the optimisation level that advisory needs:
  # the first fixed glob, 14.0.2, is outside the parent's range. The plugin's one
  # call, `glob(patterns, { absolute, nodir })`, reads the same on glob 14. This
  # goes once @sentry/bundler-plugins asks for glob 14.
  glob@^13: ^14.0.2
  # Two copies of KaTeX decide how a formula looks: rehype-katex writes the
  # markup with the katex it depends on, and the site loads the stylesheet
  # from its own. rehype-katex 7, the current release, still asks for
  # ^0.16, and KaTeX 0.18 renamed its layout classes (`base` became
  # `katex-base`, `strut` became `katex-strut`), so left to themselves the two
  # would disagree and every formula would lose its line-height rules.
  # Resolving every katex in the tree to the one catalog entry below, which
  # package.json names too, keeps the renderer and the stylesheet one
  # version, so a katex bump moves both at once. `pnpm check:math` fails the
  # build if they ever part again.
  katex: 'catalog:'
  # satori pins fflate at exactly 0.7.3, whose unzipSync can be walked into
  # an infinite loop by a malformed ZIP64 archive. The site never unzips
  # anything, so this is reachable by nothing here, but the patch release is
  # a drop-in and the tree already carries 0.7.5 for another parent. Goes
  # once satori floats past the pin.
  "fflate@0.7.3": ^0.7.5

# minimatch 3.1.5 has no entry above, on purpose. It comes only from pa11y-ci,
# whose globby ~7.1.1 brings glob 7, and glob 7.2.3, the last of them, asks
# for ^3.1.1, so nothing on that path floats to 11.0.1, the only fix
# GHSA-g3hv-75wg-m249 names. The advisory lists every release below 11.0.1,
# but the glob preprocessing it describes first shipped in minimatch 7.0.0,
# and 3.x has none of it. `minimatch@^3: ^11.0.1` does resolve and clear the
# audit, and pa11y-ci with no arguments, as the site runs it, keeps working,
# but that would close the alert on code that is not vulnerable, and glob 7
# would then throw on an argument as plain as `*.js`. globby 11, the first
# without glob, loses glob's `nonull`, so a URL handed to pa11y-ci on its
# command line comes back as nothing, which is why pa11y-ci 5 still asks for
# globby 7. This note goes once pa11y-ci leaves globby 7 or the advisory's
# range starts at 7.0.0.

# The katex both copies above resolve to. A catalog rather than a version in
# package.json, because it is the one place the dependency and the override
# can both read the same specifier from.
catalog:
  katex: ^0.19.1
