span font-style="italic">u</tspan><tspan>/√</tspan><tspan font-style="italic">m</tspan><tspan>   (Fórmula A.7)</tspan></text><text x="450.0" y="183" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle">y combinar modelo con realidad según el Anexo A al predecir</text><rect x="118.0" y="226" width="664.0" height="60.0" rx="10" fill="#f0f2f5" stroke="#1f77b4" stroke-width="2"/><text x="450.0" y="251" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>Combinar contribuciones no correlacionadas   </tspan><tspan font-style="italic">u</tspan><tspan dy="3.7" font-size="11.9" font-style="italic">c</tspan><tspan dy="-3.7"> = √(Σ </tspan><tspan font-style="italic">u</tspan><tspan dy="3.7" font-size="11.9" font-style="italic">i</tspan><tspan dy="-10.2" font-size="11.9">2</tspan><tspan dy="6.5">)   (Fórmula C.2)</tspan></text><text x="450.0" y="271" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle">la combinación de índice único del Anexo B usa la Fórmula B.2</text><rect x="118.0" y="314" width="664.0" height="60.0" rx="10" fill="#f0f2f5" stroke="#d62728" stroke-width="2"/><text x="450.0" y="339" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan>Expandir   </tspan><tspan font-style="italic">U</tspan><tspan> = </tspan><tspan font-style="italic">k</tspan><tspan>·</tspan><tspan font-style="italic">u</tspan><tspan>   (Fórmula 2),   </tspan><tspan font-style="italic">k</tspan><tspan> de la Tabla 8   (</tspan><tspan font-style="italic">k</tspan><tspan> ≥ 1)</tspan></text><text x="450.0" y="359" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#666666" text-anchor="middle">el factor de cobertura depende de la magnitud reportada y la situación</text><line x1="450