<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660"><rect width="900" height="660" fill="#ffffff"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1a1a1a" text-anchor="middle">Hand-transmitted vibration: where the accelerometer goes</text><text x="258" y="74" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="600">On the tool (ISO 5349-2, 6.1.3)</text><rect x="60" y="187.0" width="400" height="26.0" rx="13" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="2"/><rect x="230.0" y="148" width="100.0" height="52.0" rx="14" fill="#666666" stroke="#1a1a1a" stroke-width="1.6"/><rect x="236.0" y="217.0" width="19" height="34" rx="9" fill="#666666" stroke="#1a1a1a" stroke-width="1.4"/><rect x="259.0" y="217.0" width="19" height="34" rx="9" fill="#666666" stroke="#1a1a1a" stroke-width="1.4"/><rect x="282.0" y="217.0" width="19" height="34" rx="9" fill="#666666" stroke="#1a1a1a" stroke-width="1.4"/><rect x="305.0" y="217.0" width="19" height="34" rx="9" fill="#666666" stroke="#1a1a1a" stroke-width="1.4"/><line x1="254" y1="156" x2="188" y2="92" stroke="#666666" stroke-width="15" stroke-linecap="round"/><line x1="276.0" y1="272.0" x2="239.0" y2="272.0" stroke="#666666" stroke-width="1.2" stroke-linecap="round"/><path d="M 230.0 272.0 L 239.0 268.4 L 239.0 275.6 Z" fill="#666666" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="284.0" y1="272.0" x2="321.0" y2="272.0" stroke="#666666" stroke-width="1.2" stroke-linecap="round"/><path d="M 330.0 272.0 L 321.0 275.6 L 321.0 268.4 Z" fill="#666666" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="280.0" y="265.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">gripping zone ≈ 100 mm</text><rect x="268" y="213.0" width="24" height="19" rx="3" fill="#d62728" stroke="#1a1a1a" stroke-width="1.5"/><circle cx="280" cy="174" r="12" fill="#d62728" stroke="#ffffff" stroke-width="2"/><text x="280" y="179" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="600">1</text><rect x="184" y="168.0" width="24" height="19" rx="3" fill="#d62728" stroke="#1a1a1a" stroke-width="1.5"/><circle cx="196" cy="148" r="12" fill="#d62728" stroke="#ffffff" stroke-width="2"/><text x="196" y="153" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="600">2</text><rect x="360" y="168.0" width="24" height="19" rx="3" fill="#d62728" stroke="#1a1a1a" stroke-width="1.5"/><circle cx="372" cy="148" r="12" fill="#d62728" stroke="#ffffff" stroke-width="2"/><text x="372" y="153" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="600">2</text><rect x="360" y="213.0" width="24" height="19" rx="3" fill="#d62728" stroke="#1a1a1a" stroke-width="1.5"/><circle cx="372" cy="253" r="12" fill="#d62728" stroke="#ffffff" stroke-width="2"/><text x="372" y="258" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="600">3</text><text x="520" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#666666" text-anchor="end">chain-saw front handle,</text><text x="520" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#666666" text-anchor="end">Ø 30 mm tube</text><line x1="455" y1="126" x2="455" y2="183.0" stroke="#666666" stroke-width="1.2" stroke-dasharray="4,4" stroke-linecap="round"/><path d="M 378 232.0 L 432 246 L 432 306 L 110 306" fill="none" stroke="#1f77b4" stroke-width="2.0" stroke-linejoin="round"/><rect x="170.0" y="300" width="12" height="12" rx="2" fill="#1f77b4" stroke="#1a1a1a" stroke-width="1.0"/><rect x="250.0" y="300" width="12" height="12" rx="2" fill="#1f77b4" stroke="#1a1a1a" stroke-width="1.0"/><text x="110" y="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f77b4" text-anchor="start">cable taped to the handle near the transducer (6.2.3)</text><line x1="306" y1="110" x2="306.0" y2="137.0" stroke="#2ca02c" stroke-width="2.2" stroke-linecap="round"/><path d="M 306.0 146.0 L 302.4 137.0 L 309.6 137.0 Z" fill="#2ca02c" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="210" y1="250" x2="210.0" y2="227.0" stroke="#2ca02c" stroke-width="2.2" stroke-linecap="round"/><path d="M 210.0 218.0 L 213.6 227.0 L 206.4 227.0 Z" fill="#2ca02c" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="306" y="102" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#2ca02c" text-anchor="middle">grip force</text><text x="45" y="366" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="600">1  middle of the gripping zone, under the hand</text><text x="62" y="385" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#666666" text-anchor="start">the most representative location; needs an adaptor</text><text x="45" y="410" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="600">2  either side of the hand — usual practice</text><text x="62" y="429" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#666666" text-anchor="start">on a side handle, average the two positions</text><text x="45" y="454" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="600">3  underside of the handle, next to the hand</text><text x="45" y="480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="start">grip and push force change the reading: report the</text><text x="45" y="497" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="start">posture and the applied forces (7.1, clause 9 g))</text><line x1="110.0" y1="578.0" x2="175.0" y2="578.0" stroke="#1f77b4" stroke-width="2.2" stroke-linecap="round"/><path d="M 184.0 578.0 L 175.0 581.6 L 175.0 574.4 Z" fill="#1f77b4" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="190.0" y="583.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f77b4" text-anchor="start" font-weight="600">y_h</text><line x1="110.0" y1="578.0" x2="110.0" y2="541.0" stroke="#1f77b4" stroke-width="2.2" stroke-linecap="round"/><path d="M 110.0 532.0 L 113.6 541.0 L 106.4 541.0 Z" fill="#1f77b4" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="110.0" y="524.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f77b4" text-anchor="middle" font-weight="600">z_h</text><line x1="110.0" y1="578.0" x2="77.37308728467137" y2="600.83883890073" stroke="#1f77b4" stroke-width="2.2" stroke-linecap="round"/><path d="M 70.0 606.0 L 75.3 597.9 L 79.4 603.8 Z" fill="#1f77b4" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><text x="64.0" y="618.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f77b4" text-anchor="end" font-weight="600">x_h</text><text x="236" y="534" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">basicentric frame (ISO 5349-1 Fig. 1):</text><text x="236" y="552" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">rotated so that y_h lies along the</text><text x="236" y="570" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">handle axis. All three axes are</text><text x="236" y="588" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" xml:space="preserve"><tspan>measured, and every </tspan><tspan font-style="italic">k</tspan><tspan> = 1.</tspan></text><rect x="545.0" y="90.0" width="320.0" height="66.0" rx="12" fill="#f0f2f5" stroke="#1f77b4" stroke-width="2"/><text x="705.0" y="118.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan font-style="italic">a</tspan><tspan dy="4.0" font-size="12.6">hwx</tspan><tspan dy="-4.0"> , </tspan><tspan font-style="italic">a</tspan><tspan dy="4.0" font-size="12.6">hwy</tspan><tspan dy="-4.0"> , </tspan><tspan font-style="italic">a</tspan><tspan dy="4.0" font-size="12.6">hwz</tspan></text><text x="705.0" y="140.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle">Wh-weighted, one per axis (ISO 5349-1 A.1)</text><rect x="545.0" y="176.0" width="320.0" height="66.0" rx="12" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="2"/><text x="705.0" y="204.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan font-style="italic">a</tspan><tspan dy="4.0" font-size="12.6">hv</tspan><tspan dy="-4.0"> = √(</tspan><tspan font-style="italic">a</tspan><tspan dy="4.0" font-size="12.6">hwx</tspan><tspan dy="-10.8" font-size="12.6">2</tspan><tspan dy="6.8"> + </tspan><tspan font-style="italic">a</tspan><tspan dy="4.0" font-size="12.6">hwy</tspan><tspan dy="-10.8" font-size="12.6">2</tspan><tspan dy="6.8"> + </tspan><tspan font-style="italic">a</tspan><tspan dy="4.0" font-size="12.6">hwz</tspan><tspan dy="-10.8" font-size="12.6">2</tspan><tspan dy="6.8">)</tspan></text><text x="705.0" y="226.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle">vibration total value (Eq. (1))</text><rect x="545.0" y="262.0" width="320.0" height="66.0" rx="12" fill="#f0f2f5" stroke="#1a1a1a" stroke-width="2"/><text x="705.0" y="290.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan font-style="italic">A</tspan><tspan dy="4.0" font-size="12.6" font-style="italic">i</tspan><tspan dy="-4.0">(8) = </tspan><tspan font-style="italic">a</tspan><tspan dy="4.0" font-size="12.6">hv,</tspan><tspan font-size="12.6" font-style="italic">i</tspan><tspan dy="-4.0"> · √(</tspan><tspan font-style="italic">T</tspan><tspan dy="4.0" font-size="12.6" font-style="italic">i</tspan><tspan dy="-4.0"> / </tspan><tspan font-style="italic">T</tspan><tspan dy="4.0" font-size="12.6">0</tspan><tspan dy="-4.0">)</tspan></text><text x="705.0" y="312.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">T</tspan><tspan dy="3.1" font-size="9.8" font-style="italic">i</tspan><tspan dy="-3.1"> is total contact time per day (5.5)</tspan></text><rect x="545.0" y="348.0" width="320.0" height="66.0" rx="12" fill="#f0f2f5" stroke="#d62728" stroke-width="2"/><text x="705.0" y="376.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="600" xml:space="preserve"><tspan font-style="italic">A</tspan><tspan>(8) = √(Σ </tspan><tspan font-style="italic">A</tspan><tspan dy="4.0" font-size="12.6" font-style="italic">i</tspan><tspan dy="-4.0">(8)</tspan><tspan dy="-6.8" font-size="12.6">2</tspan><tspan dy="6.8">)</tspan></text><text x="705.0" y="398.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle">one per hand, two significant figures (clause 8)</text><line x1="705.0" y1="156" x2="705.0" y2="167.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 705.0 176.0 L 701.4 167.0 L 708.6 167.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="705.0" y1="242" x2="705.0" y2="253.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 705.0 262.0 L 701.4 253.0 L 708.6 253.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="705.0" y1="328" x2="705.0" y2="339.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 705.0 348.0 L 701.4 339.0 L 708.6 339.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><line x1="705.0" y1="414" x2="705.0" y2="429.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/><path d="M 705.0 438.0 L 701.4 429.0 L 708.6 429.0 Z" fill="#1a1a1a" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><rect x="545.0" y="438" width="320.0" height="62" rx="12" fill="none" stroke="#d62728" stroke-width="2.4" stroke-dasharray="6,5"/><text x="705.0" y="464" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="600">EAV 2.5 m/s²   ·   ELV 5 m/s²</text><text x="705.0" y="486" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle">Directive 2002/44/EC, Article 3</text><rect x="524" y="518" width="336" height="130" rx="12" fill="#f0f2f5" stroke="#666666" stroke-width="1.6"/><circle cx="542" cy="535" r="3.4" fill="#d62728" stroke="none" stroke-width="1.5"/><text x="556" y="540" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">transducer and mount below 5 % of the</text><text x="556" y="554" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">mass they are fixed to (6.1.5)</text><circle cx="542" cy="563" r="3.4" fill="#d62728" stroke="none" stroke-width="1.5"/><text x="556" y="568" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">linear averaging over complete work</text><text x="556" y="582" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">cycles (6.1.11)</text><circle cx="542" cy="591" r="3.4" fill="#d62728" stroke="none" stroke-width="1.5"/><text x="556" y="596" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">three samples per operation, a minute</text><text x="556" y="610" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">of record, none under 8 s (5.4.1)</text><circle cx="542" cy="619" r="3.4" fill="#d62728" stroke="none" stroke-width="1.5"/><text x="556" y="624" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">the lowest input range that does not</text><text x="556" y="638" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">overload, found by trial (6.1.10)</text></svg>