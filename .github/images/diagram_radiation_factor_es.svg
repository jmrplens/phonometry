de </tspan><tspan font-style="italic">ε</tspan><tspan dy="4.2" font-size="13.3" font-style="italic">j</tspan><tspan dy="-4.2"> (Parte 2)</tspan></text><text x="590.0" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f77b4" text-anchor="start" font-weight="600" xml:space="preserve"><tspan font-style="italic">ε</tspan><tspan dy="3.5" font-size="11.2" font-style="italic">j</tspan><tspan dy="-3.5"> = </tspan><tspan font-style="italic">P</tspan><tspan dy="3.5" font-size="11.2" font-style="italic">j</tspan><tspan dy="-3.5"> / (</tspan><tspan font-style="italic">Z</tspan><tspan dy="3.5" font-size="11.2" font-style="italic">c</tspan><tspan font-size="11.2">,</tspan><tspan font-size="11.2" font-style="italic">n</tspan><tspan dy="-3.5"> ⟨</tspan><tspan font-style="italic">v</tspan><tspan dy="3.5" font-size="11.2" font-style="italic">j</tspan><tspan dy="-9.6" font-size="11.2">2</tspan><tspan dy="6.1">⟩ </tspan><tspan font-style="italic">S</tspan><tspan>)</tspan></text><text x="590.0" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#666666" text-anchor="start" xml:space="preserve"><tspan font-style="italic">P</tspan><tspan dy="3.3" font-size="10.5" font-style="italic">j</tspan><tspan dy="-3.3"> : potencia de banda ISO 9614</tspan></text><text x="590.0" y="212" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#666666" text-anchor="start" xml:space="preserve"><tspan>⟨</tspan><tspan font-style="italic">v</tspan><tspan dy="3.3" font-size="10.5" font-style="italic">j</tspan><tspan dy="-9.0" font-size="10.5">2</tspan><tspan dy="5.7">⟩ : velocidad normal promediada</tspan></text><text x="590.0" y="238" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#666666" text-anchor="start">en la superficie, mismas bandas</text><rect x="580.0" y="268" width="260" height="118" rx="10" fill="#f0f2f5" stroke="#d62728" stroke-width="2.0"/><text x="590.0" y="292" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="600">una máquina, un ensayo:</text><text x="590.0" y="314" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start">el mismo modo de funcionamiento,</text><text x="590.0" y="336" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start">el mismo montaje, las mismas bandas.</text><text x="590.0" y="358" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" xml:space="preserve"><tspan font-style="italic">ε</tspan><tspan dy="3.3" font-size="10.5" font-style="italic">j</tspan><tspan dy="-3.3"> es una propiedad de la estructura</tspan></text><text x="590.0" y="380" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start">y de su excitación conjuntamente.</text><text x="450" y="450" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="600">se determina una vez y luego el muestreo de velocidad basta para el resto de la familia</text><text x="450" y="478" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#666666" text-anchor="middle">distancia media del segmento a la fuente ≥ 200 mm (ISO 9614-2, apartado 8.2)</text><text x="450" y="506" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#666666" text-anchor="middle" xml:space="preserve"><tspan>La Parte 1 omite esta medición y toma </tspan><tspan font-style="italic">ε</tspan><tspan> = 1, por eso devuelve un límite superior</tspan></text></svg>